<script>
(()=>{
'use strict';
const OVERRIDES={
  AMERICANHERITAGE:{backgroundColor:"#C8102E",textColor:"#FFFFFF"},
  AMERICANPREPWV:{backgroundColor:"#0B2341",textColor:"#FFFFFF"}
};
const BASKETBALL_COLOR_OVERRIDES={AMERICANHERITAGE:{backgroundColor:'#C8102E',textColor:'#FFFFFF',colors:'Red, White and Blue'},AMERICANPREPWV:{backgroundColor:'#0B2341',textColor:'#FFFFFF',colors:'Navy Blue and Cardinal Red'},BRYCEVALLEY:{backgroundColor:'#0B6623',textColor:'#FFFFFF',colors:'Green and White'},DAVINCIACADEMY:{backgroundColor:'#0B6623',textColor:'#FFFFFF',colors:'Green, Gold and Blue'},DEERCREEK:{backgroundColor:'#0B1F3A',textColor:'#FFFFFF',colors:'Navy, Silver, White'},DRAPERAPA:{backgroundColor:'#C8102E',textColor:'#FFFFFF',colors:'Red, White and Blue'},DUGWAY:{backgroundColor:'#800000',textColor:'#FFFFFF',colors:'Maroon and White'},ESCALANTE:{backgroundColor:'#C8102E',textColor:'#FFFFFF',colors:'Red, White and Black'},ESKDALE:{backgroundColor:'#1D4ED8',textColor:'#FFFFFF',colors:'Blue and White'},FREEDOMPREPACADEMY:{backgroundColor:'#C8102E',textColor:'#FFFFFF',colors:'Red, Navy, White'},GREENRIVER:{backgroundColor:'#0B6623',textColor:'#FFFFFF',colors:'Green, White and Black'},INTERMOUNTAINCHRISTIAN:{backgroundColor:'#800000',textColor:'#FFFFFF',colors:'Maroon and Gray'},LAKEPOWELL:{backgroundColor:'#C8102E',textColor:'#FFFFFF',colors:'Red and Black'},LIAHONA:{backgroundColor:'#0B1F3A',textColor:'#FFFFFF',colors:'Navy and Gray'},MAESERPREPACADEMY:{backgroundColor:'#D4AF37',textColor:'#111111',colors:'Gold and Navy'},MANILA:{backgroundColor:'#C8102E',textColor:'#FFFFFF',colors:'Red, White and Black'},MERITPREP:{backgroundColor:'#1D4ED8',textColor:'#FFFFFF',colors:'Blue, Maroon and White'},MOUNTVERNON:{backgroundColor:'#C8102E',textColor:'#FFFFFF',colors:'Red, White and Blue'},NAVAJOMOUNTAIN:{backgroundColor:'#0B1F3A',textColor:'#FFFFFF',colors:'Navy Blue, White and Silver'},PARADIGM:{backgroundColor:'#C8102E',textColor:'#FFFFFF',colors:'Red, White, Blue'},PINNACLE:{backgroundColor:'#5B2C83',textColor:'#FFFFFF',colors:'Black, Purple and Green'},PIUTE:{backgroundColor:'#5B92E5',textColor:'#FFFFFF',colors:'Columbia Blue, Red and White'},ROCKWELL:{backgroundColor:'#1E3A8A',textColor:'#D4AF37',colors:'Blue and Gold'},ROWLANDHALL:{backgroundColor:'#154734',textColor:'#FFFFFF',colors:'Forest Green and White'},SALTLAKEACADEMY:{backgroundColor:'#0B1F3A',textColor:'#FFFFFF',colors:'Navy, White'},TABIONA:{backgroundColor:'#5B2C83',textColor:'#FFFFFF',colors:'Purple and White'},TELOS:{backgroundColor:'#0B1F3A',textColor:'#FFFFFF',colors:'Navy, Gold and Silver'},TINTIC:{backgroundColor:'#1D4ED8',textColor:'#FFFFFF',colors:'Royal Blue, White, Silver and Black'},USDB:{backgroundColor:'#1D4ED8',textColor:'#FFFFFF',colors:'Blue and White'},UTAHPREP:{backgroundColor:'#000000',textColor:'#D4AF37',colors:'Black and Gold'},VALLEY:{backgroundColor:'#000000',textColor:'#F47C20',colors:'Black and Orange'},VANGUARDACADEMY:{backgroundColor:'#5B2C83',textColor:'#FFFFFF',colors:'Purple, Blue'},WASATCHACADEMY:{backgroundColor:'#000000',textColor:'#F47C20',colors:'Black and Orange'},WATERFORD:{backgroundColor:'#0B1F3A',textColor:'#FFFFFF',colors:'Navy and Burgundy'},WAYNE:{backgroundColor:'#5B2C83',textColor:'#D4AF37',colors:'Purple and Gold'},WENDOVER:{backgroundColor:'#2E8B57',textColor:'#FFFFFF',colors:'Kelly Green and White'},WESTDESERT:{backgroundColor:'#800000',textColor:'#FFFFFF',colors:'Maroon and White'}};
const clean=value=>String(value??"").trim();
const norm=value=>clean(value).toUpperCase().replace(/[^A-Z0-9]/g,"");
const matchesTeam=(game,side,key)=>norm(game[side+"Team"])===key&&(!clean(game[side+"TeamState"])||clean(game[side+"TeamState"]).toUpperCase()==="UT");
const esc=value=>clean(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const safeColor=(value,fallback)=>/^#[0-9A-F]{6}$/i.test(clean(value))?clean(value):fallback;
const root=document.getElementById("teamPage");
const statusKey=value=>clean(value).toLowerCase();
const isFinal=game=>["final","completed"].includes(statusKey(game.status))&&game.homeScore!==null&&game.homeScore!==undefined&&game.awayScore!==null&&game.awayScore!==undefined&&Number.isFinite(Number(game.homeScore))&&Number.isFinite(Number(game.awayScore));
const isRegion=game=>game.regionGame===true||["true","yes","region"].includes(statusKey(game.regionGame));
function dateLabel(value){
  const raw=clean(value);
  if(!raw)return"Date TBD";
  const parsed=new Date(raw.includes("T")?raw:raw+"T12:00:00");
  if(Number.isNaN(parsed.getTime()))return"Date TBD";
  return new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric"}).format(parsed);
}
function recordText(record){return record.w+"–"+record.l}
function fullRecordText(record){return record.w+"–"+record.l+(record.t?"–"+record.t:"")}
function empty(text,strong){
  return'<div class="empty-state"><strong>'+esc(strong)+'</strong>'+esc(text)+'</div>';
}
function calculate(games,teamName){
  const key=norm(teamName);
  const all={w:0,l:0,pf:0,pa:0,g:0};
  const region={w:0,l:0};
  games.forEach(game=>{
    if(!isFinal(game))return;
    const isHome=matchesTeam(game,"home",key);
    const isAway=matchesTeam(game,"away",key);
    if(!isHome&&!isAway)return;
    const ours=Number(isHome?game.homeScore:game.awayScore);
    const theirs=Number(isHome?game.awayScore:game.homeScore);
    all.g++;all.pf+=ours;all.pa+=theirs;
    if(ours>theirs)all.w++;else if(ours<theirs)all.l++;
    if(isRegion(game)){if(ours>theirs)region.w++;else if(ours<theirs)region.l++}
  });
  return{all,region};
}
const TEAM_PAGE_VERSION='20260928-basketball-history2017';
function renderSchedule(games,teamName,allTeams,colorRows,teamColor){
  const key=norm(teamName);
  const rows=games.filter(game=>matchesTeam(game,"home",key)||matchesTeam(game,"away",key))
    .slice().sort((a,b)=>clean(a.date).localeCompare(clean(b.date)));
  if(!rows.length)return empty("The 2026–27 schedule and results will appear here as game data is added.","No games listed yet");
  const body=rows.map(game=>{
    const isHome=matchesTeam(game,"home",key);
    const opponent=isHome?game.awayTeam:game.homeTeam;
    const opponentState=clean(isHome?game.awayTeamState:game.homeTeamState).toUpperCase();
    const opponentBrand=opponentState&&opponentState!=="UT"?{}:OVERRIDES[norm(opponent)]||colorRows.find(row=>norm(row.team)===norm(opponent))||BASKETBALL_COLOR_OVERRIDES[norm(opponent)]||{};
    const opponentBg=safeColor(opponentBrand.backgroundColor,"#1B1B1B");
    const opponentText=safeColor(opponentBrand.textColor,"#FFFFFF");
    const opponentStyle=' style="--opponent-bg:'+opponentBg+';--opponent-text:'+opponentText+';--opponent-bar:'+opponentBg+'"';
    const linkedTeam=(!opponentState||opponentState==="UT")&&(allTeams||[]).find(row=>norm(row.team)===norm(opponent)&&(row.association==="UHSAA"||row.team==="Utah Prep"));
    const opponentHref=linkedTeam?"boys-basketball-team.html?"+new URLSearchParams({team:linkedTeam.team,v:TEAM_PAGE_VERSION}).toString().replace(/&/g,"&amp;"):"";
    const opponentLabel=linkedTeam?'<a class="opponent-badge team-page-link"'+opponentStyle+' href="'+opponentHref+'" aria-label="Open '+esc(linkedTeam.team)+' basketball team page">'+esc(opponent)+'</a>':'<span class="opponent-badge"'+opponentStyle+'>'+esc(opponent)+'</span>';
    const stateTag=opponentState&&opponentState!=="UT"?' <span class="state-tag">('+esc(opponentState)+')</span>':"";
    const location=game.neutralSite===true?"Neutral":isHome?"Home":"Away";
    const region=isRegion(game)?'<span class="region-tag">Region</span>':"";
    let result='<span class="status">'+esc(game.status||"Scheduled")+'</span>';
    let resultClass="result";
    if(isFinal(game)){
      const ours=Number(isHome?game.homeScore:game.awayScore);
      const theirs=Number(isHome?game.awayScore:game.homeScore);
      const letter=ours>theirs?"W":ours<theirs?"L":"T";
      resultClass+=" "+(ours>theirs?"win":ours<theirs?"loss":"");
      result='<span class="'+resultClass+'">'+letter+" "+ours+"–"+theirs+'</span>';
    }else if(statusKey(game.status)==="live"&&game.homeScore!==null&&game.awayScore!==null){
      const ours=Number(isHome?game.homeScore:game.awayScore);
      const theirs=Number(isHome?game.awayScore:game.homeScore);
      result='<span class="status live">Live '+ours+"–"+theirs+'</span>';
    }
    const when=dateLabel(game.date)+(clean(game.time)?" · "+clean(game.time):"");
    return'<tr class="schedule-row"><td>'+esc(when)+'</td><td class="opponent">'+opponentLabel+stateTag+region+'</td><td class="location">'+location+'</td><td>'+result+'</td></tr>';
  }).join("");
  return'<div class="table-wrap" style="--team-color:'+safeColor(teamColor,"#333333")+'"><table><thead><tr><th>Date / Time</th><th>Opponent</th><th>Location</th><th>Result / Status</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
function render(team,allTeams,allGames,colorRows,scheduleSources,allTimeSummary){
  const key=norm(team.team);
  const brand=OVERRIDES[key]||colorRows.find(row=>norm(row.team)===key)||BASKETBALL_COLOR_OVERRIDES[key]||{};
  const bg=safeColor(brand.backgroundColor,"#333333");
  const fg=safeColor(brand.textColor,"#FFFFFF");
  const games=allGames.filter(game=>matchesTeam(game,"home",key)||matchesTeam(game,"away",key));
  const hasOwnSchedule=Object.keys(scheduleSources||{}).some(name=>norm(name)===key);
  const records=calculate(games,team.team);
  const historicalTotals=Object.entries(allTimeSummary&&allTimeSummary.teams||{}).find(([name])=>norm(name)===key)?.[1]||null;
  const allTimeRecord=historicalTotals?{w:historicalTotals.wins+records.all.w,l:historicalTotals.losses+records.all.l,t:historicalTotals.ties||0,g:historicalTotals.games+records.all.g}:null;
  const gamesPlayed=records.all.g;
  const recordNote=gamesPlayed?"Through "+gamesPlayed+" completed game"+(gamesPlayed===1?"":"s")+".":"No completed 2026–27 games are recorded yet.";
  const asset=window.RUSSchoolAssets;
  const entry=asset&&asset.get?asset.get(team.team):null;
  const candidates=[asset&&asset.customLogo?asset.customLogo(team.team):"",entry&&entry.logoUrl?entry.logoUrl:"",asset&&asset.fallbackLogo?asset.fallbackLogo(team.team):""].filter((url,index,array)=>url&&array.indexOf(url)===index);
  const logo=candidates[0]||"";
  const card='<section class="hero" style="--team-color:'+bg+';--team-text:'+fg+'"><div class="brand-bar"></div><div class="hero-content"><div class="logo-wrap"><img id="teamLogo" class="team-logo" alt="'+esc(team.team)+' logo"></div><div class="team-copy"><h1 class="team-name">'+esc(team.team)+'</h1><div class="team-subtitle">2026–27 Boys Basketball</div><div class="meta-row"><span class="meta-pill classification">'+esc(team.classification)+'</span><span class="meta-pill">'+esc(team.region)+'</span><span class="meta-pill">'+esc(team.association)+'</span></div></div></div></section>';
  const stats='<div class="record-grid" style="--team-color:'+bg+'"><div class="record-card"><div class="record-number">'+recordText(records.all)+'</div><div class="record-label">2026–27 Record</div></div><div class="record-card"><div class="record-number">'+recordText(records.region)+'</div><div class="record-label">Region Record</div></div><div class="record-card"><div class="record-number">'+gamesPlayed+'</div><div class="record-label">2026–27 Games Played</div></div><div class="record-card"><div class="record-number">'+(allTimeRecord?fullRecordText(allTimeRecord):'—')+'</div><div class="record-label">All-Time Record Since 2017–18</div></div></div><p class="record-note">'+esc(recordNote)+' All-time totals combine available completed results from 2017–18 through the current season.</p>';
  const scheduleMessage=hasOwnSchedule?"MaxPreps currently lists these 2026–27 games; the schedule may be incomplete.":"The full 2026–27 schedule has not been added yet. Any games shown were listed on an opponent's schedule.";
  root.innerHTML=card+stats+'<h2 class="section-title" style="--team-color:'+bg+'">2026–27 Schedule &amp; Results</h2><p class="schedule-note">'+esc(scheduleMessage)+'</p>'+renderSchedule(games,team.team,allTeams,colorRows,bg);
  document.title=team.team+" Boys Basketball | Rural Utah Sports";
  const image=document.getElementById("teamLogo");
  if(image&&logo){
    let at=0;
    image.onerror=()=>{at++;if(at<candidates.length)image.src=candidates[at];else image.hidden=true};
    image.src=logo;
  }
}
const ALL_TIME_RECORDS_URL='boys-basketball-all-time-records-2017-26.json?v=20260928-basketball-alltime2017';
const HISTORICAL_RESULTS_URL='boys-basketball-games-2025-26.json?v=20260928-basketball-results1';
let historicalResultsPromise=null;
const HISTORICAL_TEAM_ALIASES={
  UTAHMILITARYACADEMYHILLFIELD:'UMA-Hillfield',
  UTAHMILITARYACADEMYCAMPWILLIAMS:'UMA-Camp Williams',
  SAINTJOSEPH:'Saint Joseph',
  STJOSEPH:'Saint Joseph',
  AMERICANLEADERSHIPACADEMY:'ALA',
  JUANDIEGOCATHOLIC:'Juan Diego',
  JUDGEMEMORIALCATHOLIC:'Judge Memorial',
  UTAHSCHOOLFORTHEDEAFBLIND:'USDB',
  MERITPREPARATORYACADEMY:'Merit Prep'
};
function historicalTeamMatch(allTeams,name){
  const canonical=HISTORICAL_TEAM_ALIASES[norm(name)]||name;
  return (allTeams||[]).find(row=>norm(row.team)===norm(canonical)&&(row.association==='UHSAA'||row.team==='Utah Prep'));
}
function loadHistoricalResults(){
  if(!historicalResultsPromise){
    historicalResultsPromise=fetch(HISTORICAL_RESULTS_URL,{cache:'no-store'}).then(response=>{
      if(!response.ok)throw new Error('The 2025–26 results file could not be loaded.');
      return response.json();
    });
  }
  return historicalResultsPromise;
}
function renderHistoricalGames(entry,team,allTeams,colorRows,teamColor){
  const games=Array.isArray(entry.games)?entry.games.slice().sort((a,b)=>clean(a.date).localeCompare(clean(b.date))):[];
  if(!games.length){
    const text=entry.error?'Results were unavailable from the source page: '+entry.error:'No completed results are listed for this team.';
    return empty(text,'No 2025–26 results available');
  }
  const body=games.map(game=>{
    const opponent=clean(game.opponent)||'Opponent';
    const state=clean(game.opponentState).toUpperCase();
    const isOutOfState=state&&state!=='UT';
    const brand=isOutOfState?{}:OVERRIDES[norm(opponent)]||colorRows.find(row=>norm(row.team)===norm(opponent))||BASKETBALL_COLOR_OVERRIDES[norm(opponent)]||{};
    const opponentBg=safeColor(brand.backgroundColor,'#1B1B1B');
    const opponentText=safeColor(brand.textColor,'#FFFFFF');
    const opponentStyle=' style="--opponent-bg:'+opponentBg+';--opponent-text:'+opponentText+';--opponent-bar:'+opponentBg+'"';
    const linkedTeam=!isOutOfState?historicalTeamMatch(allTeams,opponent):null;
    const href=linkedTeam?'boys-basketball-team.html?'+new URLSearchParams({team:linkedTeam.team,v:TEAM_PAGE_VERSION}).toString().replace(/&/g,'&amp;'):'';
    const label=linkedTeam?'<a class="opponent-badge team-page-link"'+opponentStyle+' href="'+href+'" aria-label="Open '+esc(linkedTeam.team)+' basketball team page">'+esc(opponent)+'</a>':'<span class="opponent-badge"'+opponentStyle+'>'+esc(opponent)+'</span>';
    const stateTag=isOutOfState?' <span class="state-tag">('+esc(state)+')</span>':'';
    const location=clean(game.location);
    const result=clean(game.result).toUpperCase();
    const resultClass=result==='W'?'result win':result==='L'?'result loss':'result';
    const score=Number.isFinite(Number(game.teamScore))&&Number.isFinite(Number(game.opponentScore))?Number(game.teamScore)+'–'+Number(game.opponentScore):'';
    const resultText='<span class="'+resultClass+'">'+esc((result?result+' ':'')+score)+'</span>';
    return'<tr class="schedule-row"><td>'+esc(dateLabel(game.date))+'</td><td class="opponent">'+label+stateTag+'</td><td class="location">'+esc(location)+'</td><td>'+resultText+'</td></tr>';
  }).join('');
  return'<div class="table-wrap" style="--team-color:'+safeColor(teamColor,'#333333')+'"><table><thead><tr><th>Date</th><th>Opponent</th><th>Location</th><th>Result</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
function historicalRecord(entry){
  const record={w:0,l:0,t:0,g:0};
  for(const game of Array.isArray(entry.games)?entry.games:[]){
    const result=clean(game.result).toUpperCase();
    record.g++;
    if(result==='W')record.w++;else if(result==='L')record.l++;else if(result==='T')record.t++;
  }
  return record;
}
const HISTORICAL_SEASONS=[
  {id:'2025-26',label:'2025–26',url:'boys-basketball-games-2025-26.json?v=20260928-basketball-results1'},
  {id:'2024-25',label:'2024–25',url:'boys-basketball-games-2024-25.json?v=20260928-basketball-history2024'},
  {id:'2023-24',label:'2023–24',url:'boys-basketball-games-2023-24.json?v=20260928-basketball-history2023'},
  {id:'2022-23',label:'2022–23',url:'boys-basketball-games-2022-23.json?v=20260928-basketball-history2022'},
  {id:'2021-22',label:'2021–22',url:'boys-basketball-games-2021-22.json?v=20260928-basketball-history2021'},
  {id:'2020-21',label:'2020–21',url:'boys-basketball-games-2020-21.json?v=20260928-basketball-history2020'},
  {id:'2019-20',label:'2019–20',url:'boys-basketball-games-2019-20.json?v=20260928-basketball-history2019'},
  {id:'2018-19',label:'2018–19',url:'boys-basketball-games-2018-19.json?v=20260928-basketball-history2018'},
  {id:'2017-18',label:'2017–18',url:'boys-basketball-games-2017-18.json?v=20260928-basketball-history2017'}
];
function setupHistoricalResults(team,allTeams,colorRows){
  const key=norm(team.team);
  const brand=OVERRIDES[key]||colorRows.find(row=>norm(row.team)===key)||BASKETBALL_COLOR_OVERRIDES[key]||{};
  const bg=safeColor(brand.backgroundColor,'#333333');
  const options=HISTORICAL_SEASONS.map(season=>'<option value="'+esc(season.id)+'">'+esc(season.label)+'</option>').join('');
  root.insertAdjacentHTML('beforeend','<section class="history-section"><h2 class="section-title" style="--team-color:'+bg+'">Past Seasons</h2><p class="schedule-note">Choose a season to view its record and completed results.</p><label class="record-label" for="historySeasonSelect" style="display:block;margin:0 2px 8px;color:#bbb">Select season</label><select class="history-season-select" id="historySeasonSelect" style="max-width:100%;min-width:190px;border:1px solid #555;border-radius:5px;background:#202020;color:#fff;padding:11px 36px 11px 12px;font-weight:900"><option value="">Choose a season</option>'+options+'</select><div class="history-panel" hidden></div></section>');
  const select=root.querySelector('#historySeasonSelect');
  const panel=root.querySelector('.history-panel');
  if(!select||!panel)return;
  select.addEventListener('change',async()=>{
    const season=HISTORICAL_SEASONS.find(item=>item.id===select.value);
    if(!season){panel.hidden=true;panel.innerHTML='';return}
    panel.hidden=false;
    panel.innerHTML='<div class="loading-state">Loading '+esc(season.label)+' results…</div>';
    const cacheKey='loaded'+season.id.replace(/[^a-z0-9]/gi,'');
    if(panel.dataset[cacheKey]==='true')return;
    try{
      let payload;
      if(season.id==='2025-26')payload=await loadHistoricalResults();
      else{
        const response=await fetch(season.url,{cache:'no-store'});
        if(!response.ok)throw new Error('The '+season.label+' results file could not be loaded.');
        payload=await response.json();
      }
      const found=Object.entries(payload.teams||{}).find(([name])=>norm(name)===key);
      const entry=found?found[1]:null;
      if(!entry)panel.innerHTML=empty('No results are available for this team in '+season.label+'.','No results listed');
      else{
        const record=historicalRecord(entry);
        const tieText=record.t?'–'+record.t:'';
        const source=clean(entry.sourceUrl)?'<p class="history-source">Source: <a href="'+esc(entry.sourceUrl)+'" target="_blank" rel="noopener noreferrer">MaxPreps schedule</a></p>':'';
        const note=entry.status==='no-results'?'No completed results were listed for this team in '+season.label+'.':record.g+' completed games listed.';
        const stats='<div class="record-grid" style="--team-color:'+bg+'"><div class="record-card"><div class="record-number">'+record.w+'–'+record.l+tieText+'</div><div class="record-label">'+esc(season.label)+' Record</div></div><div class="record-card"><div class="record-number">'+record.g+'</div><div class="record-label">Completed Games</div></div></div><p class="record-note">'+esc(note)+'</p>';
        panel.innerHTML=stats+renderHistoricalGames(entry,team,allTeams,colorRows,bg)+source;
      }
      panel.dataset[cacheKey]='true';
    }catch(error){
      panel.innerHTML=empty(error&&error.message?error.message:'Please try again.','Unable to load '+season.label+' results');
      if(season.id==='2025-26')historicalResultsPromise=null;
    }
  });
}

async function load(){
  try{
    const query=new URLSearchParams(location.search);
    const requested=norm(query.get("team"));
    if(!requested)throw new Error("Select a school from the boys basketball directory.");
    const urls=["boys-basketball-teams.json?v=20260927-basketball-directory-trim","boys-basketball-games-2026-27.json?v=20260927-basketball-all-schedules","team-colors-exact.json?v=20260926-pilot1"];
    const responses=await Promise.all([...urls.map(url=>fetch(url,{cache:"no-store"})),fetch(ALL_TIME_RECORDS_URL,{cache:"no-store"}).catch(()=>null)]);
    if(!responses[0].ok)throw new Error("Basketball team list could not be loaded.");
    const teams=await responses[0].json();
    const gameFeed=responses[1].ok?await responses[1].json():{games:[]};
    const colorRows=responses[2].ok?await responses[2].json():[];
    const allTimeSummary=responses[3]&&responses[3].ok?await responses[3].json().catch(()=>null):null;
    window.RUSBasketballPreviewData={teams,games:Array.isArray(gameFeed.games)?gameFeed.games:[],colors:Array.isArray(colorRows)?colorRows:[]};
    if(window.RUSSchoolAssets&&window.RUSSchoolAssets.load)await window.RUSSchoolAssets.load();
    const team=teams.find(row=>norm(row.team)===requested&&(row.association==="UHSAA"||row.team==="Utah Prep"));
    if(!team)throw new Error("That school is not in the boys basketball team directory.");
    render(team,teams,Array.isArray(gameFeed.games)?gameFeed.games:[],Array.isArray(colorRows)?colorRows:[],gameFeed.sources||{},allTimeSummary);
    setupHistoricalResults(team,teams,Array.isArray(colorRows)?colorRows:[]);
  }catch(error){
    root.innerHTML='<div class="error-state"><strong>Unable to load this basketball team page.</strong>'+esc(error&&error.message?error.message:"Please try again.")+'</div>';
  }
}
load();
})();
</script>
