<script>
(()=>{

const OVERRIDES={

kgroundColor:'#1E3A8A',textColor:'#D4AF37',colors:'Blue and Gold'},ROWLANDHALL:{backgroundColor:'#154734',textColor:'#FFFFFF',colors:'Forest Green and White'},SALTLAKEACADEMY:{backgroundColor:'#0B1F3A',textColor:'#FFFFFF',colors:'Navy, White'},TABIONA:{backgroundColor:'#5B2C83',textColor:'#FFFFFF',colors:'Purple and White'},TELOS:{backgroundColor:'#0B1F3A',textColor:'#FFFFFF',colors:'Navy, Gold and Silver'},TINTIC:{backgroundColor:'#1D4ED8',textColor:'#FFFFFF',colors:'Royal Blue, White, Silver and Black'},USDB:{backgroundColor:'#1D4ED8',textColor:'#FFFFFF',colors:'Blue and White'},UTAHPREP:{backgroundColor:'#000000',textColor:'#D4AF37',colors:'Black and Gold'},VALLEY:{backgroundColor:'#000000',textColor:'#F47C20',colors:'Black and Orange'},VANGUARDACADEMY:{backgroundColor:'#5B2C83',textColor:'#FFFFFF',colors:'Purple, Blue'},WASATCHACADEMY:{backgroundColor:'#000000',textColor:'#F47C20',colors:'Black and Orange'},WATERFORD:{backgroundColor:'#0B1F3A',textColor:'#FFFFFF',colors:'Navy and Burgundy'},WAYNE:{backgroundColor:'#5B2C83',textColor:'#D4AF37',colors:'Purple and Gold'},WENDOVER:{backgroundColor:'#2E8B57',textColor:'#FFFFFF',colors:'Kelly Green and White'},WESTDESERT:{backgroundColor:'#800000',textColor:'#FFFFFF',colors:'Maroon and White'}};
const clean=value=>String(value??"").trim();
const norm=value=>clean(value).toUpperCase().replace(/[^A-Z0-9]/g,"");
const TEAM_KEY_ALIASES={
  UTAHMILITARYACADEMYCAMPWILLIAMS:'UMALEHI',
  UMACAMPWILLIAMS:'UMALEHI',
  UTAHMILITARYACADEMYHILLFIELD:'UMAHILLFIELD',
  STJOSEPH:'SAINTJOSEPH',
  GRAND:'GRANDCOUNTY',
  MERITPREPARATORYACADEMY:'MERITPREP',
  AMERICANLEADERSHIPACADEMY:'ALA',
  AMERICANPREPARATORYACADEMYWESTVALLEY:'AMERICANPREPWV',
  MAESERPREPARATORYACADEMY:'MAESERPREPACADEMY',
  JUANDIEGOCATHOLIC:'JUANDIEGO',
  JUDGEMEMORIALCATHOLIC:'JUDGEMEMORIAL',
  UTAHSCHOOLFORTHEDEAFBLIND:'USDB'
};
const BRAND_KEY_ALIASES={GRANDCOUNTY:'GRAND'};
const canonicalTeamKey=value=>TEAM_KEY_ALIASES[norm(value)]||norm(value);
function brandFor(name,colorRows){
  const key=canonicalTeamKey(name);
  const brandKey=BRAND_KEY_ALIASES[key]||key;
  return OVERRIDES[key]||OVERRIDES[brandKey]||
    colorRows.find(row=>norm(row.team)===brandKey)||
    colorRows.find(row=>canonicalTeamKey(row.team)===key)||
    BASKETBALL_COLOR_OVERRIDES[key]||BASKETBALL_COLOR_OVERRIDES[brandKey]||{};
}
const matchesTeam=(game,side,key)=>norm(game[side+"Team"])===key&&(!clean(game[side+"TeamState"])||clean(game[side+"TeamState"]).toUpperCase()==="UT");
const esc=value=>clean(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const safeColor=(value,fallback)=>/^#[0-9A-F]{6}$/i.test(clean(value))?clean(value):fallback;
const root=document.getElementById("teamPage");
const statusKey=value=>clean(value).toLowerCase();
const isFinal=game=>["final","completed"].includes(statusKey(game.status))&&game.homeScore!==null&&game.homeScore!==undefined&&game.awayScore!==null&&game.awayScore!==undefined&&Number.isFinite(Number(game.homeScore))&&Number.isFinite(Number(game.awayScore));
const isZeroZeroScore=(a,b)=>a!==null&&a!==undefined&&b!==null&&b!==undefined&&Number.isFinite(Number(a))&&Number.isFinite(Number(b))&&Number(a)===0&&Number(b)===0;
const isZeroZeroFinal=game=>isFinal(game)&&isZeroZeroScore(game.homeScore,game.awayScore);
const isRegion=game=>game.regionGame===true||["true","yes","region"].includes(statusKey(game.regionGame));
function dateLabel(value){
  const raw=clean(value);
  if(!raw)return"Date TBD";
  const parsed=new Date(raw.includes("T")?raw:raw+"T12:00:00");
  if(Number.isNaN(parsed.getTime()))return"Date TBD";
  return new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric"}).format(parsed);
}
function recordText(record){return record.w+"–"+record.l}
function fullRecordText(record){return record.w+"–"+record.l+(record.t?"–"+record.t:"")}
function empty(text,strong){
  return'<div class="empty-state"><strong>'+esc(strong)+'</strong>'+esc(text)+'</div>';
}
function calculate(games,teamName){
  const key=norm(teamName);
  const all={w:0,l:0,pf:0,pa:0,g:0};
  const region={w:0,l:0};
  games.forEach(game=>{
    if(!isFinal(game)||isZeroZeroFinal(game))return;
    const isHome=matchesTeam(game,"home",key);
    const isAway=matchesTeam(game,"away",key);
    if(!isHome&&!isAway)return;
    const ours=Number(isHome?game.homeScore:game.awayScore);
    const theirs=Number(isHome?game.awayScore:game.homeScore);
    all.g++;all.pf+=ours;all.pa+=theirs;
    if(ours>theirs)all.w++;else if(ours<theirs)all.l++;
    if(isRegion(game)){if(ours>theirs)region.w++;else if(ours<theirs)region.l++}
  });
  return{all,region};
}
const TEAM_PAGE_VERSION='20260928-basketball-season-history1';
function renderSchedule(games,teamName,allTeams,colorRows,teamColor){
  const key=norm(teamName);
  const rows=games.filter(game=>(matchesTeam(game,"home",key)||matchesTeam(game,"away",key))&&!isZeroZeroFinal(game))
    .slice().sort((a,b)=>clean(a.date).localeCompare(clean(b.date)));
  if(!rows.length)return empty("The 2026–27 schedule and results will appear here as game data is added.","No games listed yet");
  const body=rows.map(game=>{
    const isHome=matchesTeam(game,"home",key);
    const opponent=isHome?game.awayTeam:game.homeTeam;
    const opponentState=clean(isHome?game.awayTeamState:game.homeTeamState).toUpperCase();
    const opponentBrand=opponentState&&opponentState!=="UT"?{}:brandFor(opponent,colorRows);
    const opponentBg=safeColor(opponentBrand.backgroundColor,"#1B1B1B");
    const opponentText=safeColor(opponentBrand.textColor,"#FFFFFF");
    const opponentStyle=' style="--opponent-bg:'+opponentBg+';--opponent-text:'+opponentText+';--opponent-bar:'+opponentBg+'"';
    const linkedTeam=(!opponentState||opponentState==="UT")&&(allTeams||[]).find(row=>canonicalTeamKey(row.team)===canonicalTeamKey(opponent)&&(row.association==="UHSAA"||row.team==="Utah Prep"));
    const opponentHref=linkedTeam?"boys-basketball-team.html?"+new URLSearchParams({team:linkedTeam.team,v:TEAM_PAGE_VERSION}).toString().replace(/&/g,"&amp;"):"";
    const opponentLabel=linkedTeam?'<a class="opponent-badge team-page-link"'+opponentStyle+' href="'+opponentHref+'" aria-label="Open '+esc(linkedTeam.team)+' basketball team page">'+esc(opponent)+'</a>':'<span class="opponent-badge"'+opponentStyle+'>'+esc(opponent)+'</span>';
    const stateTag=opponentState&&opponentState!=="UT"?' <span class="state-tag">('+esc(opponentState)+')</span>':"";
    const location=game.neutralSite===true?"Neutral":isHome?"Home":"Away";
    const region=isRegion(game)?'<span class="region-tag">Region</span>':"";
    let result='<span class="status">'+esc(game.status||"Scheduled")+'</span>';
    let resultClass="result";
    if(isFinal(game)){
      const ours=Number(isHome?game.homeScore:game.awayScore);
      const theirs=Number(isHome?game.awayScore:game.homeScore);
      const letter=ours>theirs?"W":ours<theirs?"L":"T";
      resultClass+=" "+(ours>theirs?"win":ours<theirs?"loss":"");
      result='<span class="'+resultClass+'">'+letter+" "+ours+"–"+theirs+'</span>';
    }else if(statusKey(game.status)==="live"&&game.homeScore!==null&&game.awayScore!==null){
      const ours=Number(isHome?game.homeScore:game.awayScore);
      const theirs=Number(isHome?game.awayScore:game.homeScore);
      result='<span class="status live">Live '+ours+"–"+theirs+'</span>';
    }
    const when=dateLabel(game.date)+(clean(game.time)?" · "+clean(game.time):"");
    return'<tr class="schedule-row"><td>'+esc(when)+'</td><td class="opponent">'+opponentLabel+stateTag+region+'</td><td class="location">'+location+'</td><td>'+result+'</td></tr>';
  }).join("");
  return'<div class="table-wrap" style="--team-color:'+safeColor(teamColor,"#333333")+'"><table><thead><tr><th>Date / Time</th><th>Opponent</th><th>Location</th><th>Result / Status</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
function render(team,allTeams,allGames,colorRows,scheduleSources,allTimeSummary){
  const key=norm(team.team);
  const brand=brandFor(team.team,colorRows);
  const bg=safeColor(brand.backgroundColor,"#333333");
  const fg=safeColor(brand.textColor,"#FFFFFF");
  const games=allGames.filter(game=>matchesTeam(game,"home",key)||matchesTeam(game,"away",key));
  const hasOwnSchedule=Object.keys(scheduleSources||{}).some(name=>norm(name)===key);
  const records=calculate(games,team.team);
  const historicalTotals=Object.entries(allTimeSummary&&allTimeSummary.teams||{}).find(([name])=>canonicalTeamKey(name)===canonicalTeamKey(team.team))?.[1]||null;
  const allTimeRecord=historicalTotals?{w:historicalTotals.wins+records.all.w,l:historicalTotals.losses+records.all.l,t:historicalTotals.ties||0,g:historicalTotals.games+records.all.g}:null;
  const gamesPlayed=records.all.g;
  const recordNote=gamesPlayed?"Through "+gamesPlayed+" completed game"+(gamesPlayed===1?"":"s")+".":"No completed 2026–27 games are recorded yet.";

function historicalRecord(entry){

  return record;
}

function sortBasketballSeasonRows(rows,mode){

  const sorts={

    'wins-asc':numSort('wins',false),
    'losses-desc':numSort('losses',true),
    'losses-asc':numSort('losses',false),
    'winpct-desc':numSort('winPct',true),
    'winpct-asc':numSort('winPct',false),
    'pf-desc':numSort('pointsFor',true),

async function ensureBasketballSeasonHistory(team){
  const holder=root.querySelector('#seasonHistoryTableHolder');

    const rows=found&&Array.isArray(found[1])?[...found[1]]:[];
    const current=currentBasketballSeasonRow(team);
    if(current)rows.unshift(current);
    if(!rows.length)holder.innerHTML=empty('No completed season history is available for this team.','No season history available');

  map.games.appendChild(current);
  map.seasons.appendChild(seasons);
  map.history.innerHTML='<h2 class="section-title">Historical Coverage</h2><div class="info-box"><div class="info-grid"><div class="info-item"><div class="info-label">All-Time Range</div><div class="info-value">2002–03 to Present</div></div><div class="info-item"><div class="info-label">Early Source</div><div class="info-value">Deseret News</div></div><div class="info-item"><div class="info-label">Recent Source</div><div class="info-value">MaxPreps</div></div></div></div><p class="record-note">Completed results from 2002–03 forward are included where available. Placeholder 0–0 results are excluded.</p>';
  shell.append(bar,panels);
  hero.insertAdjacentElement('afterend',shell);
  const requested=(new URLSearchParams(location.search).get('tab')||'overview').toLowerCase();
  const available=new Set(tabs.map(([key])=>key));
  const show=key=>{
    const valid=available.has(key)?key:'overview';
    for(const button of bar.querySelectorAll('.rus-team-tab')){
      const on=button.dataset.tab===valid;
      button.classList.toggle('active',on);
      button.setAttribute('aria-selected',on?'true':'false');
      button.tabIndex=on?0:-1;
    }
    for(const panel of panels.querySelectorAll('.rus-team-panel')){
      const on=panel.dataset.tab===valid;
      panel.hidden=!on;
    }
    if(valid==='seasons')ensureBasketballSeasonHistory(team);
    const url=new URL(location.href);
    if(valid==='overview')url.searchParams.delete('tab');else url.searchParams.set('tab',valid);
    history.replaceState({},'',url);
  };
  window.RUSBasketballShowTab=show;
  bar.addEventListener('click',event=>{
    const button=event.target.closest('.rus-team-tab');
    if(button)show(button.dataset.tab);
  });
  bar.addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight'].includes(event.key))return;
    const buttons=[...bar.querySelectorAll('.rus-team-tab')];
    const currentButton=event.target.closest('.rus-team-tab');
    const index=buttons.indexOf(currentButton);
    if(index<0)return;
    event.preventDefault();
    const step=event.key==='ArrowRight'?1:-1;
    const next=buttons[(index+step+buttons.length)%buttons.length];
    next.focus();
    show(next.dataset.tab);
  });
  show(requested);
}

async function load(){
  try{
    const query=new URLSearchParams(location.search);
    const requested=norm(query.get("team"));
    if(!requested)throw new Error("Select a school from the boys basketball directory.");
    const urls=["boys-basketball-teams.json?v=20260927-basketball-directory-trim","boys-basketball-games-2026-27.json?v=20260927-basketball-all-schedules","team-colors-exact.json?v=20260926-pilot1"];
    const responses=await Promise.all([...urls.map(url=>fetch(url,{cache:"no-store"})),fetch(ALL_TIME_RECORDS_URL,{cache:"no-store"}).catch(()=>null)]);
    if(!responses[0].ok)throw new Error("Basketball team list could not be loaded.");
    const teams=await responses[0].json();
    const gameFeed=responses[1].ok?await responses[1].json():{games:[]};
    const colorRows=responses[2].ok?await responses[2].json():[];
    const allTimeSummary=responses[3]&&responses[3].ok?await responses[3].json().catch(()=>null):null;
    window.RUSBasketballPreviewData={teams,games:Array.isArray(gameFeed.games)?gameFeed.games:[],colors:Array.isArray(colorRows)?colorRows:[]};
    if(window.RUSSchoolAssets&&window.RUSSchoolAssets.load)await window.RUSSchoolAssets.load();
    const team=teams.find(row=>norm(row.team)===requested&&(row.association==="UHSAA"||row.team==="Utah Prep"));
    if(!team)throw new Error("That school is not in the boys basketball team directory.");
    render(team,teams,Array.isArray(gameFeed.games)?gameFeed.games:[],Array.isArray(colorRows)?colorRows:[],gameFeed.sources||{},allTimeSummary);
    setupHistoricalResults(team,teams,Array.isArray(colorRows)?colorRows:[]);
    setupBasketballTabs(team,Array.isArray(colorRows)?colorRows:[]);
  }catch(error){
    root.innerHTML='<div class="error-state"><strong>Unable to load this basketball team page.</strong>'+esc(error&&error.message?error.message:"Please try again.")+'</div>';
  }
}
load();
})();
</script>
