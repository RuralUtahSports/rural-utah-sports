function sortBasketballSeasonRows(rows,mode){

      }
      const found=Object.entries(payload.teams||{}).find(([name])=>norm(name)===key);
      const entry=found?found[1]:null;
      if(!entry)panel.innerHTML=empty('No results are available for this team in '+season.label+'.','No results listed');

        const note=entry.status==='no-results'?'No completed results were listed for this team in '+season.label+'.':record.g+' completed games listed.';

        panel.innerHTML=stats+renderHistoricalGames(entry,team,allTeams,colorRows,bg)+source;
      }
      panel.dataset[cacheKey]='true';
    }catch(error){
      panel.innerHTML=empty(error&&error.message?error.message:'Please try again.','Unable to load '+season.label+' results');
      if(season.id==='2025-26')historicalResultsPromise=null;
    }
  });
}


const OPPONENT_HISTORY_VERSION='20260928-basketball-playoffs1';
const opponentFileKey=value=>canonicalTeamKey(value).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const opponentFullDate=value=>{
  const raw=clean(value);
  if(!raw)return 'Date TBD';
  const parsed=new Date(raw.includes('T')?raw:raw+'T12:00:00');
  if(Number.isNaN(parsed.getTime()))return raw;
  return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric'}).format(parsed);
};
const opponentGameTime=value=>{
  const raw=clean(value);
  const parsed=Date.parse(raw.includes('T')?raw:raw+'T12:00:00');
  return Number.isFinite(parsed)?parsed:0;
};
function currentOpponentGames(team){
  const games=window.RUSBasketballPreviewData?.games||[];
  const teamKey=canonicalTeamKey(team.team);
  const out=[];
  for(const game of games){
    if(!isFinal(game)||isZeroZeroFinal(game))continue;
    const homeKey=canonicalTeamKey(game.homeTeam);
    const awayKey=canonicalTeamKey(game.awayTeam);
    const isHome=homeKey===teamKey;
    const isAway=awayKey===teamKey;
    if(!isHome&&!isAway)continue;
    const opponent=isHome?game.awayTeam:game.homeTeam;
    const stateRaw=clean(isHome?game.awayTeamState:game.homeTeamState).toUpperCase();
    const state=stateRaw&&stateRaw!=='UTAH'?stateRaw:'UT';
    const teamScore=Number(isHome?game.homeScore:game.awayScore);
    const opponentScore=Number(isHome?game.awayScore:game.homeScore);
    out.push({
      opponent:clean(opponent),
      key:canonicalTeamKey(opponent),
      state,
      season:'2026-27',
      date:clean(game.date),
      location:game.neutralSite===true?'Neutral':isHome?'Home':'Away',
      result:teamScore>opponentScore?'W':teamScore<opponentScore?'L':'T',
      teamScore,
      opponentScore,
      sourceUrl:''
    });
  }
  return out;
}
function summarizeOpponentGames(group){
  const games=[...(group.games||[])].sort((a,b)=>opponentGameTime(b.date)-opponentGameTime(a.date)||clean(b.season).localeCompare(clean(a.season)));
  let wins=0,losses=0,ties=0,pf=0,pa=0,biggestWin=null,biggestLoss=null;
  for(const game of games){
    pf+=Number(game.teamScore||0);
    pa+=Number(game.opponentScore||0);
    if(game.result==='W'){
      wins++;
      const margin=Number(game.teamScore)-Number(game.opponentScore);
      if(!biggestWin||margin>biggestWin.margin||(margin===biggestWin.margin&&opponentGameTime(game.date)>opponentGameTime(biggestWin.date)))biggestWin={...game,margin};
    }else if(game.result==='L'){
      losses++;
      const margin=Number(game.opponentScore)-Number(game.teamScore);
      if(!biggestLoss||margin>biggestLoss.margin||(margin===biggestLoss.margin&&opponentGameTime(game.date)>opponentGameTime(biggestLoss.date)))biggestLoss={...game,margin};
    }else ties++;
  }
  let currentStreak=null;
  if(games.length){
    const result=games[0].result;
    let count=0;
    for(const game of games){
      if(game.result!==result)break;
      count++;
    }
    currentStreak={result,count};
  }
  return {
    key:group.key,
    name:group.name,
    state:group.state,
    meetings:games.length,
    wins,losses,ties,
    winPct:games.length?(wins+ties*.5)/games.length:0,
    pointsFor:pf,
    pointsAgainst:pa,
    currentStreak,
    lastMeeting:games[0]||null,
    biggestWin,
    biggestLoss,
    games
  };
}
function mergeOpponentHistory(payload,team){
  const groups=new Map();
  const addGroup=(row)=>{
    const state=clean(row.state).toUpperCase()||'UT';
    const key=canonicalTeamKey(row.key||row.name);
    const id=key+'|'+state;
    let group=groups.get(id);
    if(!group){
      group={key,name:clean(row.name)||key,state,games:[]};
      groups.set(id,group);
    }
    if(state==='UT'){
      const linked=(window.RUSBasketballPreviewData?.teams||[]).find(item=>canonicalTeamKey(item.team)===key);
      if(linked)group.name=linked.team;
    }
    for(const game of Array.isArray(row.games)?row.games:[])group.games.push({...game});
  };
  for(const row of Array.isArray(payload?.opponents)?payload.opponents:[])addGroup(row);
  for(const game of currentOpponentGames(team)){
    const id=game.key+'|'+game.state;
    let group=groups.get(id);
    if(!group){
      const linked=(window.RUSBasketballPreviewData?.teams||[]).find(item=>canonicalTeamKey(item.team)===game.key);
      group={key:game.key,name:linked?.team||game.opponent,state:game.state,games:[]};
      groups.set(id,group);
    }
    group.games.push({
      season:game.season,date:game.date,location:game.location,result:game.result,
      teamScore:game.teamScore,opponentScore:game.opponentScore,sourceUrl:game.sourceUrl
    });
  }
  return [...groups.values()].map(summarizeOpponentGames);
}
function opponentRecord(row){
  return Number(row.wins||0)+'–'+Number(row.losses||0)+(Number(row.ties||0)?'–'+Number(row.ties||0):'');
}
function opponentStreak(row){
  const streak=row.currentStreak;
  return streak&&streak.count?streak.result+' '+streak.count:'—';
}
function opponentGameBrief(game,kind){
  if(!game)return '—';
  const margin=kind==='win'?Number(game.margin||0):kind==='loss'?Number(game.margin||0):0;
  const score=Number(game.teamScore)+'–'+Number(game.opponentScore);
  return (kind?(kind==='win'?'+':'−')+margin+' · ':'')+score+' · '+opponentFullDate(game.date);
}
function linkedOpponent(allTeams,row){
  if(clean(row.state).toUpperCase()!=='UT')return null;

  const sourceText='UHSAA Sports Records Book'+(source.updated?' · Updated '+source.updated:'');
  const sourceNote=(sourceUrl?'<p class="source-note">All-time championship source: <a href="'+esc(sourceUrl)+'" target="_blank" rel="noopener noreferrer">'+esc(sourceText)+'</a>.</p>':'')+'<p class="source-note">Championship-game appearances, runner-ups and final scores are verified from the RUS game-history coverage for the 2003–2026 championship seasons. Earlier runner-up totals are not yet included, so the appearance number should not be read as an all-time total.</p>';
  const summary='<div class="championship-summary"><div class="championship-card"><div class="championship-number">'+titles.toLocaleString()+'</div><div class="championship-label">All-Time State Titles</div></div><div class="championship-card"><div class="championship-number">'+appearances.toLocaleString()+'</div><div class="championship-label">Verified Title Games Since 2003</div></div><div class="championship-card"><div class="championship-number">'+runnerUps.toLocaleString()+'</div><div class="championship-label">Verified Runner-Ups Since 2003</div></div><div class="championship-card"><div class="championship-number">'+esc(recent)+'</div><div class="championship-label">Most Recent Title</div></div></div>';
  const finalsRows=(verified?.finals||[]).map(final=>{
    const brand=brandFor(final.opponent,colorRows);
    const obg=safeColor(brand.backgroundColor,'#1B1B1B');
    const ot=safeColor(brand.textColor,'#FFFFFF');
    const style=' style="--opponent-bg:'+obg+';--opponent-text:'+ot+';--opponent-bar:'+obg+'"';
    const linked=(allTeams||[]).find(row=>canonicalTeamKey(row.team)===canonicalTeamKey(final.opponent)&&(row.association==='UHSAA'||row.team==='Utah Prep'));
    const opponent=linked?'<a class="opponent-badge team-page-link"'+style+' href="boys-basketball-team.html?'+new URLSearchParams({team:linked.team,v:TEAM_PAGE_VERSION}).toString().replace(/&/g,'&amp;')+'">'+esc(final.opponent)+'</a>':'<span class="opponent-badge"'+style+'>'+esc(final.opponent)+'</span>';
    const resultClass=final.result==='Champion'?'finish-badge champion':'finish-badge runner-up';
    return '<tr><td><strong>'+Number(final.year)+'</strong></td><td>'+esc(final.classification||'—')+'</td><td><span class="'+resultClass+'">'+esc(final.result)+'</span></td><td>'+opponent+'</td><td>'+Number(final.teamScore)+'–'+Number(final.opponentScore)+'</td></tr>';
  }).join('');
  const finalsTable='<h3 class="subsection-title">Championship Game Appearances</h3>'+(finalsRows?'<div class="table-wrap" style="--team-color:'+bg+';--team-text:'+fg+'"><table><thead><tr><th>Year</th><th>Class</th><th>Result</th><th>Opponent</th><th>Score</th></tr></thead><tbody>'+finalsRows+'</tbody></table></div>':empty('No verified championship-game appearance is recorded for this school from 2003 through 2026.','No verified title-game appearances'));
  const titleRows=(item?.championships||[]).map(champ=>'<tr><td><strong>'+Number(champ.year)+'</strong></td><td>'+(champ.classification?esc(champ.classification):'—')+'</td><td>'+esc(champ.coach||'—')+'</td></tr>').join('');
  const years=(item?.years||[]).join(', ');
  const allTitles='<h3 class="subsection-title">All-Time UHSAA Championships</h3>'+(titles?'<div class="info-box" style="margin-bottom:16px"><div class="info-label">Championship Years</div><div class="info-value championship-years">'+esc(years)+'</div></div><div class="table-wrap" style="--team-color:'+bg+';--team-text:'+fg+'"><table><thead><tr><th>Year</th><th>Class</th><th>Coach</th></tr></thead><tbody>'+titleRows+'</tbody></table></div>':empty('UHSAA does not list a boys basketball state championship for this school through the 2026 season.','No state championships listed'));
  return '<h2 class="section-title">Championship History</h2>'+summary+finalsTable+allTitles+sourceNote;
}

function setupBasketballTabs(team,colorRows,championshipData,finalsData,allTeams){
  const hero=root.querySelector('.hero');
  const current=root.querySelector('.current-season-section');
  const seasons=root.querySelector('.history-section');
  if(!hero||!current||!seasons)return;
  const brand=brandFor(team.team,colorRows);
  const bg=safeColor(brand.backgroundColor,'#F14D07');
  const fg=safeColor(brand.textColor,'#000000');
  const shell=document.createElement('section');
  shell.className='rus-team-tabs-shell';
  shell.style.setProperty('--team-color',bg);
  shell.style.setProperty('--team-text',fg);
  const tabs=[['overview','Overview'],['seasons','Seasons'],['playoffs','Playoffs'],['games','Games'],['opponents','Opponents'],['championships','Championships'],['history','History']];
  const bar=document.createElement('div');
  bar.className='rus-team-tabs';
  bar.setAttribute('role','tablist');
  bar.setAttribute('aria-label','Basketball team sections');
  const panels=document.createElement('div');
  panels.className='rus-team-panels';
  const map={};
  for(const [key,label] of tabs){
    const button=document.createElement('button');
    button.className='rus-team-tab';
    button.type='button';
    button.dataset.tab=key;
    button.id='rus-basketball-tab-'+key;
    button.setAttribute('role','tab');
    button.textContent=label;
    const panel=document.createElement('section');
    panel.className='rus-team-panel';
    panel.dataset.tab=key;
    panel.id='rus-basketball-panel-'+key;
    panel.setAttribute('role','tabpanel');
    panel.setAttribute('aria-labelledby',button.id);
    panel.hidden=true;
    bar.appendChild(button);
    panels.appendChild(panel);
    map[key]=panel;
  }
  const colors=clean(brand.colors)||'—';
  map.overview.innerHTML='<h2 class="section-title">Team Information</h2><div class="info-box"><div class="info-grid"><div class="info-item"><div class="info-label">Classification</div><div class="info-value">'+esc(team.classification||'—')+'</div></div><div class="info-item"><div class="info-label">Region</div><div class="info-value">'+esc(team.region||'—')+'</div></div><div class="info-item"><div class="info-label">School Colors</div><div class="info-value">'+esc(colors)+'</div></div></div></div><h2 class="section-title">Basketball History</h2><div class="info-box"><div class="info-grid"><div class="info-item"><div class="info-label">Recorded History Begins</div><div class="info-value">2002–03</div></div><div class="info-item"><div class="info-label">Current Season</div><div class="info-value">2026–27</div></div><div class="info-item"><div class="info-label">Association</div><div class="info-value">'+esc(team.association||'—')+'</div></div></div></div>';
  map.games.appendChild(current);
  map.seasons.appendChild(seasons);
  map.playoffs.innerHTML='<div class="loading-state">Open the Playoffs tab to load state tournament history.</div>';
  map.opponents.innerHTML='<div class="loading-state">Open the Opponents tab to load head-to-head history.</div>';
  map.championships.innerHTML=championshipPanelHTML(team,championshipData,finalsData,bg,fg,colorRows,allTeams);
  map.history.innerHTML='<h2 class="section-title">Historical Coverage</h2><div class="info-box"><div class="info-grid"><div class="info-item"><div class="info-label">All-Time Range</div><div class="info-value">2002–03 to Present</div></div><div class="info-item"><div class="info-label">Early Source</div><div class="info-value">Deseret News</div></div><div class="info-item"><div class="info-label">Recent Source</div><div class="info-value">MaxPreps</div></div></div></div><p class="record-note">Completed results from 2002–03 forward are included where available. Placeholder 0–0 results are excluded.</p>';
  shell.append(bar,panels);
  hero.insertAdjacentElement('afterend',shell);
  const requested=(new URLSearchParams(location.search).get('tab')||'overview').toLowerCase();
  const available=new Set(tabs.map(([key])=>key));
  const show=key=>{
    const valid=available.has(key)?key:'overview';
    for(const button of bar.querySelectorAll('.rus-team-tab')){
      const on=button.dataset.tab===valid;
      button.classList.toggle('active',on);
      button.setAttribute('aria-selected',on?'true':'false');
      button.tabIndex=on?0:-1;
    }
    for(const panel of panels.querySelectorAll('.rus-team-panel')){
      const on=panel.dataset.tab===valid;
      panel.hidden=!on;
    }
    if(valid==='seasons')ensureBasketballSeasonHistory(team);
    if(valid==='playoffs')ensureBasketballPlayoffHistory(team,allTeams,colorRows,map.playoffs,bg,fg);
    if(valid==='opponents')ensureBasketballOpponentHistory(team,allTeams,colorRows,map.opponents,bg,fg);
    const url=new URL(location.href);
    if(valid==='overview')url.searchParams.delete('tab');else url.searchParams.set('tab',valid);
    history.replaceState({},'',url);
  };
  window.RUSBasketballShowTab=show;
  bar.addEventListener('click',event=>{
    const button=event.target.closest('.rus-team-tab');
    if(button)show(button.dataset.tab);
  });
  bar.addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight'].includes(event.key))return;
    const buttons=[...bar.querySelectorAll('.rus-team-tab')];
    const currentButton=event.target.closest('.rus-team-tab');
    const index=buttons.indexOf(currentButton);
    if(index<0)return;
    event.preventDefault();
    const step=event.key==='ArrowRight'?1:-1;
    const next=buttons[(index+step+buttons.length)%buttons.length];
    next.focus();
    show(next.dataset.tab);
  });
  show(requested);
}

async function load(){
  try{
    const query=new URLSearchParams(location.search);
    const requested=norm(query.get("team"));
    if(!requested)throw new Error("Select a school from the boys basketball directory.");
    const urls=["boys-basketball-teams.json?v=20260927-basketball-directory-trim","boys-basketball-games-2026-27.json?v=20260927-basketball-all-schedules","team-colors-exact.json?v=20260926-pilot1"];
    const responses=await Promise.all([...urls.map(url=>fetch(url,{cache:"no-store"})),fetch(ALL_TIME_RECORDS_URL,{cache:"no-store"}).catch(()=>null),fetch(CHAMPIONSHIPS_URL,{cache:"no-store"}).catch(()=>null),fetch(FINALS_URL,{cache:"no-store"}).catch(()=>null)]);
    if(!responses[0].ok)throw new Error("Basketball team list could not be loaded.");
    const teams=await responses[0].json();
    const gameFeed=responses[1].ok?await responses[1].json():{games:[]};
    const colorRows=responses[2].ok?await responses[2].json():[];
    const allTimeSummary=responses[3]&&responses[3].ok?await responses[3].json().catch(()=>null):null;
    const championshipData=responses[4]&&responses[4].ok?await responses[4].json().catch(()=>({teams:{}})):{teams:{}};
    const finalsData=responses[5]&&responses[5].ok?await responses[5].json().catch(()=>({teams:{}})):{teams:{}};
    window.RUSBasketballPreviewData={teams,games:Array.isArray(gameFeed.games)?gameFeed.games:[],colors:Array.isArray(colorRows)?colorRows:[]};
    if(window.RUSSchoolAssets&&window.RUSSchoolAssets.load)await window.RUSSchoolAssets.load();
    const team=teams.find(row=>norm(row.team)===requested&&(row.association==="UHSAA"||row.team==="Utah Prep"));
    if(!team)throw new Error("That school is not in the boys basketball team directory.");
    render(team,teams,Array.isArray(gameFeed.games)?gameFeed.games:[],Array.isArray(colorRows)?colorRows:[],gameFeed.sources||{},allTimeSummary,championshipData);
    setupHistoricalResults(team,teams,Array.isArray(colorRows)?colorRows:[]);
    setupBasketballTabs(team,Array.isArray(colorRows)?colorRows:[],championshipData,finalsData,teams);
  }catch(error){
    root.innerHTML='<div class="error-state"><strong>Unable to load this basketball team page.</strong>'+esc(error&&error.message?error.message:"Please try again.")+'</div>';
  }
}
load();
})();
</script>
