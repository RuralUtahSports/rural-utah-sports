<header><div class="header-content"><img src="RUSlogoNew.png" alt="Rural Utah Sports" class="logo"><div class="site-title"><h1>Rural Utah Sports</h1><p>Utah High School Sports History &amp; Data</p></div></div></header>

<script>
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const compact=v=>String(v??'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
const aliases={CEDAR:'CEDARCITY',CEDARCITY:'CEDARCITY',GRANDCOUNTY:'GRAND',GUNNISON:'GUNNISONVALLEY',MONUMENTVAL:'MONUMENTVALLEY',MAPLEMTN:'MAPLEMOUNTAIN',AMERICANLEADERSHIP:'ALA',AMERICANLEADERSHIPACADEMY:'ALA',STJOSEPH:'SAINTJOSEPH'};
const canon=v=>aliases[compact(v)]||compact(v);
const params=new URLSearchParams(location.search);
const wanted=()=>params.get('id')||'';
const requestedSeason=()=>params.get('season')==='2025'?2025:2026;
const teamURL=(t,season)=>`team.html?team=${encodeURIComponent(t)}${season===2025?'&season=2025':''}`;
const playerURL=(id,season)=>`player.html?id=${encodeURIComponent(id)}&season=${season}`;
const statString=values=>Object.entries(values||{}).filter(([,v])=>String(v??'').trim()!=='').map(([k,v])=>`<strong>${esc(k)}:</strong> ${esc(v)}`).join(' &nbsp;•&nbsp; ')||'—';
function score(g){if(g.teamScore==null||g.opponentScore==null)return '—';const c=g.teamScore>g.opponentScore?'win':g.teamScore<g.opponentScore?'loss':'tie';return `<span class="${c}">${esc(g.teamScore)}-${esc(g.opponentScore)}</span>`}
function samePlayer(a,b){if(a.playerId&&b.playerId&&a.playerId===b.playerId)return true;return compact(a.number)===compact(b.number)&&compact(a.name)===compact(b.name)}
function findProfile(rosters,id){for(const [team,t] of Object.entries(rosters?.teams||{})){for(const p of t.roster||[])if(p.playerId===id)return{team,data:t,player:p};for(const s of t.stats||[])for(const p of s.rows||[])if(p.playerId===id)return{team,data:t,player:{playerId:p.playerId,number:p.number,name:p.name,class:'',position:'',height:'',weight:''}}}return null}
function seasonLines(profile){const out=[];for(const s of profile.data?.stats||[])for(const r of s.rows||[])if(samePlayer(profile.player,r))out.push({category:s.category,values:r.values||{}});return out}
function gameLines(gameData,profile){const out=[];for(const g of gameData?.games||[])for(const p of g.players||[])if(samePlayer(profile.player,p))out.push({game:g,player:p});return out}
function seasonSwitcher(p,current){const options=[2026,2025];return `<div class="season-switch">${options.map(y=>`<a class="${y===current?'active':''}" href="${playerURL(p.playerId,y)}">${y} Season</a>`).join('')}</div>`}
function render(profile,meta,gameData,seasonYear){const p=profile.player,season=seasonLines(profile),games=gameLines(gameData,profile),plays=[];for(const x of games)for(const play of x.player.scoringPlays||[])if(!plays.some(y=>y.play===play&&y.date===x.game.date))plays.push({date:x.game.date,opponent:x.game.opponent,play,url:x.game.url});document.title=`${p.name} • ${seasonYear} | Rural Utah Sports`;
const seasonRows=season.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Category</th><th>${seasonYear} Season Totals</th></tr></thead><tbody>${season.map(s=>`<tr><td class="left"><strong>${esc(s.category)}</strong></td><td class="left">${statString(s.values)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No ${seasonYear} season stat totals were reported for this player.</div>`;
const gameRows=games.length?`<div class="summary"><span class="pill"><strong>${games.length}</strong> Games With Player Data</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Opponent</th><th>Score</th><th>Game Stats</th></tr></thead><tbody>${games.map(({game:g,player:x})=>`<tr><td>${g.url?`<a class="game-link" target="_blank" rel="noopener noreferrer" href="${esc(g.url)}">${esc(g.date)}</a>`:esc(g.date)}</td><td class="left">${esc(g.location==='Away'?'at '+g.opponent:'vs '+g.opponent)}</td><td>${score(g)}</td><td class="left">${(x.statLines||[]).map(l=>`<strong>${esc(l.category)}:</strong> ${statString(l.values)}`).join('<br>')||'—'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No individual ${seasonYear} game stat lines have been connected to this player.</div>`;
const playRows=plays.length?`<div class="plays">${plays.map(x=>`<div class="play"><strong>${esc(x.date)} vs ${esc(x.opponent)}</strong><br>${esc(x.play)}</div>`).join('')}</div>`:`<div class="empty">No ${seasonYear} scoring plays have been matched to this player.</div>`;
const links=seasonYear===2025?`<a href="awards-2025.html">2025 Awards</a>`:`<a href="stat-leaders.html">Stat Leaders</a><a href="mvp.html">MVP Race</a><a href="all-state.html">All-State Watch</a>`;
document.getElementById('page').innerHTML=`<a class="back" href="${teamURL(profile.team,seasonYear)}">← ${esc(profile.team)}</a>${seasonSwitcher(p,seasonYear)}<section class="hero"><div class="hero-top"><div><div class="eyebrow">${seasonYear} Player Profile</div><div class="player-name">${esc(p.name)}</div><a class="team-link" href="${teamURL(profile.team,seasonYear)}">${esc(profile.team)} ${esc(meta?.mascot||profile.data?.mascot||'')}</a></div><div class="number">#${esc(p.number||'—')}</div></div><div class="bio-grid"><div class="bio"><strong>${esc(p.class||'—')}</strong><span>Class</span></div><div class="bio"><strong>${esc(p.position||'—')}</strong><span>Position</span></div><div class="bio"><strong>${esc(p.height||'—')}</strong><span>Height</span></div><div class="bio"><strong>${esc(p.weight||'—')}</strong><span>Weight</span></div><div class="bio"><strong>${esc(profile.data?.classification||meta?.classification||'—')}</strong><span>Classification</span></div><div class="bio"><strong>${esc(profile.data?.region||meta?.region||'—')}</strong><span>Region</span></div></div><div class="profile-links"><a href="${teamURL(profile.team,seasonYear)}">Team Page</a>${links}${profile.data?.rosterUrl?`<a target="_blank" rel="noopener noreferrer" href="${esc(profile.data.rosterUrl)}">Deseret Roster ↗</a>`:''}</div></section><h2 class="section-title">${seasonYear} Season Stats</h2>${seasonRows}<h2 class="section-title">${seasonYear} Game Log</h2>${gameRows}<h2 class="section-title">${seasonYear} Scoring Plays</h2>${playRows}<div class="source-note">Roster and player statistics are based on information reported to Deseret. Missing values are left blank rather than estimated. Game logs are matched back to roster players only when identity can be matched confidently.</div>`}
async function load(){const id=wanted(),seasonYear=requestedSeason();if(!id){document.getElementById('page').innerHTML='<div class="error">No player was selected.</div>';return}try{const stamp=Date.now(),suffix=seasonYear===2025?'2025':'2026';const [rr,gr,tr]=await Promise.all([fetch(`deseret-rosters-stats-${suffix}.json?v=${stamp}`,{cache:'no-store'}),fetch(`player-game-stats-${suffix}.json?v=${stamp}`,{cache:'no-store'}),fetch(`teams-data.json?v=${stamp}`,{cache:'no-store'})]);if(!rr.ok)throw new Error('Roster data unavailable');const rosters=await rr.json(),games=gr.ok?await gr.json():{teams:{}},teams=tr.ok?await tr.json():[];let profile=findProfile(rosters,id);if(!profile&&seasonYear===2025){const looseId=compact(id);outer:for(const [team,t] of Object.entries(rosters.teams||{})){for(const p of t.roster||[]){if(compact(p.playerId)===looseId){profile={team,data:t,player:p};break outer}}}}if(!profile)throw new Error('Player not found');const gkey=Object.keys(games.teams||{}).find(k=>canon(k)===canon(profile.team));const meta=teams.find(t=>canon(t.team)===canon(profile.team))||{};render(profile,meta,gkey?games.teams[gkey]:null,seasonYear)}catch(e){console.error(e);document.getElementById('page').innerHTML=`<div class="error">This ${requestedSeason()} player profile could not be loaded. That player may not have archived data for this season.</div>`}}
async function loadBasketball(){
 const page=document.getElementById('page');
 const team=params.get('team')||'';
 const rosterFile=params.get('roster')||'';
 const name=params.get('name')||'';
 const classYear=params.get('classYear')||'';
 const number=params.get('number')||'';
 const year=Number(params.get('year')||0);
 const compact=v=>String(v??'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
 const jersey=v=>String(v??'').trim().replace(/^#/,'').replace(/^0+(?=\d)/,'');
 const fmt=(v,d=1)=>v===null||v===undefined||v===''||!Number.isFinite(Number(v))?'—':Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
 if(!team||!rosterFile||!name){
  page.innerHTML='<div class="error">Basketball player details are incomplete. Return to the basketball roster directory and open the player again.</div>';
  return;
 }
 try{
  const [r,sr]=await Promise.all([
   fetch(rosterFile,{cache:'no-store'}),
   year===2026?fetch('boys-basketball-player-stats/2026.json?v=20260929-profile-stats1',{cache:'no-store'}):Promise.resolve(null)
  ]);
  if(!r.ok)throw Error('Roster history unavailable');
  const data=await r.json();
  let statsData=null;
  if(sr&&sr.ok){try{statsData=await sr.json()}catch(e){console.warn('Basketball stats could not be parsed',e)}}
  const selectedSeason=(data.seasons||[]).find(s=>Number(s.year)===year);
  const rosterMatches=(selectedSeason?.players||[]).filter(p=>compact(p.name)===compact(name)&&(!number||jersey(p.number)===jersey(number)));
  const selected=rosterMatches.length===1?rosterMatches[0]:null;
  const matchNumber=number||(selected?.number||'');
  const statMatches=(statsData?.players||[]).filter(p=>compact(p.teamKey)===compact(team)&&compact(p.name)===compact(name)&&(!matchNumber||jersey(p.number)===jersey(matchNumber)));
  const playerStats=statMatches.length===1?statMatches[0]:null;
  const profilePlayer=selected||(playerStats?{number:playerStats.number||matchNumber,class:'',position:'',height:'',weight:''}:null);
  if(!profilePlayer)throw Error('Player not found or identity is ambiguous');
  const targetClass=classYear||profilePlayer.class||'';
  const rows=[];
  for(const season of data.seasons||[]){
   for(const p of season.players||[]){
    const sameName=compact(p.name)===compact(name);
    const isSelectedSeason=Number(season.year)===Number(year)&&(!matchNumber||jersey(p.number)===jersey(matchNumber));
    const sameIdentity=targetClass?String(p.class||'')===String(targetClass)||(isSelectedSeason&&!p.class):isSelectedSeason;
    if(sameName&&sameIdentity)rows.push({...p,season:season.season||String(Number(season.year)-1)+'-'+String(season.year).slice(-2),year:Number(season.year),sourceUrl:season.sourceUrl});
   }
  }
  if(selected&&!rows.some(x=>Number(x.year)===Number(year)&&jersey(x.number)===jersey(selected.number)))rows.push({...selected,season:selectedSeason?.season||'',year:Number(year),sourceUrl:selectedSeason?.sourceUrl});
  rows.sort((a,b)=>b.year-a.year);
  const displayYear=year||Number(selectedSeason?.year)||Number(rows[0]?.year)||2026;
  const displaySeason=selectedSeason?.season||String(displayYear-1)+'-'+String(displayYear).slice(-2);
  const selectedRow=rows.find(x=>Number(x.year)===displayYear)||profilePlayer;
  const teamName=data.team||team;
  const teamLink='boys-basketball-team.html?team='+encodeURIComponent(team)+'&tab=rosters';
  const directory='players.html?sport=basketball&year='+displayYear;
  const profileUrlFor=(entry)=>'player.html?sport=basketball&team='+encodeURIComponent(team)+'&roster='+encodeURIComponent(rosterFile)+'&name='+encodeURIComponent(name)+'&classYear='+encodeURIComponent(targetClass)+'&number='+encodeURIComponent(entry.number||matchNumber)+'&year='+Number(entry.year);
  const switcher=rows.length>1?'<div class="season-switch">'+rows.map(x=>'<a class="'+(Number(x.year)===displayYear?'active':'')+'" href="'+esc(profileUrlFor(x))+'">'+esc(x.season)+'</a>').join('')+'</div>':'';
  const fields=[['GP','games',0],['PTS','points',0],['PPG','pointsPerGame',2],['3PM','threePointers',0],['3PG','threePointersPerGame',2],['REB','rebounds',0],['RPG','reboundsPerGame',2],['AST','assists',0],['APG','assistsPerGame',2],['STL','steals',0],['SPG','stealsPerGame',2],['BPG','blocksPerGame',2]];
  const averages=[['PPG','pointsPerGame'],['RPG','reboundsPerGame'],['APG','assistsPerGame'],['SPG','stealsPerGame'],['BPG','blocksPerGame']];
  const statsTeam=(statsData?.teams||[]).find(t=>compact(t.teamKey)===compact(team));
  let statsSection='';
  if(displayYear===2026&&playerStats){
   statsSection='<h2 class="section-title">2025–26 Season Stats</h2><div class="summary">'+averages.map(([label,key])=>'<span class="pill"><strong>'+label+'</strong> '+fmt(playerStats[key],2)+'</span>').join('')+'</div><div class="table-wrap"><table class="data-table"><thead><tr>'+fields.map(x=>'<th>'+x[0]+'</th>').join('')+'</tr></thead><tbody><tr>'+fields.map(x=>'<td class="stat-value">'+fmt(playerStats[x[1]],x[2])+'</td>').join('')+'</tr></tbody></table></div><div class="source-note">Season totals and per-game averages from the 2025–26 boys basketball stat archive.'+(statsTeam?.sourceUrl?' <a class="game-link" target="_blank" rel="noopener noreferrer" href="'+esc(statsTeam.sourceUrl)+'">Deseret stats ↗</a>':'')+'</div>';
  }else if(displayYear===2026){
   statsSection='<h2 class="section-title">2025–26 Season Stats</h2><div class="empty">A unique team, player name and jersey number match was not available in the reported stats, so no season totals are shown.</div>';
  }else{
   statsSection='<h2 class="section-title">'+esc(displaySeason)+' Season Stats</h2><div class="empty">Basketball player season stats are currently available for 2025–26 only.</div>';
  }
  document.title=name+' • Basketball | Rural Utah Sports';
  const meta=document.querySelector('meta[name="description"]');
  if(meta)meta.content='Boys basketball roster history and reported season statistics for '+name+' from Rural Utah Sports.';
  const rosterRows=rows.map(x=>'<tr><td>'+esc(x.season)+'</td><td>'+esc(x.number||'—')+'</td><td>'+esc(x.class||'—')+'</td><td>'+esc(x.position&&x.position!=='-'?x.position:'—')+'</td><td>'+esc(x.height||'—')+'</td><td>'+esc(x.weight&&x.weight!=='-'?x.weight:'—')+'</td><td>'+(x.sourceUrl?'<a class="game-link" target="_blank" rel="noopener noreferrer" href="'+esc(x.sourceUrl)+'">Roster ↗</a>':'—')+'</td></tr>').join('');
  const rosterSection=rows.length?'<div class="table-wrap"><table class="data-table"><thead><tr><th>Season</th><th>Number</th><th>Class</th><th>Position</th><th>Height</th><th>Weight</th><th>Source</th></tr></thead><tbody>'+rosterRows+'</tbody></table></div>':'<div class="empty">No roster appearances were found for this player in the archive.</div>';
  page.innerHTML='<a class="back" href="'+directory+'">← Basketball Players</a><section class="hero"><div class="hero-top"><div><div class="eyebrow">Boys Basketball Player Profile</div><div class="player-name">'+esc(name)+'</div><a class="team-link" href="'+teamLink+'">'+esc(teamName)+'</a></div><div class="number">#'+esc(selectedRow.number||matchNumber||'—')+'</div></div><div class="bio-grid"><div class="bio"><strong>'+esc(selectedRow.class||targetClass||'—')+'</strong><span>Class</span></div><div class="bio"><strong>'+esc(selectedRow.position&&selectedRow.position!=='-'?selectedRow.position:'—')+'</strong><span>Position</span></div><div class="bio"><strong>'+esc(selectedRow.height||'—')+'</strong><span>Height</span></div><div class="bio"><strong>'+esc(selectedRow.weight&&selectedRow.weight!=='-'?selectedRow.weight:'—')+'</strong><span>Weight</span></div></div><div class="profile-links"><a href="'+teamLink+'">Team Roster History</a>'+(selectedRow.sourceUrl?'<a target="_blank" rel="noopener noreferrer" href="'+esc(selectedRow.sourceUrl)+'">Source Roster ↗</a>':'')+(displayYear===2026&&statsTeam?.sourceUrl?'<a target="_blank" rel="noopener noreferrer" href="'+esc(statsTeam.sourceUrl)+'">Source Stats ↗</a>':'')+'</div></section>'+switcher+statsSection+'<h2 class="section-title">'+esc(displaySeason)+' Game Log</h2><div class="empty">Game-by-game basketball player logs are not included in the current archive.</div><h2 class="section-title">Roster History</h2>'+rosterSection+'<div class="source-note">Basketball profiles use roster identity and season stats for this sport only. Older seasons currently include roster appearances; basketball game-by-game player logs are not imported.</div>';
 }catch(e){
  console.error(e);
  page.innerHTML='<div class="error">This basketball player profile could not be loaded. The archived roster may be unavailable or the player identity may be ambiguous.</div>';
 }
}
if(params.get('sport')==='basketball')loadBasketball();else load();
</script>
