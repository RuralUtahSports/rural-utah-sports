<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Weekly Scoreboard | Rural Utah Sports</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff}header{background:#000;border-bottom:4px solid #F14D07;padding:14px 20px}.head{max-width:1400px;margin:auto;display:flex;align-items:center;gap:16px}.logo{width:64px;height:64px;object-fit:contain}.title{font-size:26px;font-weight:900;text-transform:uppercase}.sub{color:#F14D07;font-weight:800;font-size:13px}nav{background:#000;border-bottom:1px solid #333}.nav{max-width:1400px;margin:auto;display:flex;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;padding:14px 13px;font-size:12px;font-weight:900;text-transform:uppercase}.nav a:hover,.nav a.active{background:#F14D07;color:#000}.wrap{max-width:1400px;margin:auto;padding:28px 18px 60px}h1{margin:0 0 8px;border-left:6px solid #F14D07;padding-left:12px;text-transform:uppercase}.note{color:#999;margin-bottom:18px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.sum{background:#000;border:1px solid #333;border-top:4px solid #F14D07;border-radius:8px;padding:12px}.sum b{display:block;color:#F14D07;font-size:25px}.sum span{font-size:10px;color:#888;text-transform:uppercase;font-weight:900}.filters{display:flex;gap:8px;flex-wrap:wrap;background:#000;border:1px solid #333;border-radius:8px;padding:10px;margin-bottom:18px;position:sticky;top:0;z-index:5}.filters select,.filters input{background:#181818;color:#fff;border:1px solid #444;border-radius:6px;padding:10px;font-weight:700}.filters input{flex:1;min-width:200px}.date{margin:20px 0}.date h2{font-size:18px;border-left:5px solid #F14D07;padding-left:9px}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.game{background:#000;border:1px solid #333;border-radius:8px;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;background:#171717;border-bottom:1px solid #292929}.status{font-size:10px;font-weight:900;text-transform:uppercase;color:#aaa}.status.live{color:#ffd54a}.status.final{color:#F14D07}.team{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #222}.name{font-weight:900}.score{font-size:22px;font-weight:900;color:#F14D07}.pred{font-size:10px;color:#777;margin-top:3px}.foot{padding:9px 11px;font-size:10px;color:#888;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.mercy{background:#ffd54a;color:#000;padding:4px 7px;border-radius:999px;font-weight:900}.empty{padding:35px;text-align:center;background:#000;border:1px solid #333;border-radius:8px;color:#888}@media(max-width:750px){.games{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.nav a{padding:12px 9px;font-size:11px}}
</style>
</head>
<body>
<header><div class="head"><img src="RUSlogoNew.png" class="logo" alt="Rural Utah Sports"><div><div class="title">Rural Utah Sports</div><div class="sub">Utah High School Sports History &amp; Data</div></div></div></header>
<nav><div class="nav"><a href="index.html">Home</a><a href="teams.html">Teams</a><a href="games.html">Games</a><a class="active" href="scoreboard.html">Scoreboard</a><a href="rankings.html">Rankings</a><a href="standings.html">Standings</a><a href="stat-leaders.html">Stat Leaders</a><a href="storylines.html">Storylines</a><a href="elo.html">ELO</a></div></nav>
<main class="wrap">
<h1>Weekly Scoreboard</h1><div class="note">Live and final scores only use reported game data. Predicted scores are hidden once a game is live.</div>
<div id="summary" class="summary"></div>
<div class="filters"><select id="status"><option value="ALL">All Games</option><option value="LIVE">Live</option><option value="FINAL">Final</option><option value="UPCOMING">Upcoming</option><option value="MERCY">44+ Mercy Rule</option></select><input id="search" type="search" placeholder="Search team…"></div>
<div id="board"><div class="empty">Loading scoreboard…</div></div>
</main>
<script>
const norm=v=>String(v??'').trim().toUpperCase(),compact=v=>norm(v).replace(/[^A-Z0-9]/g,''),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let games=[],details={};
function iso(d){let m=String(d||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return`${m[3]}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;return String(d||'').slice(0,10)}
function key(g){return`${iso(g.date)}|${compact(g.awayTeam)}|${compact(g.homeTeam)}`}
function state(g){const d=details[key(g)]||{},box=d.boxScore?.rows||[],a=box[0]?.total,h=box[1]?.total,has=Number.isFinite(Number(a))&&Number.isFinite(Number(h)),sheet=g.actualAway!=null&&g.actualHome!=null;const away=sheet?Number(g.actualAway):has?Number(a):null,home=sheet?Number(g.actualHome):has?Number(h):null,status=sheet?'Final':String(d.status||'Upcoming'),final=sheet||!!d.final,live=!final&&(/live|q[1-4]|half|ot/i.test(status)||!!d.clock),mercy=away!=null&&home!=null&&Math.abs(away-home)>=44;return{away,home,status,final,live,mercy}}
function fmt(d){const t=Date.parse(d);return Number.isFinite(t)?new Date(t).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}):d}
function card(g){const s=state(g),cls=s.final?'final':s.live?'live':'';const predAway=s.live||s.final?'':`<div class="pred">Pred ${g.awayScore??'—'}</div>`,predHome=s.live||s.final?'':`<div class="pred">Pred ${g.homeScore??'—'}</div>`;return`<article class="game"><div class="top"><span class="status ${cls}">${esc(s.status)}</span>${s.mercy?'<span class="mercy">44+ Mercy</span>':''}</div><div class="team"><div><div class="name">${esc(g.awayTeam)}</div>${predAway}</div><div class="score">${s.away??'—'}</div></div><div class="team"><div><div class="name">${esc(g.homeTeam)}</div>${predHome}</div><div class="score">${s.home??'—'}</div></div><div class="foot"><span>${s.final?'Final':s.live?'Live':'Upcoming'}</span>${g.deseretUrl?`<a href="${esc(g.deseretUrl)}" target="_blank" rel="noopener" style="color:#fff">Deseret Game ↗</a>`:''}</div></article>`}
function render(){const f=document.getElementById('status').value,q=norm(document.getElementById('search').value);const rows=games.filter(g=>{const s=state(g),ok=f==='ALL'||(f==='LIVE'&&s.live)||(f==='FINAL'&&s.final)||(f==='UPCOMING'&&!s.live&&!s.final)||(f==='MERCY'&&s.mercy);return ok&&(!q||norm(g.awayTeam).includes(q)||norm(g.homeTeam).includes(q))});const groups=new Map();for(const g of rows){if(!groups.has(g.date))groups.set(g.date,[]);groups.get(g.date).push(g)}document.getElementById('board').innerHTML=groups.size?[...groups].map(([d,r])=>`<section class="date"><h2>${esc(fmt(d))}</h2><div class="games">${r.map(card).join('')}</div></section>`).join(''):'<div class="empty">No games match those filters.</div>';const st=games.map(state),finals=st.filter(x=>x.final).length,live=st.filter(x=>x.live).length,mercy=st.filter(x=>x.mercy).length;document.getElementById('summary').innerHTML=`<div class="sum"><b>${games.length}</b><span>Games</span></div><div class="sum"><b>${live}</b><span>Live</span></div><div class="sum"><b>${finals}</b><span>Final</span></div><div class="sum"><b>${mercy}</b><span>Mercy Rule</span></div>`}
(async()=>{try{const v=Date.now(),[w,d]=await Promise.all([fetch('weekly-simulation.json?v='+v,{cache:'no-store'}),fetch('deseret-game-details.json?v='+v,{cache:'no-store'})]);if(!w.ok)throw new Error('weekly');const wd=await w.json(),dd=d.ok?await d.json():{games:{}};games=(wd.games||[]).filter(g=>g.awayTeam&&g.homeTeam&&String(g.date).includes('2026'));details=dd.games||{};render()}catch(e){document.getElementById('board').innerHTML='<div class="empty">Scoreboard data could not be loaded.</div>'}})();
document.getElementById('status').addEventListener('change',render);document.getElementById('search').addEventListener('input',render);
</script>
</body>
</html>
