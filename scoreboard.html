<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Weekly Scoreboard | Rural Utah Sports</title>
<meta name="description" content="Weekly Utah high school football scoreboard with Rural Utah Sports predictions and actual results.">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff}header{background:#000;border-bottom:4px solid #F14D07;padding:15px 25px}.header-content{max-width:1400px;margin:auto;display:flex;align-items:center;gap:20px}.logo{width:80px;height:80px;object-fit:contain}.site-title h1{font-size:30px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.site-title p{color:#F14D07;font-weight:bold;margin-top:5px}nav{background:#000;border-bottom:1px solid #333}.nav-content{max-width:1400px;margin:auto;display:flex;flex-wrap:wrap}.container{max-width:1400px;margin:auto;padding:34px 20px 60px}.page-title{border-left:6px solid #F14D07;padding-left:15px;font-size:34px;text-transform:uppercase}.subtitle{color:#aaa;line-height:1.5;margin:8px 0 20px}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.summary{background:#000;border:1px solid #333;border-top:4px solid #F14D07;border-radius:8px;padding:15px}.summary strong{display:block;font-size:27px;color:#F14D07}.summary span{font-size:10px;color:#888;text-transform:uppercase;font-weight:900}.filters{display:flex;gap:10px;flex-wrap:wrap;background:#000;border:1px solid #333;border-radius:8px;padding:12px;margin-bottom:18px}.filters select,.filters input{background:#171717;color:#fff;border:1px solid #444;border-radius:6px;padding:10px 12px;font-weight:700}.filters input{min-width:220px;flex:1}.date-section{margin:20px 0}.date-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px;border-left:5px solid #F14D07;padding-left:10px}.date-head h2{font-size:19px;text-transform:uppercase}.date-head span{font-size:10px;color:#777}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.game{background:#000;border:1px solid #333;border-radius:8px;overflow:hidden}.game-top{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 11px;background:#171717;border-bottom:1px solid #292929}.status{font-size:9px;font-weight:900;text-transform:uppercase;padding:4px 7px;border-radius:999px;background:#222;color:#aaa}.status.final{background:#F14D07;color:#000}.pick-result{font-size:9px;font-weight:900}.pick-result.win{color:#73d977}.pick-result.loss{color:#ff7b7b}.team-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 13px;border-bottom:1px solid #252525}.team-row:last-of-type{border-bottom:0}.team-main{display:flex;align-items:center;gap:9px;min-width:0}.team-logo{width:34px;height:34px;object-fit:contain;flex:0 0 34px}.team-name{display:inline-block;font-weight:900;color:var(--team-fg,#fff);background:var(--team-bg,#222);padding:4px 7px;border-radius:5px;text-decoration:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}.team-meta{font-size:9px;color:#777;margin-top:4px}.scores{display:flex;align-items:center;gap:10px}.pred{font-size:12px;color:#888;text-align:center}.pred b{display:block;color:#bbb;font-size:15px}.actual{font-size:12px;color:#888;text-align:center}.actual b{display:block;color:#F14D07;font-size:20px}.game-foot{padding:8px 12px;color:#777;font-size:9px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.deseret-link{color:#fff;text-decoration:none;font-weight:900;background:#1d1d1d;border:1px solid #444;border-radius:5px;padding:6px 8px}.deseret-link:hover{background:#F14D07;color:#000;border-color:#F14D07}.empty{padding:40px;text-align:center;color:#777;background:#000;border:1px solid #333;border-radius:8px}footer{background:#000;border-top:1px solid #333;color:#777;text-align:center;padding:24px;font-size:11px}@media(max-width:850px){.games{grid-template-columns:1fr}}@media(max-width:700px){.header-content{flex-direction:column;text-align:center}.site-title h1{font-size:24px}.container{padding:24px 12px 45px}.page-title{font-size:28px}.summary-grid{grid-template-columns:repeat(2,1fr)}.filters>*{width:100%}.team-logo{width:30px;height:30px;flex-basis:30px}}
</style>
</head>
<body>
<header><div class="header-content"><img src="RUSlogoNew.png" alt="Rural Utah Sports" class="logo"><div class="site-title"><h1>Rural Utah Sports</h1><p>Utah High School Sports History &amp; Data</p></div></div></header>
<nav><div class="nav-content"></div></nav>
<main class="container">
<h2 class="page-title">Weekly Scoreboard</h2>
<p class="subtitle">RUS predictions and actual results from the current weekly football sheet. Actual scores appear after they are entered and synced.</p>
<div id="summary" class="summary-grid"></div>
<div class="filters"><select id="classFilter"><option value="ALL">All Classifications</option><option>6A</option><option>5A</option><option>4A</option><option>3A</option><option>2A</option><option>1A</option><option value="8P">8-Player</option></select><select id="statusFilter"><option value="ALL">All Games</option><option value="UPCOMING">Upcoming</option><option value="FINAL">Final</option></select><input id="search" type="search" placeholder="Search team…"></div>
<div id="board"><div class="empty">Loading weekly scoreboard…</div></div>
</main>
<footer><p><strong>RURAL UTAH SPORTS</strong></p><p>Utah High School Sports History &amp; Data</p></footer>
<script src="school-assets.js?v=20260813a"></script>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;'),norm=v=>String(v??'').trim().toUpperCase(),safeHex=(v,f)=>/^#[0-9A-F]{3}(?:[0-9A-F]{3})?$/i.test(String(v||'').trim())?String(v).trim():f;
const aliases={'CEDAR':'CEDAR CITY','MONUMENT VAL':'MONUMENT VALLEY','GUNNISON':'GUNNISON VALLEY','GRAND COUNTY':'GRAND'};
const canon=v=>aliases[norm(v)]||norm(v);let games=[],teamMap=new Map();
function yearOf(d){const m=String(d||'').match(/(20\d{2})/);return m?+m[1]:0}function dateVal(d){const t=Date.parse(String(d||''));return Number.isFinite(t)?t:0}function fmtDate(d){const t=dateVal(d);if(!t)return d||'Date TBA';return new Date(t).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}function deseretUrl(d){const t=dateVal(d);if(!t)return'https://sports.deseret.com/high-school/football/scores-schedule';const x=new Date(t),y=x.getFullYear(),m=String(x.getMonth()+1).padStart(2,'0'),day=String(x.getDate()).padStart(2,'0');return`https://sports.deseret.com/high-school/football/scores-schedule/${y}-${m}-${day}`}
function teamInfo(name){return teamMap.get(canon(name))||null}function cls(name){const c=String(teamInfo(name)?.classification||'').toUpperCase();return c==='8-PLAYER'?'8P':c}function finalGame(g){return g.actualAway!==null&&g.actualAway!==undefined&&g.actualHome!==null&&g.actualHome!==undefined}function outcome(g){if(!finalGame(g))return'';const actual=norm(g.actualWinner)||(+g.actualAway>+g.actualHome?norm(g.awayTeam):+g.actualHome>+g.actualAway?norm(g.homeTeam):'TIE'),pred=norm(g.winner);if(!pred||actual==='TIE')return'';return actual===pred?'W':'L'}
function teamBlock(name,score,pred){const t=teamInfo(name),bg=safeHex(t?.backgroundColor,'#222'),fg=safeHex(t?.textColor,'#fff'),meta=t?`${t.classification||''}${t.region?' • '+t.region:''}`:'';return `<div class="team-row"><div class="team-main"><img class="team-logo" src="${esc(RUSSchoolAssets.logoUrl(name))}" alt="${esc(name)} logo" onerror="this.style.display='none'"><div><a class="team-name" href="team.html?team=${encodeURIComponent(name)}" style="--team-bg:${bg};--team-fg:${fg}">${esc(name)}</a><div class="team-meta">${esc(meta)}</div></div></div><div class="scores"><div class="pred">Pred<b>${pred??'—'}</b></div><div class="actual">Actual<b>${score??'—'}</b></div></div></div>`}
function card(g){const done=finalGame(g),o=outcome(g),dn=g.deseretUrl||deseretUrl(g.date),dnLabel=g.deseretUrl?'Deseret Game ↗':'Deseret Scores ↗';return `<article class="game"><div class="game-top"><span class="status ${done?'final':''}">${done?'Final':'Upcoming'}</span><span class="pick-result ${o==='W'?'win':o==='L'?'loss':''}">${o?`RUS Pick: ${o}`:'RUS Prediction'}</span></div>${teamBlock(g.awayTeam,done?g.actualAway:null,g.awayScore)}${teamBlock(g.homeTeam,done?g.actualHome:null,g.homeScore)}<div class="game-foot"><span>Predicted winner: <strong>${esc(g.winner||'—')}</strong></span>${done?`<span>Actual winner: <strong>${esc(g.actualWinner||(+g.actualAway>+g.actualHome?g.awayTeam:+g.actualHome>+g.actualAway?g.homeTeam:'Tie'))}</strong></span>`:''}<a class="deseret-link" href="${esc(dn)}" target="_blank" rel="noopener noreferrer">${dnLabel}</a></div></article>`}
function render(){const cf=$('classFilter').value,sf=$('statusFilter').value,q=norm($('search').value);const filtered=games.filter(g=>{const done=finalGame(g),classOK=cf==='ALL'||cls(g.awayTeam)===cf||cls(g.homeTeam)===cf,statusOK=sf==='ALL'||(sf==='FINAL'&&done)||(sf==='UPCOMING'&&!done),searchOK=!q||norm(g.awayTeam).includes(q)||norm(g.homeTeam).includes(q);return classOK&&statusOK&&searchOK});const groups=new Map();for(const g of filtered){const k=g.date||'Date TBA';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(g)}const ordered=[...groups].sort((a,b)=>dateVal(a[0])-dateVal(b[0]));$('board').innerHTML=ordered.length?ordered.map(([date,rows])=>`<section class="date-section"><div class="date-head"><h2>${esc(fmtDate(date))}</h2><span>${rows.length} game${rows.length===1?'':'s'}</span></div><div class="games">${rows.map(card).join('')}</div></section>`).join(''):'<div class="empty">No games match those filters.</div>';const finals=games.filter(finalGame),wins=finals.filter(g=>outcome(g)==='W').length,losses=finals.filter(g=>outcome(g)==='L').length,acc=(wins+losses)?(wins/(wins+losses)*100).toFixed(1)+'%':'—';$('summary').innerHTML=`<div class="summary"><strong>${games.length}</strong><span>Games This Week</span></div><div class="summary"><strong>${finals.length}</strong><span>Final</span></div><div class="summary"><strong>${games.length-finals.length}</strong><span>Remaining</span></div><div class="summary"><strong>${wins}-${losses}</strong><span>RUS Picks • ${acc}</span></div>`}
(async()=>{try{const stamp=Date.now(),[wr,tr]=await Promise.all([fetch('weekly-simulation.json?v='+stamp),fetch('teams-data.json?v='+stamp)]);if(!wr.ok||!tr.ok)throw new Error('data');const weekly=await wr.json(),teams=await tr.json();for(const t of teams||[])if(t?.team){teamMap.set(norm(t.team),t);teamMap.set(canon(t.team),t)}const all=(weekly.games||[]).filter(g=>g.awayTeam&&g.homeTeam);const season=2026;games=all.filter(g=>yearOf(g.date)===season).sort((a,b)=>dateVal(a.date)-dateVal(b.date)||String(a.awayTeam).localeCompare(String(b.awayTeam)));render()}catch(e){console.error(e);$('board').innerHTML='<div class="empty">Weekly scoreboard data could not be loaded.</div>'}})();
['classFilter','statusFilter'].forEach(id=>$(id).addEventListener('change',render));$('search').addEventListener('input',render);
</script>
<script src="nav-menu.js?v=20260813m" defer></script><script src="back-to-top.js" defer></script>
</body></html>
