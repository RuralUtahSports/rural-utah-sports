<header><div class="header-content"><img src="RUSlogoNew.png" alt="Rural Utah Sports" class="logo"><div class="site-title"><h1>Rural Utah Sports</h1><p>Utah High School Sports History &amp; Data</p></div></div></header><nav><div class="nav-content"></div></nav>
<main class="container"><div class="title-row"><div><h2 class="page-title" id="pageTitle">Season Explorer</h2><p class="subtitle" id="subtitle">A digital yearbook for Utah high school football history.</p></div><div class="year-controls"><a id="prevYear" href="#">←</a><select id="yearSelect" aria-label="Season"></select><a id="nextYear" href="#">→</a></div></div><div id="page" class="loading">Loading season…</div></main>
<footer><p><strong>RURAL UTAH SPORTS</strong></p><p>Utah High School Sports History &amp; Data</p></footer>
<script>
const $=id=>document.getElementById(id),norm=v=>String(v??'').trim().toUpperCase(),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const canonical=v=>{const name=String(v??'').trim(),n=norm(name).replace(/\.+$/,'').trim();return n.startsWith('WASATCH ACAD')?'WASATCH ACADEMY':name};const yearOf=d=>{const m=String(d||'').match(/(?:^|\D)(18\d{2}|19\d{2}|20\d{2})(?:\D|$)/);return m?Number(m[1]):null};const dateValue=d=>{const t=Date.parse(String(d||''));return Number.isFinite(t)?t:(yearOf(d)?Date.UTC(yearOf(d),0,1):0)};
function flatten(data){const out=[],seen=new Set();for(const e of (data.scores||[]))for(const g of (Array.isArray(e.games)?e.games:[])){let x;if(g.tie)x={date:g.date||'',team1:canonical(g.team1),team2:canonical(g.team2),score1:Number(g.score1),score2:Number(g.score2),tie:true};else x={date:g.date||'',team1:canonical(g.winner),team2:canonical(g.loser),score1:Number(g.winnerScore),score2:Number(g.loserScore),tie:false};x.year=yearOf(x.date);x.total=x.score1+x.score2;x.margin=Math.abs(x.score1-x.score2);const p=[[norm(x.team1).replace(/[^A-Z0-9]/g,''),x.score1],[norm(x.team2).replace(/[^A-Z0-9]/g,''),x.score2]].sort((a,b)=>a[0].localeCompare(b[0])),k=`${x.date}|${p[0][0]}:${p[0][1]}|${p[1][0]}:${p[1][1]}`;if(!seen.has(k)){seen.add(k);out.push(x)}}return out}
const gameURL=g=>`game.html?${new URLSearchParams({date:g.date||'',team1:g.team1||'',score1:String(g.score1),team2:g.team2||'',score2:String(g.score2)})}`;
function records(games){const map=new Map();const get=t=>{const k=norm(t);if(!map.has(k))map.set(k,{team:t,w:0,l:0,t:0,pf:0,pa:0,g:0});return map.get(k)};for(const x of games){const a=get(x.team1),b=get(x.team2);a.g++;b.g++;a.pf+=x.score1;a.pa+=x.score2;b.pf+=x.score2;b.pa+=x.score1;if(x.tie){a.t++;b.t++}else{a.w++;b.l++}}return [...map.values()].map(r=>({...r,pct:r.g?(r.w+r.t*.5)/r.g:0,margin:r.g?(r.pf-r.pa)/r.g:0})).sort((a,b)=>b.pct-a.pct||b.w-a.w||b.margin-a.margin)}
const rec=r=>`${r.w}-${r.l}${r.t?'-'+r.t:''}`;function championsFor(data,year){return data.filter(c=>Number(c.year)===year&&(c.champion||c.coChampions?.length)&&!['no-class','no-playoffs'].includes(c.status))}
let allGames=[],champData=[],years=[],visible=100,currentYear=null;
function updateYearNav(){const i=years.indexOf(currentYear),prev=years[i+1],next=years[i-1];$('prevYear').style.visibility=prev?'visible':'hidden';$('nextYear').style.visibility=next?'visible':'hidden';if(prev)$('prevYear').href=`season.html?year=${prev}`;if(next)$('nextYear').href=`season.html?year=${next}`}
function renderGames(list){const body=$('gameRows'),shown=list.slice(0,visible);body.innerHTML=shown.map(g=>`<tr><td>${esc(g.date||currentYear)}</td><td><a class="team-link" href="team.html?team=${encodeURIComponent(g.team1)}">${esc(g.team1)}</a></td><td><a class="game-link" href="${gameURL(g)}">${g.score1}–${g.score2}</a></td><td><a class="team-link" href="team.html?team=${encodeURIComponent(g.team2)}">${esc(g.team2)}</a></td><td>${g.total}</td><td>${g.tie?'TIE':g.margin}</td></tr>`).join('')||'<tr><td colspan="6">No games recorded for this season.</td></tr>';$('loadMore').style.display=visible<list.length?'inline-block':'none';$('loadMore').onclick=()=>{visible+=100;renderGames(list)}}
function notable(label,g,value){return `<article class="notable"><label>${label}</label>${g?`<a href="${gameURL(g)}">${esc(g.team1)} ${g.score1}–${g.score2} ${esc(g.team2)}</a>`:''}<span>${value}</span></article>`}
function render(year){currentYear=year;visible=100;$('yearSelect').value=String(year);history.replaceState(null,'',`season.html?year=${year}`);updateYearNav();const games=allGames.filter(g=>g.year===year).sort((a,b)=>dateValue(b.date)-dateValue(a.date)),recs=records(games),champs=championsFor(champData,year),points=games.reduce((s,g)=>s+g.total,0),highest=[...games].sort((a,b)=>b.total-a.total)[0],margin=[...games].filter(g=>!g.tie).sort((a,b)=>b.margin-a.margin)[0],closest=[...games].filter(g=>!g.tie).sort((a,b)=>a.margin-b.margin||b.total-a.total)[0],ties=games.filter(g=>g.tie).length;document.title=`${year} Utah High School Football Season | Rural Utah Sports`;$('pageTitle').textContent=`${year} Utah Football Season`;$('subtitle').textContent=`Champions, records, notable games, and complete results from the ${year} season.`;const og=document.querySelector('meta[property="og:title"]');if(og)og.content=document.title;$('page').className='';$('page').innerHTML=`<section class="summary-grid"><div class="summary"><strong>${games.length.toLocaleString()}</strong><span>Games</span></div><div class="summary"><strong>${recs.length.toLocaleString()}</strong><span>Teams</span></div><div class="summary"><strong>${points.toLocaleString()}</strong><span>Total Points</span></div><div class="summary"><strong>${games.length?(points/games.length).toFixed(1):'—'}</strong><span>Points Per Game</span></div></section><h2 class="section-title">State Champions</h2><section class="champ-grid">${champs.length?champs.map(c=>`<article class="champ"><div class="class">${esc(c.classification)}</div><h3>${esc(c.champion||'Co-Champions')}</h3><p>${c.score?`${esc(c.score)} vs ${esc(c.runnerUp)}`:esc(c.note||c.status)}</p><a href="championships.html?year=${year}&class=${encodeURIComponent(c.classification)}">View Bracket →</a></article>`).join(''):`<div class="champ"><h3>No championship result listed</h3><p>This season may predate a title game, have no playoff, or still be in progress.</p></div>`}</section><h2 class="section-title">Season Notables</h2><section class="notable-grid">${notable('Highest Scoring',highest,highest?`${highest.total} points`:'—')}${notable('Biggest Margin',margin,margin?`${margin.margin} points`:'—')}${notable('Closest Decided',closest,closest?`${closest.margin}-point game`:'—')}<article class="notable"><label>Tied Games</label><span>${ties}</span></article></section><h2 class="section-title">Best Records</h2><div class="table-wrap" style="max-height:52vh"><table><thead><tr><th>#</th><th>Team</th><th>Record</th><th>Win %</th><th>PF</th><th>PA</th><th>Avg Margin</th></tr></thead><tbody>${recs.slice(0,40).map((r,i)=>`<tr><td class="rank">${i+1}</td><td><a class="team-link" href="team.html?team=${encodeURIComponent(r.team)}">${esc(r.team)}</a></td><td>${rec(r)}</td><td>${(r.pct*100).toFixed(1)}%</td><td>${r.pf}</td><td>${r.pa}</td><td>${r.margin>0?'+':''}${r.margin.toFixed(1)}</td></tr>`).join('')||'<tr><td colspan="7">No records available.</td></tr>'}</tbody></table></div><h2 class="section-title">All ${year} Games</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>Winner / Team 1</th><th>Score</th><th>Loser / Team 2</th><th>Total</th><th>Margin</th></tr></thead><tbody id="gameRows"></tbody></table></div><div class="load-wrap"><button class="load" id="loadMore">Load More</button></div>${year===new Date().getFullYear()?`<div class="current-links">Following the current season? <a href="rankings.html">View Rankings</a> · <a href="standings.html">View Standings</a></div>`:''}`;renderGames(games)}
async function init(){try{const stamp=Date.now(),[gr,cr]=await Promise.all([fetch('scorigami.json?v='+stamp),fetch('championships.json?v='+stamp)]);if(!gr.ok||!cr.ok)throw new Error('data');allGames=flatten(await gr.json());champData=await cr.json();years=[...new Set([...allGames.map(g=>g.year),...champData.map(c=>Number(c.year))].filter(Boolean))].sort((a,b)=>b-a);$('yearSelect').innerHTML=years.map(y=>`<option value="${y}">${y}</option>`).join('');const requested=Number(new URLSearchParams(location.search).get('year')),year=years.includes(requested)?requested:years[0];$('yearSelect').addEventListener('change',()=>render(Number($('yearSelect').value)));render(year)}catch(e){console.error(e);$('page').className='error';$('page').textContent='Season data could not be loaded.'}}
init();
</script><script src="back-to-top.js" defer></script><script src="weekly-simulation-promo.js" defer></script>
