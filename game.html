<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const norm=v=>String(v??'').trim().toUpperCase();
const compact=v=>norm(v).replace(/[^A-Z0-9]/g,'');
const aliases={'CEDAR':'CEDAR CITY','MONUMENT VAL':'MONUMENT VALLEY','GUNNISON':'GUNNISON VALLEY','GRAND COUNTY':'GRAND'};
const canon=v=>aliases[norm(v)]||norm(v),HOME_FIELD_POINTS=3;
const safeHex=(v,f)=>/^#[0-9A-F]{3}(?:[0-9A-F]{3})?$/i.test(String(v||'').trim())?String(v).trim():f;
const yearOf=d=>{const m=String(d||'').match(/(?:^|\D)(18\d{2}|19\d{2}|20\d{2})(?:\D|$)/);return m?Number(m[1]):null};
const dateValue=d=>{const t=Date.parse(String(d||''));return Number.isFinite(t)?t:(yearOf(d)?Date.UTC(yearOf(d),0,1):0)};
function isoDate(d){const s=String(d||'').trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return`${m[3]}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;const t=dateValue(d);if(!t)return'';const x=new Date(t);return`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function fmtDate(d){const t=dateValue(d);if(!t)return d||'Date TBA';return new Date(t).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function flattenHistory(data){const out=[],seen=new Set();for(const e of(data?.scores||[]))for(const g of(Array.isArray(e.games)?e.games:[])){let x;if(g.tie)x={date:g.date||'',team1:g.team1||'',team2:g.team2||'',score1:Number(g.score1),score2:Number(g.score2),tie:true};else x={date:g.date||'',team1:g.winner||'',team2:g.loser||'',score1:Number(g.winnerScore),score2:Number(g.loserScore),tie:false};x.year=yearOf(x.date);const p=[[compact(x.team1),x.score1],[compact(x.team2),x.score2]].sort((a,b)=>a[0].localeCompare(b[0])),k=`${x.date}|${p[0][0]}:${p[0][1]}|${p[1][0]}:${p[1][1]}`;if(!seen.has(k)){seen.add(k);out.push(x)}}return out}
function samePair(g,a,b){return(norm(g.team1)===norm(a)&&norm(g.team2)===norm(b))||(norm(g.team1)===norm(b)&&norm(g.team2)===norm(a))}
function histURL(g){return`game.html?${new URLSearchParams({date:g.date||'',team1:g.team1||'',score1:String(g.score1),team2:g.team2||'',score2:String(g.score2)})}`}
function seasonRecord(games,team,year){let w=0,l=0,t=0,pf=0,pa=0;for(const g of games){if(g.year!==year)continue;const a=norm(g.team1)===norm(team),b=norm(g.team2)===norm(team);if(!a&&!b)continue;const fs=a?g.score1:g.score2,as=a?g.score2:g.score1;pf+=fs;pa+=as;if(g.tie)t++;else if(fs>as)w++;else l++}return{w,l,t,pf,pa}}
const rec=r=>`${r.w}-${r.l}${r.t?'-'+r.t:''}`;
function teamInfo(map,name){return map.get(canon(name))||map.get(norm(name))||null}
function gameKey(date,away,home){return`${isoDate(date)}|${compact(away)}|${compact(home)}`}
function logoFor(name,logos){return logos[norm(name)]||logos[canon(name)]||window.RUSSchoolAssets?.logoUrl?.(name)||''}

function boxHTML(d){const b=d?.boxScore;if(!b?.rows?.length)return'';const periods=b.periods?.length?b.periods:['Q1','Q2','Q3','Q4'];return`<h2 class="section-title">Quarter-by-Quarter</h2><div class="table-wrap"><table class="box-table"><thead><tr><th>Team</th>${periods.map(x=>`<th>${esc(x)}</th>`).join('')}<th>Total</th></tr></thead><tbody>${b.rows.map(r=>`<tr><td>${esc(r.team||'Team')}</td>${(r.quarters||[]).map(v=>`<td>${v??'—'}</td>`).join('')}<td>${r.total??'—'}</td></tr>`).join('')}</tbody></table></div>`}
function scoringHTML(d){const p=d?.scoringPlays||[];if(!p.length)return'';return`<h2 class="section-title">Scoring Plays</h2><section class="panel"><div class="scoring-list">${p.map((x,i)=>`<div class="scoring-play"><b>${i+1}.</b>${esc(typeof x==='string'?x:(x?.text||x?.description||''))}</div>`).join('')}</div></section>`}
function statsHTML(d){const stats=d?.stats||[];if(!stats.length)return'';return`<h2 class="section-title">Game Stats</h2><section class="panel">${stats.map(s=>`<div class="stat-block"><div class="stat-label">${esc((s.team?s.team+' • ':'')+(s.category||'Stats'))}</div><div class="table-wrap"><table class="stat-table"><thead><tr>${(s.headers||[]).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(s.rows||[]).map(r=>`<tr>${r.map(v=>`<td>${esc(v??'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('')}</section>`}
async function init(){
 try{
  const q=new URLSearchParams(location.search),requestedAway=q.get('away')||q.get('team1')||'',requestedHome=q.get('home')||q.get('team2')||'',requestedDate=q.get('date')||'';
  if(!requestedAway||!requestedHome){$('page').className='error';$('page').innerHTML='This game link is incomplete. <a class="game-link" href="scoreboard.html">Return to the scoreboard</a>.';return}
  const stamp=Date.now();
  const [weeklyR,teamsR,detailsR,histR,logosR]=await Promise.all([
   fetch('weekly-simulation.json?v='+stamp,{cache:'no-store'}).catch(()=>null),
   fetch('teams-data.json?v='+stamp,{cache:'no-store'}).catch(()=>null),
   fetch('deseret-game-details.json?v='+stamp,{cache:'no-store'}).catch(()=>null),
   fetch('scorigami.json?v='+stamp,{cache:'no-store'}).catch(()=>null),
   fetch('school-logo-cache.json?v='+stamp,{cache:'no-store'}).catch(()=>null)
  ]);
  const weekly=weeklyR?.ok?await weeklyR.json():{games:[]},teams=teamsR?.ok?await teamsR.json():[],details=detailsR?.ok?await detailsR.json():{games:{}},history=histR?.ok?flattenHistory(await histR.json()):[],logos=logosR?.ok?await logosR.json():{};
  try{const svg=await fetch('school-logos/rich-user.svg?v='+stamp,{cache:'no-store'}).then(r=>r.ok?r.text():'');const embedded=(svg.match(/href=["'](data:image\/(?:png|webp);base64,[^"']+)["']/i)||[])[1]||'';if(embedded)logos.RICH=embedded}catch{}
  const teamMap=new Map();for(const t of teams||[])if(t?.team){teamMap.set(norm(t.team),t);teamMap.set(canon(t.team),t)}
  const current=(weekly.games||[]).find(g=>isoDate(g.date)===isoDate(requestedDate)&&((norm(g.awayTeam)===norm(requestedAway)&&norm(g.homeTeam)===norm(requestedHome))||(norm(g.awayTeam)===norm(requestedHome)&&norm(g.homeTeam)===norm(requestedAway))));
  let away=current?.awayTeam||requestedAway,home=current?.homeTeam||requestedHome,date=current?.date||requestedDate;
  const detail=details?.games?.[gameKey(date,away,home)]||details?.games?.[gameKey(date,home,away)]||null;
  const oldScore1=q.has('score1')?Number(q.get('score1')):null,oldScore2=q.has('score2')?Number(q.get('score2')):null;
  const detailRows=detail?.boxScore?.rows||[],detailAway=detailRows[0]?.total,detailHome=detailRows[1]?.total;
  let awayScore=current?.actualAway??(Number.isFinite(Number(detailAway))?Number(detailAway):null),homeScore=current?.actualHome??(Number.isFinite(Number(detailHome))?Number(detailHome):null);
  if(!current&&oldScore1!==null&&oldScore2!==null){awayScore=oldScore1;homeScore=oldScore2}
  const final=awayScore!==null&&homeScore!==null&&(current?.actualAway!==undefined||detail?.final||(!current&&q.has('score1'))),rawStatus=String(detail?.status||''),live=!final&&(/live|q[1-4]|half|ot/i.test(rawStatus)||!!detail?.clock),status=final?'Final':live?(rawStatus||'Live'):(rawStatus||'Upcoming');
  const year=yearOf(date),awayRec=year?rec(seasonRecord(history,away,year)):'',homeRec=year?rec(seasonRecord(history,home,year)):'';
  const series=history.filter(g=>samePair(g,away,home)).sort((a,b)=>dateValue(a.date)-dateValue(b.date));let awayWins=0,homeWins=0,ties=0;for(const g of series){if(g.tie){ties++;continue}const aScore=norm(g.team1)===norm(away)?g.score1:g.score2,bScore=norm(g.team1)===norm(away)?g.score2:g.score1;if(aScore>bScore)awayWins++;else homeWins++}
  const awayInfo=teamInfo(teamMap,away),homeInfo=teamInfo(teamMap,home),awayLogo=logoFor(away,logos),homeLogo=logoFor(home,logos);
  const rawPredictedAway=Number(current?.awayScore),rawPredictedHome=Number(current?.homeScore),hasPrediction=current&&Number.isFinite(rawPredictedAway)&&Number.isFinite(rawPredictedHome),predictedAway=hasPrediction?rawPredictedAway:null,predictedHome=hasPrediction?rawPredictedHome+HOME_FIELD_POINTS:null,predWinner=!hasPrediction?'':predictedAway>predictedHome?away:predictedHome>predictedAway?home:'Pick’em',actualWinner=awayScore===null||homeScore===null?'':awayScore>homeScore?away:homeScore>awayScore?home:'Tie';const pickResult=current&&final&&predWinner&&predWinner!=='Pick’em'&&actualWinner!=='Tie'?(norm(predWinner)===norm(actualWinner)?'Correct ✓':'Missed ✕'):'';
  const mercy=final&&Math.abs(Number(awayScore)-Number(homeScore))>=44,margin=final?Math.abs(Number(awayScore)-Number(homeScore)):null;
  document.title=`${away} ${final?awayScore+'-'+homeScore+' ':''}${home} | Rural Utah Sports`;document.querySelector('meta[property="og:title"]')?.setAttribute('content',document.title);
  const scoreHTML=final||live?`${awayScore??'—'}–${homeScore??'—'}`:'VS';
  const statusClass=final?'final':live?'live':'';
  const prediction=current?`<h2 class="section-title">RUS Prediction</h2><section class="panel"><div class="prediction"><div class="prediction-team">${esc(away)}</div><div class="prediction-score">${predictedAway??'—'}–${predictedHome??'—'}</div><div class="prediction-team">${esc(home)}</div><div class="prediction-note">Includes a 3-point home-field adjustment • Predicted winner: <strong>${esc(predWinner||'—')}</strong>${pickResult?` • ${esc(pickResult)}`:''}</div></div></section>`:'';
  const recent=[...series].reverse().slice(0,10);
  const seriesHTML=`<h2 class="section-title">Series History</h2><section class="panel"><div class="series-grid"><div class="series-stat"><strong>${awayWins}</strong><span>${esc(away)} Wins</span></div><div class="series-stat"><strong>${homeWins}</strong><span>${esc(home)} Wins</span></div><div class="series-stat"><strong>${ties}</strong><span>Ties</span></div><div class="series-stat"><strong>${series.length}</strong><span>Recorded Meetings</span></div></div></section>${recent.length?`<h2 class="section-title">Recent Meetings</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>${esc(away)}</th><th>Score</th><th>${esc(home)}</th></tr></thead><tbody>${recent.map(g=>{const as=norm(g.team1)===norm(away)?g.score1:g.score2,hs=norm(g.team1)===norm(away)?g.score2:g.score1;return`<tr><td>${esc(g.date)}</td><td>${esc(away)}</td><td><a class="game-link" href="${histURL(g)}">${as}–${hs}</a></td><td>${esc(home)}</td></tr>`}).join('')}</tbody></table></div>`:''}`;
  const detailEmpty=!boxHTML(detail)&&!scoringHTML(detail)&&!statsHTML(detail)?`<h2 class="section-title">Game Details</h2><section class="panel"><div class="empty-detail">Detailed box score, scoring plays and player stats will appear here when they are available for this game.</div></section>`:'';
  const source=current?.deseretUrl||`https://sports.deseret.com/high-school/football/scores-schedule/${isoDate(date)}`;
  $('page').className='';$('page').innerHTML=`<section class="game-hero"><div class="game-meta">${esc(fmtDate(date))}${year?` • ${year} Season`:''}</div><div class="matchup">${teamCard(away,awayInfo,awayLogo,awayRec)}<div class="score-center"><div class="status ${statusClass}">${esc(status)}</div><div class="score ${!final&&!live?'upcoming':''}">${scoreHTML}</div></div>${teamCard(home,homeInfo,homeLogo,homeRec)}</div><div class="result-label">${actualWinner?`${esc(actualWinner)}${actualWinner!=='Tie'?' wins':''}`:'Game matchup'}${mercy?' • 44+ Mercy Rule':''}</div></section><section class="summary-grid"><div class="summary"><strong>${esc(status)}</strong><span>Status</span></div><div class="summary"><strong>${current?esc(predWinner||'—'):'—'}</strong><span>RUS Pick</span></div><div class="summary"><strong>${pickResult||'—'}</strong><span>Prediction Result</span></div><div class="summary"><strong>${margin??'—'}</strong><span>Final Margin</span></div></section>${prediction}${boxHTML(detail)}${scoringHTML(detail)}${statsHTML(detail)}${detailEmpty}${seriesHTML}<h2 class="section-title">Links & Source</h2><section class="panel"><div class="source-line">Game detail data is shown from Rural Utah Sports records and Deseret News game data when available.</div><div class="actions"><a class="primary" href="${esc(source)}" target="_blank" rel="noopener noreferrer">Deseret Game / Scores ↗</a><a href="team.html?team=${encodeURIComponent(away)}">${esc(away)} Team Page</a><a href="team.html?team=${encodeURIComponent(home)}">${esc(home)} Team Page</a>${year?`<a href="season.html?year=${year}">${year} Season</a>`:''}<a href="compare.html?team1=${encodeURIComponent(away)}&team2=${encodeURIComponent(home)}">Compare Programs</a></div></section>`;
