*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff}header{background:#000;border-bottom:4px solid #F14D07;padding:15px 25px}.header-content{max-width:1400px;margin:auto;display:flex;align-items:center;gap:20px}.logo{width:80px;height:80px;object-fit:contain}.site-title h1{font-size:30px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.site-title p{color:#F14D07;font-weight:bold;margin-top:5px}nav{background:#000;border-bottom:1px solid #333}.nav-content{max-width:1400px;margin:auto;display:flex;flex-wrap:wrap}.container{max-width:1200px;margin:auto;padding:35px 20px 60px}.back{display:inline-block;color:#aaa;text-decoration:none;font-weight:800;font-size:12px;text-transform:uppercase;margin-bottom:18px}.back:hover{color:#F14D07}.game-hero{background:#000;border:1px solid #333;border-top:6px solid #F14D07;border-radius:9px;padding:28px;margin-bottom:20px}.game-meta{text-align:center;color:#999;font-size:13px;font-weight:800;text-transform:uppercase;margin-bottom:20px}.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center}.team{text-align:center}.team a{color:#fff;text-decoration:none}.team a:hover{color:#F14D07}.team-name{font-size:28px;font-weight:900;text-transform:uppercase}.team-record{color:#888;font-size:12px;margin-top:7px}.score{font-size:46px;font-weight:900;color:#F14D07;white-space:nowrap}.result-label{text-align:center;color:#aaa;font-size:11px;text-transform:uppercase;margin-top:17px}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}.summary{background:#000;border:1px solid #333;border-radius:7px;padding:16px;text-align:center}.summary strong{display:block;color:#F14D07;font-size:23px}.summary span{display:block;color:#888;font-size:10px;text-transform:uppercase;margin-top:4px}.section-title{border-left:5px solid #F14D07;padding-left:12px;margin:28px 0 12px;font-size:23px;text-transform:uppercase}.series{background:#000;border:1px solid #333;border-radius:8px;padding:18px}.series-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.series-stat{background:#171717;border:1px solid #333;border-radius:6px;padding:13px;text-align:center}.series-stat strong{display:block;color:#F14D07;font-size:20px}.series-stat span{display:block;color:#777;font-size:9px;text-transform:uppercase;margin-top:4px}.table-wrap{overflow:auto;background:#000;border:1px solid #333;border-radius:8px}table{width:100%;border-collapse:collapse;min-width:720px}th{background:#F14D07;color:#000;padding:11px;text-transform:uppercase;font-size:10px}td{padding:11px;border-bottom:1px solid #2b2b2b;text-align:center;font-size:12px}.game-link{color:#F14D07;font-weight:900;text-decoration:none}.game-link:hover{text-decoration:underline}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.actions a{background:#1b1b1b;border:1px solid #444;color:#fff;text-decoration:none;padding:10px 13px;border-radius:5px;font-size:11px;font-weight:900;text-transform:uppercase}.actions a:hover{background:#F14D07;color:#000;border-color:#F14D07}.loading,.error{text-align:center;padding:70px 20px;color:#888}.error{color:#ff7777}footer{background:#000;border-top:4px solid #F14D07;text-align:center;padding:30px 20px;color:#888}footer strong{color:#F14D07}@media(max-width:760px){.scoreboard{grid-template-columns:1fr}.score{order:-1;text-align:center}.summary-grid,.series-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.header-content{flex-direction:column;text-align:center}.site-title h1{font-size:24px}.container{padding:25px 10px 45px}.game-hero{padding:21px 12px}.team-name{font-size:22px}.score{font-size:40px}}

<body>
<header><div class="header-content"><img src="RUSlogoNew.png" alt="Rural Utah Sports" class="logo"><div class="site-title"><h1>Rural Utah Sports</h1><p>Utah High School Sports History &amp; Data</p></div></div></header>
<nav><div class="nav-content"></div></nav>
<main class="container"><a class="back" href="games.html">← Back to Game Database</a><div id="page" class="loading">Loading game details…</div></main>
<footer><p><strong>RURAL UTAH SPORTS</strong></p><p>Utah High School Sports History &amp; Data</p></footer>
<script>
const $=id=>document.getElementById(id),norm=v=>String(v??'').trim().toUpperCase(),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const canonical=v=>{const n=norm(v).replace(/\.+$/,'').trim();return n.startsWith('WASATCH ACAD')?'WASATCH ACADEMY':String(v??'').trim()};
const yearOf=d=>{const m=String(d||'').match(/(?:^|\D)(18\d{2}|19\d{2}|20\d{2})(?:\D|$)/);return m?Number(m[1]):null};const dateValue=d=>{const t=Date.parse(String(d||''));return Number.isFinite(t)?t:(yearOf(d)?Date.UTC(yearOf(d),0,1):0)};
function flatten(data){const out=[],seen=new Set();for(const e of (data.scores||[]))for(const g of (Array.isArray(e.games)?e.games:[])){let x;if(g.tie)x={date:g.date||'',team1:canonical(g.team1),team2:canonical(g.team2),score1:Number(g.score1),score2:Number(g.score2),tie:true};else x={date:g.date||'',team1:canonical(g.winner),team2:canonical(g.loser),score1:Number(g.winnerScore),score2:Number(g.loserScore),tie:false};x.year=yearOf(x.date);x.total=x.score1+x.score2;x.margin=Math.abs(x.score1-x.score2);const p=[[norm(x.team1).replace(/[^A-Z0-9]/g,''),x.score1],[norm(x.team2).replace(/[^A-Z0-9]/g,''),x.score2]].sort((a,b)=>a[0].localeCompare(b[0])),k=`${x.date}|${p[0][0]}:${p[0][1]}|${p[1][0]}:${p[1][1]}`;if(!seen.has(k)){seen.add(k);out.push(x)}}return out}
function gameURL(g){return `game.html?${new URLSearchParams({date:g.date||'',team1:g.team1||'',score1:String(g.score1),team2:g.team2||'',score2:String(g.score2)})}`}
function seasonRecord(games,team,year){let w=0,l=0,t=0,pf=0,pa=0;for(const g of games){if(g.year!==year)continue;const a=norm(g.team1)===norm(team),b=norm(g.team2)===norm(team);if(!a&&!b)continue;const fs=a?g.score1:g.score2,as=a?g.score2:g.score1;pf+=fs;pa+=as;if(g.tie)t++;else if((a&&g.score1>g.score2)||(b&&g.score2>g.score1))w++;else l++}return{w,l,t,pf,pa}}
const rec=r=>`${r.w}-${r.l}${r.t?'-'+r.t:''}`;
function samePair(g,a,b){return (norm(g.team1)===norm(a)&&norm(g.team2)===norm(b))||(norm(g.team1)===norm(b)&&norm(g.team2)===norm(a))}
function exact(g,q){const s1=Number(q.get('score1')),s2=Number(q.get('score2'));if(String(g.date)!==String(q.get('date')))return false;const a=q.get('team1'),b=q.get('team2');return (norm(g.team1)===norm(a)&&norm(g.team2)===norm(b)&&g.score1===s1&&g.score2===s2)||(norm(g.team1)===norm(b)&&norm(g.team2)===norm(a)&&g.score1===s2&&g.score2===s1)}
async function init(){try{const r=await fetch('scorigami.json?v='+Date.now());if(!r.ok)throw new Error('games');const games=flatten(await r.json()),q=new URLSearchParams(location.search),a=q.get('team1')||'',b=q.get('team2')||'',match=games.find(g=>exact(g,q));if(!a||!b){$('page').className='error';$('page').innerHTML='This game link is incomplete. <a class="game-link" href="games.html">Search the game database</a>.';return}const base=match||{date:q.get('date')||'',team1:a,team2:b,score1:Number(q.get('score1')),score2:Number(q.get('score2')),tie:Number(q.get('score1'))===Number(q.get('score2')),year:yearOf(q.get('date')),total:Number(q.get('score1'))+Number(q.get('score2')),margin:Math.abs(Number(q.get('score1'))-Number(q.get('score2')))};const year=base.year,ar=seasonRecord(games,a,year),br=seasonRecord(games,b,year),series=games.filter(g=>samePair(g,a,b)).sort((x,y)=>dateValue(x.date)-dateValue(y.date));let aw=0,bw=0,ties=0;for(const g of series){if(g.tie){ties++;continue}if(norm(g.team1)===norm(a))aw++;else if(norm(g.team1)===norm(b))bw++}const recent=[...series].reverse().slice(0,10);const aScore=norm(base.team1)===norm(a)?base.score1:base.score2,bScore=norm(base.team1)===norm(a)?base.score2:base.score1;const result=aScore===bScore?'Tie':aScore>bScore?`${a} win`:`${b} win`;document.title=`${a} ${aScore}-${bScore} ${b} | Rural Utah Sports`;document.querySelector('meta[property="og:title"]')?.setAttribute('content',document.title);$('page').className='';$('page').innerHTML=`<section class="game-hero"><div class="game-meta">${esc(base.date||year||'Unknown date')}${year?` • ${year} Season`:''}</div><div class="scoreboard"><div class="team"><a href="team.html?team=${encodeURIComponent(a)}"><div class="team-name">${esc(a)}</div></a><div class="team-record">${year?`${year} record: ${rec(ar)}`:'Season record unavailable'}</div></div><div class="score">${aScore}–${bScore}</div><div class="team"><a href="team.html?team=${encodeURIComponent(b)}"><div class="team-name">${esc(b)}</div></a><div class="team-record">${year?`${year} record: ${rec(br)}`:'Season record unavailable'}</div></div></div><div class="result-label">${esc(result)}${match?'':' • shown from shared link'}</div></section><section class="summary-grid"><div class="summary"><strong>${base.total}</strong><span>Total Points</span></div><div class="summary"><strong>${base.margin}</strong><span>Margin</span></div><div class="summary"><strong>${series.length}</strong><span>All-Time Meetings</span></div><div class="summary"><strong>${aw}-${bw}${ties?'-'+ties:''}</strong><span>${esc(a)} Series Record</span></div></section><h2 class="section-title">Series Context</h2><section class="series"><div class="series-grid"><div class="series-stat"><strong>${aw}</strong><span>${esc(a)} Wins</span></div><div class="series-stat"><strong>${bw}</strong><span>${esc(b)} Wins</span></div><div class="series-stat"><strong>${ties}</strong><span>Ties</span></div><div class="series-stat"><strong>${series.length?esc(series.at(-1).date):'—'}</strong><span>Latest Meeting</span></div></div></section><h2 class="section-title">Other Meetings</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>${esc(a)}</th><th>Score</th><th>${esc(b)}</th></tr></thead><tbody>${recent.length?recent.map(g=>{const as=norm(g.team1)===norm(a)?g.score1:g.score2,bs=norm(g.team1)===norm(a)?g.score2:g.score1;return `<tr><td>${esc(g.date)}</td><td>${esc(a)}</td><td><a class="game-link" href="${gameURL(g)}">${as}–${bs}</a></td><td>${esc(b)}</td></tr>`}).join(''):'<tr><td colspan="4">No other meetings found.</td></tr>'}</tbody></table></div><div class="actions"><a href="team.html?team=${encodeURIComponent(a)}">${esc(a)} Team Page</a><a href="team.html?team=${encodeURIComponent(b)}">${esc(b)} Team Page</a>${year?`<a href="season.html?year=${year}">${year} Season</a>`:''}<a href="games.html?search=${encodeURIComponent(a+' vs '+b)}">All Series Games</a><a href="compare.html?team1=${encodeURIComponent(a)}&team2=${encodeURIComponent(b)}">Compare Programs</a></div>`}catch(e){console.error(e);$('page').className='error';$('page').innerHTML='Game data could not be loaded. <a class="game-link" href="games.html">Return to the game database</a>.'}}
init();
</script>

</body></html>
