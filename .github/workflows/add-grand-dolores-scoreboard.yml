name: Add Grand-Dolores To Scoreboard

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-grand-dolores-scoreboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add verified Grand at Dolores game
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('weekly-simulation.json')
          data = json.loads(path.read_text())
          games = data.setdefault('games', [])

          target = {
              'date': '8/21/2026',
              'awayTeam': 'GRAND',
              'homeTeam': 'DOLORES, CO',
              'awayScore': 21,
              'homeScore': 10,
              'winner': 'GRAND',
              'actualAway': 12,
              'actualHome': 6,
              'actualWinner': 'GRAND',
              'wl': 'W'
          }

          # Remove any stale/reversed copy of this matchup for the same date.
          games[:] = [g for g in games if not (
              str(g.get('date','')).strip() == '8/21/2026' and
              {str(g.get('awayTeam','')).strip().upper(), str(g.get('homeTeam','')).strip().upper()} == {'GRAND','DOLORES, CO'}
          )]
          games.append(target)
          games.sort(key=lambda g: (str(g.get('date','')), str(g.get('awayTeam',''))))
          path.write_text(json.dumps(data, separators=(',', ':')) + '\n')
          print('Grand at Dolores added:', target)
          PY

      - name: Commit scoreboard data
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add weekly-simulation.json
          git commit -m "Add Grand at Dolores to weekly scoreboard"
          git pull --rebase origin main
          git push
