name: Install championship page features
on:
  push:
    paths:
      - '.github/workflows/install-championship-features.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add feature script to Championships page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('championships.html')
          s=p.read_text()
          tag='<script src="championship-features.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s)
          PY
          node --check championship-features.js
          grep -q 'championship-features.js' championships.html
      - name: Commit
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add championships.html
          git commit -m "Enable championship sharing and leaderboard features"
          git pull --rebase origin main
          git push
