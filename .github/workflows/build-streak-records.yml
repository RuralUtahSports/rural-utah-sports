name: Build Streak Records

on:
  workflow_dispatch:
  push:
    paths:
      - 'team-page-data/**'
      - 'teams-data.json'
      - 'scripts/build_streak_records.py'
      - '.github/workflows/build-streak-records.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build streak records
        run: python scripts/build_streak_records.py
      - name: Verify output
        run: |
          python - <<'PY'
          import json
          d=json.load(open('streak-records.json'))
          assert d
          for team,row in d.items():
              assert 'longestWinStreak' in row and 'longestLossStreak' in row
          print('Verified',len(d),'teams')
          PY
      - name: Commit generated streak records
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add streak-records.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update football streak records"
          git pull --rebase origin main
          git push
