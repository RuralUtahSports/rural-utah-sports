name: Build Streak Records

on:
  workflow_dispatch:
  schedule:
    - cron: '10,25,40,55 * * * *'
  push:
    paths:
      - 'team-page-data/**'
      - 'teams-data.json'
      - 'standings-2026.json'
      - 'scripts/build_streak_records.py'
      - '.github/workflows/build-streak-records.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build streak and season records
        run: python scripts/build_streak_records.py
      - name: Add scoring streak stats to records page
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('records.html')
          text = path.read_text(encoding='utf-8')
          anchor = "{key:'lossStreak',label:'Longest Losing Streak',streakField:'longestLossStreak',format:'int',note:'Longest run of consecutive losses in the historical schedule database. Ties break a losing streak.'},"
          scoring = "{key:'scoringStreak',label:'Longest Consecutive Games Scored In',streakField:'longestScoringStreak',format:'int',note:'Longest run of consecutive games in which a team scored at least one point. A shutout resets the streak.'},{key:'currentScoringStreak',label:'Current Consecutive Games Scored In',streakField:'currentScoringStreak',format:'int',note:'Current run of consecutive completed games in which a team has scored at least one point. A shutout resets the streak.'},"
          shutouts = "{key:'shutoutStreak',label:'Longest Consecutive Games Shut Out',streakField:'longestShutoutStreak',format:'int',note:'Longest run of consecutive games in which a team scored zero points.'},{key:'currentShutoutStreak',label:'Current Consecutive Games Shut Out',streakField:'currentShutoutStreak',format:'int',note:'Current run of consecutive completed games in which a team has scored zero points.'},"
          if "key:'scoringStreak'" not in text:
              if anchor not in text: raise SystemExit('Could not find streak stat insertion point in records.html')
              text = text.replace(anchor, anchor + scoring + shutouts, 1)
          elif "key:'shutoutStreak'" not in text:
              marker = "{key:'currentScoringStreak',label:'Current Consecutive Games Scored In',streakField:'currentScoringStreak',format:'int',note:'Current run of consecutive completed games in which a team has scored at least one point. A shutout resets the streak.'},"
              if marker not in text: raise SystemExit('Could not find scoring streak insertion point in records.html')
              text = text.replace(marker, marker + shutouts, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify output
        run: |
          python - <<'PY'
          import json
          streaks=json.load(open('streak-records.json'))
          assert streaks
          for team,row in streaks.items():
              assert 'longestWinStreak' in row and 'longestLossStreak' in row
              assert 'currentWinStreak' in row and 'currentLossStreak' in row
              assert 'longestScoringStreak' in row and 'currentScoringStreak' in row
              assert 'longestShutoutStreak' in row and 'currentShutoutStreak' in row
          seasons=json.load(open('season-records.json')).get('seasons',{})
          assert seasons
          records=open('records.html', encoding='utf-8').read()
          assert "key:'scoringStreak'" in records and "key:'currentScoringStreak'" in records
          assert "key:'shutoutStreak'" in records and "key:'currentShutoutStreak'" in records
          print('Verified',len(streaks),'teams')
          PY
      - name: Commit generated record data
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add streak-records.json season-records.json records.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update football record data"
          git pull --rebase origin main
          git push
