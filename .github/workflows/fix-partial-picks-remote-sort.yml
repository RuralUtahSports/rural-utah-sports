name: Fix Partial Picks Remote Sort

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-partial-picks-remote-sort.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Use pick-first ranking for global leaderboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('weekly-picks-enhanced.js')
          s=p.read_text()
          start="remote.sort((a,b)=>"
          i=s.find(start)
          if i>=0:
              j=s.find(");body.innerHTML=wpeBoardTable",i)
              if j>=0:
                  rule="remote.sort((a,b)=>(Number(!a.eligible)-Number(!b.eligible))||(b.correct-a.correct)||((b.accuracy??-1)-(a.accuracy??-1))||(b.completed-a.completed)||((a.avgError??Infinity)-(b.avgError??Infinity)))"
                  s=s[:i]+rule+s[j+1:]
          s=s.replace('ranks complete entries by lowest total point error, then most correct picks. Partial entries are accepted. Score guesses are optional.','accepts partial entries. Rankings use most correct picks, then accuracy, then number of graded picks, then lower average point error. Score guesses are optional.')
          p.write_text(s)
          PY
      - name: Commit ranking fix
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add weekly-picks-enhanced.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix partial picks global leaderboard ranking"
          git pull --rebase origin main
          git push
