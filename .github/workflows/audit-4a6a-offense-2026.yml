name: Audit 2026 4A-6A offensive player stats
on:
  pull_request:
    paths:
      - 'scripts/audit_4a6a_stat_coverage_2026.mjs'
      - 'tests/audit-4a6a-stat-coverage-2026.test.mjs'
      - '.github/workflows/audit-4a6a-offense-2026.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source identity, missing-game and phase holds
        run: node --test tests/audit-4a6a-stat-coverage-2026.test.mjs
      - name: Audit all 74 schools and preserve per-game provenance
        run: node scripts/audit_4a6a_stat_coverage_2026.mjs --output="$RUNNER_TEMP/4a6a-offense-2026"
      - name: Ensure no roster stats, game data, verified publication or awards changed
        run: |
          test -s "$RUNNER_TEMP/4a6a-offense-2026/AUDIT.md"
          test -s "$RUNNER_TEMP/4a6a-offense-2026/audit.json"
          git diff --exit-code -- deseret-rosters-stats-2026.json maxpreps-stats-fallback-2026.json player-game-stats-2026.json maxpreps-player-game-stats-2026.json regular-season-publication-2026.json region-awards-2026.lock.json standings-2026.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2026-4a6a-offense-source-review
          path: ${{ runner.temp }}/4a6a-offense-2026
          if-no-files-found: ignore
          retention-days: 30
