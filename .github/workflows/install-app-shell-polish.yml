name: Install Shared App Shell Polish

on:
  push:
    paths:
      - '.github/workflows/install-app-shell-polish.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire shared app polish and header favorites
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('nav-menu.js')
          s=p.read_text()
          s=s.replace("addScript('site-polish.js?v=20260817-1','rusSitePolish',true);", "addScript('site-polish.js?v=20260817-1','rusSitePolish',true);addScript('app-shell-polish.js?v=20260817-app3','rusAppShellPolish',true);") if 'rusAppShellPolish' not in s else s
          s=s.replace("favorites.js?v=20260817-pages", "favorites.js?v=20260817-header3")
          p.write_text(s)
          Path('.github/workflows/install-app-shell-polish.yml').unlink(missing_ok=True)
          PY
      - name: Commit shared app shell wiring
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add nav-menu.js .github/workflows/install-app-shell-polish.yml
          if git diff --cached --quiet; then
            echo "Shared app shell already installed."
          else
            git commit -m "Use shared app styling and header favorites"
            git pull --rebase origin main
            git push
          fi
