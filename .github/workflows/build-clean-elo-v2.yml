name: Build Clean Live ELO

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - 'weekly-simulation.json'
      - 'deseret-game-details.json'
      - 'teams-data.json'
      - 'scripts/build_verified_elo_2026.mjs'
      - '.github/workflows/build-clean-elo-v2.yml'

permissions:
  contents: write

concurrency:
  group: clean-live-elo-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Recalculate ELO from historical games and verified 2026 finals only
        env:
          SHEET_ID: 1IHr84tlMdZVAazLDh0HV7ZWoxNH4UpjpLt_UTV8KZwo
          CLEAN_GAMES_GID: 627882418
        run: node scripts/build_verified_elo_2026.mjs

      - name: Verify scheduled games did not enter 2026 ELO
        run: |
          node <<'NODE'
          const fs=require('fs');
          const changes=JSON.parse(fs.readFileSync('elo-game-changes-2026.json','utf8'));
          const weekly=JSON.parse(fs.readFileSync('weekly-simulation.json','utf8'));
          const compact=v=>String(v??'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
          const iso=d=>{const s=String(d||'').trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return`${m[3]}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);return m?`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`:''};
          const details=fs.existsSync('deseret-game-details.json')?JSON.parse(fs.readFileSync('deseret-game-details.json','utf8')):{games:{}};
          for(const g of weekly.games||[]){
            const key=`${iso(g.date)}|${compact(g.awayTeam)}|${compact(g.homeTeam)}`;
            if(!changes.games?.[key])continue;
            const sheetFinal=g.actualAway!=null&&g.actualHome!=null;
            const d=details.games?.[key];
            const deseretFinal=d?.final===true&&d?.boxScore?.rows?.length===2;
            if(!sheetFinal&&!deseretFinal)throw new Error(`Unverified game entered ELO: ${key}`);
          }
          console.log('Verified 2026 ELO contains verified finals only.');
          NODE

      - name: Commit verified live ELO
        env:
          SHEET_ID: 1IHr84tlMdZVAazLDh0HV7ZWoxNH4UpjpLt_UTV8KZwo
          CLEAN_GAMES_GID: 627882418
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"

          # Other data builders also update team-page-data. Refresh from the newest
          # main first, then rebuild ELO on top of it so a concurrent site-data
          # commit cannot strand the newest game off the team ELO charts.
          git fetch origin main
          git reset --hard origin/main
          node scripts/build_verified_elo_2026.mjs

          git add team-elo-history.json elo-summary.json elo-live-summary.json elo-game-changes-2026.json elo-cleanup-report.json team-page-data
          if git diff --cached --quiet; then echo "ELO data current."; exit 0; fi
          git commit -m "Rebuild ELO from verified finals"

          # If main moves again while this short commit is being made, rebuild once
          # more from the new tip rather than attempting to rebase 100+ generated
          # team JSON files and creating merge conflicts.
          if ! git push; then
            git fetch origin main
            git reset --hard origin/main
            node scripts/build_verified_elo_2026.mjs
            git add team-elo-history.json elo-summary.json elo-live-summary.json elo-game-changes-2026.json elo-cleanup-report.json team-page-data
            if git diff --cached --quiet; then echo "ELO data current after refresh."; exit 0; fi
            git commit -m "Rebuild ELO from verified finals"
            git push
          fi
