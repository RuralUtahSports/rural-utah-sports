name: App Shell Sanity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nav-menu.js'
      - 'mobile-shell.js'
      - 'desktop-optimizations.js'
      - 'desktop-v2.js'
      - 'site-search.js'
      - 'pwa.js'
      - 'sw.js'
      - 'optimization-polish.js'
      - 'recently-viewed.js'
      - 'home-personalized.js'
      - 'my-teams-dashboard.js'
      - 'rus-lines-dashboard.js'
      - 'game-center-upgrade.js'
      - 'app-shell-polish.js'
      - 'growth-features.js'
      - 'players.html'
      - 'manifest.webmanifest'
      - 'RUSlogoNew.png'
      - 'deseret-rosters-stats-2026.json'
      - 'deseret-rosters-stats-2025.json'
      - 'scripts/check-app-shell.mjs'
      - 'scripts/check-growth-features.mjs'
      - '.github/workflows/app-shell-sanity.yml'
  pull_request:
    paths:
      - 'nav-menu.js'
      - 'mobile-shell.js'
      - 'desktop-optimizations.js'
      - 'desktop-v2.js'
      - 'site-search.js'
      - 'pwa.js'
      - 'sw.js'
      - 'optimization-polish.js'
      - 'recently-viewed.js'
      - 'home-personalized.js'
      - 'my-teams-dashboard.js'
      - 'rus-lines-dashboard.js'
      - 'game-center-upgrade.js'
      - 'app-shell-polish.js'
      - 'growth-features.js'
      - 'players.html'
      - 'manifest.webmanifest'
      - 'RUSlogoNew.png'
      - 'deseret-rosters-stats-2026.json'
      - 'deseret-rosters-stats-2025.json'
      - 'scripts/check-app-shell.mjs'
      - 'scripts/check-growth-features.mjs'
      - '.github/workflows/app-shell-sanity.yml'

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check nav-menu.js
          node --check mobile-shell.js
          node --check desktop-optimizations.js
          node --check desktop-v2.js
          node --check site-search.js
          node --check pwa.js
          node --check sw.js
          node --check optimization-polish.js
          node --check recently-viewed.js
          node --check home-personalized.js
          node --check my-teams-dashboard.js
          node --check rus-lines-dashboard.js
          node --check game-center-upgrade.js
          node --check app-shell-polish.js
          node --check growth-features.js
          node --check scripts/check-app-shell.mjs
          node --check scripts/check-growth-features.mjs

      - name: Verify app shell wiring
        run: node scripts/check-app-shell.mjs

      - name: Verify growth features
        run: node scripts/check-growth-features.mjs
