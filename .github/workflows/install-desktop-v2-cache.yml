name: Install Desktop V2 Cache Versions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-desktop-v2-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bust shared desktop cache versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('nav-menu.js')
          s=p.read_text()
          s=re.sub(r"addScript\('pwa\.js\?v=[^']*','rusPwa',true\)", "addScript('pwa.js?v=20260817-desktop2','rusPwa',true)", s)
          s=re.sub(r"addScript\('desktop-optimizations\.js\?v=[^']*','rusDesktopOptimizations',true\)", "addScript('desktop-optimizations.js?v=20260817-desktop2','rusDesktopOptimizations',true)", s)
          p.write_text(s)

          for html in Path('.').rglob('*.html'):
              text=html.read_text(errors='ignore')
              updated=re.sub(r'src=[\"\']nav-menu\.js(?:\?v=[^\"\']*)?[\"\']', 'src="nav-menu.js?v=20260817-desktop2"', text)
              if updated!=text:
                  html.write_text(updated)
          PY
      - name: Remove installer
        run: rm .github/workflows/install-desktop-v2-cache.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Activate Desktop V2 sitewide'
          git push
