name: Fix 1971-1980 bracket visibility v2

on:
  push:
    paths:
      - '.github/workflows/fix-1971-1980-brackets-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert bracket files and add seasons
        run: |
          node <<'NODE'
          const fs=require('fs');
          const classMap={AAA:'4A',AA:'3A',A:'2A',B:'1A'};
          for(let y=1971;y<=1980;y++){
            const f=`brackets-${y}.json`;
            if(!fs.existsSync(f)) throw new Error(`${f} is missing`);
            const src=JSON.parse(fs.readFileSync(f,'utf8'));
            let out={};
            if(src.classes){
              for(const [oldCls,block] of Object.entries(src.classes)){
                const cls=classMap[oldCls]||oldCls.replace(/^Class\s+/,'');
                out[cls]=(block.rounds||[]).map(r=>[r.name,(r.games||[]).map(g=>{
                  const a=g.teams&&g.teams[0]||{},b=g.teams&&g.teams[1]||{};
                  return [String(a.name||''),String(a.score??''),String(b.name||''),String(b.score??'')];
                })]);
              }
            }else{
              for(const [k,v] of Object.entries(src)) out[k.replace(/^Class\s+/,'')]=v;
            }
            if(!Object.keys(out).some(k=>['4A','3A','2A','1A'].includes(k))) throw new Error(`${y} conversion failed`);
            fs.writeFileSync(f,JSON.stringify(out,null,2)+'\n');
          }
          const file='championship-brackets.js';
          let js=fs.readFileSync(file,'utf8');
          js=js.replace(/const YEARS=\[[^;]+\];/,`const YEARS=['2025','2024','2023','2022','2021','2020','2019','2018','2017','2016','2015','2014','2013','2012','2011','2010','1990','1989','1988','1987','1986','1985','1984','1983','1982','1981','1980','1979','1978','1977','1976','1975','1974','1973','1972','1971','1970','1969','1968','1967','1966','1965','1964','1963','1962','1961','1960','1959','1958','1957','1956','1955','1954','1953','1952','1951','1950','1949','1948','1947','1946','1945','1944','1943','1942','1941','1934','1930','1929','1928','1927','1926','1925','1924','1923','1922','1921','1920','1919'];`);
          fs.writeFileSync(file,js);
          for(let y=1971;y<=1980;y++) JSON.parse(fs.readFileSync(`brackets-${y}.json`));
          NODE
      - name: Commit fixes
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add brackets-197{1,2,3,4,5,6,7,8,9}.json brackets-1980.json championship-brackets.js
          git commit -m "Show 1971-1980 playoff brackets"
          git pull --rebase origin main
          git push
