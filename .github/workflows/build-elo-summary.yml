name: Build ELO Summary

# Compatibility launcher only. The verified clean-ELO workflow is the sole owner
# of elo-summary.json, elo-live-summary.json, team-elo-history.json and ELO fields
# inside team-page-data. Keeping this workflow manual preserves the old Actions
# entry point without allowing a legacy calculation to overwrite verified data.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: elo-summary-compat
  cancel-in-progress: true

jobs:
  dispatch-clean-elo:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified clean ELO rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/build-clean-elo-v2.yml/dispatches \
            -f ref=main
          echo "Build Clean Live ELO dispatched; legacy summary writer is disabled."
