name: Install Football App Upgrades

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-football-app-upgrades.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire app features and bust cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('nav-menu.js')
          s=p.read_text()
          old="addScript('pwa.js?v=20260817-opt1','rusPwa',true);addScript('site-search.js?v=20260817-opt1','rusSiteSearch',true);addScript('optimization-polish.js?v=20260817-opt1','rusOptimizationPolish',true);"
          new="addScript('pwa.js?v=20260817-iosicon2','rusPwa',true);addScript('site-search.js?v=20260817-player2','rusSiteSearch',true);addScript('optimization-polish.js?v=20260817-opt1','rusOptimizationPolish',true);addScript('recently-viewed.js?v=20260817-app4','rusRecentlyViewed',true);"
          if old not in s: raise SystemExit('base loader marker not found')
          s=s.replace(old,new)

          old="if(path==='index.html'){addScript('home-my-teams.js?v=20260817-opt1','rusHomeMyTeams',true);addScript('did-you-know.js?v=20260812a','rusDidYouKnow',true);addScript('today-history-more.js?v=20260813a','rusTodayHistoryMore',true);addScript('record-watch-filter.js?v=20260815a','rusRecordWatchFilter',true)}"
          new="if(path==='index.html'){addScript('home-personalized.js?v=20260817-app4','rusHomePersonalized',true);addScript('did-you-know.js?v=20260812a','rusDidYouKnow',true);addScript('today-history-more.js?v=20260813a','rusTodayHistoryMore',true);addScript('record-watch-filter.js?v=20260815a','rusRecordWatchFilter',true)}"
          if old not in s: raise SystemExit('home loader marker not found')
          s=s.replace(old,new)

          old="if(path==='scoreboard.html')addScript('mobile-scoreboard-polish.js?v=20260817-final1','rusScoreboardMobilePolish',true);"
          new="if(path==='scoreboard.html'){addScript('mobile-scoreboard-polish.js?v=20260817-final1','rusScoreboardMobilePolish',true);addScript('rus-lines-dashboard.js?v=20260817-app4','rusLinesDashboard',true)}\n    if(path==='game.html')addScript('game-center-upgrade.js?v=20260817-app4','rusGameCenterUpgrade',true);\n    if(path==='my-teams.html')addScript('my-teams-dashboard.js?v=20260817-app4','rusMyTeamsDashboard',true);"
          if old not in s: raise SystemExit('scoreboard loader marker not found')
          s=s.replace(old,new)
          p.write_text(s)

          for html in Path('.').rglob('*.html'):
              text=html.read_text(errors='ignore')
              updated=re.sub(r'src=[\"\']nav-menu\.js(?:\?v=[^\"\']*)?[\"\']', 'src="nav-menu.js?v=20260817-app4"', text)
              if updated!=text: html.write_text(updated)
          PY
      - name: Remove installer
        run: rm .github/workflows/install-football-app-upgrades.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Activate personalized football app features'
          git push
