name: Import past boys basketball seasons

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-boys-basketball-past-results.yml'
      - 'scripts/import_boys_basketball_past_results.mjs'
      - 'scripts/build_boys_basketball_all_time_records.mjs'
      - 'boys-basketball-teams.json'
      - 'boys-basketball-games-2026-27.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Import next archived MaxPreps seasons
        run: |
          for season in 05-06 06-07 07-08; do
            echo "Importing boys basketball $season"
            node scripts/import_boys_basketball_past_results.mjs "$season"
          done
      - name: Build all-time record summary
        run: node scripts/build_boys_basketball_all_time_records.mjs
      - name: Commit historical schedules, reports and summary
        run: |
          for season in 2005-06 2006-07 2007-08; do
            git add "boys-basketball-games-$season.json" "boys-basketball-results-import-report-$season.json"
          done
          git add boys-basketball-all-time-records-2005-26.json
          if git diff --cached --quiet; then
            echo "No archived boys basketball results changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import past boys basketball results back to 2005"
          git pull --rebase origin main
          git push
