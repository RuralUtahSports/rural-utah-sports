name: Import past boys basketball seasons

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-boys-basketball-past-results.yml'
      - 'scripts/import_boys_basketball_past_results.mjs'
      - 'boys-basketball-teams.json'
      - 'boys-basketball-games-2026-27.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Import archived MaxPreps results
        run: |
          for season in 20-21 21-22 22-23 23-24 24-25; do
            echo "Importing boys basketball $season"
            node scripts/import_boys_basketball_past_results.mjs "$season"
          done
      - name: Commit historical schedules and reports
        run: |
          for season in 2020-21 2021-22 2022-23 2023-24 2024-25; do
            git add "boys-basketball-games-$season.json" "boys-basketball-results-import-report-$season.json"
          done
          if git diff --cached --quiet; then
            echo "No archived boys basketball results changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import past boys basketball results back to 2020"
          git push
