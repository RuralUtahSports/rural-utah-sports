name: Link Rankings Page

on:
  push:
    paths:
      - '.github/workflows/link-rankings-page.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link rankings navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              old=s
              s=s.replace('<a href="#">Rankings</a>','<a href="rankings.html">Rankings</a>')
              if p.name!='rankings.html':
                  s=s.replace('<a href="rankings.html" class="active">Rankings</a>','<a href="rankings.html">Rankings</a>')
              if s!=old:
                  p.write_text(s,encoding='utf-8')
                  changed.append(p.name)
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Verify rankings page
        run: |
          test -f rankings.html
          test -f rankings-baseline-2026.json
          grep -q 'CORNER CANYON' rankings-baseline-2026.json
          grep -q 'UMA-LEHI' rankings-baseline-2026.json
          grep -q 'href="rankings.html"' index.html
      - name: Commit
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Link rankings page across site navigation"
          git push
