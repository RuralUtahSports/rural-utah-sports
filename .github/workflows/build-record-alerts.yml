name: Build Record Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '20 * * * *'
  workflow_run:
    workflows:
      - "Build Player Single-Game Records"
      - "Build Team Stat Single-Game Records"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'player-single-game-records/**'
      - 'team-stat-single-game-records/**'
      - 'data/uhsaa-football-single-game-records.json'
      - 'scripts/build_record_alerts.mjs'
      - '.github/workflows/build-record-alerts.yml'

permissions:
  contents: write

concurrency:
  group: build-record-alerts
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current-season record alerts
        run: node scripts/build_record_alerts.mjs
      - name: Validate alert payload
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('record-alerts.json','utf8'));
          if(!Array.isArray(d.alerts)) throw new Error('record-alerts.json missing alerts array');
          for(const a of d.alerts){
            if(!['player','team'].includes(a.recordType)) throw new Error('Bad recordType');
            if(!['school','statewide','uhsaa'].includes(a.scope)) throw new Error('Bad scope');
            if(!(Number(a.value)>Number(a.previousValue))) throw new Error('Alert does not beat previous record');
            if(a.uhsaaWatch){
              if(!(Number(a.value)>Number(a.uhsaaListedValue))) throw new Error('UHSAA watch does not exceed listed mark');
              if(!a.uhsaaSourceUrl) throw new Error('UHSAA watch missing source URL');
            }
          }
          console.log(`Validated ${d.alerts.length} record alerts (${d.alerts.filter(a=>a.uhsaaWatch).length} UHSAA watches)`);
          NODE
      - name: Publish alert data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add record-alerts.json
          if git diff --cached --quiet; then echo "Record alerts already current."; exit 0; fi
          git commit -m "Auto-sync home record alerts"
          ok=0
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi
