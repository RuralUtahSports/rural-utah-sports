name: Build Simulator Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - 'teams-data.json'
      - 'team-schedules.json'
      - 'elo-summary.json'
      - 'scripts/normalize-weekly-team-names.mjs'
      - '.github/workflows/build-simulator-data.yml'

permissions:
  contents: write

concurrency:
  group: simulator-data-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      # weekly-simulation.json is rebuilt from the sheet each run, so deleted sheet games are removed from the site feed too.
      - name: Build compact simulator data
        env:
          SHEET_ID: 1IHr84tlMdZVAazLDh0HV7ZWoxNH4UpjpLt_UTV8KZwo
          WEEKLY_GID: 1211467999
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          import {normalizeWeeklyGames} from './scripts/normalize-weekly-team-names.mjs';

          const clean = v => String(v ?? '').trim();
          const norm = v => clean(v).toUpperCase().replace(/[^A-Z0-9]/g, '');
          const n = v => { const s = clean(v); if (!s) return null; const x = Number(s); return Number.isFinite(x) ? x : null; };
          const validResult = v => ['W','L','T'].includes(clean(v).toUpperCase());
          const yearOf = v => { const m = clean(v).match(/(18|19|20)\d{2}/); return m ? Number(m[0]) : null; };
          const dateStamp = v => { const d = new Date(clean(v)); return Number.isFinite(d.getTime()) ? d.getTime() : 0; };
          const fmtGame = g => `${clean(g.result)} ${Number(g.teamScore||0)}-${Number(g.opponentScore||0)}`;

          const teams = JSON.parse(fs.readFileSync('teams-data.json','utf8'));
          const schedules = JSON.parse(fs.readFileSync('team-schedules.json','utf8'));
          const eloSummary = JSON.parse(fs.readFileSync('elo-summary.json','utf8'));

          const teamByNorm = new Map();
          for (const t of teams) teamByNorm.set(norm(t.team), t.team);
          const aliases = {GUNNISON:'GUNNISON VALLEY',MAPLEMTN:'MAPLE MOUNTAIN',MONUMENTVAL:'MONUMENT VALLEY',AMERFORK:'AMERICAN FORK',CEDAR:'CEDAR CITY'};
          function resolveTeam(v) { const k = norm(v); return teamByNorm.get(k) || aliases[k] || ''; }
          function teamSchedule(team) {
            const raw = schedules[team] || schedules[resolveTeam(team)] || {};
            const out = [];
            for (const games of Object.values(raw || {})) {
              if (!Array.isArray(games)) continue;
              for (const g of games) {
                const result = clean(g.result).toUpperCase();
                const ts = n(g.teamScore), os = n(g.opponentScore);
                if (!clean(g.date) || !clean(g.opponent) || !validResult(result) || ts === null || os === null) continue;
                out.push({date:clean(g.date),opponent:clean(g.opponent),opponentTeam:resolveTeam(g.opponent),teamScore:ts,opponentScore:os,result,year:yearOf(g.date)});
              }
            }
            out.sort((a,b)=>dateStamp(a.date)-dateStamp(b.date));
            return out;
          }

          const gamesByTeam = new Map();
          const seasonRecords = new Map();
          for (const t of teams) {
            const games = teamSchedule(t.team);
            gamesByTeam.set(t.team, games);
            const byYear = {};
            for (const g of games) {
              if (!g.year) continue;
              if (!byYear[g.year]) byYear[g.year] = {wins:0,losses:0,ties:0,gp:0};
              if (g.result === 'W') byYear[g.year].wins++;
              else if (g.result === 'L') byYear[g.year].losses++;
              else byYear[g.year].ties++;
              byYear[g.year].gp++;
            }
            seasonRecords.set(t.team, byYear);
          }
          function seasonToUse(team) {
            const byYear = seasonRecords.get(team) || {};
            const years = Object.keys(byYear).map(Number).sort((a,b)=>b-a);
            if (!years.length) return null;
            if ((byYear[years[0]]?.gp || 0) >= 4) return years[0];
            return years[1] || years[0];
          }
          const seasonGames = (team,year)=>(gamesByTeam.get(team)||[]).filter(g=>g.year===year);
          function sos(team,season) {
            if (!season) return 0;
            let total=0,count=0;
            for (const g of seasonGames(team,season)) {
              const opp=g.opponentTeam;if(!opp)continue;
              const r=seasonRecords.get(opp)?.[season];if(!r||!r.gp)continue;
              total+=(r.wins+r.ties*.5)/r.gp;count++;
            }
            return count?total/count:0;
          }
          function recentForm(team){return [...(gamesByTeam.get(team)||[])].sort((a,b)=>dateStamp(b.date)-dateStamp(a.date)).slice(0,10).map(g=>g.result).join('-')}
          function recent10Diff(team){const recent=[...(gamesByTeam.get(team)||[])].sort((a,b)=>dateStamp(b.date)-dateStamp(a.date)).slice(0,10);return recent.length?recent.reduce((s,g)=>s+(g.teamScore-g.opponentScore),0)/recent.length:0}
          function eloFor(team){const e=eloSummary[team]||eloSummary[resolveTeam(team)]||null;return e&&Number.isFinite(Number(e.currentElo))?Number(e.currentElo):null}

          const featureMap={};
          for(const t of teams){const season=seasonToUse(t.team);featureMap[t.team]={team:t.team,classification:clean(t.classification),region:clean(t.region),backgroundColor:clean(t.backgroundColor),textColor:clean(t.textColor),wins:Number(t.wins||0),losses:Number(t.losses||0),ties:Number(t.ties||0),games:Number(t.games||0),winPct:Number(t.winPct||0),avgPF:t.games?Number(t.pointsFor||0)/Number(t.games):0,avgPA:t.games?Number(t.pointsAgainst||0)/Number(t.games):0,avgDiff:Number(t.avgMargin||0),recentForm:recentForm(t.team),recent10Diff:recent10Diff(t.team),seasonUsed:season,sos:sos(t.team,season),elo:eloFor(t.team)}}

          const pairKey=(a,b)=>[a,b].sort((x,y)=>x.localeCompare(y)).join('|||');
          function h2hFor(a,b){let aWins=0,bWins=0,ties=0,last=null;for(const g of gamesByTeam.get(a)||[]){if(g.opponentTeam!==b)continue;if(g.result==='W')aWins++;else if(g.result==='L')bWins++;else ties++;if(!last||dateStamp(g.date)>dateStamp(last.date))last=g}return{aWins,bWins,ties,meetings:aWins+bWins+ties,lastMeeting:last?{date:last.date,aScore:last.teamScore,bScore:last.opponentScore,result:last.result}:null}}
          function commonFor(a,b){const sa=featureMap[a]?.seasonUsed,sb=featureMap[b]?.seasonUsed;if(!sa||!sb)return{season:null,difference:0,rows:[]};const season=Math.min(sa,sb),mapA=new Map(),mapB=new Map();for(const g of seasonGames(a,season))if(g.opponentTeam)mapA.set(g.opponentTeam,g);for(const g of seasonGames(b,season))if(g.opponentTeam)mapB.set(g.opponentTeam,g);const rows=[];for(const[opp,g1]of mapA.entries()){const g2=mapB.get(opp);if(!g2)continue;const diff=(g1.teamScore-g1.opponentScore)-(g2.teamScore-g2.opponentScore);rows.push({opponent:opp,aResult:fmtGame(g1),bResult:fmtGame(g2),diff})}rows.sort((x,y)=>x.opponent.localeCompare(y.opponent));return{season,difference:rows.reduce((s,r)=>s+r.diff,0),rows}}
          const names=teams.map(t=>t.team).sort((a,b)=>a.localeCompare(b)),pairs={};
          for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++){const a=names[i],b=names[j],h=h2hFor(a,b),c=commonFor(a,b);if(h.meetings||c.rows.length)pairs[pairKey(a,b)]={a,b,h2h:h,common:c}}
          fs.writeFileSync('simulator-data.json',JSON.stringify({teams:featureMap,pairs}));
          console.log(`Simulator teams: ${names.length}`);console.log(`Pair context rows: ${Object.keys(pairs).length}`);

          // Cache-bust the Sheet export so recent row deletions/edits do not linger in the generated weekly feed.
          function csvUrl(gid,range){return `https://docs.google.com/spreadsheets/d/${process.env.SHEET_ID}/export?format=csv&gid=${gid}&range=${encodeURIComponent(range)}&_rus=${Date.now()}`}
          function parseCSV(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else{if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field=''}else field+=c}}if(field.length||row.length){row.push(field.replace(/\r$/,''));rows.push(row)}return rows}
          const res=await fetch(csvUrl(process.env.WEEKLY_GID,'A1:K1000'),{cache:'no-store'});if(!res.ok)throw new Error(`Weekly Simulation download failed: ${res.status}`);const rows=parseCSV(await res.text()),weekly=[];
          for(const r of rows.slice(1)){if(!clean(r[1])||!clean(r[2]))continue;weekly.push({date:clean(r[0]),awayTeam:clean(r[1]),homeTeam:clean(r[2]),awayScore:n(r[3]),homeScore:n(r[4]),winner:clean(r[5]),actualAway:n(r[7]),actualHome:n(r[8]),actualWinner:clean(r[9]),wl:clean(r[10])})}
          const normalized=normalizeWeeklyGames(weekly);
          // Verified schedule changes that must survive every sheet rebuild.
          for(const g of weekly){
            if(clean(g.awayTeam).toUpperCase()==='WEBER'&&clean(g.homeTeam).toUpperCase()==='ROY'&&clean(g.date)==='8/28/2026')g.date='8/27/2026';
            if(clean(g.awayTeam).toUpperCase()==='UMA-LEHI'&&clean(g.homeTeam).toUpperCase()==='SAINT JOSEPH'&&clean(g.date)==='8/28/2026')g.date='8/31/2026';
          }
          const manualCorrections = JSON.parse(fs.readFileSync('manual-scoreboard-corrections-2026.json','utf8'));
          const dateKey = value => {
            const s = clean(value);
            let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (m) return m[3] + '-' + String(m[1]).padStart(2, '0') + '-' + String(m[2]).padStart(2, '0');
            m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
            return m ? m[1] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[3]).padStart(2, '0') : s;
          };
          for (const correction of manualCorrections) {
            if (!correction.finalScore) continue;
            const targetDate = dateKey(correction.scheduledDate || correction.date);
            const awayKeys = new Set((correction.awayKeys || []).map(norm));
            const homeKeys = new Set((correction.homeKeys || []).map(norm));
            const matches = weekly.filter(g =>
              dateKey(g.date) === targetDate &&
              awayKeys.has(norm(g.awayTeam)) &&
              homeKeys.has(norm(g.homeTeam))
            );
            if (matches.length !== 1) {
              if (matches.length > 1) console.warn('Skipped ambiguous manual weekly final: ' + targetDate);
              continue;
            }
            const g = matches[0];
            const away = Number(correction.finalScore.away);
            const home = Number(correction.finalScore.home);
            if (!Number.isFinite(away) || !Number.isFinite(home)) continue;
            g.actualAway = away;
            g.actualHome = home;
            g.actualWinner = away === home ? 'TIE' : away > home ? g.awayTeam : g.homeTeam;
            g.wl = away === home ? 'T' : g.actualWinner === g.awayTeam ? 'W' : 'L';
            console.log('Applied manual weekly final: ' + g.awayTeam + ' ' + away + '-' + home + ' ' + g.homeTeam);
          }

          fs.writeFileSync('weekly-simulation.json',JSON.stringify({games:weekly}));console.log(`Weekly simulation games: ${weekly.length}; normalized team fields: ${normalized}`);
          NODE

      - name: Validate simulator data before publish
        run: node scripts/audit-football-data.mjs

      - name: Commit simulator data
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- simulator-data.json weekly-simulation.json)" ]; then
            echo "Simulator data is already current."
            exit 0
          fi
          git add simulator-data.json weekly-simulation.json
          git commit -m "Auto-sync simulator data"
          ok=0
          for attempt in 1 2 3 4; do
            if git push; then
              ok=1
              break
            fi
            git pull --rebase -X theirs origin main || { git rebase --abort || true; exit 1; }
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi
