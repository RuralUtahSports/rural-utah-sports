name: Update Custom Logo Directory

on:
  push:
    paths:
      - '.github/workflows/update-custom-logo-directory.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point school directory at custom logos
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          logos = {
            'GREEN CANYON':'school-logos/green-canyon.svg',
            'HILLCREST':'school-logos/hillcrest.svg',
            'KEARNS':'school-logos/kearns.svg',
            'LAYTON CHRISTIAN':'school-logos/layton-christian.svg',
            'LONE PEAK':'school-logos/lone-peak.svg',
            'MAPLE MOUNTAIN':'school-logos/maple-mountain.svg',
            'MILFORD':'school-logos/milford.svg',
            'MILLARD':'school-logos/millard.svg',
            'MORGAN':'school-logos/morgan.svg',
            'OREM':'school-logos/orem.svg',
            'PROVIDENCE HALL':'school-logos/providence-hall.svg',
            'RICH':'school-logos/rich.svg',
            'SAN JUAN':'school-logos/san-juan.svg',
            'VIEWMONT':'school-logos/viewmont.svg'
          }

          p = Path('school-directory.json')
          data = json.loads(p.read_text())
          missing = []
          changed = []
          for school, path in logos.items():
              if school not in data:
                  missing.append(school)
                  continue
              if data[school].get('logoUrl') != path:
                  data[school]['logoUrl'] = path
                  changed.append(school)
          if missing:
              raise SystemExit('Missing school-directory keys: ' + ', '.join(missing))
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          print('Updated school-directory logos:', ', '.join(changed))

          # Also replace any selected old UHSAA logo URLs hard-coded elsewhere.
          old_urls = {
            'https://www.uhsaa.org/Logos/portfolio150/Green%20Canyon.png':'school-logos/green-canyon.svg',
            'https://www.uhsaa.org/Logos/portfolio150/Hillcrest.png':'school-logos/hillcrest.svg',
            'https://www.uhsaa.org/Logos/portfolio150/Kearns.png':'school-logos/kearns.svg',
            'https://www.uhsaa.org/Logos/portfolio150/Layton%20Christian%20Academy.png':'school-logos/layton-christian.svg',
            'https://www.uhsaa.org/Logos/portfolio150/Lone%20Peak.png':'school-logos/lone-peak.svg',
            'https://www.uhsaa.org/Logos/portfolio150/Maple%20Mountain.png':'school-logos/maple-mountain.svg',
            'https://www.uhsaa.org/Logos/portfolio150/Milford.png':'school-logos/milford.svg',
            'https://www.uhsaa.org/Logos/portfolio150/Millard.png':'school-logos/millard.svg',
            'https://www.uhsaa.org/Logos/portfolio150/Morgan.png':'school-logos/morgan.svg',
            'https://www.uhsaa.org/Logos/portfolio150/Orem.png':'school-logos/orem.svg',
            'https://www.uhsaa.org/Logos/portfolio150/Providence%20Hall.png':'school-logos/providence-hall.svg',
            'https://www.uhsaa.org/Logos/portfolio150/Rich.png':'school-logos/rich.svg',
            'https://www.uhsaa.org/Logos/portfolio150/San%20Juan.png':'school-logos/san-juan.svg',
            'https://www.uhsaa.org/Logos/portfolio150/Viewmont.png':'school-logos/viewmont.svg'
          }
          for fp in Path('.').rglob('*'):
              if not fp.is_file() or fp.suffix.lower() not in {'.html','.js','.json'} or fp == p:
                  continue
              try:
                  s = fp.read_text()
              except Exception:
                  continue
              ns = s
              for old, new in old_urls.items():
                  ns = ns.replace(old, new)
              if ns != s:
                  fp.write_text(ns)
                  print('Updated hard-coded logo refs in', fp)
          PY
      - name: Commit sitewide logo references
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add school-directory.json '*.html' '*.js' '*.json' || true
          git add -u
          git commit -m 'Use custom school logos across site data'
          git push
