name: Normalize Wasatch Academy
on:
  push:
    paths:
      - '.github/workflows/normalize-wasatch-academy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch games alias normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('games.html')
          s=p.read_text(encoding='utf-8')
          old="function canonicalTeam(v){const name=String(v??'').trim();return TEAM_ALIASES[norm(name)]||name}"
          new="function canonicalTeam(v){const name=String(v??'').trim(),n=norm(name).replace(/\\.+$/,'').trim();if(n.startsWith('WASATCH ACAD'))return 'WASATCH ACADEMY';return TEAM_ALIASES[n]||name}"
          if old not in s:
              raise SystemExit('canonicalTeam marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -F "startsWith('WASATCH ACAD')" games.html
      - name: Commit
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add games.html
          git commit -m "Normalize all Wasatch Academy name variants"
          git pull --rebase origin main
          git push
