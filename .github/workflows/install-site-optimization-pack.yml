name: Install Site Optimization Pack

on:
  push:
    paths:
      - '.github/workflows/install-site-optimization-pack.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install optimization pack
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json, html

          VERSION = '20260817-opt1'
          ROOT = 'https://ruralutahsports.github.io/rural-utah-sports/'

          # ---------- PWA ----------
          manifest = {
              'name': 'Rural Utah Sports',
              'short_name': 'RUS',
              'description': 'Utah high school sports history, scores, rankings and data.',
              'start_url': './index.html',
              'scope': './',
              'display': 'standalone',
              'orientation': 'any',
              'background_color': '#050505',
              'theme_color': '#F14D07',
              'icons': [
                  {'src': 'RUSlogoNew.png', 'sizes': 'any', 'type': 'image/png', 'purpose': 'any'}
              ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest, indent=2) + '\n')

          Path('pwa.js').write_text(r'''(()=>{
          'use strict';
          const head=document.head;
          function meta(name,content){if(document.querySelector(`meta[name="${name}"]`))return;const m=document.createElement('meta');m.name=name;m.content=content;head.appendChild(m)}
          if(!document.querySelector('link[rel="manifest"]')){const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest?v=20260817-opt1';head.appendChild(l)}
          if(!document.querySelector('link[rel="apple-touch-icon"]')){const l=document.createElement('link');l.rel='apple-touch-icon';l.href='RUSlogoNew.png';head.appendChild(l)}
          meta('theme-color','#F14D07');meta('apple-mobile-web-app-capable','yes');meta('apple-mobile-web-app-status-bar-style','black-translucent');meta('apple-mobile-web-app-title','RUS');
          if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=20260817-opt1').catch(err=>console.warn('RUS service worker registration failed',err)),{once:true})}
          })();
          ''')

          Path('sw.js').write_text(r'''const CACHE='rus-site-20260817-opt1';
          const CORE=['./','./index.html','./teams.html','./scoreboard.html','./rankings.html','./standings.html','./RUSlogoNew.png','./nav-menu.js','./mobile-shell.js','./app-shell-polish.js'];
          const LIVE=/(weekly-simulation|deseret|live-|scoreboard|standings-2026|2026\.json|playoff-picture)/i;
          self.addEventListener('install',event=>{event.waitUntil(caches.open(CACHE).then(cache=>Promise.allSettled(CORE.map(x=>cache.add(x)))).then(()=>self.skipWaiting()))});
          self.addEventListener('activate',event=>{event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});
          async function networkFirst(req){const cache=await caches.open(CACHE);try{const res=await fetch(req);if(res&&res.ok)cache.put(req,res.clone());return res}catch(err){const hit=await cache.match(req);if(hit)return hit;throw err}}
          async function staleWhileRevalidate(req){const cache=await caches.open(CACHE);const hit=await cache.match(req);const fresh=fetch(req).then(res=>{if(res&&res.ok)cache.put(req,res.clone());return res}).catch(()=>null);return hit||await fresh||Response.error()}
          async function cacheFirst(req){const cache=await caches.open(CACHE);const hit=await cache.match(req);if(hit)return hit;const res=await fetch(req);if(res&&res.ok)cache.put(req,res.clone());return res}
          self.addEventListener('fetch',event=>{const req=event.request;if(req.method!=='GET')return;const url=new URL(req.url);if(url.origin!==location.origin)return;if(req.mode==='navigate'||LIVE.test(url.pathname)){event.respondWith(networkFirst(req));return}if(/\.(?:png|jpg|jpeg|webp|svg|ico)$/i.test(url.pathname)){event.respondWith(cacheFirst(req));return}event.respondWith(staleWhileRevalidate(req))});
          ''')

          # ---------- Universal search ----------
          Path('site-search.js').write_text(r'''(()=>{
          'use strict';
          if(window.__RUS_SITE_SEARCH__)return;window.__RUS_SITE_SEARCH__=true;
          const pages=[
          ['Home','index.html','Home'],['Teams','teams.html','Football'],['Games','games.html','Football'],['Scoreboard','scoreboard.html','Football'],['Rankings','rankings.html','Football'],['Standings','standings.html','Football'],['Stat Leaders','stat-leaders.html','Stats'],['Team Stats','team-stats.html','Stats'],['MVP Race','mvp-race.html','Stats'],['All-Utah Team','all-utah.html','Stats'],['All-State & Region Watch','all-state-watch.html','Stats'],['Storylines','storylines.html','Football'],['ELO','elo.html','Analytics'],['Playoff Picture','playoff-picture.html','Analytics'],['Upset Tracker','upsets.html','Analytics'],['Scorigami','scorigami.html','Analytics'],['Out of State','out-of-state.html','Analytics'],['Fantasy Football','fantasy-football.html','Analytics'],['Team Comparison','compare.html','Analytics'],['Player Comparison','player-compare.html','Analytics'],['Football Map','map.html','Analytics'],['Championships','championships.html','History'],['Season Explorer','season.html','History'],['Past Season Rankings','historical-rankings.html','History'],['Program Leaderboard','programs.html','History'],['Active Streaks','streaks.html','History'],['Milestone Watch','milestones.html','History'],['Rivalry Hub','rivalry.html','History'],['Dynasty Explorer','dynasty.html','History'],['History Lab','history-lab.html','History'],['Greatest Seasons','greatest-seasons.html','History'],['Records','records.html','History'],['Simulators','simulators.html','Simulators'],['Promotion / Relegation','promotion-relegation.html','Simulators']
          ];
          let layer,input,results,teamPromise,gamePromise;
          const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
          const norm=v=>String(v??'').trim().toLowerCase();
          const isoDate=v=>{const d=new Date(v);if(!Number.isFinite(d.getTime()))return'';return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
          function addStyles(){if(document.getElementById('rus-search-style'))return;const s=document.createElement('style');s.id='rus-search-style';s.textContent=`
          .rus-search-trigger{appearance:none;margin-left:auto;width:auto;min-height:44px;padding:0 13px;border:1px solid #383838;border-radius:12px;background:#171717;color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;font:900 11px Arial,sans-serif;text-transform:uppercase;cursor:pointer}.rus-search-trigger svg{width:20px;height:20px;fill:none;stroke:#F14D07;stroke-width:2.2}.rus-favorites-button{margin-left:0!important}.rus-search-layer{position:fixed;inset:0;z-index:2147483400;background:rgba(0,0,0,.78);display:none;align-items:flex-start;justify-content:center;padding:8dvh 14px 20px}.rus-search-layer.open{display:flex}.rus-search-panel{width:min(720px,100%);max-height:82dvh;overflow:hidden;background:#101010;border:1px solid #3a3a3a;border-top:5px solid #F14D07;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.65);display:flex;flex-direction:column}.rus-search-head{display:flex;gap:8px;padding:12px;border-bottom:1px solid #2c2c2c}.rus-search-input{flex:1;min-width:0;height:48px;background:#1a1a1a;color:#fff;border:1px solid #444;border-radius:9px;padding:0 14px;font-size:16px;font-weight:800;outline:none}.rus-search-input:focus{border-color:#F14D07}.rus-search-close{width:48px;height:48px;border-radius:9px;border:1px solid #444;background:#1a1a1a;color:#fff;font-size:25px}.rus-search-results{overflow:auto;padding:8px}.rus-search-result{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:center;text-decoration:none;color:#fff;border:1px solid transparent;border-radius:9px;padding:11px 12px}.rus-search-result:hover,.rus-search-result:focus{background:#1b1b1b;border-color:#353535;outline:none}.rus-search-result b{display:block;font-size:14px}.rus-search-result small{display:block;color:#888;font-size:10px;margin-top:3px}.rus-search-type{color:#F14D07;font-size:9px;font-weight:900;text-transform:uppercase}.rus-search-empty{padding:28px 14px;text-align:center;color:#888;font-size:12px}.rus-search-hint{padding:8px 13px 12px;color:#666;font-size:10px;border-top:1px solid #242424}
          @media(max-width:700px){.rus-search-trigger{width:46px;height:46px;padding:0;border-radius:12px}.rus-search-trigger span{display:none}.rus-search-layer{padding-top:4dvh}.rus-search-panel{max-height:90dvh}}
          `;document.head.appendChild(s)}
          async function teams(){return teamPromise||(teamPromise=fetch('teams-data.json').then(r=>r.ok?r.json():[]).catch(()=>[]))}
          async function games(){return gamePromise||(gamePromise=fetch('weekly-simulation.json').then(r=>r.ok?r.json():{}).then(x=>x.games||[]).catch(()=>[]))}
          function pageHits(q){return pages.filter(([name,,group])=>norm(name+' '+group).includes(q)).map(([name,href,group])=>({name,href,type:'Page',meta:group,score:norm(name).startsWith(q)?0:3}))}
          async function search(q){q=norm(q);if(!q){render(pages.slice(0,9).map(([name,href,group])=>({name,href,type:'Quick Link',meta:group,score:0})));return}const [ts,gs]=await Promise.all([teams(),games()]);const out=pageHits(q);for(const t of ts){const name=String(t?.team||'');if(norm(name).includes(q))out.push({name,href:`team.html?team=${encodeURIComponent(name)}`,type:'Team',meta:[t.classification,t.region].filter(Boolean).join(' • '),score:norm(name).startsWith(q)?0:1})}for(const g of gs){const away=String(g?.awayTeam||''),home=String(g?.homeTeam||''),hay=norm(`${away} ${home}`);if(hay.includes(q)){const d=isoDate(g.date);out.push({name:`${away} at ${home}`,href:`game.html?${new URLSearchParams({date:d,away,home})}`,type:'Game',meta:d||String(g.date||''),score:2})}}out.sort((a,b)=>a.score-b.score||a.name.localeCompare(b.name));render(out.slice(0,18))}
          function render(items){results.innerHTML=items.length?items.map(x=>`<a class="rus-search-result" href="${esc(x.href)}"><span><b>${esc(x.name)}</b><small>${esc(x.meta||'')}</small></span><span class="rus-search-type">${esc(x.type)}</span></a>`).join(''):'<div class="rus-search-empty">No matching teams, games or pages.</div>'}
          function open(){layer.classList.add('open');document.body.style.overflow='hidden';input.value='';search('');requestAnimationFrame(()=>input.focus())}
          function close(){layer.classList.remove('open');document.body.style.overflow=''}
          function build(){addStyles();const head=document.querySelector('header .header-content');if(!head)return;const b=document.createElement('button');b.type='button';b.className='rus-search-trigger';b.setAttribute('aria-label','Search Rural Utah Sports');b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg><span>Search</span>';const fav=head.querySelector('.rus-favorites-button');fav?head.insertBefore(b,fav):head.appendChild(b);layer=document.createElement('div');layer.className='rus-search-layer';layer.setAttribute('aria-hidden','true');layer.innerHTML='<div class="rus-search-panel" role="dialog" aria-modal="true" aria-label="Site search"><div class="rus-search-head"><input class="rus-search-input" type="search" autocomplete="off" placeholder="Search teams, games, pages…"><button class="rus-search-close" type="button" aria-label="Close search">×</button></div><div class="rus-search-results"></div><div class="rus-search-hint">Search Rural Utah Sports • Press / to open on desktop</div></div>';document.body.appendChild(layer);input=layer.querySelector('.rus-search-input');results=layer.querySelector('.rus-search-results');let timer;b.addEventListener('click',open);layer.querySelector('.rus-search-close').addEventListener('click',close);layer.addEventListener('click',e=>{if(e.target===layer)close()});input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>search(input.value),90)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&layer.classList.contains('open'))close();if(e.key==='/'&&!layer.classList.contains('open')&&!/input|textarea|select/i.test(document.activeElement?.tagName||'')){e.preventDefault();open()}})}
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',build,{once:true});else build();
          })();
          ''')

          # ---------- Personalized My Teams home section ----------
          Path('home-my-teams.js').write_text(r'''(()=>{
          'use strict';
          if((location.pathname.split('/').pop()||'index.html').toLowerCase()!=='index.html')return;
          const KEY='rus:favorites:v1';
          const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
          function favoriteTeams(){let list=[];try{list=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}const seen=new Set(),out=[];for(const f of Array.isArray(list)?list:[]){try{const u=new URL(f.href,location.href);if(!u.pathname.toLowerCase().endsWith('/team.html')&&!u.pathname.toLowerCase().endsWith('team.html'))continue;const team=(u.searchParams.get('team')||'').trim();const k=team.toUpperCase();if(team&&!seen.has(k)){seen.add(k);out.push(team)}}catch{}}return out}
          const dateVal=v=>{const t=Date.parse(String(v||''));return Number.isFinite(t)?t:0};
          function matchup(g,team){const home=String(g.homeTeam||''),away=String(g.awayTeam||''),isHome=home.toUpperCase()===team.toUpperCase(),opp=isHome?away:home;return `${isHome?'vs':'at'} ${opp}`}
          function gameText(g,team){if(!g)return'No scheduled game found';const d=dateVal(g.date),when=d?new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric'}):String(g.date||'TBA'),a=Number(g.actualAway),h=Number(g.actualHome),done=Number.isFinite(a)&&Number.isFinite(h);if(!done)return`Next • ${when} • ${matchup(g,team)}`;const isAway=String(g.awayTeam||'').toUpperCase()===team.toUpperCase(),us=isAway?a:h,them=isAway?h:a,res=us===them?'T':us>them?'W':'L';return`Last • ${res} ${us}-${them} • ${matchup(g,team)}`}
          function style(){if(document.getElementById('rus-my-teams-style'))return;const s=document.createElement('style');s.id='rus-my-teams-style';s.textContent=`.rus-my-teams{background:#090909;border:1px solid #333;border-top:5px solid #F14D07;border-radius:10px;padding:20px;margin:0 0 30px}.rus-my-teams-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.rus-my-teams-head h2{font-size:24px;text-transform:uppercase}.rus-my-teams-head a{color:#F14D07;text-decoration:none;font-size:10px;font-weight:900;text-transform:uppercase}.rus-my-teams-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.rus-my-team-card{position:relative;overflow:hidden;background:#151515;border:1px solid #333;border-radius:9px;padding:14px;color:#fff;text-decoration:none}.rus-my-team-card:before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:var(--team,#F14D07)}.rus-my-team-card b{display:block;font-size:16px;margin:3px 0 6px}.rus-my-team-meta,.rus-my-team-game{display:block;color:#8e8e8e;font-size:10px;line-height:1.4}.rus-my-team-game{color:#ddd;margin-top:8px}.rus-my-team-empty{color:#999;font-size:12px;line-height:1.55}.rus-my-team-empty a{color:#F14D07;font-weight:900}@media(max-width:850px){.rus-my-teams-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.rus-my-teams{padding:15px}.rus-my-teams-grid{grid-template-columns:1fr}}`;document.head.appendChild(s)}
          async function build(){style();const after=document.querySelector('.this-week'),main=document.querySelector('main');if(!main)return;const section=document.createElement('section');section.className='rus-my-teams';section.innerHTML='<div class="rus-my-teams-head"><h2>My Teams</h2><a href="teams.html">Browse Teams →</a></div><div class="rus-my-teams-grid"><div class="rus-my-team-empty">Loading your favorite teams…</div></div>';after?after.insertAdjacentElement('afterend',section):main.prepend(section);const names=favoriteTeams(),grid=section.querySelector('.rus-my-teams-grid');if(!names.length){grid.innerHTML='<div class="rus-my-team-empty">Favorite a team page with the <strong>☆</strong> button and it will show up here with its next game and quick team info. <a href="teams.html">Find a team →</a></div>';return}const [teams,weekly]=await Promise.all([fetch('teams-data.json').then(r=>r.ok?r.json():[]).catch(()=>[]),fetch('weekly-simulation.json').then(r=>r.ok?r.json():{}).catch(()=>({}))]);const map=new Map(teams.map(t=>[String(t.team||'').toUpperCase(),t])),games=weekly.games||[],now=Date.now();grid.innerHTML=names.slice(0,9).map(name=>{const t=map.get(name.toUpperCase())||{},mine=games.filter(g=>String(g.awayTeam||'').toUpperCase()===name.toUpperCase()||String(g.homeTeam||'').toUpperCase()===name.toUpperCase()).sort((a,b)=>dateVal(a.date)-dateVal(b.date)),next=mine.find(g=>dateVal(g.date)>=now)||[...mine].reverse().find(Boolean),color=/^#[0-9a-f]{6}$/i.test(String(t.backgroundColor||''))?t.backgroundColor:'#F14D07',record=[t.wins,t.losses,t.ties].every(v=>v!==undefined)?`${Number(t.wins||0)}-${Number(t.losses||0)}-${Number(t.ties||0)} all-time`:'';return`<a class="rus-my-team-card" style="--team:${esc(color)}" href="team.html?team=${encodeURIComponent(name)}"><b>${esc(name)}</b><span class="rus-my-team-meta">${esc([t.classification,t.region,record].filter(Boolean).join(' • '))}</span><span class="rus-my-team-game">${esc(gameText(next,name))}</span></a>`}).join('')}
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',build,{once:true});else build();
          })();
          ''')

          # ---------- Shared performance + desktop/loading polish ----------
          Path('optimization-polish.js').write_text(r'''(()=>{
          'use strict';
          if(document.getElementById('rus-optimization-polish'))return;const s=document.createElement('style');s.id='rus-optimization-polish';s.textContent=`
          :focus-visible{outline:2px solid #F14D07!important;outline-offset:2px!important}html{scrollbar-color:#4a4a4a #0a0a0a}.loading{position:relative;overflow:hidden}.loading:after{content:'';position:absolute;inset:0;transform:translateX(-105%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.055),transparent);animation:rusLoad 1.35s ease-in-out infinite;pointer-events:none}@keyframes rusLoad{to{transform:translateX(105%)}}
          @media(min-width:901px){body>main.container,.container{width:min(calc(100% - 40px),1440px);margin-left:auto;margin-right:auto}header .header-content{max-width:1440px}.page-title{letter-spacing:.2px}.filters,.filter-panel,.controls,.toolbar{box-shadow:0 10px 26px rgba(0,0,0,.18)}table th{position:relative}.team-card,.card,.game,.summary,.summary-card{will-change:transform}}
          @media(max-width:700px){button,a,select,input{min-touch-target-size:44px}.container{width:100%!important}}
          @media(prefers-reduced-motion:reduce){.loading:after{animation:none}}
          `;document.head.appendChild(s);const prep=root=>root.querySelectorAll?.('main img:not(.logo):not([loading])').forEach(img=>{img.loading='lazy';img.decoding='async'});prep(document);const o=new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1){if(n.matches?.('main img:not(.logo):not([loading])')){n.loading='lazy';n.decoding='async'}prep(n)}})));o.observe(document.body,{childList:true,subtree:true});
          })();
          ''')

          # ---------- Scoreboard: projected margin (RUS Line), not wagering odds ----------
          sbp=Path('scoreboard.html')
          sb=sbp.read_text()
          sb=sb.replace('RUS predictions with live/final scores, quarter-by-quarter box scores, scoring plays and available game stats. Live games only display verified reported scores.','RUS projected lines with live/final scores, quarter-by-quarter box scores, scoring plays and available game stats. Live games only display verified reported scores.')
          if 'class="rus-line-note"' not in sb:
              sb=sb.replace('</p>\n<div id="summary" class="summary-grid">','</p>\n<p class="rus-line-note">RUS Line is a model-projected margin, not a sportsbook or wagering line.</p>\n<div id="summary" class="summary-grid">',1)
          if '.rus-line-note{' not in sb:
              sb=sb.replace('.subtitle{color:#aaa;line-height:1.5;margin:8px 0 20px}', '.subtitle{color:#aaa;line-height:1.5;margin:8px 0 8px}.rus-line-note{color:#777;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.25px;margin:0 0 20px}',1)
          if 'function rusLine(g)' not in sb:
              helper="function rusLine(g){const a=Number(g.awayScore),h=Number(g.homeScore);if(!Number.isFinite(a)||!Number.isFinite(h))return'RUS Line: —';if(a===h)return'RUS Line: PK';const favorite=a>h?g.awayTeam:g.homeTeam,margin=Math.abs(a-h);return`RUS Line: ${favorite} -${Number.isInteger(margin)?margin:margin.toFixed(1)}`}\n"
              sb=sb.replace('function teamBlock(name,score,pred,showPred,isWinner)',helper+'function teamBlock(name,score,pred,showPred,isWinner)',1)
          sb=sb.replace('${showPred?`<div class="pred">Pred<b>${pred??\'—\'}</b></div>`:\'\'}','')
          sb=sb.replace("${o?`RUS Pick: ${o}`:showPred?'RUS Prediction':''}","${o?`RUS Pick: ${o}`:showPred?rusLine(g):''}")
          sb=sb.replace("${showPred?`<span>Predicted winner: <strong>${esc(g.winner||'—')}</strong></span>`:''}",'')
          sbp.write_text(sb)

          # ---------- Shared nav loader ----------
          navp=Path('nav-menu.js');nav=navp.read_text()
          nav=re.sub(r"addScript\('mobile-top-nav\.js\?v=[^']*','rusMobileTopNav',true\);",'',nav)
          nav=re.sub(r"mobile-shell\.js\?v=[^']*",'mobile-shell.js?v=20260817-opt1',nav)
          if "pwa.js?v=20260817-opt1" not in nav:
              nav=nav.replace('  function loadExtras(){\n',"  function loadExtras(){\n    addScript('pwa.js?v=20260817-opt1','rusPwa',true);addScript('site-search.js?v=20260817-opt1','rusSiteSearch',true);addScript('optimization-polish.js?v=20260817-opt1','rusOptimizationPolish',true);\n",1)
          if "home-my-teams.js?v=20260817-opt1" not in nav:
              nav=nav.replace("if(path==='index.html'){", "if(path==='index.html'){addScript('home-my-teams.js?v=20260817-opt1','rusHomeMyTeams',true);",1)
          navp.write_text(nav)

          # ---------- Root-page script cleanup + PWA + share metadata ----------
          nav_re=re.compile(r'\s*<script\b[^>]*\bsrc=["\']nav-menu\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>',re.I)
          top_re=re.compile(r'\s*<script\b[^>]*\bsrc=["\']mobile-top-nav\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>',re.I)
          for p in Path('.').glob('*.html'):
              t=p.read_text()
              t=nav_re.sub('',t)
              t=top_re.sub('',t)
              head=[]
              if 'rel="manifest"' not in t and "rel='manifest'" not in t:
                  head.append(f'<link rel="manifest" href="manifest.webmanifest?v={VERSION}">')
              if 'name="theme-color"' not in t and "name='theme-color'" not in t:
                  head.append('<meta name="theme-color" content="#F14D07">')
              if 'rel="apple-touch-icon"' not in t and "rel='apple-touch-icon'" not in t:
                  head.append('<link rel="apple-touch-icon" href="RUSlogoNew.png">')
              title_match=re.search(r'<title>(.*?)</title>',t,re.I|re.S)
              title=re.sub(r'\s+',' ',title_match.group(1)).strip() if title_match else 'Rural Utah Sports'
              page_name=title.split('|')[0].strip() or 'Rural Utah Sports'
              desc=f'{page_name} from Rural Utah Sports — Utah high school football history, scores, rankings and data.'
              if not re.search(r'<meta\s+name=["\']description["\']',t,re.I):
                  head.append(f'<meta name="description" content="{html.escape(desc,quote=True)}">')
              if not re.search(r'<meta\s+property=["\']og:title["\']',t,re.I):
                  head.append(f'<meta property="og:title" content="{html.escape(title,quote=True)}">')
              if not re.search(r'<meta\s+property=["\']og:description["\']',t,re.I):
                  head.append(f'<meta property="og:description" content="{html.escape(desc,quote=True)}">')
              if not re.search(r'<meta\s+property=["\']og:type["\']',t,re.I):
                  head.append('<meta property="og:type" content="website">')
              if not re.search(r'<meta\s+property=["\']og:url["\']',t,re.I):
                  head.append(f'<meta property="og:url" content="{ROOT}{p.name}">')
              if not re.search(r'<meta\s+property=["\']og:image["\']',t,re.I):
                  head.append(f'<meta property="og:image" content="{ROOT}RUSlogoNew.png">')
              if not re.search(r'<meta\s+name=["\']twitter:card["\']',t,re.I):
                  head.append('<meta name="twitter:card" content="summary_large_image">')
              if head and '</head>' in t:
                  t=t.replace('</head>','\n'+'\n'.join(head)+'\n</head>',1)
              script=f'<script src="nav-menu.js?v={VERSION}" defer></script>'
              if '</body>' in t:t=t.replace('</body>',script+'\n</body>',1)
              p.write_text(t)

          # Remove this installer after it has done its job.
          Path('.github/workflows/install-site-optimization-pack.yml').unlink(missing_ok=True)
          PY

      - name: Commit optimization pack
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Optimization pack already installed."
          else
            git commit -m "Install site optimization pack"
            git pull --rebase origin main
            git push
          fi
