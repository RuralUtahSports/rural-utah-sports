name: Add Share Graphic Buttons

on:
  push:
    paths:
      - '.github/workflows/add-share-graphic-buttons.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add share graphic exporter to key pages
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['awards-2025.html','standings.html','scoreboard.html','rankings.html']
          tag='<script src="share-graphic.js?v=20260815a" defer></script>'
          changed=[]
          for name in files:
              p=Path(name)
              if not p.exists():
                  print('Missing',name);continue
              s=p.read_text()
              if 'share-graphic.js' in s:
                  continue
              if '</body>' in s:
                  s=s.replace('</body>',tag+'\n</body>',1)
              else:
                  s += '\n'+tag+'\n'
              p.write_text(s)
              changed.append(name)
          print('Updated:',*changed,sep='\n')
          PY
      - name: Commit share graphic integration
        run: |
          if git diff --quiet -- awards-2025.html standings.html scoreboard.html rankings.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add awards-2025.html standings.html scoreboard.html rankings.html
          git commit -m 'Add share graphic buttons to awards standings scoreboard rankings'
          git push
