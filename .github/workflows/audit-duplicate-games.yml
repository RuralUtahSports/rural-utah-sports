name: Audit Duplicate Games
on:
  push:
    paths:
      - '.github/workflows/audit-duplicate-games.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit conflicting source rows and final Scorigami
        env:
          SHEET_ID: 1IHr84tlMdZVAazLDh0HV7ZWoxNH4UpjpLt_UTV8KZwo
          GID: 627882418
        run: |
          node <<'NODE'
          const fs=require('fs'),url=`https://docs.google.com/spreadsheets/d/${process.env.SHEET_ID}/export?format=csv&gid=${process.env.GID}&range=${encodeURIComponent('A1:F50000')}`;
          function csv(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'){r.push(f.replace(/\r$/,''));rows.push(r);r=[];f=''}else f+=c}return rows}
          const clean=v=>String(v??'').trim(),norm=v=>clean(v).replace(/\s+/g,' ').toUpperCase().replace(/\.+$/,'').trim();
          const aliases={'GUNNISON':'GUNNISON VALLEY','MAPLE MTN':'MAPLE MOUNTAIN','MONUMENT VAL':'MONUMENT VALLEY','CEDAR':'CEDAR CITY','SUMMIT':'SUMMIT ACADEMY','HINKLEY':'HINCKLEY','BY HIGH':'BYH','BRIGHAM YOUNG':'BYH'};
          function team(v){const n=norm(v);if(n.startsWith('WASATCH ACAD'))return'WASATCH ACADEMY';return aliases[n]||n}
          function sig(a,sa,b,sb){return [[a,+sa],[b,+sb]].sort((x,y)=>x[0].localeCompare(y[0])).map(x=>x.join(':')).join('|')}
          (async()=>{const res=await fetch(url),rows=csv(await res.text()).slice(1),groups=new Map();for(let i=0;i<rows.length;i++){const r=rows[i],date=clean(r[0]),a=team(r[1]),b=team(r[2]),sa=Number(r[3]),sb=Number(r[4]);if(!date||!a||!b||!Number.isFinite(sa)||!Number.isFinite(sb))continue;const k=`${date}|${[a,b].sort().join('|')}`,g={row:i+2,date,a,b,sa,sb,sig:sig(a,sa,b,sb)};(groups.get(k)||groups.set(k,[]).get(k)).push(g)}const conflicts=[...groups.values()].filter(g=>g.length>1&&new Set(g.map(x=>x.sig)).size>1);console.log('CONFLICT_GROUPS',conflicts.length);for(const g of conflicts)console.log('CONFLICT',g.map(x=>`row ${x.row} ${x.date} ${x.a} ${x.sa}-${x.sb} ${x.b}`).join(' || '));
            const d=JSON.parse(fs.readFileSync('scorigami.json','utf8')),games=d.scores.flatMap(s=>s.games||[]);const ns=games.filter(g=>[team(g.team1),team(g.team2)].sort().join('|')==='NORTH SANPETE|WASATCH ACADEMY');console.log('FINAL_NS_WASATCH_MEETINGS',ns.length);console.log('FINAL_NS_WASATCH_1970_10_30',ns.filter(g=>g.date==='10/30/1970').length);const bad=games.flatMap(g=>[g.team1,g.team2]).filter(n=>norm(n).startsWith('WASATCH ACAD')&&team(n)!=='WASATCH ACADEMY');console.log('FINAL_BAD_WASATCH_NAMES',bad.length);console.log('FINAL_SCORIGAMI_SUMMARY',JSON.stringify(d.summary));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
