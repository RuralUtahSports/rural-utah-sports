name: Rebuild Team Summaries After Dedupe

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Dedupe Team Page Rivalries
      - Sync Website Data From Google Sheet
    types:
      - completed
  push:
    paths:
      - 'scripts/schedule-known-corrections.mjs'
      - 'scripts/schedule-2024-reciprocal-date-corrections.mjs'
      - 'scripts/schedule-historical-audit-corrections.mjs'
      - 'scripts/schedule-historical-audit-corrections-2.mjs'
      - 'scripts/sanitize-team-schedules.mjs'
      - 'scripts/rebuild-team-summaries-from-schedules.mjs'
      - 'scripts/build_verified_elo_2026.mjs'
      - '.github/workflows/rebuild-team-summaries-after-dedupe.yml'

permissions:
  contents: write

concurrency:
  group: rebuild-team-summaries-after-dedupe
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Correct schedules, rebuild summaries and ELO, and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ok=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/schedule-known-corrections.mjs
            node scripts/schedule-2024-reciprocal-date-corrections.mjs
            node scripts/schedule-historical-audit-corrections.mjs
            node scripts/schedule-historical-audit-corrections-2.mjs
            node scripts/sanitize-team-schedules.mjs
            node scripts/rebuild-team-summaries-from-schedules.mjs
            node scripts/build_verified_elo_2026.mjs
            git add team-schedules.json team-record-breakdowns.json season-history.json team-page-data teams-data.json team-elo-history.json elo-summary.json elo-live-summary.json elo-game-changes-2026.json elo-cleanup-report.json
            if git diff --cached --quiet; then
              echo "Team schedules, summaries, and ELO are already clean."
              ok=1
              break
            fi
            git commit -m "Correct schedules and rebuild team summaries"
            if git push; then
              ok=1
              break
            fi
            sleep 8
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi
