name: Rebuild Team Summaries After Dedupe

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Dedupe Team Page Rivalries
      - Sync Website Data From Google Sheet
    types:
      - completed
  push:
    paths:
      - 'scripts/schedule-known-corrections.mjs'
      - 'scripts/schedule-2024-reciprocal-date-corrections.mjs'
      - 'scripts/schedule-historical-audit-corrections.mjs'
      - 'scripts/schedule-historical-audit-corrections-2.mjs'
      - 'scripts/sanitize-team-schedules.mjs'
      - 'scripts/rebuild-team-summaries-from-schedules.mjs'
      - 'scripts/build_verified_elo_2026.mjs'
      - 'scripts/enrich_playoff_notes.py'
      - '.github/workflows/rebuild-team-summaries-after-dedupe.yml'

permissions:
  contents: write

concurrency:
  group: rebuild-team-summaries-after-dedupe
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Correct schedules, rebuild summaries and ELO, restore playoff flags, and commit
        env:
          SHEET_ID: 1IHr84tlMdZVAazLDh0HV7ZWoxNH4UpjpLt_UTV8KZwo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m pip install --quiet openpyxl
          ok=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/schedule-known-corrections.mjs
            node scripts/schedule-2024-reciprocal-date-corrections.mjs
            node scripts/schedule-historical-audit-corrections.mjs
            node scripts/schedule-historical-audit-corrections-2.mjs
            node scripts/sanitize-team-schedules.mjs
            node scripts/rebuild-team-summaries-from-schedules.mjs
            node scripts/build_verified_elo_2026.mjs
            # The sanitizer intentionally synchronizes team-page schedules from the
            # canonical schedule file. Restore workbook-derived playoff notes/flags
            # after that synchronization so coach playoff records are not erased.
            python scripts/enrich_playoff_notes.py
            python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('team-page-data/ala.json').read_text(encoding='utf-8'))
          games=[g for season in (data.get('schedules') or {}).values() for g in season if g.get('playoff') is True]
          wins=sum(1 for g in games if str(g.get('result','')).upper()=='W')
          losses=sum(1 for g in games if str(g.get('result','')).upper()=='L')
          ties=sum(1 for g in games if str(g.get('result','')).upper()=='T')
          print(f'ALA playoff record after rebuild: {wins}-{losses}-{ties} ({len(games)} games)')
          assert (wins,losses,ties,len(games)) == (3,16,0,19), (
              f'Playoff flags were lost during rebuild: {wins}-{losses}-{ties} in {len(games)} games'
          )
          PY
            git add team-schedules.json team-record-breakdowns.json season-history.json team-page-data teams-data.json team-elo-history.json elo-summary.json elo-live-summary.json elo-game-changes-2026.json elo-cleanup-report.json
            if git diff --cached --quiet; then
              echo "Team schedules, summaries, ELO, and playoff flags are already clean."
              ok=1
              break
            fi
            git commit -m "Correct schedules and rebuild team summaries"
            if git push; then
              ok=1
              break
            fi
            sleep 8
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi
