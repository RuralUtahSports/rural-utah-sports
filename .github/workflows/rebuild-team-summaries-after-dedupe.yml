name: Rebuild Team Summaries After Dedupe

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Dedupe Team Page Rivalries
    types:
      - completed
  push:
    paths:
      - 'scripts/rebuild-team-summaries-from-schedules.mjs'
      - '.github/workflows/rebuild-team-summaries-after-dedupe.yml'

permissions:
  contents: write

concurrency:
  group: rebuild-team-summaries-after-dedupe
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild and commit team summary records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ok=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/rebuild-team-summaries-from-schedules.mjs
            git add teams-data.json
            if git diff --cached --quiet; then
              echo "Team summaries are already synced to cleaned schedules."
              ok=1
              break
            fi
            git commit -m "Rebuild team summaries from cleaned schedules"
            if git push; then
              ok=1
              break
            fi
            sleep 8
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi
