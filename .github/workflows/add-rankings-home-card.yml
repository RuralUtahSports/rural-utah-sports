name: Add Rankings Home Card

on:
  push:
    paths:
      - '.github/workflows/add-rankings-home-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add rankings card
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '<h3>Rankings</h3>' not in s:
              marker='<div class="card"><h3>Football Simulators</h3>'
              card='<div class="card"><h3>Rankings</h3><p>See the 2026 Rural Utah Sports football rankings for every classification, from 6A through 8-player.</p><a href="rankings.html">View Rankings</a></div>'
              if marker not in s: raise RuntimeError('simulator card marker missing')
              s=s.replace(marker,card+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: grep -q '<a href="rankings.html">View Rankings</a>' index.html
      - name: Commit
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add rankings card to homepage"
          git push
