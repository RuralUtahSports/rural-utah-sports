name: Publish 2026 playoff player statistics
on:
  pull_request:
    paths:
      - 'scripts/publish_playoff_player_stats_2026.mjs'
      - '.github/workflows/publish-playoff-player-stats-2026.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/publish_playoff_player_stats_2026.mjs'
      - '.github/workflows/publish-playoff-player-stats-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: current-football-statistics
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and recover available postseason reports
        run: |
          node --test tests/postseason-coverage-2026.test.mjs
          node scripts/merge_maxpreps_game_logs.mjs --self-test
          node scripts/publish_playoff_player_stats_2026.mjs --apply
          cp audit-output/playoff-publication-2026.json audit-output/first-pass.json
          node scripts/publish_playoff_player_stats_2026.mjs
          node -e 'const r=require("./audit-output/playoff-publication-2026.json"); if(r.gameChanged||r.shardsChanged)throw Error("Recovery must be idempotent");'
      - name: Check exact output scope
        run: |
          git diff --name-only | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{for(const p of s.trim().split("\n").filter(Boolean))if(p!=="player-game-stats-2026.json"&&!/^team-current-data\/[a-z0-9-]+\.json$/.test(p))throw Error("Unexpected change: "+p);});'
          git diff --exit-code -- region-awards-2026.lock.json regular-season-publication-2026.json deseret-rosters-stats-2026.json team-current-data/whitehorse.json official-brackets-2026.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playoff-publication-2026
          path: audit-output/
      - name: Publish only reviewed playoff outputs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add player-game-stats-2026.json team-current-data
          if git diff --cached --quiet; then echo 'Playoff data already current'; exit 0; fi
          git commit -m 'Recover reported 2026 playoff player statistics'
          git push origin HEAD:main
