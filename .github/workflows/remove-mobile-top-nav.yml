name: Remove Mobile Top Navigation

on:
  push:
    paths:
      - '.github/workflows/remove-mobile-top-nav.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep only bottom navigation on mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          nav = Path('nav-menu.js')
          s = nav.read_text()

          # Stop loading the temporary 10-button mobile top navigation.
          s = re.sub(
              r"addScript\('mobile-top-nav\.js\?v=[^']*','rusMobileTopNav',true\);",
              '',
              s,
          )

          # Fresh mobile-shell URL so phones immediately receive the bottom-only version.
          s = re.sub(
              r"mobile-shell\.js\?v=[^']*",
              "mobile-shell.js?v=20260817-bottomonly1",
              s,
          )
          nav.write_text(s)

          shell = Path('mobile-shell.js')
          s = shell.read_text()

          # Hide the complete legacy/top nav on mobile. The hidden DOM remains available
          # to build the More drawer, but it is never visible above page content.
          s = s.replace(
              "body.rus-mobile-shell-ready>nav{display:none!important}",
              "html body.rus-mobile-shell-ready>nav{display:none!important} body.rus-mobile-shell-ready .rus-mobile-core-nav{display:none!important}",
          )

          # Remove a core-nav node if an older cached script created one before this shell loads.
          s = s.replace(
              "function buildShell(){\n  if(!mq.matches||document.querySelector('.rus-mobile-bottom-nav'))return;",
              "function buildShell(){\n  if(!mq.matches||document.querySelector('.rus-mobile-bottom-nav'))return;\n  document.getElementById('rusMobileCoreNav')?.remove();",
          )
          shell.write_text(s)

          # Bust nav-menu cache on every root HTML page that loads the shared shell.
          for p in Path('.').glob('*.html'):
              t = p.read_text()
              new = re.sub(
                  r"nav-menu\.js(?:\?v=[^\"']*)?",
                  "nav-menu.js?v=20260817-bottomonly1",
                  t,
              )
              if new != t:
                  p.write_text(new)

          Path('.github/workflows/remove-mobile-top-nav.yml').unlink(missing_ok=True)
          PY

      - name: Commit bottom-only mobile navigation
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Bottom-only mobile navigation is already installed."
          else
            git commit -m "Use only bottom navigation on mobile"
            git pull --rebase origin main
            git push
          fi
