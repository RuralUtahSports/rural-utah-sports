name: Apply Site Navigation Upgrades
on:
  push:
    paths:
      - '.github/workflows/apply-dedup-nav-upgrades.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add new tabs everywhere
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          links=[('index.html','Home'),('teams.html','Teams'),('greatest-seasons.html','Greatest Seasons'),('championships.html','Championships'),('records.html','Records'),('scorigami.html','Scorigami'),('games.html','Games'),('out-of-state.html','Out of State'),('elo.html','ELO'),('rankings.html','Rankings'),('simulators.html','Simulators')]
          active_map={'team.html':'teams.html','compare.html':'teams.html'}
          changed=[]
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              if '<nav>' not in text or 'nav-content' not in text: continue
              active=active_map.get(p.name,p.name)
              nav='<nav><div class="nav-content">'+''.join(f'<a href="{href}"'+(' class="active"' if href==active else '')+f'>{label}</a>' for href,label in links)+'</div></nav>'
              text2,n=re.subn(r'<nav><div class="nav-content">.*?</div></nav>',nav,text,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'nav replacement failed: {p}')
              if text2!=text: p.write_text(text2,encoding='utf-8'); changed.append(p.name)
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          if '<h3>Out of State</h3>' not in s:
              marker='<div class="card"><h3>Team Comparison</h3>'
              cards='<div class="card"><h3>Out of State</h3><p>See Utah football records against every state, browse every out-of-state game, and filter results by Utah team, state, and year.</p><a href="out-of-state.html">View Out of State</a></div><div class="card"><h3>ELO History</h3><p>Compare historical ELO graphs for up to three Utah high school football programs at once.</p><a href="elo.html">Compare ELO</a></div>'
              if marker not in s: raise SystemExit('home card marker not found')
              p.write_text(s.replace(marker,cards+marker,1),encoding='utf-8')
          print('Updated:',', '.join(changed))
          PY
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              s=p.read_text()
              if '<nav>' in s:
                  assert 'out-of-state.html' in s,p
                  assert 'elo.html' in s,p
          s=Path('index.html').read_text(); assert '<h3>Out of State</h3>' in s and '<h3>ELO History</h3>' in s
          print('verified')
          PY
      - name: Commit
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add *.html
          if git diff --cached --quiet; then echo "Navigation already current."; else git commit -m "Add Out of State and ELO tabs sitewide"; git pull --rebase origin main; git push; fi
