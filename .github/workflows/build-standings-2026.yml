name: Build 2026 Standings

on:
  workflow_dispatch:
  schedule:
    # Stagger this off the top of the hour. A successful run also triggers
    # Update Live Scoreboard through its workflow_run backup.
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    paths:
      - 'teams-data.json'
      - 'standings.html'
      - 'weekly-simulation.json'
      - 'deseret-game-details.json'
      - 'deseret-live-details-2026.json'
      - 'verified-finals-2026.json'
      - 'scripts/reconcile-final-games.mjs'
      - 'scripts/build_standings_2026.mjs'
      - '.github/workflows/build-standings-2026.yml'

permissions:
  contents: write

concurrency:
  group: standings-2026-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test final-score reconciliation
        run: node scripts/test-final-reconciliation.mjs

      - name: Build standings from Weekly Simulation and Deseret finals
        env:
          SHEET_ID: 1IHr84tlMdZVAazLDh0HV7ZWoxNH4UpjpLt_UTV8KZwo
          WEEKLY_GID: 1211467999
        run: node scripts/build_standings_2026.mjs

      - name: Verify standings
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('standings-2026.json','utf8'));
          const all=Object.values(d.byClassification||{}).flat();
          if(all.length<100) throw new Error(`Only ${all.length} teams found in standings`);
          const eight=d.byClassification?.['8P']||[];
          const names=new Set(eight.map(x=>x.team));
          for(const n of ['MONTICELLO','MONUMENT VAL','PANGUITCH','GRAND']) if(!names.has(n)) throw new Error(`${n} missing from 8-player standings`);
          if(!Number.isFinite(Number(d.summary?.completedGames))) throw new Error('Completed game count is invalid');
          console.log(`Verified ${all.length} teams and ${d.summary.completedGames} completed games.`);
          NODE

      - name: Audit every team record
        run: node scripts/audit_standings_records_2026.mjs

      - name: Refresh current team schedules
        run: node scripts/build_team_current_shards.mjs

      - name: Commit standings
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- standings-2026.json team-current-data)" ]; then
            echo "Standings already current."
            exit 0
          fi
          git add standings-2026.json team-current-data
          git commit -m "Auto-sync 2026 standings"
          git pull --rebase origin main
          git push
