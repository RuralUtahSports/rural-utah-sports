name: Add 2026 Standings Automation
on:
  push:
    paths:
      - '.github/workflows/add-2026-standings.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hourly standings build and navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-simulator-data.yml')
          s=p.read_text()
          marker="          fs.writeFileSync('weekly-simulation.json',JSON.stringify({games:weekly}));console.log(`Weekly simulation games: ${weekly.length}`);"
          add=r'''          fs.writeFileSync('weekly-simulation.json',JSON.stringify({games:weekly}));console.log(`Weekly simulation games: ${weekly.length}`);

          // Build 2026 standings from completed Weekly Simulation games.
          const activeNames=new Set();
          for(const g of weekly){const a=resolveTeam(g.awayTeam),h=resolveTeam(g.homeTeam);if(a)activeNames.add(a);if(h)activeNames.add(h)}
          const st={};
          for(const name of activeNames){const t=featureMap[name];if(!t)continue;st[name]={team:name,classification:t.classification,region:t.region,backgroundColor:t.backgroundColor,textColor:t.textColor,wins:0,losses:0,ties:0,regionWins:0,regionLosses:0,regionTies:0,pointsFor:0,pointsAgainst:0,results:[]}}
          function apply(name,pf,pa,date,isRegion){const x=st[name];if(!x)return;x.pointsFor+=pf;x.pointsAgainst+=pa;let r='T';if(pf>pa){x.wins++;r='W';if(isRegion)x.regionWins++}else if(pf<pa){x.losses++;r='L';if(isRegion)x.regionLosses++}else{x.ties++;if(isRegion)x.regionTies++}x.results.push({date,result:r})}
          let completedGames=0;
          for(const g of weekly){if(g.actualAway===null||g.actualHome===null)continue;const a=resolveTeam(g.awayTeam),h=resolveTeam(g.homeTeam);if(!a&&!h)continue;completedGames++;const sameRegion=!!(a&&h&&st[a]&&st[h]&&st[a].classification===st[h].classification&&st[a].region&&st[a].region===st[h].region);if(a)apply(a,g.actualAway,g.actualHome,g.date,sameRegion);if(h)apply(h,g.actualHome,g.actualAway,g.date,sameRegion)}
          for(const x of Object.values(st)){x.results.sort((a,b)=>dateStamp(a.date)-dateStamp(b.date));let streak='—';if(x.results.length){const last=x.results.at(-1).result;let n=0;for(let i=x.results.length-1;i>=0&&x.results[i].result===last;i--)n++;streak=last+n}x.streak=streak;delete x.results}
          const wp=x=>{const n=x.wins+x.losses+x.ties;return n?(x.wins+x.ties*.5)/n:0},rwp=x=>{const n=x.regionWins+x.regionLosses+x.regionTies;return n?(x.regionWins+x.regionTies*.5)/n:0},diff=x=>x.pointsFor-x.pointsAgainst;
          const sortOverall=(a,b)=>wp(b)-wp(a)||(b.wins-a.wins)||diff(b)-diff(a)||a.team.localeCompare(b.team);
          const sortRegion=(a,b)=>rwp(b)-rwp(a)||(b.regionWins-a.regionWins)||wp(b)-wp(a)||diff(b)-diff(a)||a.team.localeCompare(b.team);
          const byClassification={},byRegion={};
          for(const x of Object.values(st)){(byClassification[x.classification]??=[]).push(x);byRegion[x.classification]??={};(byRegion[x.classification][x.region||'Independent']??=[]).push(x)}
          for(const arr of Object.values(byClassification))arr.sort(sortOverall);
          for(const groups of Object.values(byRegion))for(const arr of Object.values(groups))arr.sort(sortRegion);
          fs.writeFileSync('standings-2026.json',JSON.stringify({season:2026,updatedAt:new Date().toISOString(),summary:{scheduledGames:weekly.length,completedGames},byClassification,byRegion}));
          console.log(`2026 standings teams: ${Object.keys(st).length}; completed games: ${completedGames}`);'''
          if "standings-2026.json" not in s:
              if marker not in s: raise SystemExit('weekly marker missing')
              s=s.replace(marker,add,1)
              s=s.replace('simulator-data.json weekly-simulation.json)', 'simulator-data.json weekly-simulation.json standings-2026.json)')
              s=s.replace('git add simulator-data.json weekly-simulation.json', 'git add simulator-data.json weekly-simulation.json standings-2026.json')
              p.write_text(s)

          for p in Path('.').glob('*.html'):
              s=p.read_text();o=s
              if 'href="standings.html"' not in s and 'href="simulators.html"' in s:
                  s=s.replace('<a href="simulators.html"', '<a href="standings.html">Standings</a><a href="simulators.html"', 1)
              if s!=o:p.write_text(s)
          PY
      - name: Run standings build now
        run: |
          node --check <(python - <<'PY'
          import re
          from pathlib import Path
          s=Path('standings.html').read_text();print('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          ) || true
          node <<'NODE'
          const fs=require('fs');
          const weekly=JSON.parse(fs.readFileSync('weekly-simulation.json','utf8')).games||[];
          const teams=JSON.parse(fs.readFileSync('teams-data.json','utf8'));
          const clean=v=>String(v??'').trim(),norm=v=>clean(v).toUpperCase().replace(/[^A-Z0-9]/g,''),n=v=>{const s=clean(v);if(!s)return null;const x=Number(s);return Number.isFinite(x)?x:null},dateStamp=v=>{const d=new Date(clean(v));return Number.isFinite(d.getTime())?d.getTime():0};
          const teamByNorm=new Map();for(const t of teams)teamByNorm.set(norm(t.team),t.team);const aliases={GUNNISON:'GUNNISON VALLEY',MAPLEMTN:'MAPLE MOUNTAIN',MONUMENTVAL:'MONUMENT VALLEY',AMERFORK:'AMERICAN FORK',CEDAR:'CEDAR CITY'};const resolveTeam=v=>teamByNorm.get(norm(v))||aliases[norm(v)]||'';
          const featureMap=Object.fromEntries(teams.map(t=>[t.team,t]));const activeNames=new Set();for(const g of weekly){const a=resolveTeam(g.awayTeam),h=resolveTeam(g.homeTeam);if(a)activeNames.add(a);if(h)activeNames.add(h)}const st={};for(const name of activeNames){const t=featureMap[name];if(!t)continue;st[name]={team:name,classification:clean(t.classification),region:clean(t.region),backgroundColor:clean(t.backgroundColor),textColor:clean(t.textColor),wins:0,losses:0,ties:0,regionWins:0,regionLosses:0,regionTies:0,pointsFor:0,pointsAgainst:0,results:[]}}function apply(name,pf,pa,date,isRegion){const x=st[name];if(!x)return;x.pointsFor+=pf;x.pointsAgainst+=pa;let r='T';if(pf>pa){x.wins++;r='W';if(isRegion)x.regionWins++}else if(pf<pa){x.losses++;r='L';if(isRegion)x.regionLosses++}else{x.ties++;if(isRegion)x.regionTies++}x.results.push({date,result:r})}let completedGames=0;for(const g of weekly){const aa=n(g.actualAway),ah=n(g.actualHome);if(aa===null||ah===null)continue;const a=resolveTeam(g.awayTeam),h=resolveTeam(g.homeTeam);if(!a&&!h)continue;completedGames++;const sameRegion=!!(a&&h&&st[a]&&st[h]&&st[a].classification===st[h].classification&&st[a].region&&st[a].region===st[h].region);if(a)apply(a,aa,ah,g.date,sameRegion);if(h)apply(h,ah,aa,g.date,sameRegion)}for(const x of Object.values(st)){x.results.sort((a,b)=>dateStamp(a.date)-dateStamp(b.date));let streak='—';if(x.results.length){const last=x.results.at(-1).result;let c=0;for(let i=x.results.length-1;i>=0&&x.results[i].result===last;i--)c++;streak=last+c}x.streak=streak;delete x.results}const wp=x=>{const z=x.wins+x.losses+x.ties;return z?(x.wins+x.ties*.5)/z:0},rwp=x=>{const z=x.regionWins+x.regionLosses+x.regionTies;return z?(x.regionWins+x.regionTies*.5)/z:0},diff=x=>x.pointsFor-x.pointsAgainst,sortOverall=(a,b)=>wp(b)-wp(a)||(b.wins-a.wins)||diff(b)-diff(a)||a.team.localeCompare(b.team),sortRegion=(a,b)=>rwp(b)-rwp(a)||(b.regionWins-a.regionWins)||wp(b)-wp(a)||diff(b)-diff(a)||a.team.localeCompare(b.team);const byClassification={},byRegion={};for(const x of Object.values(st)){(byClassification[x.classification]??=[]).push(x);byRegion[x.classification]??={};(byRegion[x.classification][x.region||'Independent']??=[]).push(x)}for(const a of Object.values(byClassification))a.sort(sortOverall);for(const g of Object.values(byRegion))for(const a of Object.values(g))a.sort(sortRegion);fs.writeFileSync('standings-2026.json',JSON.stringify({season:2026,updatedAt:new Date().toISOString(),summary:{scheduledGames:weekly.length,completedGames},byClassification,byRegion}));console.log('standings teams',Object.keys(st).length,'completed',completedGames)
          NODE
      - name: Verify and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          assert Path('standings.html').exists() and Path('standings-2026.json').exists()
          d=json.loads(Path('standings-2026.json').read_text());assert d['season']==2026
          bad=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text()
              if '<nav>' in s and 'href="standings.html"' not in s: bad.append(p.name)
          print('nav missing',bad,'teams',sum(len(v) for v in d['byClassification'].values()))
          assert not bad
          PY
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add .github/workflows/build-simulator-data.yml standings-2026.json '*.html'
          git commit -m "Add automatically updating 2026 standings"
          git pull --rebase origin main
          git push
