name: Import Deseret boys basketball history

on:
  push:
    branches: [main]
    paths:
      - 'scripts/import_boys_basketball_deseret_history.mjs'
      - 'scripts/build_boys_basketball_all_time_records.mjs'
      - '.github/workflows/import-boys-basketball-deseret-history.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Import Deseret seasons
        run: |
          for year in 2003 2004 2005; do
            echo "Importing boys basketball season ending $year"
            node scripts/import_boys_basketball_deseret_history.mjs "$year"
          done
      - name: Verify imports
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for (const season of ['2002-03','2003-04','2004-05']) {
            const d=JSON.parse(fs.readFileSync(`boys-basketball-games-${season}.json`,'utf8'));
            if(d.season!==season) throw new Error(`Wrong season for ${season}`);
            if((d.summary?.withResults||0)<60) throw new Error(`Too few teams with results for ${season}: ${d.summary?.withResults||0}`);
            if((d.summary?.completedGames||0)<1000) throw new Error(`Too few completed team results for ${season}: ${d.summary?.completedGames||0}`);
            console.log(season,d.summary);
          }
          NODE
      - name: Rebuild all-time basketball records
        run: node scripts/build_boys_basketball_all_time_records.mjs
      - name: Commit Deseret historical seasons
        run: |
          for season in 2002-03 2003-04 2004-05; do
            git add "boys-basketball-games-$season.json" "boys-basketball-results-import-report-$season.json"
          done
          git add boys-basketball-all-time-records-2002-26.json
          if git diff --cached --quiet; then
            echo "No Deseret historical basketball data changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import 2002-05 boys basketball from Deseret"
          git pull --rebase origin main
          git push
