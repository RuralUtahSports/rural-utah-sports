name: Add championship bracket sharing and history features

on:
  push:
    paths:
      - '.github/workflows/add-championship-features.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add championship features
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='championship-brackets.js';
          let js=fs.readFileSync(file,'utf8');
          const must=(old,replacement,label)=>{if(!js.includes(old))throw new Error(`Missing ${label}`);js=js.replace(old,replacement)};

          must("let teamMap=new Map(),cache={},activeYear='2025',activeData=null;","let teamMap=new Map(),cache={},activeYear='2025',activeData=null,activeClass='',highlightedTeam='',championshipEntries=[];",'state');

          must("document.head.appendChild(style);",`style.textContent+=\`.bracket-highlight-select{min-width:170px}.bracket-copy{height:38px;border:1px solid #555;background:#222;color:#fff;border-radius:5px;padding:0 12px;font-weight:900;cursor:pointer}.bracket-copy:hover{border-color:#F14D07;color:#F14D07}.bracket-champion-bar{display:none;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;background:#050505;border:1px solid #333;border-left:5px solid #F14D07;border-radius:7px;padding:13px 15px;margin-bottom:12px}.bracket-champion-bar.show{display:flex}.bracket-champion-kicker{display:block;color:#F14D07;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.bracket-champion-name{font-size:20px;font-weight:900}.bracket-champion-name a{color:inherit;text-decoration:none}.bracket-champion-result{color:#aaa;font-size:12px;font-weight:800}.bracket-team{cursor:pointer;transition:opacity .15s ease,filter .15s ease,box-shadow .15s ease}.bracket-grid.has-highlight .bracket-game{opacity:.18;filter:saturate(.25);transition:opacity .15s ease,filter .15s ease}.bracket-grid.has-highlight .bracket-game.path-game{opacity:1;filter:none;box-shadow:0 0 0 1px rgba(241,77,7,.55)}.bracket-grid.has-highlight .bracket-game.path-game .bracket-team:not(.path-team){filter:saturate(.35) brightness(.6)}.bracket-team.path-team{box-shadow:inset 0 0 0 2px #fff!important}.champ-leaders{margin-top:34px;border-top:4px solid #F14D07;padding-top:24px}.champ-leader-head{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}.champ-leader-head h3{font-size:25px;text-transform:uppercase}.champ-leader-head p{color:#999;font-size:13px;margin-top:5px}.champ-leader-controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.champ-leader-tab{border:1px solid #444;background:#191919;color:#fff;padding:8px 10px;border-radius:5px;font-weight:900;cursor:pointer}.champ-leader-tab.active{background:#F14D07;color:#000;border-color:#F14D07}.champ-decade{height:35px;background:#191919;color:#fff;border:1px solid #444;border-radius:5px;padding:0 8px;font-weight:900}.champ-leader-list{background:#090909;border:1px solid #333;border-radius:8px;overflow:hidden}.champ-leader-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid #292929}.champ-leader-row:last-child{border-bottom:0}.champ-leader-rank{color:#777;font-size:12px;font-weight:900}.champ-leader-team{font-weight:900;min-width:0}.champ-leader-team a{color:inherit;text-decoration:none}.champ-leader-detail{display:block;color:#777;font-size:10px;font-weight:700;margin-top:2px}.champ-leader-value{font-size:19px;font-weight:900;color:#F14D07;text-align:right}.champ-leader-value small{display:block;color:#777;font-size:9px;text-transform:uppercase;margin-top:2px}@media(max-width:600px){.bracket-copy{width:100%}.bracket-highlight-select{width:100%}.bracket-champion-name{font-size:17px}.champ-leader-row{grid-template-columns:30px minmax(0,1fr) auto;padding:10px}.champ-leader-head h3{font-size:21px}}\`;document.head.appendChild(style);`,'style append');

          must("main.appendChild(sec);",`main.appendChild(sec);
const controls=sec.querySelector('.bracket-controls');
const highlightWrap=document.createElement('div');highlightWrap.className='bracket-year-wrap';highlightWrap.innerHTML='<label for="bracketHighlight">Highlight Team</label><select id="bracketHighlight" class="bracket-year bracket-highlight-select"><option value="">No Highlight</option></select>';controls.appendChild(highlightWrap);
const highlightSelect=highlightWrap.querySelector('select');
const copyLink=document.createElement('button');copyLink.type='button';copyLink.id='bracketCopy';copyLink.className='bracket-copy';copyLink.textContent='Copy Bracket Link';controls.appendChild(copyLink);
const championBar=document.createElement('div');championBar.id='bracketChampionBar';championBar.className='bracket-champion-bar';sec.querySelector('.bracket-scroll').before(championBar);
const leaderSec=document.createElement('section');leaderSec.className='champ-leaders';leaderSec.innerHTML='<div class="champ-leader-head"><div><h3>Championship History Leaders</h3><p>All-time leaders calculated from the Rural Utah Sports Championship Log.</p></div><div class="champ-leader-controls" id="champLeaderControls"><button class="champ-leader-tab active" data-mode="titles">Titles</button><button class="champ-leader-tab" data-mode="appearances">Appearances</button><button class="champ-leader-tab" data-mode="runnerups">Runner-Up</button><button class="champ-leader-tab" data-mode="gaps">Title Gaps</button><button class="champ-leader-tab" data-mode="decade">By Decade</button><select id="champLeaderDecade" class="champ-decade" hidden></select></div></div><div id="champLeaderList" class="champ-leader-list"><div class="bracket-loading">Loading championship leaders…</div></div>';main.appendChild(leaderSec);
const leaderControls=leaderSec.querySelector('#champLeaderControls'),leaderList=leaderSec.querySelector('#champLeaderList'),leaderDecade=leaderSec.querySelector('#champLeaderDecade');`,'append section');

          must("return `<div class=\"bracket-team ${isWin?'win ':''}${bg?'has-color':''}\"${css}>${linked}<span class=\"bracket-score ${isWin?'win-score':''}\">${clean(score)}</span></div>`","return `<div class=\"bracket-team ${isWin?'win ':''}${bg?'has-color':''}\" data-team-key=\"${encodeURIComponent(feedKey(name))}\"${css}>${linked}<span class=\"bracket-score ${isWin?'win-score':''}\">${clean(score)}</span></div>`",'team data key');

          const oldRender=`function render(cls){if(!activeData||!activeData[cls])return;[...tabs.children].forEach(b=>b.classList.toggle('active',b.dataset.cls===cls));const rounds=alignedRounds(activeData[cls]);grid.innerHTML=rounds.map((r,i)=>{const champ=r[0]==='Championship'||r[0].includes('Championship')||i===rounds.length-1;return \`<div class="bracket-round \${champ?'bracket-champ':''}"><div class="bracket-round-title">\${r[0]}</div><div class="bracket-games">\${r[1].map(g=>gameHTML(g,cls,champ)).join('')}</div></div>\`}).join('');scroller.scrollLeft=0}`;
          const newRender=`function teamsInRounds(rounds){const teams=new Map();for(const r of rounds||[])for(const g of r[1]||[])for(const name of [g[0],g[2]]){const key=feedKey(name);if(key&&!teams.has(key))teams.set(key,stripSeed(name))}return teams}
function refreshHighlightOptions(rounds){const teams=teamsInRounds(rounds);highlightSelect.innerHTML='<option value="">No Highlight</option>'+[...teams.entries()].sort((a,b)=>a[1].localeCompare(b[1])).map(([key,label])=>\`<option value="\${key}">\${label}</option>\`).join('');if(highlightedTeam&&teams.has(highlightedTeam))highlightSelect.value=highlightedTeam;else{highlightedTeam='';highlightSelect.value=''}}
function applyHighlight(){grid.classList.toggle('has-highlight',!!highlightedTeam);for(const game of grid.querySelectorAll('.bracket-game')){const rows=[...game.querySelectorAll('.bracket-team')];const hit=!!highlightedTeam&&rows.some(row=>decodeURIComponent(row.dataset.teamKey||'')===highlightedTeam);game.classList.toggle('path-game',hit);for(const row of rows)row.classList.toggle('path-team',!!highlightedTeam&&decodeURIComponent(row.dataset.teamKey||'')===highlightedTeam)}}
function updateShareURL(){if(!history.replaceState)return;const p=new URLSearchParams();p.set('year',activeYear);if(activeClass)p.set('class',activeClass);if(highlightedTeam)p.set('team',highlightedTeam);history.replaceState(null,'',location.pathname+'?'+p.toString()+location.hash)}
function setHighlightedTeam(key){highlightedTeam=key||'';if(highlightSelect.value!==highlightedTeam)highlightSelect.value=highlightedTeam;applyHighlight();updateShareURL()}
function updateChampionBar(cls,rounds){const last=rounds&&rounds[rounds.length-1],g=last&&last[1]&&last[1][0];if(!g){championBar.classList.remove('show');championBar.innerHTML='';return}const [aw,bw]=winnerFlags(g);const winner=aw?g[0]:bw?g[2]:'';const loser=aw?g[2]:bw?g[0]:'';const ws=aw?g[1]:bw?g[3]:'';const ls=aw?g[3]:bw?g[1]:'';if(!winner){championBar.innerHTML=\`<div><span class="bracket-champion-kicker">\${activeYear} \${cls} Championship</span><div class="bracket-champion-name">\${stripSeed(g[0])} \${clean(g[1])} – \${clean(g[3])} \${stripSeed(g[2])}</div></div>\`;championBar.classList.add('show');return}const t=lookup(winner),bg=t?safeHex(t.backgroundColor,'#F14D07'):'#F14D07',fg=t?safeHex(t.textColor,'#FFFFFF'):'#FFFFFF';const name=t?\`<a href="team.html?team=\${encodeURIComponent(t.team)}">\${stripSeed(winner)}</a>\`:stripSeed(winner);championBar.style.borderLeftColor=bg;championBar.innerHTML=\`<div><span class="bracket-champion-kicker">\${activeYear} \${cls} Champion</span><div class="bracket-champion-name" style="color:\${fg};background:\${bg};display:inline-block;padding:5px 9px;border-radius:5px">\${name}</div></div><div class="bracket-champion-result">Won \${clean(ws)}–\${clean(ls)} vs. \${stripSeed(loser)}</div>\`;championBar.classList.add('show')}
function render(cls){if(!activeData||!activeData[cls])return;activeClass=cls;[...tabs.children].forEach(b=>b.classList.toggle('active',b.dataset.cls===cls));const rounds=alignedRounds(activeData[cls]);refreshHighlightOptions(rounds);updateChampionBar(cls,rounds);grid.innerHTML=rounds.map((r,i)=>{const champ=r[0]==='Championship'||r[0].includes('Championship')||i===rounds.length-1;return \`<div class="bracket-round \${champ?'bracket-champ':''}"><div class="bracket-round-title">\${r[0]}</div><div class="bracket-games">\${r[1].map(g=>gameHTML(g,cls,champ)).join('')}</div></div>\`}).join('');applyHighlight();scroller.scrollLeft=0;updateShareURL()}`;
          must(oldRender,newRender,'render');

          const oldTabs=`function buildTabs(){tabs.innerHTML='';const available=CLASS_ORDER.filter(c=>activeData&&activeData[c]&&activeData[c].length);available.forEach((cls,i)=>{const b=document.createElement('button');b.type='button';b.className='bracket-tab'+(i===0?' active':'');b.dataset.cls=cls;b.textContent=cls;b.addEventListener('click',()=>render(cls));tabs.appendChild(b)});if(available[0])render(available[0]);else grid.innerHTML='<div class="bracket-loading">No bracket data is available for this season.</div>'}`;
          const newTabs=`function buildTabs(preferredClass=''){tabs.innerHTML='';const available=CLASS_ORDER.filter(c=>activeData&&activeData[c]&&activeData[c].length);const target=available.includes(preferredClass)?preferredClass:available[0];available.forEach(cls=>{const b=document.createElement('button');b.type='button';b.className='bracket-tab'+(cls===target?' active':'');b.dataset.cls=cls;b.textContent=cls;b.addEventListener('click',()=>{highlightedTeam='';render(cls)});tabs.appendChild(b)});if(target)render(target);else{activeClass='';grid.innerHTML='<div class="bracket-loading">No bracket data is available for this season.</div>';championBar.classList.remove('show')}}`;
          must(oldTabs,newTabs,'tabs');

          const oldLoad=`async function loadYear(year){activeYear=year;heading.textContent=\`${'${'}year} Playoff Brackets\`;grid.innerHTML='<div class="bracket-loading">Loading playoff bracket…</div>';tabs.innerHTML='';try{if(!cache[year]){const r=await fetch(\`brackets-${'${'}year}.json?v=${'${'}Date.now()}\`);if(!r.ok)throw new Error(\`Bracket data unavailable (${'${'}r.status})\`);cache[year]=await r.json()}activeData=cache[year];buildTabs()}catch(e){console.error(e);activeData=null;grid.innerHTML='<div class="bracket-loading">This playoff bracket could not be loaded.</div>'}}`;
          const newLoad=`async function loadYear(year,preferredClass='',preferredTeam=''){activeYear=year;highlightedTeam=preferredTeam?feedKey(preferredTeam):'';heading.textContent=\`${'${'}year} Playoff Brackets\`;grid.innerHTML='<div class="bracket-loading">Loading playoff bracket…</div>';tabs.innerHTML='';try{if(!cache[year]){const r=await fetch(\`brackets-${'${'}year}.json?v=${'${'}Date.now()}\`);if(!r.ok)throw new Error(\`Bracket data unavailable (${'${'}r.status})\`);cache[year]=await r.json()}activeData=cache[year];buildTabs(preferredClass)}catch(e){console.error(e);activeData=null;activeClass='';grid.innerHTML='<div class="bracket-loading">This playoff bracket could not be loaded.</div>';championBar.classList.remove('show')}}`;
          must(oldLoad,newLoad,'load year');

          const oldBoot=`yearSelect.addEventListener('change',()=>loadYear(yearSelect.value));async function boot(){try{const r=await fetch('teams-data.json?v='+Date.now());if(r.ok){const teams=await r.json();for(const t of teams)teamMap.set(norm(t.team),t)}}catch(e){console.warn('Bracket team colors unavailable',e)}await loadYear('2025')}boot();`;
          const newBoot=`function leaderTeamHTML(row){const t=knownLeaderTeam(row.key);if(!t)return row.name;const bg=safeHex(t.backgroundColor,'#222222'),fg=safeHex(t.textColor,'#FFFFFF');return \`<a href="team.html?team=\${encodeURIComponent(t.team)}" style="display:inline-block;background:\${bg};color:\${fg};padding:4px 7px;border-radius:4px">\${row.name}</a>\`}
function knownLeaderTeam(key){const n=norm(key);return teamMap.get(aliases[n]||n)||teamMap.get(n)||null}
let leaderRows=[],leaderMode='titles';
function renderLeaderboard(mode=leaderMode){leaderMode=mode;for(const b of leaderControls.querySelectorAll('.champ-leader-tab'))b.classList.toggle('active',b.dataset.mode===mode);leaderDecade.hidden=mode!=='decade';let rows=leaderRows.slice(),label='Titles',detail=r=>r.titles.length?\`${'${'}r.titles[0]}–${'${'}r.titles[r.titles.length-1]}\`:'',value=r=>r.titles.length;if(mode==='appearances'){label='Appearances';rows.sort((a,b)=>b.appearances-a.appearances||b.titles.length-a.titles.length||a.name.localeCompare(b.name));detail=r=>\`${'${'}r.titles.length} title${'${'}r.titles.length===1?'':'s'}\`;value=r=>r.appearances}else if(mode==='runnerups'){label='Runner-Up';rows.sort((a,b)=>b.runnerUps-a.runnerUps||b.appearances-a.appearances||a.name.localeCompare(b.name));detail=r=>\`${'${'}r.appearances} title-game appearance${'${'}r.appearances===1?'':'s'}\`;value=r=>r.runnerUps}else if(mode==='gaps'){label='Seasons';rows=rows.filter(r=>r.maxGap>0).sort((a,b)=>b.maxGap-a.maxGap||a.name.localeCompare(b.name));detail=r=>\`${'${'}r.gapStart} to ${'${'}r.gapEnd} between titles\`;value=r=>r.maxGap}else if(mode==='decade'){const d=Number(leaderDecade.value);label='Titles';rows=rows.map(r=>({...r,decadeTitles:r.titles.filter(y=>Math.floor(y/10)*10===d).length})).filter(r=>r.decadeTitles).sort((a,b)=>b.decadeTitles-a.decadeTitles||a.name.localeCompare(b.name));detail=r=>\`${'${'}d}s\`;value=r=>r.decadeTitles}else rows.sort((a,b)=>b.titles.length-a.titles.length||b.appearances-a.appearances||a.name.localeCompare(b.name));rows=rows.filter(r=>value(r)>0).slice(0,10);leaderList.innerHTML=rows.map((r,i)=>\`<div class="champ-leader-row"><div class="champ-leader-rank">#${'${'}i+1}</div><div class="champ-leader-team">${'${'}leaderTeamHTML(r)}<span class="champ-leader-detail">${'${'}detail(r)}</span></div><div class="champ-leader-value">${'${'}value(r)}<small>${'${'}label}</small></div></div>\`).join('')||'<div class="bracket-loading">No leaderboard data is available.</div>'}
async function buildLeaderboard(){try{const r=await fetch('championships.json?v='+Date.now());if(!r.ok)throw new Error('Championship history unavailable');championshipEntries=await r.json();const programs=new Map();const get=(key,name)=>{key=feedKey(key||name);if(!programs.has(key))programs.set(key,{key,name:stripSeed(name||key),titles:[],runnerUps:0,appearances:0,maxGap:0,gapStart:null,gapEnd:null});const p=programs.get(key);if(name&&(!p.name||p.name===p.key))p.name=stripSeed(name);return p};for(const e of championshipEntries){const y=Number(e.year);if(!Number.isFinite(y))continue;if(e.status==='championship'){const c=get(e.championKey,e.champion),r=get(e.runnerUpKey,e.runnerUp);c.titles.push(y);c.appearances++;r.runnerUps++;r.appearances++}else if(e.status==='co-champions'){for(const c of e.coChampions||[]){const p=get(c.key,c.name);p.titles.push(y);p.appearances++}}}leaderRows=[...programs.values()];for(const p of leaderRows){p.titles=[...new Set(p.titles)].sort((a,b)=>a-b);for(let i=1;i<p.titles.length;i++){const gap=p.titles[i]-p.titles[i-1];if(gap>p.maxGap){p.maxGap=gap;p.gapStart=p.titles[i-1];p.gapEnd=p.titles[i]}}}const decades=[...new Set(championshipEntries.map(e=>Math.floor(Number(e.year)/10)*10).filter(Number.isFinite))].sort((a,b)=>b-a);leaderDecade.innerHTML=decades.map(d=>\`<option value="\${d}">\${d}s</option>\`).join('');renderLeaderboard('titles')}catch(e){console.error(e);leaderList.innerHTML='<div class="bracket-loading">Championship leaderboards could not be loaded.</div>'}}
yearSelect.addEventListener('change',()=>{highlightedTeam='';loadYear(yearSelect.value)});highlightSelect.addEventListener('change',()=>setHighlightedTeam(highlightSelect.value));grid.addEventListener('click',e=>{if(e.target.closest('a'))return;const row=e.target.closest('.bracket-team');if(!row)return;const key=decodeURIComponent(row.dataset.teamKey||'');setHighlightedTeam(key===highlightedTeam?'':key)});copyLink.addEventListener('click',async()=>{updateShareURL();const old=copyLink.textContent;try{await navigator.clipboard.writeText(location.href);copyLink.textContent='Copied!'}catch(e){copyLink.textContent='Link Ready'}setTimeout(()=>copyLink.textContent=old,1200)});leaderControls.addEventListener('click',e=>{const b=e.target.closest('.champ-leader-tab');if(b)renderLeaderboard(b.dataset.mode)});leaderDecade.addEventListener('change',()=>renderLeaderboard('decade'));async function boot(){try{const r=await fetch('teams-data.json?v='+Date.now());if(r.ok){const teams=await r.json();for(const t of teams)teamMap.set(norm(t.team),t)}}catch(e){console.warn('Bracket team colors unavailable',e)}const q=new URLSearchParams(location.search),requestedYear=q.get('year'),year=YEARS.includes(requestedYear)?requestedYear:'2025',cls=q.get('class')||'',team=q.get('team')||'';yearSelect.value=year;await loadYear(year,cls,team);await buildLeaderboard()}boot();`;
          must(oldBoot,newBoot,'boot');

          fs.writeFileSync(file,js);
          NODE
          node --check championship-brackets.js
          grep -q "Copy Bracket Link" championship-brackets.js
          grep -q "Championship History Leaders" championship-brackets.js
          grep -q "URLSearchParams(location.search)" championship-brackets.js
      - name: Commit changes
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add championship-brackets.js
          git commit -m "Add shareable brackets, team highlighting and title leaders"
          git pull --rebase origin main
          git push
