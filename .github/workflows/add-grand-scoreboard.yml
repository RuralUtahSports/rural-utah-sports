name: Add Grand Dolores To Scoreboard

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-grand-scoreboard.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upsert Grand at Dolores
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('weekly-simulation.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          games = data.setdefault('games', [])

          wanted = {
              'date': '8/21/2026',
              'awayTeam': 'GRAND',
              'homeTeam': 'DOLORES, CO',
              'awayScore': 21,
              'homeScore': 10,
              'winner': 'GRAND',
              'actualAway': 12,
              'actualHome': 6,
              'actualWinner': 'GRAND',
              'wl': 'W'
          }

          # Remove any stale/reversed version of this matchup for the same date.
          def same_matchup(g):
              if str(g.get('date', '')).strip() != '8/21/2026':
                  return False
              teams = {str(g.get('awayTeam', '')).strip().upper(), str(g.get('homeTeam', '')).strip().upper()}
              return teams == {'GRAND', 'DOLORES, CO'}

          games[:] = [g for g in games if not same_matchup(g)]
          games.append(wanted)
          games.sort(key=lambda g: (str(g.get('date', '')), str(g.get('awayTeam', ''))))

          path.write_text(json.dumps(data, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
      - name: Commit scoreboard game
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add weekly-simulation.json
          if git diff --cached --quiet; then
            echo "Grand-Dolores is already present."
            exit 0
          fi
          git commit -m "Add Grand-Dolores to weekly scoreboard"
          git pull --rebase origin main
          git push
