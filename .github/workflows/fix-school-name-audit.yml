name: Fix School Name Audit

on:
  push:
    paths:
      - '.github/workflows/fix-school-name-audit.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix audit sort syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/audit-school-name-aliases.yml')
          s=p.read_text()
          old="candidates.sort((a,b)=>({high:0,likely:1,possible:2}[a.confidence]-({high:0,likely:1,possible:2}[b.confidence]) || b.score-a.score || (b.appearancesA+b.appearancesB)-(a.appearancesA+a.appearancesB));"
          new="const order={high:0,likely:1,possible:2}; candidates.sort((a,b)=>order[a.confidence]-order[b.confidence] || b.score-a.score || (b.appearancesA+b.appearancesB)-(a.appearancesA+a.appearancesB));"
          if old not in s: raise SystemExit('Target line not found')
          p.write_text(s.replace(old,new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/audit-school-name-aliases.yml
          git commit -m "Fix school name alias audit syntax"
          git push
