name: One-time live games first

on:
  push:
    paths:
      - '.github/workflows/one-time-live-first.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Put live date sections first
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scoreboard.html')
          s=p.read_text()
          old="const ordered=[...groups].sort((a,b)=>dateVal(a[0])-dateVal(b[0]));"
          new="const ordered=[...groups].sort((a,b)=>Number(b[1].some(liveGame))-Number(a[1].some(liveGame))||dateVal(a[0])-dateVal(b[0]));"
          if old not in s:
              raise SystemExit('target sort not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit change
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add scoreboard.html
          git commit -m "Keep live scoreboard games at top"
          git pull --rebase origin main
          git push
