name: Activate Credibility Cache Version

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-credibility-cache.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bust shared shell cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('nav-menu.js'); s=p.read_text()
          s=re.sub(r"addScript\('pwa\.js\?v=[^']*','rusPwa',true\)","addScript('pwa.js?v=20260817-cred1','rusPwa',true)",s)
          p.write_text(s)
          for html in Path('.').rglob('*.html'):
              text=html.read_text(errors='ignore')
              new=re.sub(r'src=[\"\']nav-menu\.js(?:\?v=[^\"\']*)?[\"\']','src="nav-menu.js?v=20260817-cred1"',text)
              if new!=text: html.write_text(new)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/activate-credibility-cache.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Activate credibility package cache version'
          git push
