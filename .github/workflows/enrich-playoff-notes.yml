name: Enrich Team Schedules With Playoff Notes

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sync Website Data From Google Sheet
    types:
      - completed
  push:
    paths:
      - '.github/workflows/enrich-playoff-notes.yml'
      - 'scripts/enrich_playoff_notes.py'

permissions:
  contents: write

concurrency:
  group: playoff-notes-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook reader
        run: python -m pip install --quiet openpyxl

      - name: Add team-tab notes and playoff flags to schedules
        env:
          SHEET_ID: 1IHr84tlMdZVAazLDh0HV7ZWoxNH4UpjpLt_UTV8KZwo
        run: python scripts/enrich_playoff_notes.py

      - name: Verify ALA historical playoff record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path('team-page-data/ala.json').read_text(encoding='utf-8'))
          games=[g for year in (data.get('schedules') or {}).values() for g in year if g.get('playoff') is True]
          wins=sum(1 for g in games if str(g.get('result','')).upper()=='W')
          losses=sum(1 for g in games if str(g.get('result','')).upper()=='L')
          ties=sum(1 for g in games if str(g.get('result','')).upper()=='T')
          print(f'ALA playoff record: {wins}-{losses}-{ties} ({len(games)} games)')
          assert (wins,losses,ties,len(games)) == (3,16,0,19), (
              'ALA playoff regression: expected 3-16 in 19 games, got '
              f'{wins}-{losses}-{ties} in {len(games)} games'
          )
          PY

      - name: Commit enriched team page data
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add team-page-data
          if git diff --cached --quiet; then
            echo "Playoff notes are already current."
          else
            git commit -m "Auto-sync playoff notes to team schedules"
            git push
          fi
