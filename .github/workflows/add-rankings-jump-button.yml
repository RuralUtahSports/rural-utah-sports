name: Add Rankings Jump Button

on:
  push:
    paths:
      - '.github/workflows/add-rankings-jump-button.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add jump to classification rankings button
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('rankings.html')
          s = p.read_text(encoding='utf-8')

          css_anchor = ".badge strong{color:#F14D07}"
          css = ".top-ranking-actions{display:flex;gap:10px;flex-wrap:wrap;margin:-5px 0 24px}.top-ranking-jump{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#F14D07;color:#000;text-decoration:none;padding:12px 16px;border-radius:7px;font-size:12px;font-weight:1000;text-transform:uppercase;box-shadow:0 4px 14px rgba(0,0,0,.28)}.top-ranking-jump:hover{background:#ff6420}.classification-anchor{scroll-margin-top:20px}"
          if '.top-ranking-actions{' not in s:
              if css_anchor not in s:
                  raise SystemExit('CSS anchor not found')
              s = s.replace(css_anchor, css_anchor + css, 1)

          mobile_anchor = "@media(max-width:650px){"
          mobile_css = "@media(max-width:650px){.top-ranking-actions{margin-top:-3px}.top-ranking-jump{width:100%;padding:13px 14px;font-size:12px}"
          if '@media(max-width:650px){.top-ranking-actions' not in s:
              if mobile_anchor not in s:
                  raise SystemExit('Mobile CSS anchor not found')
              s = s.replace(mobile_anchor, mobile_css, 1)

          meta = '<div class="meta" id="rankingMeta"><div class="badge"><strong>2026</strong> Week 1</div><div class="badge">State Top 25 Updated</div><div class="badge">Class Rankings: Preseason</div><div class="badge">RUS Rankings Archive</div></div>'
          actions = meta + '\n<div class="top-ranking-actions"><a class="top-ranking-jump" href="#classification-rankings">↓ Jump to Classification Rankings</a></div>'
          if 'class="top-ranking-actions"' not in s:
              if meta not in s:
                  raise SystemExit('Top meta block not found')
              s = s.replace(meta, actions, 1)

          old_section = '<section class="archive-controls"><div class="archive-field"><label for="rankingSnapshot">Classification Ranking Week</label>'
          new_section = '<section class="archive-controls classification-anchor" id="classification-rankings"><div class="archive-field"><label for="rankingSnapshot">Classification Ranking Week</label>'
          if 'id="classification-rankings"' not in s:
              if old_section not in s:
                  raise SystemExit('Classification controls section not found')
              s = s.replace(old_section, new_section, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit rankings jump button
        run: |
          if git diff --quiet -- rankings.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rankings.html
          git commit -m 'Add jump to classification rankings button'
          git pull --rebase origin main
          git push
