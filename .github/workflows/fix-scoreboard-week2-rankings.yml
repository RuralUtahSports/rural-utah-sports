name: Fix Scoreboard Week 2 Rankings

# Triggered after workflow creation so GitHub runs the one-time repair.
on:
  push:
    paths:
      - '.github/workflows/fix-scoreboard-week2-rankings.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align scoreboard graphics with current rankings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          layout = Path('scoreboard-share-layout.js')
          s = layout.read_text()
          s = s.replace("fetchJson('https://raw.githubusercontent.com/RuralUtahSports/rural-utah-sports/main/standings-2026.json')", "fetchJson('standings-2026.json')")
          s = s.replace("fetchJson('https://raw.githubusercontent.com/RuralUtahSports/rural-utah-sports/main/rankings-current-2026.json')", "fetchJson('rankings-current-2026.json')")
          s = s.replace("fetchJson('https://raw.githubusercontent.com/RuralUtahSports/rural-utah-sports/main/state-top25-history-2026.json')", "fetchJson('state-top25-history-2026.json')")
          old = "const snapshots=stateData?.snapshots||[],latest=snapshots[snapshots.length-1]||stateData;"
          new = "const snapshots=stateData?.snapshots||[],rankingLabel=String(classData?.label||'').trim(),matching=snapshots.find(s=>String(s?.label||'').trim()===rankingLabel),dated=[...snapshots].sort((a,b)=>Date.parse(a?.date||0)-Date.parse(b?.date||0)),latest=matching||dated[dated.length-1]||stateData;"
          if old not in s:
              raise SystemExit('Expected compact ranking snapshot selector not found')
          s = s.replace(old, new, 1)
          layout.write_text(s)

          core = Path('scoreboard-share-layout-core.js')
          c = core.read_text()
          old_core = "const snapshots=stateData?.snapshots||[],latest=snapshots[snapshots.length-1]||stateData;"
          new_core = "const snapshots=stateData?.snapshots||[],rankingLabel=String(classData?.label||'').trim(),matching=snapshots.find(s=>String(s?.label||'').trim()===rankingLabel),dated=[...snapshots].sort((a,b)=>Date.parse(a?.date||0)-Date.parse(b?.date||0)),latest=matching||dated[dated.length-1]||stateData;"
          if old_core not in c:
              raise SystemExit('Expected full-board ranking snapshot selector not found')
          c = c.replace(old_core, new_core, 1)
          core.write_text(c)

          page = Path('scoreboard.html')
          h = page.read_text()
          h = re.sub(r'scoreboard-share-layout\.js\?v=[^\"\']+', 'scoreboard-share-layout.js?v=20260822-week2-ranks1', h)
          page.write_text(h)
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scoreboard-share-layout.js scoreboard-share-layout-core.js scoreboard.html
          if git diff --cached --quiet; then
            echo 'No scoreboard ranking changes needed.'
            exit 0
          fi
          git commit -m 'Use current Week 2 rankings on scoreboard graphics'
          git push
