name: Refresh Football RPI Standings

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'weekly-simulation.json'
      - 'scripts/build_rpi_standings.mjs'
      - 'scripts/fetch_uhsaa_rpi.mjs'
      - 'rpi-oos-2026.json'
      - '.github/workflows/refresh-rpi-standings.yml'

permissions:
  contents: write

concurrency:
  group: football-rpi-standings
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Capture source snapshot for publication
        run: echo "STAT_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Fetch official UHSAA RPI snapshot
        run: node scripts/fetch_uhsaa_rpi.mjs

      - name: Build RUS RPI standings
        run: node scripts/build_rpi_standings.mjs

      - name: Verify generated standings
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('rpi-standings-2026.json', 'utf8'));
          const classes = ['6A', '5A', '4A', '3A', '2A', '1A', '8P'];
          const rows = classes.flatMap((classification) => data.classifications?.[classification] || []);
          if (rows.length !== 116) throw new Error(`Expected 116 ranked teams, found ${rows.length}`);
          if (rows.some((row) => !Number.isFinite(row.rpi))) throw new Error('Invalid RPI value found');
          console.log(`Verified ${rows.length} football RPI rows.`);
          NODE

      - name: Commit refreshed standings
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          node scripts/check_stat_publish_2026.mjs --snapshot-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uhsaa-rpi-official-2026.json rpi-standings-2026.json
          if git diff --cached --quiet; then echo "Derived data already current."; exit 0; fi
          git commit -m "Refresh derived data from current source snapshot"
          git push origin HEAD:main
