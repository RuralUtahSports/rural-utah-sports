name: Apply Partial Weekly Picks Ranking

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-partial-picks-ranking.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Allow and fairly rank partial picks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('weekly-picks-enhanced.js')
          s = p.read_text()
          s = s.replace("eligible:!!user&&picked===w.games.length&&scorePicks===w.games.length", "eligible:!!user&&picked>0")
          old = "(Number(!a.eligible)-Number(!b.eligible))||((a.totalError??Infinity)-(b.totalError??Infinity))||(b.correct-a.correct)||a.username.localeCompare(b.username)"
          new = "(Number(!a.eligible)-Number(!b.eligible))||(b.correct-a.correct)||((b.accuracy??-1)-(a.accuracy??-1))||(b.completed-a.completed)||((a.avgError??Infinity)-(b.avgError??Infinity))||a.username.localeCompare(b.username)"
          s = s.replace(old, new)
          s = s.replace("r.isRus?'RUS':r.eligible?'Complete':'Incomplete'", "r.isRus?'RUS':r.eligible&&r.picked===(wpCurrentWeek()?.games.length||0)?'Complete':r.eligible?'Partial':'No Picks'")
          s = s.replace("Incomplete entries stay below ranked entries.", "Partial entries are accepted. Score guesses are optional.")
          p.write_text(s)
          PY
      - name: Commit client ranking update
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add weekly-picks-enhanced.js
          if git diff --cached --quiet; then
            echo "Partial picks ranking already applied."
          else
            git commit -m "Allow partial weekly picks on leaderboard"
            git pull --rebase origin main
            git push
          fi
