name: Import boys basketball rosters

on:
  push:
    branches: [main]
    paths:
      - 'scripts/import_boys_basketball_rosters.py'
      - '.github/workflows/import-boys-basketball-rosters.yml'
      - 'boys-basketball-teams.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: pip install beautifulsoup4
      - name: Import Deseret rosters
        run: python3 scripts/import_boys_basketball_rosters.py
      - name: Verify roster output
        run: |
          python3 - <<'PY'
          import json, pathlib
          idx=json.load(open('boys-basketball-rosters/index.json'))
          s=idx['summary']
          print(s)
          if s['teams'] < 140:
              raise SystemExit('Too few teams')
          if s['rostersImported'] < 700:
              raise SystemExit('Too few rosters imported')
          if s['playerRows'] < 8000:
              raise SystemExit('Too few player rows imported')
          if s['failures'] > 300:
              raise SystemExit('Too many roster page failures')
          sample=idx['teams'].get('JUAB')
          if not sample or not pathlib.Path(sample['file']).exists():
              raise SystemExit('Juab roster file missing')
          PY
      - name: Commit roster history
        run: |
          git add boys-basketball-rosters
          if git diff --cached --quiet; then
            echo "No roster data changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import boys basketball rosters back to 2020"
          git pull --rebase origin main
          git push
