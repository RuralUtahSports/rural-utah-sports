name: Enlarge Ranking Share Logos V2

on:
  push:
    paths:
      - '.github/workflows/enlarge-ranking-share-logos-v2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enlarge ranking share logos substantially
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, io, re

          # Give the logo much more of each ranking card while keeping it contained.
          js = Path('share-graphic.js')
          s = js.read_text()
          s = re.sub(
              r'\.rus-export-rank-item\{[^}]+\}',
              '.rus-export-rank-item{position:relative;border:1px solid rgba(255,255,255,.14);border-left:8px solid var(--accent,#555);border-radius:10px;padding:9px 8px 7px;overflow:hidden;box-sizing:border-box;background:linear-gradient(135deg,var(--tint,rgba(255,255,255,.12)),#141414 72%);display:flex;flex-direction:column;align-items:center}',
              s,
              count=1
          )
          s = re.sub(
              r'\.rus-export-logo-wrap\{[^}]+\}',
              '.rus-export-logo-wrap{margin-top:auto;height:94px;min-height:94px;max-height:94px;width:100%;display:flex;align-items:center;justify-content:center;padding:0 2px;overflow:hidden;box-sizing:border-box}',
              s,
              count=1
          )
          s = re.sub(
              r'\.rus-export-logo-large\{[^}]+\}',
              '.rus-export-logo-large{display:block;width:auto;height:auto;max-width:100%;max-height:90px;object-fit:contain;object-position:center center;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}',
              s,
              count=1
          )
          # Compact the text just slightly so the larger logo never collides with it.
          s = s.replace('margin-top:6px;font-weight:1000;text-align:center}.rus-export-logo-wrap', 'margin-top:4px;font-weight:1000;text-align:center}.rus-export-logo-wrap', 1)
          s = s.replace('flex-wrap:wrap;margin-top:6px;color:#d8d8d8', 'flex-wrap:wrap;margin-top:4px;color:#d8d8d8', 1)
          js.write_text(s)

          # Rebuild the custom share PNGs with less internal transparent padding.
          src_dir = Path('school-logos')
          out_dir = Path('school-logo-share')
          out_dir.mkdir(exist_ok=True)
          for svg in sorted(src_dir.glob('*.svg')):
              try:
                  text = svg.read_text(errors='ignore')
                  m = re.search(r'href=["\']data:image/[^;]+;base64,([^"\']+)', text, re.I | re.S)
                  if not m:
                      continue
                  raw = base64.b64decode(re.sub(r'\s+', '', m.group(1)))
                  im = Image.open(io.BytesIO(raw)).convert('RGBA')
                  bbox = im.getchannel('A').getbbox()
                  if bbox:
                      im = im.crop(bbox)
                  canvas_w, canvas_h = 512, 384
                  inner_w, inner_h = 452, 314
                  scale = min(inner_w / max(1, im.width), inner_h / max(1, im.height))
                  new_size = (max(1, round(im.width * scale)), max(1, round(im.height * scale)))
                  im = im.resize(new_size, Image.Resampling.LANCZOS)
                  canvas = Image.new('RGBA', (canvas_w, canvas_h), (0,0,0,0))
                  canvas.alpha_composite(im, ((canvas_w-im.width)//2, (canvas_h-im.height)//2))
                  canvas.save(out_dir / f'{svg.stem}.png', 'PNG', optimize=True)
                  print('rebuilt', svg.stem, new_size)
              except Exception as e:
                  print('skipping', svg.name, e)

          # Force mobile browsers to load this version immediately.
          rank = Path('rankings.html')
          text = rank.read_text()
          text = re.sub(r"share-graphic\.js\?v=[^\"']+", 'share-graphic.js?v=20260815-logo-xl', text)
          rank.write_text(text)
          PY

      - name: Commit larger ranking logos
        run: |
          if git diff --quiet -- share-graphic.js rankings.html school-logo-share && [ -z "$(git status --porcelain school-logo-share)" ]; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add share-graphic.js rankings.html school-logo-share
          git commit -m 'Make ranking share logos substantially larger'
          git pull --rebase origin main
          git push
