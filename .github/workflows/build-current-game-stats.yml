name: Build Current Game Stats

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deseret-game-details.json'
      - 'weekly-simulation.json'
      - 'deseret-team-data-2026.json'
      - 'manual-stat-corrections-2026.json'
      - 'maxpreps-player-game-stats-2026.json'
      - 'scripts/build_player_game_stats.mjs'
      - 'scripts/merge_maxpreps_game_logs.mjs'
      - 'scripts/propose_4a6a_canonical_game_repairs_2026.mjs'
      - 'audits/2026-regular-season/reconciled-4a6a-player-cases-2026.json'
      - 'scripts/merge_verified_deseret_kicking.mjs'
      - 'deseret-kicking-game-stats-2026.json'
      - 'scripts/reconcile_season_stats_from_game_logs.mjs'
      - 'scripts/protect_regular_season_import_2026.mjs'
      - 'scripts/lib/regular-season-import-2026.mjs'
      - 'scripts/lib/verified-player-corrections-2026.mjs'
      - 'regular-season-corrections-batch-*-2026.json'
      - 'regular-season-correction-batches-2026.json'
      - 'scripts/lib/reviewed-batches-2026.mjs'
      - 'scripts/lib/stat-import-integrity-2026.mjs'
      - 'scripts/build_regular_season_publication_2026.mjs'
      - 'scripts/check_stat_publish_2026.mjs'
      - 'competition-scope-review-2026.json'
      - 'scripts/build_deseret_stat_metrics.mjs'
      - 'scripts/build_weekly_awards.mjs'
      - 'scripts/build_team_current_shards.mjs'
      - 'award-scoring-core.js'
      - '.github/workflows/build-current-game-stats.yml'

permissions:
  contents: write

concurrency:
  group: current-football-statistics
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture published statistics before importing
        run: |
          echo "STAT_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cp deseret-rosters-stats-2026.json "$RUNNER_TEMP/regular-season-retained.json"
          cp player-game-stats-2026.json "$RUNNER_TEMP/regular-games-retained.json"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build current game stats and season totals
        run: |
          node scripts/apply_manual_stat_corrections.mjs
          node scripts/build_player_game_stats.mjs
          node scripts/merge_maxpreps_game_logs.mjs
          node scripts/reconcile_season_stats_from_game_logs.mjs
          node scripts/merge_verified_deseret_kicking.mjs
          node scripts/protect_regular_season_import_2026.mjs --baseline="$RUNNER_TEMP/regular-season-retained.json" --games-baseline="$RUNNER_TEMP/regular-games-retained.json" --candidate-output="$RUNNER_TEMP/regular-season-import-candidate.json"
          # After import preservation, install ONLY reviewed opponent-game cells.
          # Re-run on every rebuild to preserve those boxes against stale feeds.
          node scripts/propose_4a6a_canonical_game_repairs_2026.mjs --apply --output="$RUNNER_TEMP/4a6a-source-repairs"
          node scripts/build_regular_season_publication_2026.mjs
          node scripts/build_deseret_stat_metrics.mjs
          node scripts/build_weekly_awards.mjs
          node scripts/build_team_current_shards.mjs
      - name: Retain source import candidate for statistical review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regular-season-import-candidate
          path: ${{ runner.temp }}/regular-season-import-candidate.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify current game stats and season totals
        run: |
          node - <<'NODE'
          const fs=require('fs');

          const games=JSON.parse(fs.readFileSync('player-game-stats-2026.json','utf8'));
          if(!games.summary||games.summary.teamGames<400) throw new Error('Current game stat output is incomplete');
          const gameAge=Date.now()-Date.parse(games.updatedAt);
          if(!Number.isFinite(gameAge)||gameAge>15*60*1000) throw new Error('Current game stat output was not rebuilt');

          const season=JSON.parse(fs.readFileSync('deseret-rosters-stats-2026.json','utf8'));
          const seasonAge=Date.now()-Date.parse(season.updatedAt);
          if(!Number.isFinite(seasonAge)||seasonAge>15*60*1000) throw new Error('Season stat totals were not reconciled');
          const reconciliation=season.summary?.gameLogSeasonReconciliation;
          if(!reconciliation||!Number.isFinite(reconciliation.teams)) throw new Error('Season reconciliation summary is missing');

          const metrics=JSON.parse(fs.readFileSync('deseret-stat-metrics-2026.json','utf8'));
          if(Object.keys(metrics.teams||{}).length!==Object.keys(season.teams||{}).length) throw new Error('Compact stat metrics do not match season team coverage');

          const weeklyAwards=JSON.parse(fs.readFileSync('weekly-awards-2026.json','utf8'));
          if(!weeklyAwards.weeks?.length) throw new Error('Weekly awards output is empty');

          const shards=fs.readdirSync('team-current-data').filter(name=>name.endsWith('.json'));
          if(shards.length<100) throw new Error('Per-team current-data output is incomplete');

          console.log(games.summary);
          console.log(`Season reconciliation: ${reconciliation.teams-reconciliation.skippedTeams} complete teams rebuilt, ${reconciliation.skippedTeams} incomplete teams preserved.`);
          console.log(`Verified ${weeklyAwards.weeks.length} weekly award slate(s) and ${shards.length} per-team shards.`);
          NODE
      - name: Publish current game stats and season totals
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$STAT_SOURCE_COMMIT" ]; then
            echo "Main changed during import. Rerun against latest main; do not overwrite newer data."
            exit 1
          fi
          node scripts/check_stat_publish_2026.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regular-season-publication-2026.json deseret-rosters-stats-2026.json deseret-stat-metrics-2026.json player-game-stats-2026.json weekly-awards-2026.json team-current-data
          if git diff --cached --quiet; then echo "Statistics already current."; exit 0; fi
          git commit -m "Refresh source data; preserve reviewed regular-season statistics"
          git push origin HEAD:main
