name: Build Historical Playoff Brackets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-playoff-brackets.yml'
  schedule:
    - cron: '37 9 * * 1'

permissions:
  contents: write

concurrency:
  group: playoff-brackets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build bracket JSON from UHSAA All Time Playoffs sheet
        env:
          SHEET_ID: 1VQeDOr2V0-PNc8sT1nxMZ4gF7gNz_Xyrzo2vPoNy0_k
        run: |
          node <<'NODE'
          const fs=require('fs');
          const years={
            2025:426454698,
            2024:0,
            2023:1981707037,
            2022:1162076855,
            2021:428877866,
            2020:1949217040
          };
          const classOrder=['6A','5A','4A','3A','2A','1A','8-Player'];
          function parseCSV(text){
            const rows=[];let row=[],field='',quoted=false;
            for(let i=0;i<text.length;i++){
              const c=text[i];
              if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}
              else if(c==='"')quoted=true;
              else if(c===','){row.push(field);field=''}
              else if(c==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field=''}
              else field+=c;
            }
            if(field.length||row.length){row.push(field.replace(/\r$/,''));rows.push(row)}
            return rows;
          }
          const clean=v=>String(v??'').replace(/\r/g,'').trim();
          function validTeam(v){
            const s=clean(v);if(!s)return false;
            if(/^\d+$/.test(s))return false;
            if(/ROUND|FINAL|CHAMPION|QUARTER|SEMIFINAL|HOME TEAM|U OF U|SUU|STADIUM/i.test(s))return false;
            return true;
          }
          function sideGames(rows,start,end,teamCol,scoreCol){
            const entries=[];
            for(let r=start;r<end;r++){
              const team=clean(rows[r]?.[teamCol]),score=clean(rows[r]?.[scoreCol]);
              if(validTeam(team)&&score!=='')entries.push({row:r,team,score});
            }
            const games=[];
            for(let i=0;i+1<entries.length;i+=2){
              const a=entries[i],b=entries[i+1];
              games.push({center:(a.row+b.row)/2,game:[a.team,a.score,b.team,b.score]});
            }
            return games;
          }
          function mergedRound(rows,start,end,leftTeam,leftScore,rightTeam,rightScore){
            return [...sideGames(rows,start,end,leftTeam,leftScore),...sideGames(rows,start,end,rightTeam,rightScore)]
              .sort((a,b)=>a.center-b.center).map(x=>x.game);
          }
          function centerGames(rows,start,end,teamCol,scoreCol){return sideGames(rows,start,end,teamCol,scoreCol).map(x=>x.game)}
          function parseSection(rows,start,end,cls){
            const first=mergedRound(rows,start,end,4,6,38,40);
            const second=mergedRound(rows,start,end,8,10,34,36);
            const quarter=mergedRound(rows,start,end,12,14,30,32);
            const semi=mergedRound(rows,start,end,16,18,26,28);
            const champ=centerGames(rows,start,end,21,24);
            const rounds=[];
            if(first.length)rounds.push(['First Round',first]);
            if(second.length)rounds.push(['Second Round',second]);
            if(quarter.length)rounds.push(['Quarterfinals',quarter]);
            if(semi.length)rounds.push(['Semifinals',semi]);
            if(champ.length)rounds.push(['Championship',champ]);
            return rounds;
          }
          async function fetchYear(year,gid){
            const url=`https://docs.google.com/spreadsheets/d/${process.env.SHEET_ID}/export?format=csv&gid=${gid}`;
            const res=await fetch(url,{headers:{'User-Agent':'Rural-Utah-Sports-Brackets'}});
            if(!res.ok)throw new Error(`${year} sheet download failed ${res.status}`);
            const rows=parseCSV(await res.text());
            const starts=[];
            for(let r=0;r<rows.length;r++){
              const joined=(rows[r]||[]).map(clean).join(' | ');
              if(/CHAMPIONSHIP/i.test(joined)&&(/1ST ROUND|QUARTERFINALS/i.test(joined)))starts.push(r);
            }
            if(starts.length<6)throw new Error(`${year}: only found ${starts.length} bracket sections`);
            const out={};
            for(let i=0;i<Math.min(starts.length,classOrder.length);i++){
              const s=starts[i],e=i+1<starts.length?starts[i+1]:rows.length;
              out[classOrder[i]]=parseSection(rows,s,e,classOrder[i]);
            }
            return out;
          }
          (async()=>{
            const output={source:'UHSAA All Time Playoffs',generatedAt:new Date().toISOString(),years:{}};
            for(const [year,gid] of Object.entries(years)){
              output.years[year]=await fetchYear(year,gid);
              const counts=Object.entries(output.years[year]).map(([c,r])=>`${c}:${r.reduce((n,x)=>n+x[1].length,0)}`).join(', ');
              console.log(`${year} ${counts}`);
            }
            fs.writeFileSync('playoff-brackets.json',JSON.stringify(output,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify bracket output
        run: |
          node <<'NODE'
          const d=require('./playoff-brackets.json');
          for(const y of ['2020','2021','2022','2023','2024','2025']){
            if(!d.years[y])throw new Error(`Missing ${y}`);
            for(const c of ['6A','5A','4A','3A','2A','1A']){
              if(!Array.isArray(d.years[y][c])||!d.years[y][c].length)throw new Error(`Missing ${y} ${c}`);
              const final=d.years[y][c].find(x=>x[0]==='Championship');
              if(!final||!final[1].length)throw new Error(`Missing championship ${y} ${c}`);
            }
          }
          console.log('Bracket archive verified');
          NODE
      - name: Commit bracket archive
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add playoff-brackets.json
          if git diff --cached --quiet; then echo "Bracket archive current."; exit 0; fi
          git commit -m "Update 2020-2025 playoff bracket archive"
          ok=0
          for attempt in 1 2 3 4; do if git pull --rebase origin main && git push; then ok=1; break; fi; sleep 10; done
          if [ "$ok" -ne 1 ]; then exit 1; fi
