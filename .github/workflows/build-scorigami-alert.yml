name: Build Scorigami Alert Feed

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Build Scorigami Data']
    types: [completed]
  push:
    paths:
      - 'scorigami.json'
      - 'weekly-simulation.json'
      - 'deseret-live-details-2026.json'
      - '.github/workflows/build-scorigami-alert.yml'

permissions:
  contents: write

concurrency:
  group: scorigami-alert-feed
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build lightweight alert feed
        run: |
          node <<'NODE'
          const fs=require('fs');
          const clean=v=>String(v??'').trim();
          const norm=v=>clean(v).toUpperCase().replace(/\s+/g,' ');
          const aliases={'GUNNISON':'GUNNISON VALLEY','MAPLE MTN':'MAPLE MOUNTAIN','MONUMENT VAL':'MONUMENT VALLEY','CEDAR':'CEDAR CITY','SUMMIT':'SUMMIT ACADEMY','WASATCH ACAD':'WASATCH ACADEMY','WASATCH ACAD.':'WASATCH ACADEMY','HINKLEY':'HINCKLEY','BY HIGH':'BYH','BRIGHAM YOUNG':'BYH','UTAH SCH DEAF':'USDB','AMRICAN FORK':'AMERICAN FORK','DESERET HILLS':'DESERT HILLS','MOUNUMENT VALLEY':'MONUMENT VALLEY','MONTUMENT VALLEY':'MONUMENT VALLEY','MOAPA VALLEY(NV)':'MOAPA VALLEY (NV)','VIRGIN VAL (NV)':'VIRGIN VALLEY (NV)','VIRGIN VALLEY (NV))':'VIRGIN VALLEY (NV)','BOULDER CITY(NV)':'BOULDER CITY (NV)','HIGHLAND, ID':'HIGHLAND (ID)','MARSH VALLEY(ID)':'MARSH VALLEY (ID)','ONEIDA ACAD.(ID)':'ONEIDA ACADEMY (ID)','RAYMOND, ALBERTA':'RAYMOND (ALBERTA)','ST LOUIS (HI)':'ST. LOUIS (HI)','CROWNPOINT (NM)':'CROWN POINT (NM)','KIRKLAND (NM)':'KIRTLAND (NM)','MTN CREST JV':'MOUNTAIN CREST JV','EAST HIGH 2ND TEAM':'EAST 2ND TEAM','WEST HIGH 2ND TEAM':'WEST 2ND TEAM','MTN. VIEW CHRISTIAN (NV)':'MTN VIEW CHRISTIAN (NV)','MONUMENT VAL (AZ) JV':'MONUMENT VALLEY (AZ) JV','BLOOMFIELD(NM)JV':'BLOOMFIELD (NM) JV'};
          const team=v=>{const n=norm(v).replace(/\.+$/,'').trim();if(n.startsWith('WASATCH ACAD'))return'WASATCH ACADEMY';return aliases[n]||n};
          const day=v=>{const t=Date.parse(clean(v));return Number.isFinite(t)?t:0};
          const scoreKey=(a,b)=>`${Math.max(Number(a),Number(b))}-${Math.min(Number(a),Number(b))}`;
          const gameId=g=>`${clean(g.date)}|${team(g.awayTeam)}|${team(g.homeTeam)}|${Number(g.actualAway)}-${Number(g.actualHome)}`;
          const hasScore=g=>g.actualAway!==null&&g.actualAway!==undefined&&g.actualHome!==null&&g.actualHome!==undefined&&Number.isFinite(Number(g.actualAway))&&Number.isFinite(Number(g.actualHome));
          const out={updatedAt:new Date().toISOString(),alerts:[]};
          if(!fs.existsSync('scorigami.json')){
            fs.writeFileSync('scorigami-latest.json',JSON.stringify(out));process.exit(0);
          }
          const sc=JSON.parse(fs.readFileSync('scorigami.json','utf8'));
          const byScore=new Map((sc.scores||[]).map(x=>[`${x.winner}-${x.loser}`,x]));
          const finals=[];

          if(fs.existsSync('weekly-simulation.json')){
            try{
              const weekly=JSON.parse(fs.readFileSync('weekly-simulation.json','utf8'));
              for(const g of (weekly.games||[])) if(hasScore(g)) finals.push({...g,source:'weekly'});
            }catch(e){console.warn('Weekly Simulation alerts skipped:',e.message)}
          }

          if(fs.existsSync('deseret-live-details-2026.json')){
            try{
              const live=JSON.parse(fs.readFileSync('deseret-live-details-2026.json','utf8'));
              for(const [key,d] of Object.entries(live.games||{})){
                const isFinal=d?.final===true||/^final$/i.test(clean(d?.status));
                const rows=d?.boxScore?.rows;
                if(!isFinal||!Array.isArray(rows)||rows.length<2) continue;
                const a=Number(rows[0]?.total),h=Number(rows[1]?.total);
                if(!Number.isFinite(a)||!Number.isFinite(h)||a<0||h<0) continue;
                const parts=String(key).split('|');
                const g={date:clean(d?.date||parts[0]),awayTeam:clean(d?.awayTeam||parts[1]),homeTeam:clean(d?.homeTeam||parts[2]),actualAway:a,actualHome:h,deseretUrl:clean(d?.url),source:'live'};
                if(g.date&&g.awayTeam&&g.homeTeam) finals.push(g);
              }
            }catch(e){console.warn('Live scoreboard alerts skipped:',e.message)}
          }

          const deduped=new Map();
          for(const g of finals){
            const key=`${day(g.date)}|${[team(g.awayTeam),team(g.homeTeam)].sort().join('|')}|${scoreKey(g.actualAway,g.actualHome)}`;
            const prior=deduped.get(key);
            if(!prior||g.source==='live') deduped.set(key,g);
          }

          const exactFor=(entry,g)=>{
            const targetDay=day(g.date),away=team(g.awayTeam),home=team(g.homeTeam);
            return (entry?.games||[]).some(x=>day(x.date)===targetDay&&new Set([team(x.team1||x.winner),team(x.team2||x.loser)]).has(away)&&new Set([team(x.team1||x.winner),team(x.team2||x.loser)]).has(home));
          };

          const alerts=[];
          for(const g of deduped.values()){
            const k=scoreKey(g.actualAway,g.actualHome),entry=byScore.get(k);
            if(!entry||Number(entry.count)!==1)continue;
            const a=Number(g.actualAway),h=Number(g.actualHome),tie=a===h;
            const winner=tie?g.awayTeam:(a>h?g.awayTeam:g.homeTeam),loser=tie?g.homeTeam:(a>h?g.homeTeam:g.awayTeam);
            const winnerScore=Math.max(a,h),loserScore=Math.min(a,h);
            if(!exactFor(entry,g))continue;
            alerts.push({id:gameId(g),date:g.date,awayTeam:g.awayTeam,homeTeam:g.homeTeam,awayScore:a,homeScore:h,winner,loser,winnerScore,loserScore,score:k,tie,deseretUrl:g.deseretUrl||''});
          }
          alerts.sort((a,b)=>day(b.date)-day(a.date)||a.id.localeCompare(b.id));
          out.alerts=alerts.slice(0,5);
          fs.writeFileSync('scorigami-latest.json',JSON.stringify(out));

          const liveFinals=[...deduped.values()].filter(g=>g.source==='live'&&day(g.date)>0);
          const latestDay=liveFinals.length?Math.max(...liveFinals.map(g=>day(g.date))):0;
          const checks=liveFinals.filter(g=>day(g.date)===latestDay).map(g=>{
            const score=scoreKey(g.actualAway,g.actualHome),entry=byScore.get(score);
            return {date:g.date,awayTeam:g.awayTeam,homeTeam:g.homeTeam,awayScore:Number(g.actualAway),homeScore:Number(g.actualHome),score,count:entry?Number(entry.count):0,exact:!!entry&&exactFor(entry,g),scorigami:!!entry&&Number(entry.count)===1&&exactFor(entry,g)};
          }).sort((a,b)=>a.awayTeam.localeCompare(b.awayTeam)||a.homeTeam.localeCompare(b.homeTeam));
          const diagnostics={updatedAt:new Date().toISOString(),latestDay:latestDay?new Date(latestDay).toISOString():null,liveFinalsChecked:checks.length,checks};
          fs.writeFileSync('scorigami-checks.json',JSON.stringify(diagnostics,null,2));
          console.log(`Current Scorigami alerts: ${out.alerts.length}; latest live finals checked: ${checks.length}; Scorigamis: ${checks.filter(x=>x.scorigami).length}`);
          NODE
      - name: Commit alert feed
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add scorigami-latest.json scorigami-checks.json
          if git diff --cached --quiet; then echo "Scorigami alert feed current."; exit 0; fi
          cp scorigami-latest.json /tmp/scorigami-latest.json
          cp scorigami-checks.json /tmp/scorigami-checks.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/scorigami-latest.json scorigami-latest.json
            cp /tmp/scorigami-checks.json scorigami-checks.json
            git add scorigami-latest.json scorigami-checks.json
            if git diff --cached --quiet; then
              echo "Scorigami alert feed current."
              exit 0
            fi
            git commit -m "Update current Scorigami alerts"
            if git push origin HEAD:main; then
              echo "Scorigami alert feed published on attempt ${attempt}."
              exit 0
            fi
            echo "Push raced with another update; retrying (${attempt}/5)."
            git reset --hard origin/main
            sleep 5
          done
          echo "Unable to publish Scorigami alert feed after 5 attempts." >&2
          exit 1
