name: Sync Finals to Weekly Feed

on:
  workflow_dispatch:
  push:
    paths:
      - 'deseret-live-details-2026.json'
      - 'deseret-game-details.json'
      - '.github/workflows/sync-live-finals-to-weekly.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-live-finals-to-weekly
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Copy verified finals into weekly simulation
        run: |
          node <<'NODE'
          const fs = require('fs');
          const clean = v => String(v ?? '').trim();
          const compact = v => clean(v).toUpperCase().replace(/[^A-Z0-9]/g, '');
          const isoDate = value => {
            const s = clean(value);
            let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (m) return m[3] + '-' + String(m[1]).padStart(2, '0') + '-' + String(m[2]).padStart(2, '0');
            m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
            return m ? m[1] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[3]).padStart(2, '0') : '';
          };
          const keyFor = g => isoDate(g.date) + '|' + compact(g.awayTeam) + '|' + compact(g.homeTeam);
          const aliases = new Map([
            ['UMALEHI', 'UMALEHI'],
            ['UMACAMPWILLIAMS', 'UMALEHI'],
            ['UTAHMILITARYCAMPWILLIAMS', 'UMALEHI'],
            ['UTAHMILITARYACADEMYCAMPWILLIAMS', 'UMALEHI'],
            ['SAINTJOSEPH', 'SAINTJOSEPH'],
            ['STJOSEPH', 'SAINTJOSEPH']
          ]);
          const canonical = value => aliases.get(compact(value)) || compact(value);
          const dayNumber = value => {
            const normalized = isoDate(value);
            const time = normalized ? Date.parse(normalized + 'T12:00:00Z') : NaN;
            return Number.isFinite(time) ? time / 86400000 : null;
          };
          const statusRank = detail => {
            if (detail?.final === true || /^final$/i.test(clean(detail?.status))) return 0;
            if (/^(?:live|q[1-4]|halftime|half|ot)$/i.test(clean(detail?.status)) || clean(detail?.clock)) return 1;
            return 2;
          };
          const findDetailForGame = (game, payload) => {
            const targetDay = dayNumber(game.date);
            if (targetDay === null) return null;
            const targetAway = canonical(game.awayTeam);
            const targetHome = canonical(game.homeTeam);
            const candidates = Object.entries(payload.games || {}).flatMap(([key, detail]) => {
              const parts = String(key).split('|');
              const candidateDay = dayNumber(detail?.date || parts[0]);
              if (candidateDay === null) return [];
              const distance = Math.abs(candidateDay - targetDay);
              if (distance > 3) return [];
              const away = canonical(detail?.awayTeam || parts[1]);
              const home = canonical(detail?.homeTeam || parts[2]);
              if (away !== targetAway || home !== targetHome) return [];
              return [{ detail, distance, rank: statusRank(detail) }];
            });
            if (!candidates.length) return null;
            const finals = candidates.filter(candidate => candidate.rank === 0);
            const exact = candidates.filter(candidate => candidate.distance === 0);
            const pool = finals.length ? finals : exact.length ? exact : candidates;
            const bestDistance = Math.min(...pool.map(candidate => candidate.distance));
            const nearest = pool.filter(candidate => candidate.distance === bestDistance);
            return nearest.length === 1 ? nearest[0].detail : null;
          };

          const weekly = JSON.parse(fs.readFileSync('weekly-simulation.json','utf8'));
          const live = JSON.parse(fs.readFileSync('deseret-live-details-2026.json','utf8'));
          const full = fs.existsSync('deseret-game-details.json')
            ? JSON.parse(fs.readFileSync('deseret-game-details.json','utf8'))
            : { games: {} };
          // The compact live feed is authoritative for delayed/manual finals.
          // The full Deseret feed carries the regular Friday finals as well.
          const mergedDetails = {
            games: { ...(full.games || {}), ...(live.games || {}) }
          };
          let changed = 0;

          for (const g of weekly.games || []) {
            const detail = findDetailForGame(g, mergedDetails);
            if (!detail) continue;
            if (detail.final !== true) {
              if (detail.statusSource === 'deseret-browser-live-early-final-guard' &&
                  (g.actualAway !== null || g.actualHome !== null || clean(g.actualWinner) || clean(g.wl))) {
                g.actualAway = null;
                g.actualHome = null;
                g.actualWinner = '';
                g.wl = '';
                changed++;
              }
              continue;
            }
            const rows = detail.boxScore?.rows;
            if (!Array.isArray(rows) || rows.length < 2) continue;
            const away = Number(rows[0]?.total);
            const home = Number(rows[1]?.total);
            if (!Number.isFinite(away) || !Number.isFinite(home) || away < 0 || home < 0) continue;

            const winner = away === home ? 'TIE' : away > home ? g.awayTeam : g.homeTeam;
            const predictedWinner = canonical(g.winner);
            const actualWinner = canonical(winner);
            const wl = away === home ? 'T' : predictedWinner ? (predictedWinner === actualWinner ? 'W' : 'L') : '';
            if (g.actualAway === away && g.actualHome === home && g.actualWinner === winner && g.wl === wl) continue;
            g.actualAway = away;
            g.actualHome = home;
            g.actualWinner = winner;
            g.wl = wl;
            changed++;
          }

          if (changed) fs.writeFileSync('weekly-simulation.json', JSON.stringify(weekly));
          console.log(`Live finals synced into weekly feed: ${changed}`);
          NODE

      - name: Commit synced finals
        id: publish
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add weekly-simulation.json
          if git diff --cached --quiet; then
            echo "Weekly final scores are already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync verified finals into weekly simulation"
            ok=0
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push; then
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then exit 1; fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh downstream data from new finals
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-scorigami.yml --ref main
          gh workflow run update-live-scoreboard.yml --ref main
