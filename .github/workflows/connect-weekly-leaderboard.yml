name: Connect Weekly Leaderboard

on:
  push:
    paths:
      - '.github/workflows/connect-weekly-leaderboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link shared leaderboard
        run: |
          if ! grep -q 'weekly-picks-backend.js' simulators.html; then
            sed -i 's#<script src="weekly-picks-enhanced.js"></script>#<script src="weekly-picks-enhanced.js"></script>\n<script src="weekly-picks-backend.js"></script>#' simulators.html
          fi
      - name: Validate JavaScript
        run: |
          node --check weekly-picks.js
          node --check weekly-picks-enhanced.js
          node --check weekly-picks-backend.js
      - name: Commit
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add simulators.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Connect shared weekly picks leaderboard"
          git push
