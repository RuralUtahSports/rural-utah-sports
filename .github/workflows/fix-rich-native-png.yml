name: Fix Rich Native PNG

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-rich-native-png.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point Rich directly at native PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          for name in ['school-logo-integration.js','school-assets.js']:
              p=Path(name)
              s=p.read_text()
              s=s.replace("'RICH':'school-logos/rich-user.svg'", "'RICH':'school-logos/rich.png'")
              s=s.replace("'RICH':'school-logos/rich.svg'", "'RICH':'school-logos/rich.png'")
              if name == 'school-assets.js' and "'RICH':'school-logos/rich.png'" not in s:
                  marker="  'PROVIDENCE HALL':'school-logos/providence-hall.svg',\n"
                  if marker in s:
                      s=s.replace(marker, marker+"  'RICH':'school-logos/rich.png',\n")
              p.write_text(s)

          p=Path('school-logo-cache.json')
          data=json.loads(p.read_text())
          data['RICH']='school-logos/rich.png'
          p.write_text(json.dumps(data, indent=2)+"\n")
          PY
      - name: Commit fix
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add school-logo-integration.js school-assets.js school-logo-cache.json
          if git diff --cached --quiet; then
            echo "Already fixed"
            exit 0
          fi
          git commit -m "Use native PNG for Rich logo everywhere"
          git pull --rebase origin main
          git push
