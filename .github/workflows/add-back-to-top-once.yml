name: Add Back To Top Once
on:
  push:
    paths:
      - '.github/workflows/add-back-to-top-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared back-to-top script to root pages
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=[]
          for p in sorted(Path('.').glob('*.html')):
              text=p.read_text()
              if 'back-to-top.js' in text:
                  continue
              if '</body>' not in text:
                  continue
              text=text.replace('</body>','<script src="back-to-top.js" defer></script>\n</body>')
              p.write_text(text)
              changed.append(p.name)
          print('Updated:', ', '.join(changed))
          assert changed, 'No pages updated'
          PY
      - name: Verify all root pages
        run: |
          python - <<'PY'
          from pathlib import Path
          missing=[]
          for p in sorted(Path('.').glob('*.html')):
              if '</body>' in p.read_text() and 'back-to-top.js' not in p.read_text():
                  missing.append(p.name)
          print('Missing:', missing)
          assert not missing
          PY
      - name: Commit changes
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add '*.html'
          git commit -m "Add floating back to top button across site"
          git pull --rebase origin main
          git push
