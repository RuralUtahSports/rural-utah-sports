name: Build boys basketball season history

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_boys_basketball_season_history.mjs'
      - '.github/workflows/build-boys-basketball-season-history.yml'
      - 'boys-basketball-games-*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build season history summary
        run: node scripts/build_boys_basketball_season_history.mjs
      - name: Commit season history summary
        run: |
          git add boys-basketball-season-history-2002-26.json
          if git diff --cached --quiet; then
            echo "No basketball season history changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build basketball season history summary"
          git pull --rebase origin main
          git push
