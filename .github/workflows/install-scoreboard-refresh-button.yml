name: Install Scoreboard Refresh Button

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-scoreboard-refresh-button.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add refresh script to scoreboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scoreboard.html')
          s=p.read_text()
          tag='<script src="scoreboard-refresh.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add scoreboard.html
          if git diff --cached --quiet; then
            echo "Refresh button already installed."
            exit 0
          fi
          git commit -m "Add refresh button to scoreboard"
          git pull --rebase origin main
          git push
