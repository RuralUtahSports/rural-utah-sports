name: Check Deseret 2026-27 Basketball Schedule Availability
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-deseret-2027-basketball.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check 2027 season team and statewide basketball schedule pages
        run: |
          node --input-type=module <<'NODE'
          const base='https://sports.deseret.com';
          const paths=[
            '/high-school/school/kanab/boys-basketball/scores-schedule/2027',
            '/high-school/school/juab/boys-basketball/scores-schedule/2027',
            '/high-school/school/manti/boys-basketball/scores-schedule/2027',
            '/high-school/school/valley/boys-basketball/scores-schedule/2027',
            '/high-school/school/westlake/boys-basketball/scores-schedule/2027',
            '/high-school/school/richfield/boys-basketball/scores-schedule/2027',
            '/high-school/school/kanab/boys-basketball/scores-schedule/2026',
            '/high-school/boys-basketball/scores-schedule/2026-11-17?region=all',
            '/high-school/boys-basketball/scores-schedule/2026-11-24?region=all',
            '/high-school/boys-basketball/scores-schedule/2026-12-04?region=all',
            '/high-school/boys-basketball/scores-schedule/2027-01-15?region=all'
          ];
          for(const path of paths){
            try{
              const r=await fetch(base+path,{headers:{'user-agent':'Mozilla/5.0 (compatible; RuralUtahSports/1.0; +https://ruralutahsports.com/)','accept':'text/html'},signal:AbortSignal.timeout(15000)});
              const html=await r.text(), plain=html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,' ').replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,' ').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ');
              const games=(plain.match(/Upcoming\s*(?:Nov|Dec|Jan|Feb|Mar)|Final\s*(?:Nov|Dec|Jan|Feb|Mar)/gi)||[]).length;
              const noGames=/no games scheduled|no games available|there are no games|sorry, there are no games/i.test(plain);
              const around=plain.indexOf('Scores & Schedules');
              console.log('RESULT',JSON.stringify({path,status:r.status,finalUrl:r.url,htmlLength:html.length,games,noGames,has2026Dates:/Nov \d{1,2}, 2026|Dec \d{1,2}, 2026|Jan \d{1,2}, 2027/.test(plain),excerpt:plain.slice(Math.max(0,around),around+850)}));
            }catch(e){console.log('ERROR',path,String(e))}
          }
          NODE