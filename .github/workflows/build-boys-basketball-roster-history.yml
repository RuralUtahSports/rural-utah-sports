name: Build boys basketball roster history

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_boys_basketball_roster_history.py'
      - '.github/workflows/build-boys-basketball-roster-history.yml'
      - 'boys-basketball-teams.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python3 -m pip install beautifulsoup4 requests
      - name: Build roster history
        run: python3 scripts/build_boys_basketball_roster_history.py
      - name: Verify output
        run: |
          python3 - <<'PY'
          import json, os
          d=json.load(open('boys-basketball-rosters/index.json'))
          s=d['summary']
          print(s)
          if s['teamsChecked'] < 148:
              raise SystemExit('Too few teams checked')
          if s['pagesChecked'] < s['teamsChecked'] * 18:
              raise SystemExit('Not all roster seasons were checked')
          if s['pagesWithRosters'] < 300:
              raise SystemExit('Too few historical roster pages parsed')
          if s['players'] < 3000:
              raise SystemExit('Too few roster players parsed')
          sample=d['teams'].get('JUAB')
          if not sample or not os.path.exists(sample['file']):
              raise SystemExit('Juab roster history missing')
          juab=json.load(open(sample['file']))
          season=next((r for r in juab['seasons'] if r.get('year')==2021),None)
          if not season or not season.get('players'):
              raise SystemExit('Juab 2020-21 roster missing')
          player=season['players'][0]
          if not player.get('name') or player['name'].strip().isdigit() or not player.get('number'):
              raise SystemExit('Roster player fields are misaligned')
          bountiful=d['teams'].get('BOUNTIFUL')
          if not bountiful:
              raise SystemExit('Bountiful roster history missing')
          bountiful=json.load(open(bountiful['file']))
          season=next((r for r in bountiful['seasons'] if r.get('year')==2010),None)
          if not season or not season.get('players'):
              raise SystemExit('2009-10 roster missing')
          PY
      - name: Commit roster history
        run: |
          git add boys-basketball-rosters
          if git diff --cached --quiet; then
            echo "No roster history changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build basketball roster history"
          git pull --rebase origin main
          git push
