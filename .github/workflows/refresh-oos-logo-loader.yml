name: Refresh OOS logo loader

on:
  push:
    paths:
      - '.github/workflows/refresh-oos-logo-loader.yml'

permissions:
  contents: write

jobs:
  refresh-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache-bust school asset loader everywhere
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          bundle = Path('school-assets-bundle.js')
          text = bundle.read_text(encoding='utf-8')
          text = re.sub(
              r"school-assets-core\.js\?v=[A-Za-z0-9._-]+",
              "school-assets-core.js?v=20260910-oos-1",
              text,
          )
          bundle.write_text(text, encoding='utf-8')

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              new = re.sub(
                  r"school-assets-bundle\.js\?v=[A-Za-z0-9._-]+",
                  "school-assets-bundle.js?v=20260910-oos-1",
                  text,
              )
              if new != text:
                  path.write_text(new, encoding='utf-8')
          PY

      - name: Commit loader refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add school-assets-bundle.js *.html
          git diff --cached --quiet && exit 0
          git commit -m 'Cache-bust school assets for Week 5 OOS logos'
          git push
