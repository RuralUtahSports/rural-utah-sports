name: Install Trust & Growth Cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-trust-growth-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Activate growth cache versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('nav-menu.js'); s=p.read_text()
          s=re.sub(r"addScript\('pwa\.js\?v=[^']*','rusPwa',true\)", "addScript('pwa.js?v=20260817-growth1','rusPwa',true)", s)
          p.write_text(s)
          for html in Path('.').rglob('*.html'):
              text=html.read_text(errors='ignore')
              updated=re.sub(r'src=[\"\']nav-menu\.js(?:\?v=[^\"\']*)?[\"\']', 'src="nav-menu.js?v=20260817-growth1"', text)
              updated=re.sub(r'src=[\"\']site-credibility\.js(?:\?v=[^\"\']*)?[\"\']', 'src="site-credibility.js?v=20260817-growth1"', updated)
              if updated!=text: html.write_text(updated)
          PY
      - name: Remove installer
        run: rm .github/workflows/install-trust-growth-cache.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Activate Trust & Growth sitewide'
          git push
