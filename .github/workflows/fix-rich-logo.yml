name: Fix Rich Logo

on:
  push:
    paths:
      - '.github/workflows/fix-rich-logo.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build reliable Rich PNG logo
        run: |
          curl -L --fail --retry 3 'https://assets.scorebooklive.com/uploads/production/school/30123/image/15609b0836.jpeg' -o /tmp/rich-source.jpg
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          im = Image.open('/tmp/rich-source.jpg').convert('RGBA')
          px = im.load()
          # Make the near-white background transparent while preserving the logo.
          for y in range(im.height):
              for x in range(im.width):
                  r,g,b,a = px[x,y]
                  if r > 242 and g > 242 and b > 242:
                      px[x,y] = (255,255,255,0)

          bbox = im.getbbox()
          if bbox:
              im = im.crop(bbox)
          pad = max(12, round(max(im.size) * 0.08))
          canvas = Image.new('RGBA', (im.width + pad*2, im.height + pad*2), (0,0,0,0))
          canvas.alpha_composite(im, (pad, pad))

          out = Path('school-logo-share/rich.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          canvas.save(out, 'PNG', optimize=True)

          cache_path = Path('school-logo-cache.json')
          cache = json.loads(cache_path.read_text())
          cache['RICH'] = 'school-logo-share/rich.png'
          cache_path.write_text(json.dumps(cache, indent=2) + '\n')
          PY

      - name: Commit Rich PNG logo
        run: |
          if git diff --quiet -- school-logo-share/rich.png school-logo-cache.json; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add school-logo-share/rich.png school-logo-cache.json
          git commit -m 'Fix Rich logo rendering with PNG asset'
          git push
