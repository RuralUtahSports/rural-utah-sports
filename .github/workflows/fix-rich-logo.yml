name: Fix Rich Logo

on:
  push:
    paths:
      - '.github/workflows/fix-rich-logo.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert Rich embedded WebP logo to PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          python - <<'PY'
          from pathlib import Path
          import base64, re

          src = Path('school-logos/rich.svg')
          text = src.read_text()
          m = re.search(r'data:image/webp;base64,([^"\']+)', text)
          if not m:
              raise SystemExit('Could not find embedded Rich WebP in SVG')
          Path('/tmp/rich.webp').write_bytes(base64.b64decode(m.group(1)))
          PY
          dwebp /tmp/rich.webp -o /tmp/rich.png
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          im = Image.open('/tmp/rich.png').convert('RGBA')
          pad = max(8, round(max(im.size) * 0.08))
          canvas = Image.new('RGBA', (im.width + pad*2, im.height + pad*2), (0,0,0,0))
          canvas.alpha_composite(im, (pad, pad))

          out = Path('school-logo-share/rich.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          canvas.save(out, 'PNG', optimize=True)

          cache_path = Path('school-logo-cache.json')
          cache = json.loads(cache_path.read_text())
          cache['RICH'] = 'school-logo-share/rich.png'
          cache_path.write_text(json.dumps(cache, indent=2) + '\n')
          PY

      - name: Commit Rich PNG logo
        run: |
          if git diff --quiet -- school-logo-share/rich.png school-logo-cache.json; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add school-logo-share/rich.png school-logo-cache.json
          git commit -m 'Fix Rich logo rendering with PNG asset'
          git push
