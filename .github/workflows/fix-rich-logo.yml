name: Fix Rich Logo

on:
  push:
    paths:
      - '.github/workflows/fix-rich-logo.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build reliable Rich PNG logo
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, json

          src = Path('school-logo-share/rich.b64')
          out = Path('school-logo-share/rich.png')
          out.write_bytes(base64.b64decode(src.read_text().strip()))

          cache_path = Path('school-logo-cache.json')
          cache = json.loads(cache_path.read_text())
          cache['RICH'] = 'school-logo-share/rich.png'
          cache_path.write_text(json.dumps(cache, indent=2) + '\n')
          PY

      - name: Commit Rich PNG logo
        run: |
          if git diff --quiet -- school-logo-share/rich.png school-logo-cache.json; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add school-logo-share/rich.png school-logo-cache.json
          git commit -m 'Fix Rich logo rendering with PNG asset'
          git push
