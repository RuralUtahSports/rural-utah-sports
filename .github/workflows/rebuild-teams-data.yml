name: Sync Website Data From Google Sheet

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - '.github/workflows/rebuild-teams-data.yml'

permissions:
  contents: write

concurrency:
  group: sheet-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download sheet data and rebuild website JSON
        env:
          SHEET_ID: 1IHr84tlMdZVAazLDh0HV7ZWoxNH4UpjpLt_UTV8KZwo
        run: |
          node <<'NODE'
          const fs = require('fs');

          const SHEET_ID = process.env.SHEET_ID;

          function csvUrl(gid, range) {
            return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}&range=${encodeURIComponent(range)}`;
          }

          function parseCSV(text) {
            const rows = [];
            let row = [], field = '', quoted = false;
            for (let i = 0; i < text.length; i++) {
              const c = text[i];
              if (quoted) {
                if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
                else if (c === '"') quoted = false;
                else field += c;
              } else {
                if (c === '"') quoted = true;
                else if (c === ',') { row.push(field); field = ''; }
                else if (c === '\n') { row.push(field.replace(/\r$/, '')); rows.push(row); row = []; field = ''; }
                else field += c;
              }
            }
            if (field.length || row.length) { row.push(field.replace(/\r$/, '')); rows.push(row); }
            return rows;
          }

          async function getCSV(gid, range) {
            const res = await fetch(csvUrl(gid, range));
            if (!res.ok) throw new Error(`Sheet download failed: ${res.status} ${res.statusText}`);
            return parseCSV(await res.text());
          }

          const clean = v => String(v ?? '').trim();
          const num = v => {
            const s = clean(v);
            if (!s) return null;
            const n = Number(s.replace(/,/g, '').replace(/%$/, ''));
            return Number.isFinite(n) ? n : null;
          };

          const canonicalTeam = name => {
            const aliases = {
              'GUNNISON': 'GUNNISON VALLEY',
              'MAPLE MTN': 'MAPLE MOUNTAIN',
              'MONUMENT VAL': 'MONUMENT VALLEY',
              'CEDAR': 'CEDAR CITY',
              'SUMMIT': 'SUMMIT ACADEMY',
              'BRIGHAM YOUNG': 'BYH',
              'WASATCH ACADEMY': 'WASATCH ACAD'
            };
            const key = clean(name).replace(/\s+/g, ' ').toUpperCase();
            return aliases[key] || key;
          };

          const teamSlug = name => canonicalTeam(name)
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '');

          const classificationName = value => clean(value)
            .replace(/^CLASS\s+/i, '')
            .replace(/\s+/g, ' ')
            .trim();

          function emptyRecord() {
            return { wins: 0, losses: 0, ties: 0, games: 0 };
          }

          function addResult(record, result) {
            record.games++;
            if (result === 'W') record.wins++;
            else if (result === 'L') record.losses++;
            else record.ties++;
          }

          function dateParts(date) {
            const m = clean(date).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (!m) return null;
            return { month: Number(m[1]), day: Number(m[2]), year: Number(m[3]) };
          }

          function dateKey(date) {
            const p = dateParts(date);
            return p ? (p.year * 10000 + p.month * 100 + p.day) : 0;
          }

          function parseChampionshipLog(rows) {
            const entries = [];
            let classColumns = {};
            let currentYear = null;

            const makeTeam = name => {
              const display = clean(name).replace(/\s+/g, ' ');
              return display ? { name: display, key: canonicalTeam(display) } : null;
            };

            for (const row of rows) {
              const yearCell = clean(row[1]);
              const isHeader = yearCell.toUpperCase() === 'YEAR';

              if (isHeader) {
                classColumns = {};
                for (let c = 2; c < row.length; c++) {
                  const value = clean(row[c]);
                  if (/^CLASS\s+/i.test(value)) classColumns[c] = classificationName(value);
                }
                continue;
              }

              for (let c = 2; c < row.length; c++) {
                const value = clean(row[c]);
                if (/^CLASS\s+/i.test(value) && !/^NO CLASS/i.test(value)) {
                  classColumns[c] = classificationName(value);
                }
              }

              const parsedYear = /^\d{4}$/.test(yearCell) ? Number(yearCell) : null;
              if (parsedYear) currentYear = parsedYear;
              if (!currentYear) continue;

              for (const [colText, classification] of Object.entries(classColumns)) {
                const c = Number(colText);
                const championRaw = clean(row[c]);
                const scoreRaw = clean(row[c + 1]);
                const runnerRaw = clean(row[c + 2]);
                if (!championRaw && !scoreRaw && !runnerRaw) continue;
                if (/^CHAMPION$/i.test(championRaw) || /^CLASS\s+/i.test(championRaw)) continue;

                if (/^NO CLASS/i.test(championRaw)) {
                  entries.push({
                    year: currentYear,
                    classification,
                    status: 'no-class',
                    champion: '', championKey: '', score: '', runnerUp: '', runnerUpKey: '',
                    coChampions: [],
                    note: championRaw
                  });
                  continue;
                }

                if (/^NO PLAYOFFS/i.test(championRaw)) {
                  entries.push({
                    year: currentYear,
                    classification,
                    status: 'no-playoffs',
                    champion: '', championKey: '', score: '', runnerUp: '', runnerUpKey: '',
                    coChampions: [],
                    note: championRaw
                  });
                  continue;
                }

                const champion = makeTeam(championRaw);
                const runnerUp = makeTeam(runnerRaw);

                if (!parsedYear && !scoreRaw && champion && runnerUp) {
                  const previous = [...entries].reverse().find(e =>
                    e.year === currentYear &&
                    e.classification === classification &&
                    e.status === 'co-champions' &&
                    /all 4 are champs/i.test(e.note || '')
                  );
                  if (previous) {
                    for (const team of [champion, runnerUp]) {
                      if (!previous.coChampions.some(x => x.key === team.key)) previous.coChampions.push(team);
                    }
                    continue;
                  }
                }

                if (!champion && !runnerUp) continue;
                const isCoChampionship = /both champs|all 4 are champs/i.test(scoreRaw);
                const note = isCoChampionship ? scoreRaw : '';
                const score = isCoChampionship ? '' : scoreRaw;
                const coChampions = [];
                if (isCoChampionship) {
                  for (const team of [champion, runnerUp]) if (team) coChampions.push(team);
                }

                entries.push({
                  year: currentYear,
                  classification,
                  status: isCoChampionship ? 'co-champions' : 'championship',
                  champion: champion?.name || '',
                  championKey: champion?.key || '',
                  score,
                  runnerUp: runnerUp?.name || '',
                  runnerUpKey: runnerUp?.key || '',
                  coChampions,
                  note
                });
              }
            }

            return entries.sort((a, b) => a.year - b.year || a.classification.localeCompare(b.classification, undefined, { numeric: true }));
          }

          function championshipHistoryForTeam(entries, team) {
            const history = [];
            for (const entry of entries) {
              if (entry.status !== 'championship' && entry.status !== 'co-champions') continue;
              let role = '';
              let opponent = '';
              let opponentKey = '';

              if (entry.status === 'co-champions') {
                if ((entry.coChampions || []).some(c => c.key === team)) {
                  role = 'Co-Champion';
                  const others = (entry.coChampions || []).filter(c => c.key !== team);
                  opponent = others.map(c => c.name).join(' / ');
                  opponentKey = others.length === 1 ? others[0].key : '';
                }
              } else if (entry.championKey === team) {
                role = 'Champion';
                opponent = entry.runnerUp;
                opponentKey = entry.runnerUpKey;
              } else if (entry.runnerUpKey === team) {
                role = 'Runner-Up';
                opponent = entry.champion;
                opponentKey = entry.championKey;
              }

              if (!role) continue;
              history.push({
                year: entry.year,
                classification: entry.classification,
                role,
                opponent,
                opponentKey,
                score: entry.score,
                note: entry.note
              });
            }
            history.sort((a, b) => b.year - a.year || a.classification.localeCompare(b.classification, undefined, { numeric: true }));
            return history;
          }

          (async () => {
            const teams = JSON.parse(fs.readFileSync('teams-data.json', 'utf8'));
            const websiteTeams = new Set(teams.map(t => canonicalTeam(t.team)));

            const locRows = await getCSV('830334138', 'A1:G1000');
            const locations = {};
            for (const r of locRows.slice(1)) {
              const name = canonicalTeam(r[0]);
              if (!name) continue;
              locations[name] = {
                classification: clean(r[2]).toUpperCase(),
                region: clean(r[3]),
                mascot: clean(r[4])
              };
            }

            const recordRows = await getCSV('1907276361', 'R1:AP241');
            const records = {};
            for (const r of recordRows.slice(1)) {
              const school = canonicalTeam(r[1]);
              if (!school || school === 'SCHOOL') continue;
              const regionTitles = num(r[21]);
              const playoffWins = num(r[22]);
              const stateChampionships = num(r[23]);
              const championshipGames = num(r[24]);
              if (regionTitles === null && playoffWins === null && stateChampionships === null && championshipGames === null) continue;
              records[school] = { regionTitles, playoffWins, stateChampionships, championshipGames };
            }

            const championshipRows = await getCSV('2077753447', 'A1:AD125');
            const championships = parseChampionshipLog(championshipRows);
            const teamChampionshipHistory = {};
            const teamChampionshipSummary = {};
            for (const team of websiteTeams) {
              const history = championshipHistoryForTeam(championships, team);
              teamChampionshipHistory[team] = history;
              teamChampionshipSummary[team] = {
                titles: history.filter(h => h.role === 'Champion' || h.role === 'Co-Champion').length,
                appearances: history.length
              };
            }

            const seasonRows = await getCSV('149428399', 'A1:Q6791');
            const seasonHistory = {};
            for (const r of seasonRows.slice(1)) {
              const team = canonicalTeam(r[1]);
              const year = num(r[2]);
              if (!team || team === 'TEAM' || year === null || !websiteTeams.has(team)) continue;
              const season = {
                year,
                rating: num(r[3]),
                wins: num(r[4]),
                losses: num(r[5]),
                ties: num(r[6]),
                winPct: num(r[7]),
                games: num(r[8]),
                pointsFor: num(r[9]),
                pointsAgainst: num(r[10]),
                ppg: num(r[11]),
                papg: num(r[12]),
                avgMargin: num(r[13]),
                opponentWinPct: num(r[14]),
                opponentsOpponentWinPct: num(r[15]),
                sos: num(r[16]),
                rank: num(r[0])
              };
              if (!seasonHistory[team]) seasonHistory[team] = [];
              seasonHistory[team].push(season);
            }
            for (const seasons of Object.values(seasonHistory)) seasons.sort((a, b) => b.year - a.year);

            const gameRows = await getCSV('627882418', 'A1:F40906');
            const breakdowns = {};
            const schedules = {};
            const getTeamBreakdown = team => {
              if (!breakdowns[team]) breakdowns[team] = { decades: {}, opponents: {} };
              return breakdowns[team];
            };
            const addScheduleGame = (team, year, game) => {
              if (!websiteTeams.has(team)) return;
              if (!schedules[team]) schedules[team] = {};
              if (!schedules[team][year]) schedules[team][year] = [];
              schedules[team][year].push(game);
            };

            let validGames = 0;
            for (const r of gameRows.slice(1)) {
              const date = clean(r[0]);
              const parts = dateParts(date);
              const team1 = canonicalTeam(r[1]);
              const team2 = canonicalTeam(r[2]);
              const score1 = num(r[3]);
              const score2 = num(r[4]);
              if (!parts || !team1 || !team2 || team1 === team2 || score1 === null || score2 === null) continue;
              const year = parts.year;
              const decade = String(Math.floor(year / 10) * 10);
              const result1 = score1 > score2 ? 'W' : score1 < score2 ? 'L' : 'T';
              const result2 = result1 === 'W' ? 'L' : result1 === 'L' ? 'W' : 'T';
              const b1 = getTeamBreakdown(team1), b2 = getTeamBreakdown(team2);
              if (!b1.decades[decade]) b1.decades[decade] = emptyRecord();
              if (!b2.decades[decade]) b2.decades[decade] = emptyRecord();
              if (!b1.opponents[team2]) b1.opponents[team2] = emptyRecord();
              if (!b2.opponents[team1]) b2.opponents[team1] = emptyRecord();
              addResult(b1.decades[decade], result1);addResult(b2.decades[decade], result2);addResult(b1.opponents[team2], result1);addResult(b2.opponents[team1], result2);
              addScheduleGame(team1, year, { date, opponent: team2, teamScore: score1, opponentScore: score2, result: result1 });
              addScheduleGame(team2, year, { date, opponent: team1, teamScore: score2, opponentScore: score1, result: result2 });
              validGames++;
            }
            for (const teamYears of Object.values(schedules)) for (const games of Object.values(teamYears)) games.sort((a, b) => dateKey(a.date) - dateKey(b.date));

            const eloRows = await getCSV('1029710821', 'A1:H81811');
            const eloHistory = {};
            let eloPoints = 0;
            for (const r of eloRows.slice(1)) {
              const date = clean(r[0]);
              const parts = dateParts(date);
              const team = canonicalTeam(r[1]);
              const opponent = canonicalTeam(r[2]);
              const eloBefore = num(r[4]);
              const change = num(r[5]);
              const eloAfter = num(r[6]);
              if (!parts || !team || !websiteTeams.has(team) || eloBefore === null || eloAfter === null) continue;
              if (!eloHistory[team]) eloHistory[team] = [];
              eloHistory[team].push({ date, season: num(r[7]) ?? parts.year, opponent, result: clean(r[3]).toUpperCase(), eloBefore, change, eloAfter });
              eloPoints++;
            }
            for (const rows of Object.values(eloHistory)) rows.sort((a, b) => dateKey(a.date) - dateKey(b.date));

            fs.writeFileSync('team-locations.json', JSON.stringify(locations));
            fs.writeFileSync('team-records.json', JSON.stringify(records));
            fs.writeFileSync('championships.json', JSON.stringify(championships));
            fs.writeFileSync('season-history.json', JSON.stringify(seasonHistory));
            fs.writeFileSync('team-record-breakdowns.json', JSON.stringify(breakdowns));
            fs.writeFileSync('team-schedules.json', JSON.stringify(schedules));
            fs.writeFileSync('team-elo-history.json', JSON.stringify(eloHistory));

            const pageDataDir = 'team-page-data';
            fs.rmSync(pageDataDir, { recursive: true, force: true });
            fs.mkdirSync(pageDataDir, { recursive: true });
            for (const team of websiteTeams) {
              const payload = {
                seasonHistory: seasonHistory[team] || [],
                breakdown: breakdowns[team] || { decades: {}, opponents: {} },
                schedules: schedules[team] || {},
                eloHistory: eloHistory[team] || [],
                championshipHistory: teamChampionshipHistory[team] || [],
                championshipSummary: teamChampionshipSummary[team] || { titles: 0, appearances: 0 }
              };
              fs.writeFileSync(`${pageDataDir}/${teamSlug(team)}.json`, JSON.stringify(payload));
            }

            let matched = 0;
            for (const team of teams) {
              const key = canonicalTeam(team.team);
              const info = locations[key];
              if (!info) continue;
              matched++;
              team.classification = info.classification;
              team.region = info.region;
              team.mascot = info.mascot;
              if (teamChampionshipSummary[key]) {
                team.stateChampionships = teamChampionshipSummary[key].titles;
                team.championshipGames = teamChampionshipSummary[key].appearances;
              }
              delete team.address;
              delete team.coach;
            }
            fs.writeFileSync('teams-data.json', JSON.stringify(teams));

            console.log(`School Locations: ${Object.keys(locations).length}`);
            console.log(`Record Book programs: ${Object.keys(records).length}`);
            console.log(`Championship entries: ${championships.length}`);
            console.log(`Championship teams matched: ${Object.values(teamChampionshipSummary).filter(x => x.appearances > 0).length}`);
            console.log(`Season-history teams: ${Object.keys(seasonHistory).length}`);
            console.log(`Season-history rows: ${Object.values(seasonHistory).reduce((n, rows) => n + rows.length, 0)}`);
            console.log(`Clean games processed: ${validGames}`);
            console.log(`Programs with decade/opponent records: ${Object.keys(breakdowns).length}`);
            console.log(`Programs with schedules: ${Object.keys(schedules).length}`);
            console.log(`Programs with ELO history: ${Object.keys(eloHistory).length}`);
            console.log(`ELO history rows stored: ${eloPoints}`);
            console.log(`Team page files generated: ${websiteTeams.size}`);
            console.log(`Matched website teams: ${matched}/${teams.length}`);

            if (!Object.keys(locations).length || !Object.keys(records).length || !championships.length || !Object.keys(seasonHistory).length || !validGames || !Object.keys(schedules).length || !eloPoints || !matched) {
              throw new Error('Sheet sync produced empty data; refusing to commit.');
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Commit updated data
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add team-locations.json team-records.json championships.json season-history.json team-record-breakdowns.json team-schedules.json team-elo-history.json teams-data.json team-page-data
          if git diff --cached --quiet; then
            echo "Website data is already current."
          else
            git commit -m "Auto-sync website data from Google Sheet"
            git push
          fi