name: Rebuild Team Data

on:
  workflow_dispatch:
  push:
    paths:
      - 'team-locations.json'
      - '.github/workflows/rebuild-teams-data.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild teams-data.json
        run: |
          node <<'NODE'
          const fs = require('fs');
          const teams = JSON.parse(fs.readFileSync('teams-data.json', 'utf8'));
          const locations = JSON.parse(fs.readFileSync('team-locations.json', 'utf8'));

          for (const team of teams) {
            const info = locations[team.team];
            if (!info) continue;
            team.classification = info.classification;
            team.region = info.region;
            team.mascot = info.mascot;
            delete team.address;
          }

          fs.writeFileSync('teams-data.json', JSON.stringify(teams));
          NODE

      - name: Commit updated data
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add teams-data.json
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Update team classifications and regions"
            git push
          fi
