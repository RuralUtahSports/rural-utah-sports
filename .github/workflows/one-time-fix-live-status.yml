name: One-time fix live status isolation

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-live-status.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch scoreboard and live clock isolation
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Initial scoreboard render must use the freshest main-branch live feed,
          # not a potentially lagging GitHub Pages copy.
          p = Path('scoreboard.html')
          s = p.read_text()
          old = "fetch('deseret-game-details.json?v='+stamp,{cache:'no-store'}).catch(()=>null)"
          new = "fetch('https://raw.githubusercontent.com/RuralUtahSports/rural-utah-sports/main/deseret-game-details.json?v='+stamp,{cache:'no-store'}).catch(()=>null)"
          if old not in s:
              raise SystemExit('scoreboard live-source pattern not found')
          s = s.replace(old, new, 1)
          s = s.replace('scoreboard-refresh.js?v=20260821-livefix4', 'scoreboard-refresh.js?v=20260821-livefix5', 1)
          p.write_text(s)

          # 2) Always rebuild the detail map when the refresh returns. This prevents
          # any stale per-game status/clock from surviving in an already-open page.
          p = Path('scoreboard-refresh.js')
          s = p.read_text()
          old = "const changed = !lastLiveUpdatedAt || updatedAt !== lastLiveUpdatedAt || !detailMap.size;"
          if old not in s:
              raise SystemExit('refresh changed-pattern not found')
          s = s.replace(old, "const changed = true;", 1)
          p.write_text(s)

          # 3) Deseret can embed other live-game widgets/tickers on a game page.
          # Only accept a clock from text adjacent to BOTH teams in this game.
          p = Path('scripts/enrich-deseret-game-details.mjs')
          s = p.read_text()
          start = s.index('function extractClock(html) {')
          end = s.index('\nfunction extractStatus(', start)
          replacement = r'''function extractClock(html, game) {
            const all = htmlText(html.slice(0, Math.min(html.length, 140000)));
            const beforeScoring = all.split(/Scoring Summary/i)[0];
            const lines = beforeScoring.split(/\n+/).map(clean).filter(Boolean);
            const awayKeys = keysFor(game?.awayTeam || '');
            const homeKeys = keysFor(game?.homeTeam || '');
            const containsAny = (line, keys) => {
              const c = compact(line);
              return keys.some(k => k && c.includes(k));
            };

            const awayHits = [], homeHits = [];
            for (let i = 0; i < lines.length; i++) {
              if (containsAny(lines[i], awayKeys)) awayHits.push(i);
              if (containsAny(lines[i], homeKeys)) homeHits.push(i);
            }

            let best = null;
            for (const a of awayHits) for (const h of homeHits) {
              const gap = Math.abs(a - h);
              if (gap <= 18 && (!best || gap < best.gap)) best = { a, h, gap };
            }
            if (!best) return { clock: '', period: '' };

            const lo = Math.max(0, Math.min(best.a, best.h) - 8);
            const hi = Math.min(lines.length, Math.max(best.a, best.h) + 16);
            const segment = lines.slice(lo, hi).join('\n');

            let m = segment.match(/\b(\d{1,2}:\d{2}(?:\.\d+)?)\s*(?:left|remaining)?\s*(?:in\s*(?:the\s*)?)?(?:Q\s*([1-4])|([1-4])\s*Q|([1-4])(?:st|nd|rd|th)(?:\s+quarter)?)/i);
            if (m) return { clock: m[1], period: `Q${m[2] || m[3] || m[4]}` };

            m = segment.match(/\b(?:Q\s*([1-4])|([1-4])\s*Q|([1-4])(?:st|nd|rd|th)(?:\s+quarter)?)\s*(?:[-–—|•:]?\s*)(\d{1,2}:\d{2}(?:\.\d+)?)/i);
            if (m) return { clock: m[4], period: `Q${m[1] || m[2] || m[3]}` };

            return { clock: '', period: '' };
          }
          '''
          s = s[:start] + replacement + s[end:]
          s = s.replace('const clockInfo = extractClock(html);', 'const clockInfo = extractClock(html, game);', 1)
          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add -- scoreboard.html scoreboard-refresh.js scripts/enrich-deseret-game-details.mjs
          git commit -m "Fix stale live statuses and cross-game clocks"
          git pull --rebase origin main
          git push
