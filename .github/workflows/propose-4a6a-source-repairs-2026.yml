name: Propose 2026 verified 4A-6A source game repairs
on:
  pull_request:
    paths:
      - 'scripts/propose_4a6a_canonical_game_repairs_2026.mjs'
      - 'tests/proposed-4a6a-canonical-repairs-2026.test.mjs'
      - '.github/workflows/propose-4a6a-source-repairs-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact original game fields, eligibility and missing-value holds
        run: node --test tests/proposed-4a6a-canonical-repairs-2026.test.mjs
      - name: Reconstruct game repair proposals from current saved data
        run: node scripts/propose_4a6a_canonical_game_repairs_2026.mjs --output="$RUNNER_TEMP/4a6a-canonical-source-repair-review"
      - name: Verify canonical datasets are unchanged
        run: |
          git diff --exit-code -- player-game-stats-2026.json deseret-rosters-stats-2026.json deseret-team-data-2026.json deseret-stat-metrics-2026.json team-current-data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2026-4a6a-canonical-source-repair-proposal
          path: ${{ runner.temp }}/4a6a-canonical-source-repair-review
          if-no-files-found: ignore
          retention-days: 30
