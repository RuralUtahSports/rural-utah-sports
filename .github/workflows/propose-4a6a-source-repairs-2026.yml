name: Propose 2026 verified 4A-6A source game repairs
on:
  pull_request:
    paths:
      - 'scripts/propose_4a6a_canonical_game_repairs_2026.mjs'
      - 'tests/proposed-4a6a-canonical-repairs-2026.test.mjs'
      - '.github/workflows/propose-4a6a-source-repairs-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source-preservation workflow YAML with a strict parser
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; p='.github/workflows/regular-season-scope-review.yml'; d=yaml.safe_load(open(p)); print('YAML parsed:', d.get('name'))"
      - name: Validate source-preservation workflow with actionlint
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint .github/workflows/regular-season-scope-review.yml
      - name: Check exact original game fields, eligibility and missing-value holds
        run: node --test tests/proposed-4a6a-canonical-repairs-2026.test.mjs
      - name: Reconstruct game repair proposals from current saved data
        run: node scripts/propose_4a6a_canonical_game_repairs_2026.mjs --output="$RUNNER_TEMP/4a6a-canonical-source-repair-review"
      - name: Dry-run actual source repair writes twice in isolated temp directory
        shell: bash
        run: |
          WORK="$RUNNER_TEMP/2026-source-repair-sandbox"
          mkdir -p "$WORK/audits/2026-regular-season"
          cp player-game-stats-2026.json deseret-rosters-stats-2026.json official-brackets-2026.json competition-scope-review-2026.json "$WORK/"
          cp audits/2026-regular-season/reconciled-4a6a-player-cases-2026.json "$WORK/audits/2026-regular-season/"
          (cd "$WORK"; node "$GITHUB_WORKSPACE/scripts/propose_4a6a_canonical_game_repairs_2026.mjs" --apply --output="$RUNNER_TEMP/first-repair-pass")
          cp "$WORK/player-game-stats-2026.json" "$RUNNER_TEMP/first-repair-result.json"
          (cd "$WORK"; node "$GITHUB_WORKSPACE/scripts/propose_4a6a_canonical_game_repairs_2026.mjs" --apply --output="$RUNNER_TEMP/second-repair-pass")
          cmp "$WORK/player-game-stats-2026.json" "$RUNNER_TEMP/first-repair-result.json"
          node -e "const fs=require('fs');const g=JSON.parse(fs.readFileSync(process.argv[1]));const w=g.teams['WEST JORDAN'].games.find(x=>x.date==='2026-08-21');if(w.players.find(x=>x.playerId==='west-jordan-3-kenyon-shockey').statLines.find(x=>x.category==='Passing').values.Yards!=='29')process.exit(1);for(const [team,date] of [['LAYTON','2026-10-14'],['MOUNTAIN RIDGE','2026-10-15']]){const rows=g.teams[team].games.filter(x=>x.date===date);if(rows.length!==1||!rows[0].manualPartialStats)process.exit(1);}" "$RUNNER_TEMP/first-repair-result.json"
      - name: Verify canonical datasets are unchanged
        run: |
          git diff --exit-code -- player-game-stats-2026.json deseret-rosters-stats-2026.json deseret-team-data-2026.json deseret-stat-metrics-2026.json team-current-data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2026-4a6a-canonical-source-repair-proposal
          path: ${{ runner.temp }}/4a6a-canonical-source-repair-review
          if-no-files-found: ignore
          retention-days: 30
