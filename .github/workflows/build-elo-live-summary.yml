name: Build Live ELO Summary

on:
  workflow_dispatch:
  push:
    paths:
      - 'team-elo-history.json'
      - '.github/workflows/build-elo-live-summary.yml'

permissions:
  contents: write

concurrency:
  group: live-elo-summary
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compact current ELO data
        run: |
          node <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('team-elo-history.json','utf8'));
          const out={updatedAt:new Date().toISOString(),teams:{}};
          for(const [team,rows] of Object.entries(h||{})){
            if(!Array.isArray(rows)||!rows.length)continue;
            const r=rows[rows.length-1];
            out.teams[team]={currentElo:r.eloAfter,eloBefore:r.eloBefore,change:r.change,date:r.date,opponent:r.opponent,result:r.result};
          }
          fs.writeFileSync('elo-live-summary.json',JSON.stringify(out));
          console.log(`Live ELO rows: ${Object.keys(out.teams).length}`);
          NODE
      - name: Commit compact ELO data
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add elo-live-summary.json
          if git diff --cached --quiet; then echo "Live ELO summary current."; exit 0; fi
          git commit -m "Update lightweight live ELO summary"
          git pull --rebase origin main
          git push
