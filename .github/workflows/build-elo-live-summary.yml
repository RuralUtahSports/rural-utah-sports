name: Build Live ELO Summary

# Compatibility launcher only. Build Clean Live ELO is the sole writer for the
# current ELO outputs. This prevents the older summary path from overwriting
# verified 2026 ELO after another workflow changes team-elo-history.json.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: live-elo-summary-compat
  cancel-in-progress: true

jobs:
  dispatch-clean-elo:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified clean ELO rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/build-clean-elo-v2.yml/dispatches \
            -f ref=main
          echo "Build Clean Live ELO dispatched; legacy live-summary writer is disabled."
