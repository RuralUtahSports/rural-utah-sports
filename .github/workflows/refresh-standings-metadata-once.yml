name: Refresh Standings Metadata Once
on:
  push:
    paths:
      - '.github/workflows/refresh-standings-metadata-once.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reindex standings with current team metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          teams=json.loads(Path('teams-data.json').read_text())
          meta={t['team']:t for t in teams}
          d=json.loads(Path('standings-2026.json').read_text())
          flat={}
          for arr in d.get('byClassification',{}).values():
              for x in arr:
                  flat[x['team']]=x
          for name,x in flat.items():
              t=meta.get(name)
              if not t: continue
              x['classification']=str(t.get('classification','')).strip()
              x['region']=str(t.get('region','')).strip()
              x['backgroundColor']=t.get('backgroundColor',x.get('backgroundColor'))
              x['textColor']=t.get('textColor',x.get('textColor'))
          def wp(x):
              g=x.get('wins',0)+x.get('losses',0)+x.get('ties',0)
              return (x.get('wins',0)+x.get('ties',0)*.5)/g if g else 0
          def rwp(x):
              g=x.get('regionWins',0)+x.get('regionLosses',0)+x.get('regionTies',0)
              return (x.get('regionWins',0)+x.get('regionTies',0)*.5)/g if g else 0
          def diff(x): return x.get('pointsFor',0)-x.get('pointsAgainst',0)
          byc={}; byr={}
          for x in flat.values():
              c=x.get('classification',''); r=x.get('region') or 'Independent'
              byc.setdefault(c,[]).append(x)
              byr.setdefault(c,{}).setdefault(r,[]).append(x)
          for a in byc.values():
              a.sort(key=lambda x:(-wp(x),-x.get('wins',0),-diff(x),x['team']))
          for groups in byr.values():
              for a in groups.values():
                  a.sort(key=lambda x:(-rwp(x),-x.get('regionWins',0),-wp(x),-diff(x),x['team']))
          d['byClassification']=byc; d['byRegion']=byr
          Path('standings-2026.json').write_text(json.dumps(d,separators=(',',':')))
          for n in ('BEAVER','ENTERPRISE','GRAND'):
              x=flat[n]; print(n,x['classification'],x['region'])
          assert flat['BEAVER']['region']=='1A South'
          assert flat['ENTERPRISE']['region']=='1A South'
          assert flat['GRAND']['classification']=='8P' and flat['GRAND']['region']=='Independent'
          PY
      - name: Commit refreshed standings
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add standings-2026.json
          git commit -m "Refresh standings team classifications and regions"
          git pull --rebase origin main
          git push
