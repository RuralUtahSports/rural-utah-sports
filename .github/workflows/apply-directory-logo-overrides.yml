name: Apply Directory Logo Overrides

on:
  push:
    paths:
      - '.github/workflows/apply-directory-logo-overrides.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update school directory logo URLs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('school-directory.json')
          data = json.loads(p.read_text())
          overrides = {
            'GREEN CANYON':'school-logos/green-canyon.svg',
            'HILLCREST':'school-logos/hillcrest.svg',
            'KEARNS':'school-logos/kearns.svg',
            'LAYTON CHRISTIAN':'school-logos/layton-christian.svg',
            'LAYTON CHRISTIAN ACADEMY':'school-logos/layton-christian.svg',
            'LONE PEAK':'school-logos/lone-peak.svg',
            'MAPLE MOUNTAIN':'school-logos/maple-mountain.svg',
            'MILFORD':'school-logos/milford.svg',
            'MILLARD':'school-logos/millard.svg',
            'MORGAN':'school-logos/morgan.svg',
            'OREM':'school-logos/orem.svg',
            'PROVIDENCE HALL':'school-logos/providence-hall.svg',
            'RICH':'school-logos/rich.svg',
            'SAN JUAN':'school-logos/san-juan.svg',
            'VIEWMONT':'school-logos/viewmont.svg'
          }

          changed=[]
          for key, path in overrides.items():
              if key in data:
                  if data[key].get('logoUrl') != path:
                      data[key]['logoUrl'] = path
                      changed.append(key)

          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          print('Updated logoUrl for:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit directory logo updates
        run: |
          if git diff --quiet -- school-directory.json; then
            echo 'No directory changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add school-directory.json
          git commit -m 'Use custom school logos in shared directory'
          git push
