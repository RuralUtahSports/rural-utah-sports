name: Build Player Single-Game Records

on:
  workflow_dispatch:
  schedule:
    - cron: '45 11 * * 2'
  workflow_run:
    workflows:
      - "Build Deseret Team Data"
      - "Build Deseret Rosters and Stats"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/build_player_single_game_records.mjs'
      - 'scripts/test_player_single_game_records_parser.mjs'
      - 'scripts/validate_player_single_game_records.mjs'
      - '.github/workflows/build-player-single-game-records.yml'
      - 'teams-data.json'
      - 'deseret-game-details.json'
      - 'deseret-rosters-stats-2026.json'
      - 'deseret-stat-metrics-2026.json'
      - 'player-game-stats-2026.json'
      - 'manual-player-single-game-records-2026.json'
      - 'uhsaa-football-records-expanded.json'
      - 'uhsaa-records-*.json'
      - 'team-page-data/**'
      - 'deseret-*.json'
      - 'player-game-stats-*.json'
      - 'team-stats-*.json'
      - 'manual-player-single-game-records-*.json'

permissions:
  contents: write

concurrency:
  group: player-single-game-records
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Capture source snapshot for publication
        run: echo "STAT_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test player record parser
        run: node scripts/test_player_single_game_records_parser.mjs
      - name: Test record duplicate normalization
        run: node scripts/dedupe_player_single_game_records.mjs --self-test
      - name: Probe historical stats source
        id: historical_source
        run: node scripts/probe_player_records_source.mjs
      - name: Build 2001-present player single-game records
        if: steps.historical_source.outputs.available == 'true'
        run: node scripts/build_player_single_game_records.mjs
      - name: Normalize duplicate entries in preserved snapshot
        run: node scripts/dedupe_player_single_game_records.mjs
      - name: Validate existing or freshly rebuilt historical dataset
        run: node scripts/validate_player_single_game_records.mjs
      - name: Merge current-season qualifying performances
        run: node scripts/merge_current_player_single_game_records.mjs
      - name: Remove invalid pass-attempt record
        run: node scripts/suppress_invalid_tage_ita_attempts.mjs --records-only
      - name: Normalize duplicate entries after merge
        run: node scripts/dedupe_player_single_game_records.mjs
      - name: Verify merged records before committing
        run: node scripts/validate_player_single_game_records.mjs
      - name: Commit record data
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          node scripts/check_stat_publish_2026.mjs --snapshot-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player-single-game-records
          if git diff --cached --quiet; then echo "Derived data already current."; exit 0; fi
          git commit -m "Refresh derived data from current source snapshot"
          git push origin HEAD:main
