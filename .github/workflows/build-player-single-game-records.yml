name: Build Player Single-Game Records

on:
  workflow_dispatch:
  schedule:
    - cron: '45 11 * * 2'
  push:
    branches: [main]
    paths:
      - 'scripts/build_player_single_game_records.mjs'
      - 'scripts/test_player_single_game_records_parser.mjs'
      - 'scripts/validate_player_single_game_records.mjs'
      - '.github/workflows/build-player-single-game-records.yml'
      - 'teams-data.json'

permissions:
  contents: write

concurrency:
  group: player-single-game-records
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test player record parser
        run: node scripts/test_player_single_game_records_parser.mjs
      - name: Build 2001-present player single-game records
        run: node scripts/build_player_single_game_records.mjs
      - name: Validate generated dataset before publishing
        run: node scripts/validate_player_single_game_records.mjs
      - name: Commit record data
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add player-single-game-records
          if git diff --cached --quiet; then echo "Player single-game records already current."; exit 0; fi
          git commit -m "Auto-sync 2001-present player single-game records"
          ok=0
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi

# Trigger the historical backfill after parser or validation changes reach main.
