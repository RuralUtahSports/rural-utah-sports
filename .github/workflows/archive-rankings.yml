name: Archive Rankings

on:
  workflow_dispatch:
  push:
    paths:
      - 'rankings-current-2026.json'
      - 'scripts/archive_rankings.py'
      - '.github/workflows/archive-rankings.yml'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive current snapshot
        run: python scripts/archive_rankings.py
      - name: Verify archive
        run: |
          python - <<'PY'
          import json
          d=json.load(open('rankings-history-2026.json'))
          assert d.get('snapshots')
          assert all(x.get('key') and x.get('classifications') for x in d['snapshots'])
          print('Snapshots:',len(d['snapshots']))
          PY
      - name: Commit archive
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add rankings-history-2026.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive football rankings snapshot"
          git pull --rebase origin main
          git push
