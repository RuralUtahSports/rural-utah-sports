name: Merge Current Player Single-Game Records

on:
  workflow_dispatch:
  schedule:
    # Safety refresh after Tuesday stat pipelines and again Wednesday morning.
    - cron: '15 15 * * 2,3'
  push:
    branches: [main]
    paths:
      - 'player-game-stats-2026.json'
      - 'deseret-game-details.json'
      - 'deseret-rosters-stats-2026.json'
      - 'deseret-stat-metrics-2026.json'
      - 'manual-player-single-game-records-2026.json'
      - 'scripts/merge_current_player_single_game_records.mjs'
      - '.github/workflows/merge-current-player-single-game-records.yml'
  workflow_run:
    workflows:
      - "Build Deseret Rosters and Stats"
      - "Build Current Game Stats"
      - "Build MaxPreps Stats Fallback"
    types: [completed]

permissions:
  contents: write

concurrency:
  group: current-player-single-game-records
  cancel-in-progress: true

jobs:
  merge:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Capture source snapshot for publication
        run: echo "STAT_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge current-season qualifying performances
        run: node scripts/merge_current_player_single_game_records.mjs
      - name: Remove invalid pass-attempt records
        run: node scripts/suppress_invalid_tage_ita_attempts.mjs --records-only
      - name: Verify generated JSON
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const juab=JSON.parse(fs.readFileSync('player-single-game-records/by-team/juab.json','utf8'));
          const tackles=juab.categories.find(c=>c.key==='tackles')?.entries||[];
          if(tackles.length>15) throw new Error(`Juab tackle leaderboard exceeded limit: ${tackles.length}`);
          for(const row of tackles){if(!Number.isFinite(Number(row.value))||Number(row.value)<=0) throw new Error('Invalid Juab tackle record');}
          for(const [player,value] of [['Justus Reynolds',19],['Bryson Downard',16]]){
            const row=tackles.find(r=>r.player===player&&Number(r.season)===2026&&r.date==='2026-08-21');
            if(!row||Number(row.value)!==value) throw new Error(`Missing verified Juab tackle record: ${player} ${value}`);
          }
          JSON.parse(fs.readFileSync('player-single-game-records/statewide.json','utf8'));
          console.log(`Juab tackles verified: ${tackles.length} entries; cutoff ${tackles.at(-1)?.value ?? 'n/a'}`);
          NODE
      - name: Commit updated current-season records
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          node scripts/check_stat_publish_2026.mjs --snapshot-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player-single-game-records
          if git diff --cached --quiet; then echo "Derived data already current."; exit 0; fi
          git commit -m "Refresh derived data from current source snapshot"
          git push origin HEAD:main
