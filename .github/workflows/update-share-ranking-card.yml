name: Fix Ranking Share Title Spacing

on:
  push:
    paths:
      - '.github/workflows/update-share-ranking-card.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix class ranking title spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('share-graphic.js')
          s=p.read_text()

          old="""  function titleFor(el){\n    const h=el.querySelector?.('h1,h2,h3,.team-name,.region-title,.rank-head')?.textContent?.trim();\n    if(h)return h.slice(0,70);\n    if(PAGE.includes('scoreboard'))return 'Rural Utah Sports Scoreboard';\n    if(PAGE.includes('standings'))return 'Rural Utah Sports Standings';\n    if(PAGE.includes('rankings'))return 'Rural Utah Sports Rankings';\n    return 'Rural Utah Sports Awards';\n  }\n"""
          new="""  function titleFor(el){\n    if(PAGE.includes('rankings')){\n      const card=el.matches?.('.rank-card')?el:el.closest?.('.rank-card');\n      if(card){\n        const cls=card.querySelector('.rank-head h2')?.textContent?.trim();\n        const label=card.querySelector('.rank-head span')?.textContent?.trim();\n        if(cls&&label)return `${cls} ${label}`.slice(0,70);\n      }\n    }\n    const h=el.querySelector?.('h1,h2,h3,.team-name,.region-title,.rank-head')?.textContent?.trim();\n    if(h)return h.slice(0,70);\n    if(PAGE.includes('scoreboard'))return 'Rural Utah Sports Scoreboard';\n    if(PAGE.includes('standings'))return 'Rural Utah Sports Standings';\n    if(PAGE.includes('rankings'))return 'Rural Utah Sports Rankings';\n    return 'Rural Utah Sports Awards';\n  }\n"""

          if old not in s:
            raise SystemExit('titleFor pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          q=Path('rankings.html')
          text=q.read_text()
          text=re.sub(r"share-graphic\.js\?v=[^\"']+", 'share-graphic.js?v=20260815-title-space', text)
          q.write_text(text)
          PY
      - name: Commit title spacing fix
        run: |
          if git diff --quiet -- share-graphic.js rankings.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add share-graphic.js rankings.html
          git commit -m 'Fix spacing in ranking share graphic titles'
          git push
