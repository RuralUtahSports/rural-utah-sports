name: Fix Classification Ranking Share Order

on:
  push:
    paths:
      - '.github/workflows/update-share-ranking-card.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Flow classification rankings top-to-bottom
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('share-graphic.js')
          s = p.read_text(encoding='utf-8')

          # Classification Top 10 should read vertically: 1,2,3,4,5 down
          # the left side, then 6,7,8,9,10 down the right side.
          s = s.replace(
              "    const cols=verticalClass?1:rows.length>20?(h>w*1.35?3:5):rows.length>10?(h>w*1.35?2:4):2;",
              "    const cols=verticalClass?2:rows.length>20?(h>w*1.35?3:5):rows.length>10?(h>w*1.35?2:4):2;",
              1
          )

          s = s.replace(
              "    const rowH=verticalClass?Math.max(58,Math.floor((availableH-gap*(rowsPerCol-1))/rowsPerCol)):Math.max(72,Math.floor((availableH-gap*(rowsPerCol-1))/rowsPerCol));",
              "    const rowH=verticalClass?Math.max(100,Math.floor((availableH-gap*(rowsPerCol-1))/rowsPerCol)):Math.max(72,Math.floor((availableH-gap*(rowsPerCol-1))/rowsPerCol));",
              1
          )

          s = s.replace(
              "grid.style.gridAutoFlow='row';grid.style.gap=`${gap}px`;",
              "grid.style.gridAutoFlow=verticalClass?'column':'row';grid.style.gap=`${gap}px`;",
              1
          )

          # Keep each team card stacked internally like the current graphic;
          # only change the ranking ORDER across the two columns.
          vertical_css = re.compile(r"\n  \.rus-export-board\.rus-export-vertical-ranking \.rus-export-rank-item\{.*?\n  \.rus-export-board\.rus-export-vertical-ranking \.rus-export-move\{font-size:16px\}\n", re.S)
          s = vertical_css.sub("\n", s, count=1)

          s = s.replace(
              "+(verticalClass?' rus-export-vertical-ranking':'')",
              "",
              1
          )

          p.write_text(s, encoding='utf-8')

          q = Path('rankings.html')
          t = q.read_text(encoding='utf-8')
          t = re.sub(r'share-graphic\.js\?v=[^\"\']+', 'share-graphic.js?v=20260816-vertical-flow-v2', t)
          q.write_text(t, encoding='utf-8')
          PY
      - name: Commit ranking share order fix
        run: |
          if git diff --quiet -- share-graphic.js rankings.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add share-graphic.js rankings.html
          git commit -m 'Flow classification ranking share graphics vertically'
          git pull --rebase origin main
          git push
