name: Build 3A-1A Overall Share Template

on:
  push:
    paths:
      - '.github/workflows/update-share-ranking-card.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch dedicated 3A-1A overall export
        run: python scripts/patch-overall-share.py
      - name: Commit dedicated overall ranking share template
        run: |
          if git diff --quiet -- share-graphic.js rankings.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add share-graphic.js rankings.html
          git commit -m 'Build featured 3A-1A overall ranking share graphic'
          git pull --rebase origin main
          git push
