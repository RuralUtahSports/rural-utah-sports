name: Enlarge Ranking Share Logos

on:
  push:
    paths:
      - '.github/workflows/update-share-ranking-card.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enlarge ranking share logos
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('share-graphic.js')
          s=p.read_text()

          s=s.replace(
            ".rus-export-logo-wrap{margin-top:auto;height:94px;min-height:94px;max-height:94px;width:100%;display:flex;align-items:center;justify-content:center;padding:0 2px;overflow:hidden;box-sizing:border-box}.rus-export-logo-large{display:block;width:auto;height:auto;max-width:100%;max-height:90px;object-fit:contain;object-position:center center;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}",
            ".rus-export-logo-wrap{margin-top:auto;height:122px;min-height:122px;max-height:122px;width:100%;display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden;box-sizing:border-box}.rus-export-logo-large{display:block;width:auto;height:auto;max-width:100%;max-height:118px;object-fit:contain;object-position:center center;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}"
          )

          s=s.replace(
            ".rus-export-board.rus-export-landscape .rus-export-logo-wrap{height:58px;min-height:58px;max-height:58px;padding:0 4px;overflow:hidden}.rus-export-board.rus-export-landscape .rus-export-logo-large{max-width:92%;max-height:54px;object-fit:contain;object-position:center center}",
            ".rus-export-board.rus-export-landscape .rus-export-logo-wrap{height:72px;min-height:72px;max-height:72px;padding:0 2px;overflow:hidden}.rus-export-board.rus-export-landscape .rus-export-logo-large{max-width:96%;max-height:68px;object-fit:contain;object-position:center center}"
          )

          p.write_text(s)

          q=Path('rankings.html')
          text=q.read_text()
          text=re.sub(r"share-graphic\.js\?v=[^\"']+", 'share-graphic.js?v=20260815-logo-large3', text)
          q.write_text(text)
          PY
      - name: Commit larger ranking logos
        run: |
          if git diff --quiet -- share-graphic.js rankings.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add share-graphic.js rankings.html
          git commit -m 'Make team logos larger on ranking share graphics'
          git push
