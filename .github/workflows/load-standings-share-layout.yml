name: Load Enhanced Standings Share Layout

on:
  push:
    paths:
      - '.github/workflows/load-standings-share-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix classification standings share graphics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js=Path('standings-share-layout.js')
          s=js.read_text(encoding='utf-8')

          old_load="const loadLogos=()=>logosPromise||(logosPromise=fetch(`school-logo-cache.json?v=${Date.now()}`,{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({})));"
          new_load="""const loadLogos=()=>logosPromise||(logosPromise=(async()=>{\n    const logos=await fetch(`school-logo-cache.json?v=${Date.now()}`,{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({}));\n    try{\n      const current=logos.RICH||window.RUSSchoolAssets?.logoUrl?.('RICH')||'';\n      if(/rich-user\\.svg/i.test(current)||!current){\n        const svg=await fetch(`school-logos/rich-user.svg?v=${Date.now()}`,{cache:'no-store'}).then(r=>r.ok?r.text():'');\n        const embedded=svg.match(/href=[\\\"'](data:image[^\\\"']+)[\\\"']/i)?.[1]||'';\n        if(embedded)logos.RICH=embedded;\n      }\n    }catch{}\n    return logos;\n  })());"""
          if old_load in s:
              s=s.replace(old_load,new_load,1)

          s=s.replace('align-content:stretch}', 'align-content:start;grid-auto-rows:max-content}', 1)
          s=s.replace('.rus-standings-region-card{background:#080808;border:1px solid #333;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:0}', '.rus-standings-region-card{background:#080808;border:1px solid #333;border-radius:10px;overflow:hidden;align-self:start}', 1)
          s=s.replace('.rus-standings-share-table{width:100%;border-collapse:collapse;table-layout:fixed;flex:1}', '.rus-standings-share-table{width:100%;border-collapse:collapse;table-layout:fixed}', 1)
          s=s.replace('.rus-standings-share-table td{border-bottom:1px solid #252525;padding:4px 3px;font-size:8px;', '.rus-standings-share-table td{border-bottom:1px solid #252525;padding:4px 3px;font-size:10px;height:var(--rus-row-h,auto);', 1)
          s=s.replace('.rus-standings-share-table th{background:${ORANGE};color:#000;padding:5px 3px;font-size:7px;', '.rus-standings-share-table th{background:${ORANGE};color:#000;padding:6px 3px;font-size:8px;', 1)
          s=s.replace('.rus-share-team-logo{width:28px;height:28px;flex:0 0 28px;', '.rus-share-team-logo{width:34px;height:34px;flex:0 0 34px;', 1)
          s=s.replace('.rus-share-team-logo img{max-width:28px;max-height:28px;', '.rus-share-team-logo img{max-width:34px;max-height:34px;', 1)
          s=s.replace('.rus-share-team-name{font-size:9px;', '.rus-share-team-name{font-size:10px;', 1)

          s=s.replace("    const gridRows=Math.ceil(groups.length/Math.max(1,cols));grid.style.gridTemplateRows=`repeat(${Math.max(1,gridRows)},minmax(0,1fr))`;\n",'',1)
          marker="    grid.style.gridTemplateColumns=`repeat(${Math.max(1,cols)},minmax(0,1fr))`;\n"
          if marker in s and '--rus-row-h' not in s[s.find('async function buildBoard'):s.find('async function createGraphic')]:
              s=s.replace(marker, marker+"    const maxRows=Math.max(1,...groups.map(g=>g.rows.length));\n    const rowH=format==='square'?Math.max(48,Math.min(112,Math.floor(760/maxRows))):format==='x'?Math.max(34,Math.min(76,Math.floor(590/maxRows))):Math.max(46,Math.min(86,Math.floor(1450/maxRows)));\n    board.style.setProperty('--rus-row-h',`${rowH}px`);\n",1)

          s=s.replace("await ensureRegionView(value);groups=readGroups();label=", "await ensureRegionView(value);groups=readGroups().filter(g=>!/INDEPEND/i.test(g.title));label=", 1)

          js.write_text(s,encoding='utf-8')

          p=Path('standings.html')
          h=p.read_text(encoding='utf-8')
          h=re.sub(r'<script src=\"standings-share-layout\\.js\\?v=[^\"]+\" defer></script>', '<script src="standings-share-layout.js?v=20260816-v4" defer></script>', h)
          p.write_text(h,encoding='utf-8')
          PY
      - name: Commit standings share fixes
        run: |
          if git diff --quiet -- standings-share-layout.js standings.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standings-share-layout.js standings.html
          git commit -m 'Fix classification standings share graphics'
          git pull --rebase origin main
          git push
