name: Load Enhanced Standings Share Layout

on:
  push:
    paths:
      - '.github/workflows/load-standings-share-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh standings share script version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('standings.html')
          h=p.read_text(encoding='utf-8')
          h=re.sub(r'standings-share-layout\.js\?v=[^"\']+', 'standings-share-layout.js?v=20260816-v5', h)
          p.write_text(h,encoding='utf-8')
          PY
      - name: Commit standings share cache refresh
        run: |
          if git diff --quiet -- standings.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standings.html
          git commit -m 'Refresh standings share layout cache'
          git pull --rebase origin main
          git push
