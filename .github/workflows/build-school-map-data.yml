name: Build Football School Map Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-school-map-data.yml'
      - 'scripts/build_school_map_data.py'
      - 'teams-data.json'
      - 'school-assets.js'

permissions:
  contents: write

concurrency:
  group: football-school-map-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Build UHSAA school location data
        run: python scripts/build_school_map_data.py

      - name: Commit map data
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add school-directory.json
          if git diff --cached --quiet; then
            echo "School map data is already current."
          else
            git commit -m "Auto-update football school map data"
            git pull --rebase origin main
            git push origin main
          fi
