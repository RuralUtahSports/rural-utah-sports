name: Audit 2026 Stat Leaders source coverage
on:
  pull_request:
    paths:
      - 'scripts/audit_stat_leaders_2026.mjs'
      - 'tests/audit-stat-leaders-2026.test.mjs'
      - '.github/workflows/stat-leaders-coverage-audit-2026.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test player statistics audit cases
        run: node --test tests/audit-stat-leaders-2026.test.mjs
      - name: Independently review all currently reported 2026 player leaderboards
        run: node scripts/audit_stat_leaders_2026.mjs --output="$RUNNER_TEMP/stat-leaders-audit"
      - name: Ensure no dataset, official ranks or award inputs were changed by audit
        run: |
          git diff --exit-code -- deseret-rosters-stats-2026.json maxpreps-stats-fallback-2026.json player-game-stats-2026.json maxpreps-player-game-stats-2026.json regular-season-publication-2026.json region-awards-2026.lock.json standings-2026.json
          test -s "$RUNNER_TEMP/stat-leaders-audit/AUDIT.md"
          test -s "$RUNNER_TEMP/stat-leaders-audit/audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2026-stat-leaders-evidence-review
          path: ${{ runner.temp }}/stat-leaders-audit
          if-no-files-found: ignore
          retention-days: 30
