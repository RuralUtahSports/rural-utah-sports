name: Revert Rich Original Logo

on:
  push:
    paths:
      - '.github/workflows/revert-rich-original-logo.yml'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Rich custom logo overrides
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('school-assets.js')
          s = p.read_text()
          s2 = re.sub(r"\n\s*'RICH':'school-logos/rich\.svg',?", '', s)
          if s2 == s:
              print('Rich custom override was already absent from school-assets.js')
          p.write_text(s2)

          cp = Path('school-logo-cache.json')
          data = json.loads(cp.read_text())
          if 'RICH' in data:
              data.pop('RICH')
          cp.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Commit revert
        run: |
          if git diff --quiet -- school-assets.js school-logo-cache.json; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add school-assets.js school-logo-cache.json
          git commit -m 'Restore Rich original logo source'
          git push
