name: Add Games Team Records
on:
  push:
    paths:
      - '.github/workflows/add-games-team-records.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Games team records script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('games.html')
          t=p.read_text()
          tag='<script src="games-team-records.js" defer></script>'
          if tag not in t:
              t=t.replace('</body>',tag+'\n</body>')
              p.write_text(t)
          assert tag in p.read_text()
          PY
      - name: Commit changes
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add games.html
          git commit -m "Show team single-game scoring records on Games page"
          git pull --rebase origin main
          git push
