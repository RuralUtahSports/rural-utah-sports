name: Football classification history
on:
  pull_request:
    paths:
      - 'team-season-alignments.json'
      - 'team-season-sheet.js'
      - 'team-season-record-display.json'
      - 'scripts/build-team-season-standings.mjs'
      - 'historical-football-programs.json'
      - 'audits/team-season-archive-counts.json'
      - 'team-page-content.html'
      - 'team.html'
      - 'team-tabs.js'
      - 'teams.html'
      - 'championship-brackets.js'
      - 'scripts/*team-season-alignments*'
      - '.github/workflows/team-season-alignments.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-team-season-alignments.mjs
      - run: node scripts/build-team-season-standings.mjs && git diff --exit-code -- team-season-record-display.json
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps webkit
      - name: Check team seasons on an iPhone viewport
        run: |
          python3 -m http.server 8852 --bind 127.0.0.1 &
          for i in {1..20}; do curl -fsS -o /dev/null http://127.0.0.1:8852/team.html && break; sleep 0.25; done
          node scripts/test-team-season-alignments-browser.cjs
