name: Rebuild 2025 Awards

on:
  workflow_dispatch:
  push:
    paths:
      - 'award-scoring-core.js'
      - 'scripts/build_awards_2025.mjs'
      - '.github/workflows/rebuild-awards-2025.yml'

permissions:
  contents: write

concurrency:
  group: rebuild-2025-awards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild and publish 2025 awards
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/build_awards_2025.mjs
            node -e "const fs=require('fs');const awards=JSON.parse(fs.readFileSync('awards-2025.json','utf8'));if(awards.season!==2025)throw new Error('Wrong awards season');if(!awards.method?.scoringVersion)throw new Error('Shared scoring version missing');const sample=Object.values(awards.allState||{}).flatMap(x=>Object.values(x.positions||{})).flat().find(Boolean);if(sample&&typeof sample.positionScore!=='number')throw new Error('Position score missing from generated players');console.log('2025 award scoring version:',awards.method.scoringVersion);"
            git add awards-2025.json
            if git diff --cached --quiet; then echo "2025 awards already current."; exit 0; fi
            git commit -m "Recalculate 2025 awards with shared scoring"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
