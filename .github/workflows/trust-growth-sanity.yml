name: Trust & Growth Sanity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'seo-structured-data.js'
      - 'site-credibility.js'
      - 'pwa.js'
      - 'sw.js'
      - 'changelog.json'
      - 'whats-new.html'
      - 'robots.txt'
      - 'scripts/build-sitemap.mjs'
      - 'scripts/audit-football-data.mjs'
      - 'scripts/check-trust-growth.mjs'
      - '.github/workflows/data-audit.yml'
      - '.github/workflows/build-sitemap.yml'
      - '.github/workflows/trust-growth-sanity.yml'
  pull_request:
    paths:
      - 'seo-structured-data.js'
      - 'site-credibility.js'
      - 'pwa.js'
      - 'sw.js'
      - 'changelog.json'
      - 'whats-new.html'
      - 'robots.txt'
      - 'scripts/build-sitemap.mjs'
      - 'scripts/audit-football-data.mjs'
      - 'scripts/check-trust-growth.mjs'
      - '.github/workflows/data-audit.yml'
      - '.github/workflows/build-sitemap.yml'
      - '.github/workflows/trust-growth-sanity.yml'

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check seo-structured-data.js
          node --check site-credibility.js
          node --check pwa.js
          node --check sw.js
          node --check scripts/build-sitemap.mjs
          node --check scripts/audit-football-data.mjs
          node --check scripts/check-trust-growth.mjs
      - name: Verify Trust & Growth wiring
        run: node scripts/check-trust-growth.mjs
