name: Add Championship Bracket Test
on:
  push:
    paths:
      - '.github/workflows/add-championship-bracket-test.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add bracket script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('championships.html')
          t=p.read_text()
          if 'championship-brackets.js' not in t:
              t=t.replace('</body>','<script src="championship-brackets.js" defer></script>\n</body>')
              p.write_text(t)
          assert 'championship-brackets.js' in p.read_text()
          PY
      - name: Commit changes
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add championships.html
          git commit -m "Show 2025 playoff brackets on championships page"
          git pull --rebase origin main
          git push
