name: Apply Grouped Navigation
on:
  push:
    paths:
      - '.github/workflows/apply-grouped-nav.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared nav script to root pages
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=[]
          for p in sorted(Path('.').glob('*.html')):
              text=p.read_text()
              if '</body>' not in text or 'nav-menu.js' in text:
                  continue
              text=text.replace('</body>','<script src="nav-menu.js" defer></script>\n</body>')
              p.write_text(text)
              changed.append(p.name)
          print('Updated:', ', '.join(changed))
          assert changed, 'No pages updated'
          PY
      - name: Verify all root pages
        run: |
          python - <<'PY'
          from pathlib import Path
          missing=[]
          for p in sorted(Path('.').glob('*.html')):
              text=p.read_text()
              if '</body>' in text and 'nav-menu.js' not in text:
                  missing.append(p.name)
          print('Missing:', missing)
          assert not missing
          PY
      - name: Commit changes
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add '*.html'
          git commit -m "Use grouped navigation across site"
          git pull --rebase origin main
          git push
