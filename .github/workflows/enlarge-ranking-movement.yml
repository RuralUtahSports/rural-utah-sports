name: Enlarge Ranking Movement
on:
  push:
    paths:
      - '.github/workflows/enlarge-ranking-movement.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enlarge movement arrows and numbers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('share-graphic.js')
          s=p.read_text()
          old='.rus-export-move.up{color:#62df8c}.rus-export-move.down{color:#ff7070}.rus-export-move.new{color:#F14D07}'
          new='.rus-export-move{font-size:14px;font-weight:1000;line-height:1}.rus-export-move.up{color:#62df8c}.rus-export-move.down{color:#ff7070}.rus-export-move.new{color:#F14D07}.rus-export-board.rus-export-landscape .rus-export-move{font-size:12px}'
          if old not in s:
              raise SystemExit('movement CSS target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Bust rankings share cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('rankings.html')
          s=p.read_text()
          import re
          s,n=re.subn(r'share-graphic\.js\?v=[^"\']+', 'share-graphic.js?v=20260815movebig', s)
          if not n:
              raise SystemExit('rankings share script tag not found')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'RuralUtahSports'
          git config user.email '60403147+RuralUtahSports@users.noreply.github.com'
          git add share-graphic.js rankings.html
          git diff --cached --quiet && exit 0
          git commit -m 'Make ranking movement indicators larger in share graphics'
          git push
