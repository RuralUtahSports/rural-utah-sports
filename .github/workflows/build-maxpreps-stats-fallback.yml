name: Build MaxPreps Stats Fallback
# Defensive fallback refreshes run independently of the frequent Deseret refresh queue.
# Parser and merge self-tests run before every full refresh.

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/merge_maxpreps_stats_fallback.mjs'
      - 'scripts/merge_maxpreps_game_logs.mjs'
      - 'scripts/reconcile_season_stats_from_game_logs.mjs'
      - 'scripts/build_team_current_shards.mjs'
      - '.github/workflows/build-maxpreps-stats-fallback.yml'
  schedule:
    # Daily at 5:37 a.m. Mountain Daylight Time (11:37 a.m. UTC).
    # Move the baseline refresh earlier so short/Wednesday game weeks are ready sooner.
    - cron: '37 11 * * *'
    # Extra early-week pass Monday and Tuesday at 12:37 p.m. MDT (6:37 p.m. UTC).
    # This catches MaxPreps stat updates posted after the morning scrape before midweek games.
    - cron: '37 18 * * 1,2'

permissions:
  contents: write

concurrency:
  # Do not share the 15-minute Deseret queue: frequent Deseret runs can otherwise
  # keep this longer fallback refresh pending indefinitely.
  group: maxpreps-stats-fallback
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify fallback parser and merge rules
        run: |
          node scripts/merge_maxpreps_stats_fallback.mjs --self-test
          node scripts/merge_maxpreps_game_logs.mjs --self-test
          node scripts/reconcile_season_stats_from_game_logs.mjs --self-test
      - name: Fill missing Deseret player stats from MaxPreps
        run: node scripts/merge_maxpreps_stats_fallback.mjs
      - name: Rebuild stats-dependent data
        run: |
          node scripts/apply_manual_stat_corrections.mjs
          node scripts/build_player_game_stats.mjs
          node scripts/merge_maxpreps_game_logs.mjs
          node scripts/reconcile_season_stats_from_game_logs.mjs
          node scripts/build_deseret_stat_metrics.mjs
          node scripts/build_weekly_awards.mjs
          node scripts/build_team_current_shards.mjs
      - name: Verify fallback output
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('deseret-rosters-stats-2026.json','utf8'));
          const fallback=data.summary?.maxprepsFallback;
          if(!fallback||fallback.checked<100) throw new Error('MaxPreps fallback did not check enough teams');

          const cache=JSON.parse(fs.readFileSync('maxpreps-stats-fallback-2026.json','utf8'));
          const gameCache=JSON.parse(fs.readFileSync('maxpreps-player-game-stats-2026.json','utf8'));
          for(const [label,payload] of [['season cache',cache],['game cache',gameCache]]){
            const age=Date.now()-Date.parse(payload.updatedAt);
            if(!Number.isFinite(age)||age>20*60*1000) throw new Error(`MaxPreps ${label} was not freshly rebuilt`);
          }
          if((gameCache.summary?.playersFetched||0)<100) throw new Error('MaxPreps game-log refresh fetched too few players');

          if(!fs.existsSync('deseret-stat-metrics-2026.json')) throw new Error('Compact stat metrics were not rebuilt');
          const games=JSON.parse(fs.readFileSync('player-game-stats-2026.json','utf8'));
          if(!games.summary?.maxprepsFallback||games.summary.maxprepsFallback.gamesMatched<100) throw new Error('MaxPreps game logs were not merged');
          const weeklyAwards=JSON.parse(fs.readFileSync('weekly-awards-2026.json','utf8'));
          if(!weeklyAwards.weeks?.length) throw new Error('Weekly awards output is empty');
          const shards=fs.readdirSync('team-current-data').filter(name=>name.endsWith('.json'));
          if(shards.length<100) throw new Error('Per-team current-data output is incomplete');
          console.log(fallback);
          console.log(gameCache.summary);
          console.log(`Verified ${weeklyAwards.weeks.length} weekly award slate(s) and ${shards.length} per-team shards`);
          NODE
      - name: Commit fallback data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish_dir=$(mktemp -d)
          cp maxpreps-stats-fallback-2026.json maxpreps-player-game-stats-2026.json deseret-rosters-stats-2026.json deseret-stat-metrics-2026.json player-game-stats-2026.json weekly-awards-2026.json "$publish_dir/"
          cp -R team-current-data "$publish_dir/"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git switch -C maxpreps-publish origin/main
            cp "$publish_dir"/*.json .
            rm -rf team-current-data
            cp -R "$publish_dir/team-current-data" .
            git add maxpreps-stats-fallback-2026.json maxpreps-player-game-stats-2026.json deseret-rosters-stats-2026.json deseret-stat-metrics-2026.json player-game-stats-2026.json weekly-awards-2026.json team-current-data
            if git diff --cached --quiet; then echo "MaxPreps fallback data already current."; exit 0; fi
            git commit -m "Auto-fill missing player stats from MaxPreps"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push attempt $attempt failed; retrying against latest main."
            sleep $((attempt * 5))
          done
          echo "Failed to push generated MaxPreps fallback data after retries."
          exit 1
