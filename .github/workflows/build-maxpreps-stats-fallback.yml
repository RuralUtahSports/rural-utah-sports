name: Build MaxPreps Stats Fallback

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/merge_maxpreps_stats_fallback.mjs'
      - 'scripts/merge_maxpreps_game_logs.mjs'
      - '.github/workflows/build-maxpreps-stats-fallback.yml'
  schedule:
    # Tuesday at 8:00 a.m. Mountain Daylight Time (2:00 p.m. UTC).
    - cron: '7 14 * * 2'

permissions:
  contents: write

concurrency:
  group: maxpreps-stats-fallback
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify fallback parser and merge rules
        run: |
          node scripts/merge_maxpreps_stats_fallback.mjs --self-test
          node scripts/merge_maxpreps_game_logs.mjs --self-test
      - name: Fill missing Deseret player stats from MaxPreps
        run: node scripts/merge_maxpreps_stats_fallback.mjs
      - name: Rebuild stats-dependent data
        run: |
          node scripts/apply_manual_stat_corrections.mjs
          node scripts/build_deseret_stat_metrics.mjs
          node scripts/build_player_game_stats.mjs
          node scripts/merge_maxpreps_game_logs.mjs
          node scripts/build_weekly_awards.mjs
          node scripts/build_team_current_shards.mjs
      - name: Verify fallback output
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('deseret-rosters-stats-2026.json','utf8'));
          const fallback=data.summary?.maxprepsFallback;
          if(!fallback||fallback.checked<100) throw new Error('MaxPreps fallback did not check enough teams');
          if(!fs.existsSync('deseret-stat-metrics-2026.json')) throw new Error('Compact stat metrics were not rebuilt');
          if(fs.readdirSync('team-current-data').filter(name=>name.endsWith('.json')).length<100) throw new Error('Per-team data was not rebuilt');
          console.log(fallback);
          NODE
      - name: Commit fallback data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maxpreps-stats-fallback-2026.json maxpreps-player-game-stats-2026.json deseret-rosters-stats-2026.json deseret-stat-metrics-2026.json player-game-stats-2026.json weekly-awards-2026.json team-current-data
          if git diff --cached --quiet; then echo "MaxPreps fallback data already current."; exit 0; fi
          git commit -m "Auto-fill missing player stats from MaxPreps"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            echo "Push attempt $attempt failed; retrying against latest main."
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "Failed to push generated MaxPreps fallback data after retries."
          exit 1
