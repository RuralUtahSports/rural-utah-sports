name: Fix Greatest Seasons Navigation

on:
  push:
    paths:
      - '.github/workflows/fix-greatest-seasons-nav.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('greatest-seasons.html')
          text = p.read_text(encoding='utf-8')
          nav = '<nav>\n  <div class="nav-content">\n    <a href="index.html">Home</a>\n    <a href="teams.html">Teams</a>\n    <a href="greatest-seasons.html" class="active">Greatest Seasons</a>\n    <a href="championships.html">Championships</a>\n    <a href="records.html">Records</a>\n    <a href="scorigami.html">Scorigami</a>\n    <a href="#">Games</a>\n    <a href="#">Rankings</a>\n    <a href="simulators.html">Simulators</a>\n  </div>\n</nav>'
          text, count = re.subn(r'<nav>.*?</nav>', nav, text, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError('Navigation block not found')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit navigation
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add greatest-seasons.html
          if git diff --cached --quiet; then
            echo "Navigation already current."
          else
            git commit -m "Fix Greatest Seasons navigation"
            git push
          fi
