name: Apply Custom School Logo Overrides

on:
  push:
    paths:
      - '.github/workflows/apply-custom-logo-overrides.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire uploaded logos into shared logo resolver
        shell: bash
        run: |
          cat > /tmp/patch_logos.py <<'PY'
          from pathlib import Path
          p = Path('school-assets.js')
          s = p.read_text()
          marker = "  const BAD=new Set(['ESCALANTE','USDB','UTAH SCH DEAF']);"
          custom = """  const CUSTOM_LOGOS={
            'GREEN CANYON':'school-logos/green-canyon.svg',
            'HILLCREST':'school-logos/hillcrest.svg',
            'KEARNS':'school-logos/kearns.svg',
            'LAYTON CHRISTIAN':'school-logos/layton-christian.svg',
            'LAYTON CHRISTIAN ACADEMY':'school-logos/layton-christian.svg',
            'LONE PEAK':'school-logos/lone-peak.svg',
            'MAPLE MOUNTAIN':'school-logos/maple-mountain.svg',
            'MILFORD':'school-logos/milford.svg',
            'MILLARD':'school-logos/millard.svg',
            'MORGAN':'school-logos/morgan.svg',
            'OREM':'school-logos/orem.svg',
            'PROVIDENCE HALL':'school-logos/providence-hall.svg',
            'RICH':'school-logos/rich.svg',
            'SAN JUAN':'school-logos/san-juan.svg',
            'VIEWMONT':'school-logos/viewmont.svg'
          };
          """
          if 'const CUSTOM_LOGOS=' not in s:
              if marker not in s:
                  raise SystemExit('Could not find BAD marker in school-assets.js')
              s = s.replace(marker, custom + marker, 1)
          old = "  A.logoUrl=(team,entry)=>entry?.logoUrl||A.get(team)?.logoUrl||A.fallbackLogo(team);"
          new = "  A.logoUrl=(team,entry)=>CUSTOM_LOGOS[norm(team)]||entry?.logoUrl||A.get(team)?.logoUrl||A.fallbackLogo(team);"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Could not find logoUrl resolver in school-assets.js')
          p.write_text(s)
          PY
          python /tmp/patch_logos.py
      - name: Commit resolver update
        shell: bash
        run: |
          if git diff --quiet -- school-assets.js; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add school-assets.js
          git commit -m 'Use uploaded custom school logos sitewide'
          git push
