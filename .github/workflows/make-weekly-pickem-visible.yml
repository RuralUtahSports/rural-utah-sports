name: Make Weekly Pickem Visible

on:
  push:
    paths:
      - '.github/workflows/make-weekly-pickem-visible.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Put Weekly Pickem in the canonical navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          nav = Path('nav-menu.js')
          text = nav.read_text()
          original = text

          # Make Pick'em a real item in the Simulators dropdown, not something
          # that depends on the delayed site-polish script to append it later.
          old_group = '''    simulators: [\n      ["Simulators Hub", "simulators.html"],\n      ["Promotion / Relegation", "promotion-relegation.html"],\n    ],'''
          new_group = '''    simulators: [\n      ["Weekly Pick'em", "simulators.html?tab=weekly"],\n      ["Simulators Hub", "simulators.html"],\n      ["Promotion / Relegation", "promotion-relegation.html"],\n    ],'''
          if old_group in text:
              text = text.replace(old_group, new_group, 1)
          elif 'simulators.html?tab=weekly' not in text:
              raise SystemExit('Could not locate simulators navigation group')

          # Also expose Pick'em as a top-level item so it is immediately visible
          # on desktop and mobile without opening a dropdown.
          old_slot = '''        link("Standings", "standings.html"),\n        dropdown("Stats", "stats"),'''
          new_slot = '''        link("Standings", "standings.html"),\n        link("Pick'em", "simulators.html?tab=weekly"),\n        dropdown("Stats", "stats"),'''
          if old_slot in text:
              text = text.replace(old_slot, new_slot, 1)
          elif 'link("Pick\'em", "simulators.html?tab=weekly")' not in text:
              raise SystemExit('Could not locate top-level navigation insertion point')

          nav.write_text(text)
          print('nav-menu.js updated:', text != original)

          # Keep the delayed enhancement consistent, but the canonical nav above
          # no longer depends on it.
          polish = Path('site-polish.js')
          if polish.exists():
              p = polish.read_text()
              p = p.replace("simulators.html#weekly", "simulators.html?tab=weekly")
              polish.write_text(p)

          # Bust the browser cache for nav-menu.js everywhere it is referenced.
          for html in Path('.').glob('*.html'):
              s = html.read_text()
              n = s.replace('nav-menu.js?v=20260818-perf2', 'nav-menu.js?v=20260827-pickem1')
              n = n.replace('nav-menu.js?v=20260818-perf1', 'nav-menu.js?v=20260827-pickem1')
              n = n.replace('nav-menu.js"', 'nav-menu.js?v=20260827-pickem1"')
              if n != s:
                  html.write_text(n)

          # Ensure the homepage's no-JS/static fallback also shows Pick'em.
          index = Path('index.html')
          s = index.read_text()
          marker = '<a href="simulators.html">Simulators</a>'
          add = marker + '<a href="simulators.html?tab=weekly">Pick\'em</a>'
          if marker in s and 'href="simulators.html?tab=weekly">Pick\'em</a>' not in s:
              s = s.replace(marker, add, 1)
              index.write_text(s)
          PY

      - name: Validate Weekly Pickem visibility
        run: |
          grep -Fq 'link("Pick'"'"'em", "simulators.html?tab=weekly")' nav-menu.js
          grep -Fq '["Weekly Pick'"'"'em", "simulators.html?tab=weekly"]' nav-menu.js
          grep -Fq 'simulators.html?tab=weekly' index.html
          grep -Fq 'Weekly Pick'"'"'em' simulators.html
          test -f weekly-picks.js

      - name: Commit visible Pickem navigation
        run: |
          rm -f .github/workflows/make-weekly-pickem-visible.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nav-menu.js site-polish.js index.html '*.html' .github/workflows/make-weekly-pickem-visible.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make Weekly Pickem visible in navigation"
          git push
