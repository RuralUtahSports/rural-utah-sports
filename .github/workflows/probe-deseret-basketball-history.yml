name: Probe Deseret basketball history

on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_deseret_basketball_history.mjs'
      - '.github/workflows/probe-deseret-basketball-history.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe historical Deseret scoreboard
        run: node scripts/probe_deseret_basketball_history.mjs
      - name: Commit probe output
        run: |
          git add deseret-basketball-probe-2000-02-09.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Probe Deseret 1999-2000 basketball archive"
          git pull --rebase origin main
          git push
