name: Enlarge Ranking Share Logos

on:
  push:
    paths:
      - '.github/workflows/enlarge-ranking-share-logos.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enlarge logos without clipping
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js = Path('share-graphic.js')
          s = js.read_text()

          s, n1 = re.subn(
              r'\.rus-export-logo-wrap\{[^}]+\}',
              '.rus-export-logo-wrap{margin-top:auto;height:78px;min-height:78px;max-height:78px;width:100%;display:flex;align-items:center;justify-content:center;padding:3px 6px;overflow:hidden;box-sizing:border-box}',
              s,
              count=1
          )
          s, n2 = re.subn(
              r'\.rus-export-logo-large\{[^}]+\}',
              '.rus-export-logo-large{display:block;width:auto;height:auto;max-width:96%;max-height:70px;object-fit:contain;object-position:center center;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}',
              s,
              count=1
          )

          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Expected one logo wrapper and one logo rule, got {n1} and {n2}')

          js.write_text(s)

          rank = Path('rankings.html')
          text = rank.read_text()
          text = re.sub("share-graphic\\.js\\?v=[^\\\"']+", 'share-graphic.js?v=20260815-logo-big1', text)
          rank.write_text(text)
          PY

      - name: Commit larger share logos
        run: |
          if git diff --quiet -- share-graphic.js rankings.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add share-graphic.js rankings.html
          git commit -m 'Enlarge ranking share logos safely'
          git push
