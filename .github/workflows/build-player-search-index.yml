name: Build Player Search Index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deseret-rosters-stats-2026.json'
      - 'deseret-rosters-stats-2025.json'
      - 'standings-2026.json'
      - 'weekly-simulation.json'
      - '.github/workflows/build-player-search-index.yml'
      - 'scripts/build_player_search_index.mjs'

  workflow_run:
    workflows: ['Build Deseret Rosters and Stats', 'Build MaxPreps Stats Fallback', 'Build 2025 Football Archive', 'Build 2026 Standings', 'Build Simulator Data', 'Enrich Weekly Deseret Links']
    types: [completed]
  schedule:
    - cron: '23 * * * *'

concurrency:
  group: search-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Capture source snapshot for publication
        run: echo "STAT_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build lightweight player search index
        run: node scripts/build_player_search_index.mjs
      - name: Validate search coverage and runtime behavior
        run: node scripts/test-search-runtime.cjs
      - name: Commit index update
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          node scripts/check_stat_publish_2026.mjs --snapshot-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-search-index.json
          if git diff --cached --quiet; then echo "Derived data already current."; exit 0; fi
          git commit -m "Refresh derived data from current source snapshot"
          git push origin HEAD:main
