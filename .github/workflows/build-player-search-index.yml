name: Build Player Search Index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deseret-rosters-stats-2026.json'
      - 'deseret-rosters-stats-2025.json'
      - 'scripts/build-player-search-index.mjs'
      - '.github/workflows/build-player-search-index.yml'

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build player search index
        run: node scripts/build-player-search-index.mjs

      - name: Commit generated index
        run: |
          if git diff --quiet -- player-search-index.json; then
            echo 'Player search index is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add player-search-index.json
          git commit -m 'Refresh player search index'
          git push
