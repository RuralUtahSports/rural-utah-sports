name: Fix Beaver Enterprise Region
on:
  push:
    paths:
      - '.github/workflows/fix-beaver-enterprise-region.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update regions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('teams-data.json')
          data=json.loads(p.read_text())
          targets={'BEAVER','ENTERPRISE'}
          found=set()
          for t in data:
              if t.get('team') in targets:
                  t['classification']='1A'
                  t['region']='1A South'
                  found.add(t['team'])
          if found != targets:
              raise SystemExit(f'Missing teams: {targets-found}')
          p.write_text(json.dumps(data,separators=(',',':')))
          PY
      - name: Verify and commit
        run: |
          python - <<'PY'
          import json
          d=json.load(open('teams-data.json'))
          for name in ('BEAVER','ENTERPRISE'):
              t=next(x for x in d if x.get('team')==name)
              assert t['classification']=='1A'
              assert t['region']=='1A South'
              print(name,t['classification'],t['region'])
          PY
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add teams-data.json
          git commit -m "Move Beaver and Enterprise to 1A South"
          git pull --rebase origin main
          git push
