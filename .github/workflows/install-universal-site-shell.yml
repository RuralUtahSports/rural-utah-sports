name: Install Universal Site Shell

on:
  push:
    paths:
      - '.github/workflows/install-universal-site-shell.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load shared shell on every root HTML page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          tag = '<script src="nav-menu.js?v=20260817-universal5"></script>'
          changed = []
          skipped = []

          for p in sorted(Path('.').glob('*.html')):
              text = p.read_text(encoding='utf-8')
              old = text

              # Replace any existing nav-menu loader with one common cache-busted loader.
              text = re.sub(
                  r'<script\s+src=["\']nav-menu\.js(?:\?[^"\']*)?["\']\s*></script>',
                  tag,
                  text,
                  flags=re.I,
              )

              # Older pages such as scoreboard.html had only hard-coded nav and no shared loader.
              if 'nav-menu.js?v=20260817-universal5' not in text:
                  if re.search(r'</body\s*>', text, flags=re.I):
                      text = re.sub(r'</body\s*>', tag + '\n</body>', text, count=1, flags=re.I)
                  else:
                      skipped.append(str(p))

              if text != old:
                  p.write_text(text, encoding='utf-8')
                  changed.append(str(p))

          print(f'Updated {len(changed)} HTML pages')
          for name in changed:
              print('  +', name)
          if skipped:
              print('Skipped pages without </body>:')
              for name in skipped:
                  print('  !', name)

          # One-shot installer.
          Path('.github/workflows/install-universal-site-shell.yml').unlink(missing_ok=True)
          PY

      - name: Verify key pages
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','scoreboard.html','teams.html','team.html','games.html','rankings.html','standings.html','stat-leaders.html','storylines.html','elo.html','simulators.html']:
              p=Path(name)
              if not p.exists():
                  raise SystemExit(f'Missing expected page: {name}')
              text=p.read_text(encoding='utf-8')
              if 'nav-menu.js?v=20260817-universal5' not in text:
                  raise SystemExit(f'Shared shell missing from {name}')
          print('Shared shell verified on all key football pages.')
          PY

      - name: Commit universal shell wiring
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "All pages already use the shared shell."
          else
            git commit -m "Use shared app shell on every football page"
            git pull --rebase origin main
            git push
          fi
