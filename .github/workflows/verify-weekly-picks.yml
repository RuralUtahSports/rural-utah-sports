name: Verify Weekly Picks

on:
  push:
    paths:
      - '.github/workflows/verify-weekly-picks.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check weekly picks JavaScript
        run: node --check weekly-picks.js
      - name: Verify 4 PM Mountain release wiring
        run: |
          grep -q "const WP_TZ='America/Denver'" weekly-picks.js
          grep -q "const WP_RELEASE_HOUR=16" weekly-picks.js
          grep -q 'weekly-picks.css' simulators.html
          grep -q 'weekly-picks.js' simulators.html
          node <<'NODE'
          const release = Number('202608131600');
          if (!(Number('202608131559') < release)) throw new Error('15:59 should remain locked');
          if (!(Number('202608131600') >= release)) throw new Error('16:00 should be released');
          console.log('Release boundary verified: 4:00 PM Mountain Time');
          NODE
