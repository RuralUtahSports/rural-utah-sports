name: Build Scorigami Data

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    paths:
      - '.github/workflows/build-scorigami.yml'
      - 'scripts/build_home_history.mjs'
      - 'weekly-simulation.json'

permissions:
  contents: write

concurrency:
  group: scorigami-data-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Scorigami JSON
        env:
          SHEET_ID: 1IHr84tlMdZVAazLDh0HV7ZWoxNH4UpjpLt_UTV8KZwo
          CLEAN_GAMES_GID: 627882418
        run: |
          node <<'NODE'
          const fs=require('fs');const sheetId=process.env.SHEET_ID,gid=process.env.CLEAN_GAMES_GID;
          const url=`https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}&range=${encodeURIComponent('A1:F50000')}`;
          function parseCSV(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else{if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field=''}else field+=c}}if(field.length||row.length){row.push(field.replace(/\r$/,''));rows.push(row)}return rows}
          const clean=v=>String(v??'').trim(),norm=v=>clean(v).replace(/\s+/g,' ').toUpperCase(),num=v=>{const n=Number(clean(v).replace(/,/g,''));return Number.isFinite(n)?n:null};
          const aliases={'GUNNISON':'GUNNISON VALLEY','MAPLE MTN':'MAPLE MOUNTAIN','MONUMENT VAL':'MONUMENT VALLEY','CEDAR':'CEDAR CITY','SUMMIT':'SUMMIT ACADEMY','WASATCH ACAD':'WASATCH ACADEMY','WASATCH ACAD.':'WASATCH ACADEMY','HINKLEY':'HINCKLEY','BY HIGH':'BYH','BRIGHAM YOUNG':'BYH','UTAH SCH DEAF':'USDB','AMRICAN FORK':'AMERICAN FORK','DESERET HILLS':'DESERT HILLS','MOUNUMENT VALLEY':'MONUMENT VALLEY','MONTUMENT VALLEY':'MONUMENT VALLEY','MOAPA VALLEY(NV)':'MOAPA VALLEY (NV)','VIRGIN VAL (NV)':'VIRGIN VALLEY (NV)','VIRGIN VALLEY (NV))':'VIRGIN VALLEY (NV)','BOULDER CITY(NV)':'BOULDER CITY (NV)','HIGHLAND, ID':'HIGHLAND (ID)','MARSH VALLEY(ID)':'MARSH VALLEY (ID)','ONEIDA ACAD.(ID)':'ONEIDA ACADEMY (ID)','RAYMOND, ALBERTA':'RAYMOND (ALBERTA)','ST LOUIS (HI)':'ST. LOUIS (HI)','CROWNPOINT (NM)':'CROWN POINT (NM)','KIRKLAND (NM)':'KIRTLAND (NM)','MTN CREST JV':'MOUNTAIN CREST JV','EAST HIGH 2ND TEAM':'EAST 2ND TEAM','WEST HIGH 2ND TEAM':'WEST 2ND TEAM','MTN. VIEW CHRISTIAN (NV)':'MTN VIEW CHRISTIAN (NV)','MONUMENT VAL (AZ) JV':'MONUMENT VALLEY (AZ) JV','BLOOMFIELD(NM)JV':'BLOOMFIELD (NM) JV'};
          function team(v){const n=norm(v).replace(/\.+$/,'').trim();if(n.startsWith('WASATCH ACAD'))return'WASATCH ACADEMY';return aliases[n]||n}
          const year=v=>{const m=clean(v).match(/(18|19|20)\d{2}/);return m?Number(m[0]):null},stamp=v=>{const d=new Date(clean(v));return Number.isFinite(d.getTime())?d.getTime():0};
          function pairKey(a,b){return [a,b].sort().join('|')}
          function scoreSig(a,sa,b,sb){return [[a,sa],[b,sb]].sort((x,y)=>x[0].localeCompare(y[0])).map(x=>`${x[0]}:${x[1]}`).join('|')}
          function isKnownBadDuplicate(date,a,b,sa,sb){
            const pair=pairKey(a,b),sig=scoreSig(a,sa,b,sb);
            if(date==='9/19/2025'&&pair==='MONUMENT VALLEY|PANGUITCH')return true;
            // The real 2024 Westlake-Copper Hills playoff game was 10/25/2024, 41-26.
            // A second copy dated 10/18/2024 exists in the historical source and is not a real game.
            if(date==='10/18/2024'&&pair==='COPPER HILLS|WESTLAKE'&&sig==='COPPER HILLS:26|WESTLAKE:41')return true;
            return false;
          }
          (async()=>{const res=await fetch(url);if(!res.ok)throw new Error(`Sheet download failed ${res.status}`);const rows=parseCSV(await res.text()),scoreMap=new Map(),candidates=[];let skippedRows=0,sourceRows=0,weeklyFinalsAdded=0,exactDuplicatesRemoved=0,nearDuplicatesRemoved=0,conflictingDuplicates=0,knownCorrectionsRemoved=0,maxWinningScore=0,maxLosingScore=0;
            for(let i=1;i<rows.length;i++){const r=rows[i],date=clean(r[0]),team1=team(r[1]),team2=team(r[2]),score1=num(r[3]),score2=num(r[4]),ts=stamp(date);if(!date||!ts||!team1||!team2||team1===team2||score1===null||score2===null||score1<0||score2<0){if(r.some(v=>clean(v)))skippedRows++;continue}if(isKnownBadDuplicate(date,team1,team2,score1,score2)){knownCorrectionsRemoved++;continue}sourceRows++;candidates.push({date,team1,team2,score1,score2,ts,index:i,pair:pairKey(team1,team2),sig:scoreSig(team1,score1,team2,score2),source:'clean'})}
            // Merge finalized Weekly Simulation games so Scorigami updates as soon as a final reaches the site,
            // even if the Google Sheet Clean Games rebuild has not finished yet. Normal dedupe below prevents double counting.
            if(fs.existsSync('weekly-simulation.json')){
              try{
                const weekly=JSON.parse(fs.readFileSync('weekly-simulation.json','utf8'));
                for(const [i,g] of (weekly.games||[]).entries()){
                  const date=clean(g.date),team1=team(g.awayTeam),team2=team(g.homeTeam),score1=num(g.actualAway),score2=num(g.actualHome),ts=stamp(date);
                  if(!date||!ts||!team1||!team2||team1===team2||score1===null||score2===null||score1<0||score2<0)continue;
                  if(isKnownBadDuplicate(date,team1,team2,score1,score2)){knownCorrectionsRemoved++;continue}
                  weeklyFinalsAdded++;
                  candidates.push({date,team1,team2,score1,score2,ts,index:1000000+i,pair:pairKey(team1,team2),sig:scoreSig(team1,score1,team2,score2),source:'weekly'});
                }
              }catch(e){console.warn('Weekly Simulation merge skipped:',e.message)}
            }
            candidates.sort((a,b)=>a.ts-b.ts||a.index-b.index);
            const exactSeen=new Map(),lastBySignature=new Map(),unique=[];
            for(const g of candidates){const exactKey=`${g.date}|${g.pair}`,priorSig=exactSeen.get(exactKey);if(priorSig!==undefined){exactDuplicatesRemoved++;if(priorSig!==g.sig)conflictingDuplicates++;continue}exactSeen.set(exactKey,g.sig);const signature=`${g.pair}|${g.sig}`,prior=lastBySignature.get(signature);if(prior){const days=(g.ts-prior.ts)/86400000,modern=(year(g.date)||0)>=2000&&(year(prior.date)||0)>=2000,maxGap=modern?7:3;if(days>0&&days<=maxGap){nearDuplicatesRemoved++;continue}}lastBySignature.set(signature,g);unique.push(g)}
            for(const g of unique){const {date,team1,team2,score1,score2}=g,high=Math.max(score1,score2),low=Math.min(score1,score2),k=`${high}-${low}`,yr=year(date);let e=scoreMap.get(k);if(!e){e={winner:high,loser:low,count:0,firstYear:null,recentYear:null,games:[]};scoreMap.set(k,e)}e.count++;if(yr!==null){e.firstYear=e.firstYear===null?yr:Math.min(e.firstYear,yr);e.recentYear=e.recentYear===null?yr:Math.max(e.recentYear,yr)}const tie=score1===score2,winningTeam=tie?team1:(score1>score2?team1:team2),losingTeam=tie?team2:(score1>score2?team2:team1);e.games.push({date,year:yr,winner:winningTeam,loser:losingTeam,winnerScore:high,loserScore:low,tie,team1,team2,score1,score2});maxWinningScore=Math.max(maxWinningScore,high);maxLosingScore=Math.max(maxLosingScore,low)}
            for(const e of scoreMap.values())e.games.sort((a,b)=>stamp(b.date)-stamp(a.date));const scores=[...scoreMap.values()].sort((a,b)=>a.winner-b.winner||a.loser-b.loser),duplicatesRemoved=exactDuplicatesRemoved+nearDuplicatesRemoved+knownCorrectionsRemoved;const payload={summary:{sourceRows,weeklyFinalsAdded,uniqueGames:unique.length,duplicatesRemoved,exactDuplicatesRemoved,nearDuplicatesRemoved,knownCorrectionsRemoved,conflictingDuplicates,uniqueFinalScores:scores.length,skippedRows},maxWinningScore,maxLosingScore,scores};if(!scores.length||!unique.length)throw new Error('No score data');fs.writeFileSync('scorigami.json',JSON.stringify(payload));console.log(`Source rows: ${sourceRows}; weekly finals merged: ${weeklyFinalsAdded}; unique games: ${unique.length}; duplicates removed: ${duplicatesRemoved} (${exactDuplicatesRemoved} exact, ${nearDuplicatesRemoved} near-date, ${knownCorrectionsRemoved} known correction); conflicts: ${conflictingDuplicates}`)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Build compact homepage history
        run: node scripts/build_home_history.mjs
      - name: Commit Scorigami data
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add scorigami.json home-streak-watch.json home-history
          if git diff --cached --quiet; then echo "Scorigami data is already current."; else git commit -m "Auto-sync deeply deduplicated Scorigami data"; git pull --rebase origin main; git push; fi
