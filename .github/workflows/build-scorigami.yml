name: Build Scorigami Data

on:
  workflow_dispatch:
  schedule:
    - cron: '22 * * * *'
  push:
    paths:
      - '.github/workflows/build-scorigami.yml'

permissions:
  contents: write

concurrency:
  group: scorigami-data-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Scorigami JSON
        env:
          SHEET_ID: 1IHr84tlMdZVAazLDh0HV7ZWoxNH4UpjpLt_UTV8KZwo
          SCORIGAMI_GID: 1465282096
          CLEAN_GAMES_GID: 627882418
        run: |
          node <<'NODE'
          const fs = require('fs');

          const sheetId = process.env.SHEET_ID;
          const scorigamiGid = process.env.SCORIGAMI_GID;
          const cleanGamesGid = process.env.CLEAN_GAMES_GID;

          function csvUrl(gid, range) {
            return `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}&range=${encodeURIComponent(range)}`;
          }

          function parseCSV(text) {
            const rows = [];
            let row = [], field = '', quoted = false;
            for (let i = 0; i < text.length; i++) {
              const c = text[i];
              if (quoted) {
                if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
                else if (c === '"') quoted = false;
                else field += c;
              } else {
                if (c === '"') quoted = true;
                else if (c === ',') { row.push(field); field = ''; }
                else if (c === '\n') { row.push(field.replace(/\r$/, '')); rows.push(row); row = []; field = ''; }
                else field += c;
              }
            }
            if (field.length || row.length) { row.push(field.replace(/\r$/, '')); rows.push(row); }
            return rows;
          }

          async function getCSV(gid, range) {
            const res = await fetch(csvUrl(gid, range));
            if (!res.ok) throw new Error(`Sheet download failed: ${res.status} ${res.statusText}`);
            return parseCSV(await res.text());
          }

          const clean = v => String(v ?? '').trim();
          const num = v => {
            const s = clean(v).replace(/,/g, '');
            if (!s) return null;
            const n = Number(s);
            return Number.isFinite(n) ? n : null;
          };
          const scoreKey = (winner, loser) => `${winner}-${loser}`;
          const dateYear = v => {
            const m = clean(v).match(/(18|19|20)\d{2}/);
            return m ? Number(m[0]) : null;
          };

          (async () => {
            const summaryRows = await getCSV(scorigamiGid, 'A1:H3');
            const summaryRow = summaryRows[1] || [];
            const summary = {
              uniqueGames: num(summaryRow[1]) || 0,
              uniqueFinalScores: num(summaryRow[4]) || 0,
              skippedRows: num(summaryRow[7]) || 0
            };

            const matrixRows = await getCSV(scorigamiGid, 'A5:CG181');
            if (!matrixRows.length) throw new Error('Scorigami matrix is empty.');
            const headers = matrixRows[0];
            const losingScores = [];
            for (let c = 1; c < headers.length; c++) {
              const n = num(headers[c]);
              if (n === null) break;
              losingScores.push({ column: c, score: n });
            }

            const scoreMap = new Map();
            let maxWinningScore = 0;
            let maxLosingScore = 0;
            for (const row of matrixRows.slice(1)) {
              const winner = num(row[0]);
              if (winner === null) continue;
              maxWinningScore = Math.max(maxWinningScore, winner);
              for (const h of losingScores) {
                if (h.score > winner) continue;
                const count = num(row[h.column]);
                if (count === null || count <= 0) continue;
                maxLosingScore = Math.max(maxLosingScore, h.score);
                scoreMap.set(scoreKey(winner, h.score), {
                  winner,
                  loser: h.score,
                  count,
                  firstYear: null,
                  recentYear: null,
                  games: []
                });
              }
            }

            const historyRows = await getCSV(scorigamiGid, 'CO5:CR1726');
            for (const row of historyRows) {
              const m = clean(row[0]).match(/^(\d+)-(\d+)$/);
              if (!m) continue;
              const winner = Number(m[1]), loser = Number(m[2]);
              const entry = scoreMap.get(scoreKey(winner, loser));
              if (!entry) continue;
              entry.firstYear = num(row[2]);
              entry.recentYear = num(row[3]);
            }

            const tieRows = await getCSV(scorigamiGid, 'CJ15:CM180');
            for (const row of tieRows) {
              const m = clean(row[0]).match(/^(\d+)-(\d+)$/);
              if (!m || m[1] !== m[2]) continue;
              const winner = Number(m[1]), loser = Number(m[2]);
              const count = num(row[1]);
              if (count === null || count <= 0) continue;
              const key = scoreKey(winner, loser);
              let entry = scoreMap.get(key);
              if (!entry) {
                entry = { winner, loser, count, firstYear: null, recentYear: null, games: [] };
                scoreMap.set(key, entry);
              } else {
                entry.count = count;
              }
              entry.firstYear = num(row[2]);
              entry.recentYear = num(row[3]);
              maxWinningScore = Math.max(maxWinningScore, winner);
              maxLosingScore = Math.max(maxLosingScore, loser);
            }

            const cleanGameRows = await getCSV(cleanGamesGid, 'A1:F40906');
            const seenGames = new Set();
            let matchedGames = 0;
            for (const row of cleanGameRows.slice(1)) {
              const date = clean(row[0]);
              const team1 = clean(row[1]);
              const team2 = clean(row[2]);
              const score1 = num(row[3]);
              const score2 = num(row[4]);
              const winnerName = clean(row[5]);
              if (!date || !team1 || !team2 || score1 === null || score2 === null) continue;

              const high = Math.max(score1, score2);
              const low = Math.min(score1, score2);
              const entry = scoreMap.get(scoreKey(high, low));
              if (!entry) continue;

              const canonicalTeams = [team1, team2].sort((a,b) => a.localeCompare(b));
              const dedupeKey = `${date}|${canonicalTeams[0]}|${canonicalTeams[1]}|${score1}|${score2}`;
              if (seenGames.has(dedupeKey)) continue;
              seenGames.add(dedupeKey);

              let winningTeam = winnerName;
              let losingTeam = '';
              if (score1 === score2) {
                winningTeam = team1;
                losingTeam = team2;
              } else if (winnerName) {
                losingTeam = winnerName === team1 ? team2 : team1;
              } else if (score1 > score2) {
                winningTeam = team1;
                losingTeam = team2;
              } else {
                winningTeam = team2;
                losingTeam = team1;
              }

              entry.games.push({
                date,
                year: dateYear(date),
                winner: winningTeam,
                loser: losingTeam,
                winnerScore: high,
                loserScore: low,
                tie: score1 === score2,
                team1,
                team2,
                score1,
                score2
              });
              matchedGames++;
            }

            for (const entry of scoreMap.values()) {
              entry.games.sort((a,b) => {
                const ay = a.year || 0, by = b.year || 0;
                if (ay !== by) return by - ay;
                return String(b.date).localeCompare(String(a.date));
              });
            }

            const scores = [...scoreMap.values()].sort((a, b) => a.winner - b.winner || a.loser - b.loser);
            const payload = { summary, maxWinningScore, maxLosingScore, scores };

            if (!scores.length || !summary.uniqueFinalScores) throw new Error('Scorigami build produced no score data.');
            fs.writeFileSync('scorigami.json', JSON.stringify(payload));
            console.log(`Scorigami scores: ${scores.length}`);
            console.log(`Matched unique games: ${matchedGames}`);
            console.log(`Matrix range: 0-${maxWinningScore} winners, 0-${maxLosingScore} losers`);
            const sample = scoreMap.get('16-3');
            if (sample) console.log(`16-3 games attached: ${sample.games.length} (sheet count ${sample.count})`);
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Commit Scorigami data
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add scorigami.json
          if git diff --cached --quiet; then
            echo "Scorigami data is already current."
          else
            git commit -m "Auto-sync Scorigami data"
            git push
          fi
