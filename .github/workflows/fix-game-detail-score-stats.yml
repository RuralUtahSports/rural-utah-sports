name: Fix Game Detail Readability

on:
  push:
    paths:
      - '.github/workflows/fix-game-detail-score-stats.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add game detail helper
        run: |
          python3 -c "from pathlib import Path; p=Path('game.html'); s=p.read_text(encoding='utf-8'); tag='<script src=\"game-detail-fixes.js?v=20260816-v1\" defer></script>'; s=s if 'game-detail-fixes.js' in s else s.replace('<script src=\"school-assets.js?v=20260815-logo2\"></script>',tag+'\\n<script src=\"school-assets.js?v=20260815-logo2\"></script>'); p.write_text(s,encoding='utf-8')"

      - name: Commit page update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Load game detail readability fixes'
          git pull --rebase origin main
          git push
