name: Fix Game Detail Readability

on:
  push:
    paths:
      - '.github/workflows/fix-game-detail-score-stats.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop self-triggering game detail observer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('game-detail-fixes.js')
          s = p.read_text(encoding='utf-8')
          replacement = """  const page = document.getElementById('page');
          let applied = false;

          function applyWhenReady() {
            if (applied || !page || page.classList.contains('loading') || page.classList.contains('error')) return;
            applied = true;
            apply();
          }

          applyWhenReady();

          if (page && !applied) {
            const observer = new MutationObserver(() => {
              if (page.classList.contains('loading')) return;
              observer.disconnect();
              requestAnimationFrame(applyWhenReady);
            });
            observer.observe(page, { childList: true, attributes: true, attributeFilter: ['class'] });
          }
          })();
          """
          pattern = r"\s*apply\(\);\s*const page = document\.getElementById\('page'\);\s*if \(page\) new MutationObserver\(apply\)\.observe\(page, \{ childList: true, subtree: true \}\);\s*\}\)\(\);\s*$"
          s2, n = re.subn(pattern, '\n' + replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'observer block replacements: {n}')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Bump helper cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('game.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'game-detail-fixes\.js\?v=[^\" ]+', 'game-detail-fixes.js?v=20260816-v3', s)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-detail-fixes.js game.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prevent game detail render loop'
          git pull --rebase origin main
          git push
