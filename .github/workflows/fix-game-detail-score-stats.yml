name: Fix Game Detail Readability

on:
  push:
    paths:
      - '.github/workflows/fix-game-detail-score-stats.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep game helper cache current
        run: |
          python3 -c "from pathlib import Path; import re; p=Path('game.html'); s=p.read_text(encoding='utf-8'); s=re.sub(r'game-detail-fixes\\.js\\?v=[^\" ]+','game-detail-fixes.js?v=20260816-v2',s); p.write_text(s,encoding='utf-8')"

      - name: Refine stat completeness detection
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'scripts/enrich-deseret-game-details.mjs';
          let s = fs.readFileSync(path, 'utf8');
          const replacement = `function statsAvailability(stats) {
            if (!Array.isArray(stats) || !stats.length) return { status: 'unavailable', blocks: 0, rows: 0, filledCoreCells: 0, emptyCoreBlocks: 0 };
            let rows = 0, coreCells = 0, filledCoreCells = 0, emptyCoreBlocks = 0;
            for (const block of stats) {
              const headers = block.headers || [];
              const coreIndexes = headers.map((h, i) => isCoreStatHeader(h) ? i : -1).filter(i => i >= 0);
              let blockCoreCells = 0, blockFilledCoreCells = 0;
              for (const row of block.rows || []) {
                rows++;
                for (const i of coreIndexes) {
                  blockCoreCells++;
                  coreCells++;
                  if (clean(row?.[i]) && !/^[-–—]$/.test(clean(row?.[i]))) {
                    blockFilledCoreCells++;
                    filledCoreCells++;
                  }
                }
              }
              if (blockCoreCells > 0 && blockFilledCoreCells === 0) emptyCoreBlocks++;
            }
            let status = 'partial';
            if (filledCoreCells > 0 && emptyCoreBlocks === 0 && (coreCells === 0 || filledCoreCells / coreCells >= 0.25)) status = 'full';
            return { status, blocks: stats.length, rows, coreCells, filledCoreCells, emptyCoreBlocks };
          }`;
          const re = /function statsAvailability\(stats\) \{[\s\S]*?\n\}\n\nfunction qualityRank/;
          if (!re.test(s)) throw new Error('statsAvailability function not found');
          s = s.replace(re, replacement + '\n\nfunction qualityRank');
          fs.writeFileSync(path, s);
          NODE

      - name: Commit updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.html scripts/enrich-deseret-game-details.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refine game stat completeness detection'
          git pull --rebase origin main
          git push
