name: Post New Scorigami to X

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Build Scorigami Alert Feed']
    types: [completed]
  push:
    paths:
      - 'scorigami-latest.json'
      - '.github/workflows/post-scorigami-to-x.yml'

permissions:
  contents: write

concurrency:
  group: scorigami-x-post
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Post unseen Scorigamis
        run: |
          node <<'NODE'
          const fs=require('fs'),https=require('https'),crypto=require('crypto');
          const required=['X_API_KEY','X_API_SECRET','X_ACCESS_TOKEN','X_ACCESS_SECRET'];
          if(required.some(k=>!process.env[k])){console.log('X credentials are not configured yet. Skipping automatic post.');process.exit(0)}
          if(!fs.existsSync('scorigami-latest.json')){console.log('No Scorigami alert feed yet.');process.exit(0)}
          const feed=JSON.parse(fs.readFileSync('scorigami-latest.json','utf8'));
          const statePath='scorigami-posted.json',state=fs.existsSync(statePath)?JSON.parse(fs.readFileSync(statePath,'utf8')):{posted:[]};
          const posted=new Set(state.posted||[]),alerts=(feed.alerts||[]).filter(a=>a?.id&&!posted.has(a.id));
          if(!alerts.length){console.log('No unseen Scorigamis to post.');process.exit(0)}
          const enc=s=>encodeURIComponent(String(s)).replace(/[!'()*]/g,c=>'%'+c.charCodeAt(0).toString(16).toUpperCase());
          function post(text){return new Promise((resolve,reject)=>{
            const url='https://api.x.com/2/tweets',oauth={oauth_consumer_key:process.env.X_API_KEY,oauth_nonce:crypto.randomBytes(18).toString('hex'),oauth_signature_method:'HMAC-SHA1',oauth_timestamp:String(Math.floor(Date.now()/1000)),oauth_token:process.env.X_ACCESS_TOKEN,oauth_version:'1.0'};
            const paramString=Object.keys(oauth).sort().map(k=>`${enc(k)}=${enc(oauth[k])}`).join('&');
            const base=`POST&${enc(url)}&${enc(paramString)}`,key=`${enc(process.env.X_API_SECRET)}&${enc(process.env.X_ACCESS_SECRET)}`;
            oauth.oauth_signature=crypto.createHmac('sha1',key).update(base).digest('base64');
            const auth='OAuth '+Object.keys(oauth).sort().map(k=>`${enc(k)}="${enc(oauth[k])}"`).join(', '),body=JSON.stringify({text});
            const req=https.request(url,{method:'POST',headers:{Authorization:auth,'Content-Type':'application/json','Content-Length':Buffer.byteLength(body)}},res=>{let data='';res.on('data',d=>data+=d);res.on('end',()=>res.statusCode>=200&&res.statusCode<300?resolve(data):reject(new Error(`X API ${res.statusCode}: ${data}`)))});req.on('error',reject);req.write(body);req.end();
          })}
          (async()=>{
            for(const a of alerts.reverse()){
              const result=a.tie?`${a.awayTeam} ${a.awayScore}-${a.homeScore} ${a.homeTeam}`:`${a.winner} ${a.winnerScore}-${a.loserScore} ${a.loser}`;
              const text=`🚨 SCORIGAMI! 🚨\n\n${result}\n\nThat final score had never happened before in the Rural Utah Sports Utah high school football database.\n\nExplore Scorigami: https://ruralutahsports.github.io/rural-utah-sports/scorigami.html\n\n#UtahHSFB #Scorigami`;
              await post(text);posted.add(a.id);console.log(`Posted ${a.id}`);
            }
            fs.writeFileSync(statePath,JSON.stringify({updatedAt:new Date().toISOString(),posted:[...posted].slice(-250)},null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Save posted-state file
        run: |
          if [ ! -f scorigami-posted.json ]; then exit 0; fi
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add scorigami-posted.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remember posted Scorigami alerts"
          git pull --rebase origin main
          git push
