name: Audit 2026 postseason player coverage
on:
  pull_request:
    paths:
      - 'scripts/audit_postseason_player_coverage_2026.mjs'
      - 'scripts/lib/postseason-finals-2026.mjs'
      - 'scripts/merge_maxpreps_game_logs.mjs'
      - 'reviewed-hunt-postseason-2026.js'
      - '.github/workflows/audit-postseason-coverage-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/postseason-coverage-2026.test.mjs
      - run: node scripts/merge_maxpreps_game_logs.mjs --self-test
      - run: node scripts/audit_postseason_player_coverage_2026.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: 2026-postseason-player-coverage
          path: audit-output/postseason-coverage-2026.json
