name: Refresh RPI Out-of-State Data

on:
  workflow_dispatch:
  schedule:
    # MaxPreps records are refreshed several times daily as scores are posted.
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_rpi_oos_from_maxpreps.mjs'
      - '.github/workflows/update-rpi-oos-maxpreps.yml'

permissions:
  contents: write

concurrency:
  group: rpi-oos-maxpreps
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capture source snapshot for publication
        run: echo "STAT_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh out-of-state records from MaxPreps
        env:
          MAXPREPS_SEASON: 26-27
        run: node scripts/update_rpi_oos_from_maxpreps.mjs

      - name: Verify RPI data
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('rpi-oos-2026.json', 'utf8'));
          const teams = Object.keys(data.teams || {});
          if (!teams.length) throw new Error('No out-of-state teams were written');
          if (!Number.isFinite(Number(data.summary?.teams))) throw new Error('Refresh summary is missing');
          console.log(`Verified ${teams.length} out-of-state teams (${data.summary.fetched} MaxPreps pages loaded).`);
          NODE

      - name: Rebuild football RPI standings
        run: |
          node scripts/fetch_uhsaa_rpi.mjs
          node scripts/build_rpi_standings.mjs

      - name: Commit refreshed RPI data
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          node scripts/check_stat_publish_2026.mjs --snapshot-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rpi-oos-2026.json uhsaa-rpi-official-2026.json rpi-standings-2026.json
          if git diff --cached --quiet; then echo "Derived data already current."; exit 0; fi
          git commit -m "Refresh derived data from current source snapshot"
          git push origin HEAD:main
