name: Add Region Share Options

on:
  push:
    paths:
      - '.github/workflows/add-region-share-options.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add region picker to standings share graphics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('share-graphic.js')
          s=p.read_text()

          # Treat each standings group as its own shareable section.
          s=s.replace("else if(PAGE.includes('standings')) sels=['.region-card','.standings-card','.standings-section','section'];",
                      "else if(PAGE.includes('standings')) sels=['.group','.region-card','.standings-card','.standings-section','section'];")

          # Add helpers before make().
          marker="  async function make(format){\n"
          if 'function standingsRegions()' not in s:
              helper=r'''  function standingsRegions(){
    return [...document.querySelectorAll('.group')].map((el,i)=>({
      el,
      title:(el.querySelector('.group-title')?.textContent||`Region ${i+1}`).trim()
    })).filter(x=>x.title);
  }
  async function ensureRegionView(){
    if(!PAGE.includes('standings'))return;
    const btn=document.getElementById('regionBtn');
    if(btn&&!btn.classList.contains('active')){
      btn.click();
      await new Promise(r=>setTimeout(r,80));
    }
    const filter=document.getElementById('filter');
    if(filter&&filter.value!=='all'){
      filter.value='all';
      filter.dispatchEvent(new Event('change',{bubbles:true}));
      await new Promise(r=>setTimeout(r,60));
    }
  }
'''
              s=s.replace(marker,helper+marker,1)

          # Allow make() to receive a specific section instead of always guessing current viewport.
          old="    const el=currentSection(),label=titleFor(el),dims=format==='story'?[1080,1920]:format==='x'?[1600,900]:[1080,1080];"
          new="    const el=arguments[1]||currentSection(),label=titleFor(el),dims=format==='story'?[1080,1920]:format==='x'?[1600,900]:[1080,1080];"
          s=s.replace(old,new)

          # Replace modal with standings-aware region picker while keeping existing behavior elsewhere.
          start=s.find('  function modal(){')
          end=s.find('  function init(){',start)
          if start<0 or end<0:
              raise SystemExit('Could not locate modal block')
          modal=r'''  async function modal(){
    let regionOptions='';
    if(PAGE.includes('standings')){
      await ensureRegionView();
      const regions=standingsRegions();
      regionOptions=`<label style="display:block;margin:0 0 6px;color:#aaa;font-size:10px;font-weight:900;text-transform:uppercase">Region</label><select class="rus-share-region" style="width:100%;height:44px;margin:0 0 13px;background:#1d1d1d;color:#fff;border:1px solid #444;border-radius:8px;padding:0 10px;font-weight:900">${regions.map((r,i)=>`<option value="${i}">${esc(r.title)}</option>`).join('')}</select>`;
    }
    const el=document.createElement('div');el.className='rus-share-modal';el.innerHTML=`<div class="rus-share-sheet"><h3>Share Graphic</h3><p>${PAGE.includes('standings')?'Choose a region, then choose the social format. Only that region will be included in the graphic.':'Creates a branded graphic from the section currently in view. Rankings use team colors, local logos and a layout that fills the canvas.'}</p>${regionOptions}<div class="rus-share-grid"><button class="rus-share-option" data-f="square"><strong>Instagram Post</strong>1080 × 1080</button><button class="rus-share-option" data-f="story"><strong>Instagram Story</strong>1080 × 1920</button><button class="rus-share-option" data-f="x"><strong>X Post</strong>1600 × 900</button><button class="rus-share-option" data-f="square"><strong>Square PNG</strong>Download / Share</button></div><button class="rus-share-close">Cancel</button></div>`;
    document.body.appendChild(el);el.querySelector('.rus-share-close').onclick=()=>el.remove();el.addEventListener('click',e=>{if(e.target===el)el.remove()});
    el.querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{const f=b.dataset.f;b.disabled=true;b.textContent='Creating…';try{let target=null;if(PAGE.includes('standings')){const regions=standingsRegions(),idx=Number(el.querySelector('.rus-share-region')?.value||0);target=regions[idx]?.el||null}await make(f,target);el.remove()}catch(err){console.error(err);b.disabled=false;b.textContent='Try Again';alert('Could not create the graphic. Please try again.')}});
  }
'''
          s=s[:start]+modal+s[end:]
          p.write_text(s)

          # Bump cache key on standings page so phones load the new share script.
          h=Path('standings.html')
          hs=h.read_text()
          hs=re.sub(r'share-graphic\.js\?v=[^\"\']+', 'share-graphic.js?v=20260815-region1', hs)
          h.write_text(hs)
          PY
      - name: Commit region share support
        run: |
          if git diff --quiet -- share-graphic.js standings.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add share-graphic.js standings.html
          git commit -m 'Add region picker to standings share graphics'
          git push
