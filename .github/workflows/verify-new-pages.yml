name: Verify New Site Pages
on:
  push:
    paths:
      - '.github/workflows/verify-new-pages.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pages and data
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          for name in ['elo.html','out-of-state.html']:
              s=Path(name).read_text()
              scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
              Path('/tmp/'+name+'.js').write_text('\n'.join(scripts))
          teams=json.loads(Path('teams-data.json').read_text())
          def slug(v): return re.sub(r'^-+|-+$','',re.sub(r'[^a-z0-9]+','-',str(v).lower()))
          missing=[t['team'] for t in teams if not Path('team-page-data',slug(t['team'])+'.json').exists()]
          print('ELO_TEAM_PAGE_MISSING',len(missing),missing[:30])
          o=json.loads(Path('out-of-state.json').read_text())
          print('OOS_SUMMARY',json.dumps(o['summary']))
          required=['out-of-state.html','elo.html']
          bad=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text()
              if '<nav>' in s and any(x not in s for x in required): bad.append(p.name)
          print('NAV_MISSING_NEW_TABS',bad)
          if bad: raise SystemExit(1)
          PY
          node --check /tmp/elo.html.js
          node --check /tmp/out-of-state.html.js
