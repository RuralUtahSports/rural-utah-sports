name: Add Grand 2026 Schedule

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-grand-2026-schedule.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Grand 2026 schedule
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('team-page-data/grand.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data.setdefault('schedules', {})['2026'] = [
              {
                  'date': '8/14/2026',
                  'opponent': 'WATER CANYON',
                  'teamScore': 53,
                  'opponentScore': 38,
                  'result': 'W'
              },
              {
                  'date': '8/21/2026',
                  'opponent': 'DOLORES, CO',
                  'teamScore': 12,
                  'opponentScore': 6,
                  'result': 'W'
              }
          ]
          path.write_text(json.dumps(data, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
      - name: Commit Grand schedule
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add team-page-data/grand.json
          if git diff --cached --quiet; then
            echo "Grand schedule is already current."
            exit 0
          fi
          git commit -m "Add Grand 2026 schedule"
          git pull --rebase origin main
          git push
