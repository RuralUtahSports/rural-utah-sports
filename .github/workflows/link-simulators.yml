name: Link Simulator Navigation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/link-simulators.yml'

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link simulator navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          changed=[]
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              new,count=re.subn(r'<a href="#">\s*Simulators\s*</a>', '<a href="simulators.html">Simulators</a>', text)
              if count:
                  p.write_text(new,encoding='utf-8')
                  changed.append(p.name)
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit links
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "Navigation already current."
          else
            git commit -m "Finish simulator navigation links"
            git push
          fi
