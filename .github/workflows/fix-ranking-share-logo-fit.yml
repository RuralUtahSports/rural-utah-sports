name: Fix Ranking Share Logo Fit

on:
  push:
    paths:
      - '.github/workflows/fix-ranking-share-logo-fit.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reserve fixed logo area inside ranking cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('share-graphic.js')
          s=p.read_text()

          old=".rus-export-rank-item{position:relative;border:1px solid rgba(255,255,255,.14);border-left:8px solid var(--accent,#555);border-radius:10px;padding:10px 10px 9px;overflow:hidden;box-sizing:border-box;background:linear-gradient(135deg,var(--tint,rgba(255,255,255,.12)),#141414 72%);display:flex;flex-direction:column;align-items:center}"
          new=".rus-export-rank-item{position:relative;border:1px solid rgba(255,255,255,.14);border-left:8px solid var(--accent,#555);border-radius:10px;padding:10px 10px 72px;overflow:hidden;box-sizing:border-box;background:linear-gradient(135deg,var(--tint,rgba(255,255,255,.12)),#141414 72%);display:flex;flex-direction:column;align-items:center}"
          if old not in s:
              raise SystemExit('rank item CSS pattern not found')
          s=s.replace(old,new,1)

          old_logo=".rus-export-logo-wrap{margin-top:auto;min-height:62px;width:100%;display:flex;align-items:flex-end;justify-content:center;padding-top:5px}.rus-export-logo-large{width:82px;height:64px;max-width:86%;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}"
          new_logo=".rus-export-logo-wrap{position:absolute;left:10px;right:10px;bottom:7px;height:58px;min-height:58px;display:flex;align-items:center;justify-content:center;margin:0;padding:0;overflow:visible}.rus-export-logo-large{display:block;width:88px;height:58px;max-width:88px;max-height:58px;object-fit:contain;object-position:center center;margin:0 auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}"
          if old_logo not in s:
              raise SystemExit('logo CSS pattern not found')
          s=s.replace(old_logo,new_logo,1)
          p.write_text(s)

          q=Path('rankings.html')
          text=q.read_text()
          text=re.sub(r'share-graphic\.js\?v=[^"]+', 'share-graphic.js?v=20260815-logo-fit1', text)
          q.write_text(text)
          PY
      - name: Commit logo fit fix
        run: |
          if git diff --quiet -- share-graphic.js rankings.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add share-graphic.js rankings.html
          git commit -m 'Keep ranking share logos inside card bounds'
          git push
