name: Persist Custom School Logos

on:
  push:
    paths:
      - '.github/workflows/persist-custom-school-logos.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve custom logos in school directory generator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build_school_map_data.py')
          s = p.read_text()
          marker = 'BLOCKED = {"ESCALANTE", "USDB", "UTAH SCH DEAF"}\n'
          custom = '''CUSTOM_LOGOS = {
    "GREEN CANYON": "school-logos/green-canyon.svg",
    "HILLCREST": "school-logos/hillcrest.svg",
    "KEARNS": "school-logos/kearns.svg",
    "LAYTON CHRISTIAN": "school-logos/layton-christian.svg",
    "LONE PEAK": "school-logos/lone-peak.svg",
    "MAPLE MOUNTAIN": "school-logos/maple-mountain.svg",
    "MILFORD": "school-logos/milford.svg",
    "MILLARD": "school-logos/millard.svg",
    "MORGAN": "school-logos/morgan.svg",
    "OREM": "school-logos/orem.svg",
    "PROVIDENCE HALL": "school-logos/providence-hall.svg",
    "RICH": "school-logos/rich.svg",
    "SAN JUAN": "school-logos/san-juan.svg",
    "VIEWMONT": "school-logos/viewmont.svg",
}
'''
          if 'CUSTOM_LOGOS = {' not in s:
              if marker not in s:
                  raise SystemExit('BLOCKED marker not found')
              s = s.replace(marker, marker + '\n' + custom, 1)
          old = '        logo = official_logo_url(school_name)\n'
          new = '        logo = CUSTOM_LOGOS.get(team, official_logo_url(school_name))\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('logo assignment not found')
          p.write_text(s)
          PY
      - name: Commit persistent custom logo support
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_school_map_data.py
          git commit -m 'Preserve custom school logos during directory rebuilds'
          git push
