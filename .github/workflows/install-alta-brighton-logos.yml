name: Install Alta and Brighton Logos

on:
  push:
    paths:
      - '.github/workflows/install-alta-brighton-logos.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point the site at the new Alta and Brighton logos
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          cache_path = Path('school-logo-cache.json')
          cache = json.loads(cache_path.read_text())
          cache['ALTA'] = 'school-logos/alta.svg'
          cache['BRIGHTON'] = 'school-logos/brighton.svg'
          cache_path.write_text(json.dumps(cache, indent=2) + '\n')

          # Bump the share script cache version so phones immediately request the new logo map.
          rank = Path('rankings.html')
          if rank.exists():
              text = rank.read_text()
              text = re.sub(r"share-graphic\.js\?v=[^\"']+", 'share-graphic.js?v=20260815-alta-brighton', text)
              rank.write_text(text)
          PY

      - name: Commit logo replacements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add school-logo-cache.json rankings.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Use updated Alta and Brighton logos sitewide'
          git pull --rebase origin main
          git push origin main
