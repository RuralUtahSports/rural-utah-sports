name: Install Alta and Brighton Logos

on:
  push:
    paths:
      - '.github/workflows/install-alta-brighton-logos.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert custom SVG wrappers to PNG with Sharp
        run: |
          npm install --no-save sharp
          node <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');
          (async () => {
            fs.mkdirSync('school-logo-share', { recursive: true });
            for (const stem of ['alta', 'brighton']) {
              await sharp(`school-logos/${stem}.svg`, { density: 300 })
                .resize({ width: 452, height: 314, fit: 'inside', withoutEnlargement: false })
                .extend({ top: 35, bottom: 35, left: 30, right: 30, background: { r: 0, g: 0, b: 0, alpha: 0 } })
                .png()
                .toFile(`school-logo-share/${stem}.png`);
              console.log('Built', stem);
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('school-logo-cache.json')
          cache = json.loads(p.read_text())
          cache['ALTA'] = 'school-logo-share/alta.png'
          cache['BRIGHTON'] = 'school-logo-share/brighton.png'
          p.write_text(json.dumps(cache, indent=2) + '\n')
          PY

      - name: Commit logo replacements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add school-logo-share/alta.png school-logo-share/brighton.png school-logo-cache.json
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Fix Alta and Brighton share logos'
          git pull --rebase origin main
          git push origin main
