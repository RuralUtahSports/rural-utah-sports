name: Install Alta and Brighton Logos

on:
  push:
    paths:
      - '.github/workflows/install-alta-brighton-logos.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build padded PNGs and update logo cache
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, io, json, re

          for stem in ('alta','brighton'):
              svg = Path('school-logos') / f'{stem}.svg'
              text = svg.read_text(errors='ignore')
              m = re.search(r'href=["\']data:image/[^;]+;base64,([^"\']+)', text, re.I | re.S)
              if not m:
                  raise SystemExit(f'No embedded image found in {svg}')
              raw = base64.b64decode(re.sub(r'\s+', '', m.group(1)))
              im = Image.open(io.BytesIO(raw)).convert('RGBA')
              bbox = im.getchannel('A').getbbox()
              if bbox:
                  im = im.crop(bbox)
              canvas_w, canvas_h = 512, 384
              inner_w, inner_h = 452, 314
              scale = min(inner_w / max(1, im.width), inner_h / max(1, im.height))
              im = im.resize((max(1, round(im.width*scale)), max(1, round(im.height*scale))), Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', (canvas_w, canvas_h), (0,0,0,0))
              canvas.alpha_composite(im, ((canvas_w-im.width)//2, (canvas_h-im.height)//2))
              out = Path('school-logo-share') / f'{stem}.png'
              out.parent.mkdir(exist_ok=True)
              canvas.save(out, 'PNG', optimize=True)

          cache_path = Path('school-logo-cache.json')
          cache = json.loads(cache_path.read_text())
          cache['ALTA'] = 'school-logo-share/alta.png'
          cache['BRIGHTON'] = 'school-logo-share/brighton.png'
          cache_path.write_text(json.dumps(cache, indent=2) + '\n')
          PY

      - name: Commit logo replacements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add school-logo-share/alta.png school-logo-share/brighton.png school-logo-cache.json
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Use updated Alta and Brighton logos'
          git pull --rebase origin main
          git push origin main
