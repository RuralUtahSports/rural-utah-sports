name: Install RUS Credibility Package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-rus-credibility.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire credibility package
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('nav-menu.js'); s=p.read_text()
          if "about:[['About RUS'" not in s:
              marker="    simulators:[['Simulators Hub','simulators.html'],['Promotion / Relegation','promotion-relegation.html']]\n"
              repl="    simulators:[['Simulators Hub','simulators.html'],['Promotion / Relegation','promotion-relegation.html']],\n    about:[['About RUS','about.html'],['Methodology & Sources','methodology.html'],['Media & Attribution','media.html'],['Corrections','corrections.html']]\n"
              if marker not in s: raise SystemExit('nav groups marker missing')
              s=s.replace(marker,repl)
          if "site-credibility.js" not in s:
              marker="addScript('recently-viewed.js?v=20260817-app4','rusRecentlyViewed',true);"
              repl=marker+"addScript('site-credibility.js?v=20260817-cred1','rusCredibility',true);"
              if marker not in s: raise SystemExit('nav loader marker missing')
              s=s.replace(marker,repl)
          old="dropdown('Analytics','analytics'),dropdown('Simulators','simulators')].join('')"
          new="dropdown('Analytics','analytics'),dropdown('Simulators','simulators'),dropdown('About','about')].join('')"
          if old in s: s=s.replace(old,new)
          elif "dropdown('About','about')" not in s: raise SystemExit('nav render marker missing')
          p.write_text(s)

          # Make the credibility code and shared shell fresh immediately.
          p=Path('sw.js'); s=p.read_text()
          s=re.sub(r"const CACHE='[^']+'", "const CACHE='rus-site-20260817-cred1'", s, count=1)
          if "'./site-credibility.js'" not in s:
              s=s.replace("'./desktop-v2.js'", "'./desktop-v2.js','./site-credibility.js'")
          if 'site-credibility' not in s.split('const LIVE=',1)[1].split(';',1)[0]:
              s=s.replace('recently-viewed)', 'recently-viewed|site-credibility)')
          p.write_text(s)

          p=Path('pwa.js'); s=p.read_text()
          s=re.sub(r"const VERSION='[^']+'", "const VERSION='20260817-cred1'", s, count=1)
          p.write_text(s)

          # Protect the package with the existing app-shell checker.
          p=Path('scripts/check-app-shell.mjs'); s=p.read_text()
          if "'site-credibility.js'" not in s:
              s=s.replace("  'game-center-upgrade.js',", "  'game-center-upgrade.js',\n  'site-credibility.js',\n  'about.html',\n  'methodology.html',\n  'media.html',\n  'corrections.html',")
          old="'recently-viewed.js', 'home-personalized.js'"
          if old in s: s=s.replace(old,"'recently-viewed.js', 'site-credibility.js', 'home-personalized.js'")
          if "site-credibility.js no longer" not in s:
              s=s.replace("for (const needle of ['pwa.js', 'site-search.js', 'mobile-shell.js', 'recently-viewed.js'", "for (const needle of ['pwa.js', 'site-search.js', 'mobile-shell.js', 'recently-viewed.js', 'site-credibility.js'")
          if "About credibility navigation" not in s:
              s += "\nfor (const needle of ['about.html','methodology.html','media.html','corrections.html']) {\n  if (!nav.includes(needle)) fail(`About credibility navigation is missing ${needle}.`);\n}\n"
          p.write_text(s)

          p=Path('.github/workflows/app-shell-sanity.yml'); s=p.read_text()
          additions=['site-credibility.js','about.html','methodology.html','media.html','corrections.html']
          for file in additions:
              line=f"      - '{file}'"
              if line not in s:
                  first="      - 'game-center-upgrade.js'"
                  s=s.replace(first,first+'\n'+line)
          if 'node --check site-credibility.js' not in s:
              s=s.replace('          node --check game-center-upgrade.js', '          node --check game-center-upgrade.js\n          node --check site-credibility.js')
          p.write_text(s)

          # Direct cache-bust for every page that loads the shared nav.
          for html in Path('.').rglob('*.html'):
              text=html.read_text(errors='ignore')
              updated=re.sub(r'src=[\"\']nav-menu\.js(?:\?v=[^\"\']*)?[\"\']', 'src="nav-menu.js?v=20260817-cred1"', text)
              if updated!=text: html.write_text(updated)
          PY
      - name: Remove installer
        run: rm .github/workflows/install-rus-credibility.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Activate RUS credibility package sitewide'
          git push
