name: Fix scoreboard refresh cache

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current scoreboard refresh cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('scoreboard.html').read_text()
          expected = 'scoreboard-refresh.js?v=20260904-live-refresh-fix1'
          if expected not in s:
              raise SystemExit('current scoreboard refresh cache key missing')
          print('scoreboard refresh cache key is current')
          PY
