name: Add Classification Standings Share

on:
  push:
    paths:
      - '.github/workflows/add-classification-standings-share.yml'
      - 'scripts/patch-classification-standings-share.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch standings share graphic
        run: python scripts/patch-classification-standings-share.py
      - name: Commit standings share update
        run: |
          if git diff --quiet -- share-graphic.js standings.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add share-graphic.js standings.html
          git commit -m 'Add whole-classification standings share graphic'
          git pull --rebase origin main
          git push
