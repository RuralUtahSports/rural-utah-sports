name: Import 2025-26 boys basketball results

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/import_boys_basketball_2025_results.mjs'
      - 'boys-basketball-teams.json'
      - 'boys-basketball-games-2026-27.json'
      - 'boys-basketball-team.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Import MaxPreps results
        run: node scripts/import_boys_basketball_2025_results.mjs
      - name: Build all-time record summary
        run: node scripts/build_boys_basketball_all_time_records.mjs
      - name: Commit results and all-time summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boys-basketball-games-2025-26.json boys-basketball-results-import-report-2025-26.json boys-basketball-all-time-records-2014-26.json
          if git diff --cached --quiet; then
            echo "No 2025-26 basketball results or all-time totals changed."
            exit 0
          fi
          git commit -m "Update 2025-26 boys basketball results"
          git pull --rebase origin main
          git push
