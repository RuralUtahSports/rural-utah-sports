name: Build Historical Rankings Data

on:
  workflow_dispatch:
  push:
    paths:
      - 'teams-data.json'
      - 'greatest-seasons-data-v2.json'
      - 'full-season-alignment-2025.json'
      - 'scripts/build_historical_rankings.mjs'
      - '.github/workflows/build-historical-rankings.yml'

permissions:
  contents: write

concurrency:
  group: historical-rankings-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and publish historical rankings data
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/build_historical_rankings.mjs
            node -e "const d=require('./historical-rankings-data.json'); const years=Object.keys(d.seasons||{}); if(years.length<50) throw new Error('Too few historical seasons'); if((d.summary?.programs||0)<90) throw new Error('Too few programs'); if((d.seasons?.['1990']||[]).length<20) throw new Error('1990 ranking data missing'); if((d.seasons?.['2025']||[]).length<110) throw new Error('2025 game-derived coverage is unexpectedly low'); console.log(d.summary)"
            git add historical-rankings-data.json
            if git diff --cached --quiet; then echo "Historical rankings data already current."; exit 0; fi
            git commit -m "Rebuild historical rankings data"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
