name: Remove Invalid Tage Ita 87 Attempts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-invalid-tage-ita-record.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: remove-invalid-tage-ita-87
  cancel-in-progress: false
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove unsupported October 8 passing attempt figure
        run: node scripts/suppress_invalid_tage_ita_attempts.mjs
      - name: Check game yards remain and record attempts are gone
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const j = f => JSON.parse(fs.readFileSync(f,'utf8'));
          const current=j('player-game-stats-2026.json');
          const old=current.teams['WOODS CROSS'].games.find(g=>g.date==='2026-10-08'&&g.opponent==='OLYMPUS');
          const p=old.players.find(p=>p.name==='Tage Ita'),pass=p.statLines.find(l=>l.category==='Passing');
          if(!pass || Number(pass.values.YARDS||pass.values.Yards)!==87)throw Error('Original 87 passing yards were altered or game not found');
          if(Object.keys(pass.values).some(k=>/COMP.ATT|COMP%/i.test(k)))throw Error('False attempt or completion percentage still present in game');
          for(const file of ['player-single-game-records/2026.json','player-single-game-records/statewide.json','player-single-game-records/by-team/woods-cross.json']){
            const rows=j(file).categories.find(c=>c.key==='passAttempts')?.entries||[];
            if(rows.some(r=>r.player==='Tage Ita'&&r.date==='2026-10-08'&&Number(r.value)===87))throw Error('False record persists in '+file);
          }
          if(j('record-alerts.json').alerts.some(a=>a.player==='Tage Ita'&&a.categoryKey==='passAttempts'&&Number(a.value)===87))throw Error('False alert persists');
          const season=j('deseret-rosters-stats-2026.json').teams['WOODS CROSS'].stats.find(x=>x.category==='Passing').rows.find(x=>x.name==='Tage Ita');
          if(season?.values?.['COMP-ATT']==='67-199')throw Error('Contaminated season total persists');
          console.log('Verified: No 87-attempt record or alert; legitimate 87 passing yards preserved.');
          NODE
      - name: Publish verified corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player-game-stats-2026.json maxpreps-player-game-stats-2026.json deseret-rosters-stats-2026.json maxpreps-stats-fallback-2026.json team-current-data/woods-cross.json player-single-game-records/2026.json player-single-game-records/statewide.json player-single-game-records/by-team/woods-cross.json record-alerts.json
          if git diff --cached --quiet; then echo "Already corrected; no commit necessary."; exit 0; fi
          git commit -m "Remove incorrect Tage Ita 87-pass attempt record vs Olympus"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1