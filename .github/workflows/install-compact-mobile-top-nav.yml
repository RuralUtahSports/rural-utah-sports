name: Install Compact Mobile Top Navigation

on:
  push:
    paths:
      - '.github/workflows/install-compact-mobile-top-nav.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire compact mobile navigation and bust caches
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          nav = Path('nav-menu.js')
          s = nav.read_text()
          old = "addScript('mobile-shell.js?v=20260817-mobile2','rusMobileShell',true);"
          new = "addScript('mobile-top-nav.js?v=20260817-core4','rusMobileTopNav',true);addScript('mobile-shell.js?v=20260817-core4','rusMobileShell',true);"
          if 'rusMobileTopNav' not in s:
              if old not in s:
                  raise SystemExit('Expected mobile shell loader not found in nav-menu.js')
              s = s.replace(old, new, 1)
          else:
              s = re.sub(r"mobile-top-nav\.js\?v=[^']+", "mobile-top-nav.js?v=20260817-core4", s)
              s = re.sub(r"mobile-shell\.js\?v=[^']+", "mobile-shell.js?v=20260817-core4", s)
          nav.write_text(s)

          changed = 0
          pattern = re.compile(r'''src=(["'])nav-menu\.js(?:\?[^"']*)?\1''', re.I)
          for p in Path('.').rglob('*.html'):
              try:
                  text = p.read_text()
              except UnicodeDecodeError:
                  continue
              updated = pattern.sub('src="nav-menu.js?v=20260817-core4"', text)
              if updated != text:
                  p.write_text(updated)
                  changed += 1
          print(f'Updated nav-menu cache key in {changed} HTML files')
          Path('.github/workflows/install-compact-mobile-top-nav.yml').unlink(missing_ok=True)
          PY
      - name: Commit compact mobile navigation
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Compact mobile navigation already installed."
          else
            git commit -m "Use compact football menu across mobile pages"
            git pull --rebase origin main
            git push
          fi
