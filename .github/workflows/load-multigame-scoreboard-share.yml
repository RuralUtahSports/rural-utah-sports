name: Load Multi-Game Scoreboard Share

on:
  push:
    paths:
      - .github/workflows/load-multigame-scoreboard-share.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add scoreboard share loader
        run: python -c "from pathlib import Path; p=Path('scoreboard.html'); s=p.read_text(encoding='utf-8'); s=s.replace('share-graphic.js?v=20260815-region1','share-graphic.js?v=20260816-scoreboard-multi-v2'); tag='<script src=\"scoreboard-share-layout.js?v=20260816-v1\" defer></script>'; s=s if 'scoreboard-share-layout.js' in s else s.replace('<script src=\"share-graphic.js?v=20260816-scoreboard-multi-v2\" defer></script>','<script src=\"share-graphic.js?v=20260816-scoreboard-multi-v2\" defer></script>\\n'+tag); p.write_text(s,encoding='utf-8')"
      - name: Commit loader
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scoreboard.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Load multi-game scoreboard share tool'
          git pull --rebase origin main
          git push
