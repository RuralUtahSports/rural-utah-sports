name: Bump School Assets Cache

on:
  push:
    paths:
      - '.github/workflows/bump-school-assets-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update school-assets cache key in HTML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          token = '20260815b'
          changed = []
          for p in Path('.').rglob('*.html'):
              s = p.read_text(errors='ignore')
              ns = re.sub(r'school-assets\.js(?:\?v=[^"\']*)?', f'school-assets.js?v={token}', s)
              if ns != s:
                  p.write_text(ns)
                  changed.append(str(p))
          print('Updated:', *changed, sep='\n')
          PY
      - name: Commit cache-bust update
        run: |
          if git diff --quiet -- '*.html'; then
            echo 'No HTML cache references needed updating.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git commit -m 'Refresh school logo assets on site'
          git push
