name: Audit Every Team Games Section

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-team-games.yml'
      - 'scripts/audit-team-games.mjs'
  workflow_run:
    workflows:
      - Sync Website Data From Google Sheet
      - Enrich Team Schedules With Playoff Notes
      - Dedupe Team Page Rivalries
      - Rebuild Team Summaries After Dedupe
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: audit-team-games
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Audit every team page games section
        run: node scripts/audit-team-games.mjs

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team-games-audit.json
          if git diff --cached --quiet; then
            echo "Audit report is unchanged."
            exit 0
          fi
          git commit -m "Audit every team games section"
          ok=0
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi
