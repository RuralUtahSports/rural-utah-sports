name: Tighten Classification Standings Share

on:
  push:
    paths:
      - '.github/workflows/tighten-classification-standings-share.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix classification standings share layout
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('standings-share-layout.js')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
            ".rus-standings-share-table .c-rank{width:5%}.rus-standings-share-table .c-team{width:36%;text-align:left}.rus-standings-share-table .c-rec{width:10%}.rus-standings-share-table .c-pct{width:9%}.rus-standings-share-table .c-pf,.rus-standings-share-table .c-pa{width:7%}.rus-standings-share-table .c-diff{width:8%}.rus-standings-share-table .c-streak{width:8%}",
            ".rus-standings-share-table .c-rank{width:5%}.rus-standings-share-table .c-team{width:40%;text-align:left}.rus-standings-share-table .c-rec{width:9%}.rus-standings-share-table .c-pct{width:8%}.rus-standings-share-table .c-pf,.rus-standings-share-table .c-pa{width:6%}.rus-standings-share-table .c-diff{width:7%}.rus-standings-share-table .c-streak{width:7%}"
          )

          s=s.replace(
            ".rus-share-team-cell{display:flex;align-items:center;gap:6px;min-width:0}",
            ".rus-share-team-cell{display:flex;align-items:center;gap:7px;min-width:0;width:100%}"
          )
          s=s.replace(
            ".rus-share-team-name{display:inline-block;max-width:100%;font-size:10px;font-weight:1000;line-height:1.05;white-space:normal;overflow:visible;text-overflow:clip;padding:4px 6px;border-radius:5px;text-align:left}",
            ".rus-share-team-name{display:block;flex:1;min-width:0;max-width:none;font-size:11px;font-weight:1000;line-height:1.1;color:#fff;white-space:normal;overflow:visible;text-overflow:clip;padding:0;text-align:left;word-break:normal}"
          )
          s=s.replace(
            ".rus-standings-share-board.story .rus-share-team-name{font-size:11px;padding:5px 7px}",
            ".rus-standings-share-board.story .rus-share-team-name{font-size:12px}"
          )
          s=s.replace(
            ".rus-standings-share-board.x .rus-share-team-name{font-size:8px;padding:3px 5px}",
            ".rus-standings-share-board.x .rus-share-team-name{font-size:9px}"
          )

          old_row='''      return `<tr style="box-shadow:inset 4px 0 0 ${esc(teamColor)}"><td class="c-rank">${esc(r.rank)}</td><td class="c-team"><div class="rus-share-team-cell"><span class="rus-share-team-logo">${logo?`<img src="${esc(logo)}" alt="">`:''}</span><span class="rus-share-team-name" style="background:${esc(teamColor)};color:${teamText}">${esc(fullName)}</span></div></td><td class="c-rec">${esc(r.region)}</td><td class="c-pct">${esc(r.pct)}</td><td class="c-rec">${esc(r.overall)}</td><td class="c-pf">${esc(r.pf)}</td><td class="c-pa">${esc(r.pa)}</td><td class="c-diff ${dnum>0?'rus-share-diff-pos':dnum<0?'rus-share-diff-neg':''}">${esc(r.diff)}</td><td class="c-streak ${streak.startsWith('W')?'rus-share-streak-w':streak.startsWith('L')?'rus-share-streak-l':''}">${esc(r.streak)}</td></tr>`;'''
          new_row='''      return `<tr><td class="c-rank">${esc(r.rank)}</td><td class="c-team" style="border-left:6px solid ${esc(teamColor)}"><div class="rus-share-team-cell"><span class="rus-share-team-logo">${logo?`<img src="${esc(logo)}" alt="">`:''}</span><span class="rus-share-team-name">${esc(fullName)}</span></div></td><td class="c-rec">${esc(r.region)}</td><td class="c-pct">${esc(r.pct)}</td><td class="c-rec">${esc(r.overall)}</td><td class="c-pf">${esc(r.pf)}</td><td class="c-pa">${esc(r.pa)}</td><td class="c-diff ${dnum>0?'rus-share-diff-pos':dnum<0?'rus-share-diff-neg':''}">${esc(r.diff)}</td><td class="c-streak ${streak.startsWith('W')?'rus-share-streak-w':streak.startsWith('L')?'rus-share-streak-l':''}">${esc(r.streak)}</td></tr>`;'''
          if old_row not in s:
              raise SystemExit('current colored row template not found')
          s=s.replace(old_row,new_row,1)

          old_h='''    const maxRows=Math.max(1,...groups.map(g=>g.rows.length));
    const rowH=format==='square'?Math.max(48,Math.min(112,Math.floor(760/maxRows))):format==='x'?Math.max(34,Math.min(76,Math.floor(590/maxRows))):Math.max(46,Math.min(86,Math.floor(1450/maxRows)));
    board.style.setProperty('--rus-row-h',`${rowH}px`);'''
          new_h='''    const maxRows=Math.max(1,...groups.map(g=>g.rows.length));
    const gridRows=Math.ceil(groups.length/Math.max(1,cols));
    const rowBudget=format==='square'?Math.floor((850-Math.max(0,gridRows-1)*12)/Math.max(1,gridRows)):format==='x'?Math.floor((680-Math.max(0,gridRows-1)*12)/Math.max(1,gridRows)):Math.floor((1540-Math.max(0,gridRows-1)*12)/Math.max(1,gridRows));
    const rowH=format==='square'?Math.max(38,Math.min(gridRows>1?54:96,Math.floor((rowBudget-62)/maxRows))):format==='x'?Math.max(30,Math.min(58,Math.floor((rowBudget-54)/maxRows))):Math.max(42,Math.min(86,Math.floor((rowBudget-62)/maxRows)));
    board.style.setProperty('--rus-row-h',`${rowH}px`);'''
          if old_h not in s:
              raise SystemExit('current row height block not found')
          s=s.replace(old_h,new_h,1)

          p.write_text(s,encoding='utf-8')

          h=Path('standings.html')
          text=h.read_text(encoding='utf-8')
          text=text.replace('standings-share-layout.js?v=20260816-v6','standings-share-layout.js?v=20260816-v7')
          text=text.replace('standings-share-layout.js?v=20260816-v7','standings-share-layout.js?v=20260816-v7')
          h.write_text(text,encoding='utf-8')
          PY
      - name: Commit tighter standings share layout
        run: |
          if git diff --quiet -- standings-share-layout.js standings.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standings-share-layout.js standings.html
          git commit -m 'Tighten classification standings share layout'
          git pull --rebase origin main
          git push
