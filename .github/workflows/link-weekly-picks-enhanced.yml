name: Link Enhanced Weekly Picks

on:
  push:
    paths:
      - '.github/workflows/link-weekly-picks-enhanced.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link enhanced weekly picks assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('simulators.html')
          s=p.read_text(encoding='utf-8')
          if 'weekly-picks-enhanced.css' not in s:
              marker='<link rel="stylesheet" href="weekly-picks.css">'
              if marker not in s: raise RuntimeError('weekly picks stylesheet marker missing')
              s=s.replace(marker,marker+'\n<link rel="stylesheet" href="weekly-picks-enhanced.css">',1)
          if 'weekly-picks-enhanced.js' not in s:
              marker='<script src="weekly-picks.js"></script>'
              if marker not in s: raise RuntimeError('weekly picks script marker missing')
              s=s.replace(marker,marker+'\n<script src="weekly-picks-enhanced.js"></script>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add simulators.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enable enhanced weekly picks"
          git push
