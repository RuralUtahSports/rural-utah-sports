name: Build Team Single-Game Records

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Player Single-Game Records"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: build-team-single-game-records
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build team single-game records
        run: node scripts/build_team_single_game_records.mjs
      - name: Validate team single-game records
        run: node scripts/validate_team_single_game_records.mjs
      - name: Publish generated records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team-single-game-records
          if git diff --cached --quiet; then
            echo "No team-record changes"
            exit 0
          fi
          git commit -m "Auto-sync team single-game records"
          git pull --rebase origin main
          git push origin HEAD:main
