name: Enrich Weekly Deseret Links

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Simulator Data"]
    types: [completed]
  push:
    paths:
      - 'scripts/enrich-weekly-deseret.mjs'
      - '.github/workflows/enrich-weekly-deseret.yml'

permissions:
  contents: write

concurrency:
  group: weekly-deseret-links
  cancel-in-progress: false

jobs:
  enrich:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Match Deseret game pages
        run: node scripts/enrich-weekly-deseret.mjs

      - name: Commit Deseret links
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add weekly-simulation.json deseret-game-links.json
          if git diff --cached --quiet; then
            echo "Deseret game links are already current."
            exit 0
          fi
          git commit -m "Auto-sync Deseret game links"
          ok=0
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi
