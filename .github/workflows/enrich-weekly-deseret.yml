name: Enrich Weekly Deseret Links

# Manual refresh trigger: 2026-08-15 Duchesne final
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Simulator Data"]
    types: [completed]
  push:
    paths:
      - 'scripts/enrich-weekly-deseret.mjs'
      - 'scripts/enrich-deseret-game-details.mjs'
      - 'scripts/apply_manual_stat_corrections.mjs'
      - 'manual-stat-corrections-2026.json'
      - '.github/workflows/enrich-weekly-deseret.yml'

permissions:
  contents: write

concurrency:
  group: weekly-deseret-links
  cancel-in-progress: false

jobs:
  enrich:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Match Deseret game pages
        run: node scripts/enrich-weekly-deseret.mjs

      - name: Update Deseret box scores, scoring plays and stats
        run: node scripts/enrich-deseret-game-details.mjs

      - name: Clean redundant player initials
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'deseret-game-details.json';
          if (!fs.existsSync(file)) process.exit(0);
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));

          function cleanPlayerName(value) {
            const original = String(value ?? '');
            const normalized = original.replace(/\s+/g, ' ').trim();
            const cleaned = normalized.replace(
              /^([A-Za-z])(?:\s*\.\s*|\s+)([A-Za-z][A-Za-z'’\-]{1,})(\s+.+)$/,
              (match, initial, first, rest) => initial.toLowerCase() === first[0].toLowerCase() ? `${first}${rest}` : match
            );
            return cleaned;
          }

          let changed = 0;
          const examples = [];
          for (const game of Object.values(data.games || {})) {
            for (const table of game.stats || []) {
              const headers = (table.headers || []).map(value => String(value || '').trim().toUpperCase());
              const playerIndex = headers.findIndex(value => value === 'PLAYER' || value === 'NAME' || value.includes('PLAYER NAME'));
              if (playerIndex < 0) continue;
              for (const row of table.rows || []) {
                if (!Array.isArray(row) || playerIndex >= row.length) continue;
                const before = String(row[playerIndex] ?? '');
                const after = cleanPlayerName(before);
                if (after !== before) {
                  row[playerIndex] = after;
                  changed++;
                  if (examples.length < 12) examples.push(`${before} -> ${after}`);
                }
              }
            }
          }

          if (changed) fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          console.log(`Redundant player initials removed: ${changed}`);
          for (const example of examples) console.log(`  ${example}`);
          NODE

      - name: Validate enriched weekly data before publish
        run: node scripts/audit-football-data.mjs

      - name: Commit Deseret data
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add weekly-simulation.json deseret-game-links.json deseret-game-details.json
          if git diff --cached --quiet; then
            echo "Deseret game data is already current."
            exit 0
          fi
          git commit -m "Auto-sync Deseret game data"
          ok=0
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi
