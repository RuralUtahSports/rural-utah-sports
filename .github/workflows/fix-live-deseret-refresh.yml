name: Fix live Deseret refresh throttle

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-live-deseret-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch active-game browser refresh
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/enrich-deseret-game-details.mjs")
          text = path.read_text()
          old = """    const browserAge = hoursSince(prior?.browserFetchedAt);
              const priorStats = prior?.statsAvailability || statsAvailability(prior?.stats || []);
              if (prior?.browserFetchedAt && browserAge < (priorStats.status === 'full' ? 12 : 2) && hasCompleteBoxScore(prior)) continue;
          """
          # Keep the exact repository indentation; Python's dedent-free string above
          # is normalized below to avoid YAML indentation affecting the match.
          old = old.replace("              ", "    ")
          new = """    const browserAge = hoursSince(prior?.browserFetchedAt);
              const priorStats = prior?.statsAvailability || statsAvailability(prior?.stats || []);
              const priorLive = /^(?:live|q[1-4]|halftime|half|ot)$/i.test(clean(prior?.status));
              // Never rate-limit an in-progress game just because all four quarter cells exist.
              // Deseret can pre-render numeric quarter cells, so treating that as complete can
              // freeze a live game for 2-12 hours and miss the final score/status.
              if (!priorLive && prior?.browserFetchedAt && browserAge < (priorStats.status === 'full' ? 12 : 2) && hasCompleteBoxScore(prior)) continue;
          """
          new = new.replace("              ", "    ")

          marker = "const priorLive = /^(?:live|q[1-4]|halftime|half|ot)$/i.test(clean(prior?.status));"
          if old in text:
              path.write_text(text.replace(old, new, 1))
              print("Patched live-game browser refresh throttle")
          elif marker in text:
              print("Patch already present")
          else:
              raise SystemExit("Expected throttle block not found; refusing to make an unsafe edit")

      - name: Check JavaScript syntax
        run: node --check scripts/enrich-deseret-game-details.mjs

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/enrich-deseret-game-details.mjs
          git commit -m "Refresh active Deseret games without browser throttle"
          git push
