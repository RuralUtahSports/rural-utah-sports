name: Build Team Statistics

on:
  workflow_dispatch:
  # Source data is also committed by scheduled Actions. Those GITHUB_TOKEN
  # commits do not reliably trigger another push workflow, so refresh this
  # independently after the standings/roster jobs have had time to finish.
  schedule:
    - cron: '5,20,35,50 * * * *'
  push:
    branches: [main]
    paths:
      - 'deseret-rosters-stats-2026.json'
      - 'standings-2026.json'
      - 'deseret-rosters-stats-2025.json'
      - 'full-season-alignment-2025.json'
      - 'scorigami.json'
      - 'teams-data.json'
      - 'scripts/build_team_stats.mjs'
      - '.github/workflows/build-team-stats.yml'

permissions:
  contents: write

concurrency:
  group: current-football-statistics
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and publish team statistics
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          export STAT_SOURCE_COMMIT=$(git rev-parse HEAD)
          node scripts/build_team_stats.mjs 2026
          node -e "const fs=require('fs');for(const y of [2026]){const d=JSON.parse(fs.readFileSync('team-stats-'+y+'.json','utf8'));if(d.season!==y)throw new Error('Wrong team stats season '+y);if((d.summary?.teams||0)<90)throw new Error('Too few teams in '+y+' team stats');if(!d.teams||!Object.keys(d.teams).length)throw new Error('Missing team stats data '+y);console.log(y,d.summary)}"
          git fetch origin main
          node scripts/check_stat_publish_2026.mjs
          git add team-stats-2026.json
          if git diff --cached --quiet; then echo "Team statistics already current."; exit 0; fi
          git commit -m "Recalculate team statistics"
          git push origin HEAD:main
