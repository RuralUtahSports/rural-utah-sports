name: Build Deseret Rosters and Stats
# Rebuild compact team shards after fallback data refreshes.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/enrich-deseret-game-details.mjs'
      - 'manual-stat-corrections-2026.json'
      - 'scripts/build_deseret_rosters_stats.mjs'
      - 'scripts/merge_deseret_stats_endpoints.mjs'
      - 'scripts/merge_maxpreps_stats_fallback.mjs'
      - 'scripts/build_deseret_stat_metrics.mjs'
      - 'scripts/build_player_game_stats.mjs'
      - 'scripts/merge_maxpreps_game_logs.mjs'
      - 'scripts/propose_4a6a_canonical_game_repairs_2026.mjs'
      - 'audits/2026-regular-season/reconciled-4a6a-player-cases-2026.json'
      - 'audits/2026-regular-season/westlake-taylor-oct15-reviewed-2026.json'
      - 'scripts/merge_verified_deseret_kicking.mjs'
      - 'deseret-kicking-game-stats-2026.json'
      - 'scripts/reconcile_season_stats_from_game_logs.mjs'
      - 'scripts/protect_regular_season_import_2026.mjs'
      - 'scripts/lib/regular-season-import-2026.mjs'
      - 'scripts/lib/verified-player-corrections-2026.mjs'
      - 'regular-season-corrections-batch-*-2026.json'
      - 'regular-season-correction-batches-2026.json'
      - 'scripts/lib/reviewed-batches-2026.mjs'
      - 'scripts/lib/stat-import-integrity-2026.mjs'
      - 'scripts/build_regular_season_publication_2026.mjs'
      - 'scripts/check_stat_publish_2026.mjs'
      - 'competition-scope-review-2026.json'
      - 'scripts/build_weekly_awards.mjs'
      - 'scripts/apply_manual_stat_corrections.mjs'
      - 'award-scoring-core.js'
      - 'scripts/build_team_current_shards.mjs'
      - '.github/workflows/build-deseret-rosters-stats.yml'

permissions:
  contents: write

concurrency:
  group: current-football-statistics
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deseret occasionally rate-limits the full statewide pass. Leave enough
    # time for bounded retries instead of discarding the entire refresh.
    timeout-minutes: 75
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture published statistics before importing
        run: |
          echo "STAT_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cp deseret-rosters-stats-2026.json "$RUNNER_TEMP/regular-season-retained.json"
          cp player-game-stats-2026.json "$RUNNER_TEMP/regular-games-retained.json"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build rosters and season player stats
        run: |
          node scripts/build_deseret_rosters_stats.mjs
          node scripts/merge_deseret_stats_endpoints.mjs
          if [ -f maxpreps-stats-fallback-2026.json ]; then node scripts/merge_maxpreps_stats_fallback.mjs --apply-cache; fi
          node scripts/apply_manual_stat_corrections.mjs
      - name: Connect roster players to individual game box scores
        run: |
          node scripts/build_player_game_stats.mjs
          node scripts/merge_maxpreps_game_logs.mjs
          node scripts/reconcile_season_stats_from_game_logs.mjs
          node scripts/merge_verified_deseret_kicking.mjs
          # Re-apply verified athlete-level floors after incomplete game logs have been summed.
          node scripts/apply_manual_stat_corrections.mjs
      - name: Preserve reviewed season and game cells
        run: node scripts/protect_regular_season_import_2026.mjs --baseline="$RUNNER_TEMP/regular-season-retained.json" --games-baseline="$RUNNER_TEMP/regular-games-retained.json" --candidate-output="$RUNNER_TEMP/regular-season-import-candidate.json"
      - name: Reapply approved 4A-6A source game corrections after import protection
        run: node scripts/propose_4a6a_canonical_game_repairs_2026.mjs --apply --output="$RUNNER_TEMP/4a6a-source-repairs"
      - name: Build reviewed regular-season publication
        run: node scripts/build_regular_season_publication_2026.mjs
      - name: Build compact shared stat metrics
        run: node scripts/build_deseret_stat_metrics.mjs
      - name: Build automatic weekly awards
        run: node scripts/build_weekly_awards.mjs
      - name: Build compact per-team payloads
        run: node scripts/build_team_current_shards.mjs
      - name: Retain source import candidate for statistical review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regular-season-import-candidate
          path: ${{ runner.temp }}/regular-season-import-candidate.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify roster/stat data
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('deseret-rosters-stats-2026.json','utf8'));
          if(!d.summary||d.summary.teams<100) throw new Error('Roster/stat output incomplete');
          const merge=d.summary.statsEndpointMerge;
          if(!merge||merge.checked<100) throw new Error('Both Deseret stats endpoints were not checked for enough teams');
          if((merge.bothSucceeded||0)+(merge.oneSucceeded||0)<100) throw new Error('Too many Deseret stats endpoint failures');
          console.log(d.summary);
          const metrics=JSON.parse(fs.readFileSync('deseret-stat-metrics-2026.json','utf8'));
          const fullBytes=fs.statSync('deseret-rosters-stats-2026.json').size;
          const metricBytes=fs.statSync('deseret-stat-metrics-2026.json').size;
          if(Object.keys(metrics.teams||{}).length!==Object.keys(d.teams||{}).length) throw new Error('Compact stat metrics team coverage mismatch');
          if(metricBytes>=fullBytes*.5) throw new Error('Compact stat metrics payload is unexpectedly large');
          console.log(`Compact stat metrics: ${(metricBytes/1024).toFixed(1)} KB vs ${(fullBytes/1024).toFixed(1)} KB full`);
          if(fs.existsSync('player-game-stats-2026.json')) console.log(JSON.parse(fs.readFileSync('player-game-stats-2026.json','utf8')).summary);
          const weeklyAwards=JSON.parse(fs.readFileSync('weekly-awards-2026.json','utf8'));
          if(!weeklyAwards.weeks?.length) throw new Error('Weekly awards output is empty');
          console.log(`Verified ${weeklyAwards.weeks.length} weekly award slate(s)`);
          const shards=fs.readdirSync('team-current-data').filter(name=>name.endsWith('.json'));
          if(shards.length<100) throw new Error('Per-team current-data output incomplete');
          console.log(`Verified ${shards.length} per-team shards`);
          NODE
      - name: Commit roster/stat data
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$STAT_SOURCE_COMMIT" ]; then
            echo "Main changed during import. Rerun against latest main; do not overwrite newer data."
            exit 1
          fi
          node scripts/check_stat_publish_2026.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regular-season-publication-2026.json deseret-rosters-stats-2026.json deseret-stat-metrics-2026.json player-game-stats-2026.json weekly-awards-2026.json team-current-data
          if git diff --cached --quiet; then echo "Statistics already current."; exit 0; fi
          git commit -m "Refresh source data; preserve reviewed regular-season statistics"
          git push origin HEAD:main
