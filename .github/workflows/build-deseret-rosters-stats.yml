name: Build Deseret Rosters and Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - 'deseret-team-data-2026.json'
      - 'deseret-game-details.json'
      - 'deseret-game-links.json'
      - 'scripts/enrich-deseret-game-details.mjs'
      - 'standings-2026.json'
      - 'weekly-simulation.json'
      - 'weekly-awards-stat-status.json'
      - 'manual-stat-corrections-2026.json'
      - 'scripts/build_deseret_rosters_stats.mjs'
      - 'scripts/build_deseret_stat_metrics.mjs'
      - 'scripts/build_player_game_stats.mjs'
      - 'scripts/build_weekly_awards.mjs'
      - 'scripts/apply_manual_stat_corrections.mjs'
      - 'award-scoring-core.js'
      - 'scripts/build_team_current_shards.mjs'
      - '.github/workflows/build-deseret-rosters-stats.yml'

permissions:
  contents: write

concurrency:
  group: deseret-rosters-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build rosters and season player stats
        run: node scripts/build_deseret_rosters_stats.mjs
      - name: Build compact shared stat metrics
        run: node scripts/build_deseret_stat_metrics.mjs
      - name: Connect roster players to individual game box scores
        run: node scripts/build_player_game_stats.mjs
      - name: Build automatic weekly awards
        run: node scripts/build_weekly_awards.mjs
      - name: Build compact per-team payloads
        run: node scripts/build_team_current_shards.mjs
      - name: Verify roster/stat data
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('deseret-rosters-stats-2026.json','utf8'));
          if(!d.summary||d.summary.teams<100) throw new Error('Roster/stat output incomplete');
          console.log(d.summary);
          const metrics=JSON.parse(fs.readFileSync('deseret-stat-metrics-2026.json','utf8'));
          const fullBytes=fs.statSync('deseret-rosters-stats-2026.json').size;
          const metricBytes=fs.statSync('deseret-stat-metrics-2026.json').size;
          if(Object.keys(metrics.teams||{}).length!==Object.keys(d.teams||{}).length) throw new Error('Compact stat metrics team coverage mismatch');
          if(metricBytes>=fullBytes*.5) throw new Error('Compact stat metrics payload is unexpectedly large');
          console.log(`Compact stat metrics: ${(metricBytes/1024).toFixed(1)} KB vs ${(fullBytes/1024).toFixed(1)} KB full`);
          if(fs.existsSync('player-game-stats-2026.json')) console.log(JSON.parse(fs.readFileSync('player-game-stats-2026.json','utf8')).summary);
          const weeklyAwards=JSON.parse(fs.readFileSync('weekly-awards-2026.json','utf8'));
          if(!weeklyAwards.weeks?.length) throw new Error('Weekly awards output is empty');
          console.log(`Verified ${weeklyAwards.weeks.length} weekly award slate(s)`);
          const shards=fs.readdirSync('team-current-data').filter(name=>name.endsWith('.json'));
          if(shards.length<100) throw new Error('Per-team current-data output incomplete');
          console.log(`Verified ${shards.length} per-team shards`);
          NODE
      - name: Commit roster/stat data
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add deseret-rosters-stats-2026.json deseret-stat-metrics-2026.json player-game-stats-2026.json weekly-awards-2026.json team-current-data
          if git diff --cached --quiet; then echo "Roster/stat data already current."; exit 0; fi
          git commit -m "Auto-sync Deseret rosters and stats"
          ok=0
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi
