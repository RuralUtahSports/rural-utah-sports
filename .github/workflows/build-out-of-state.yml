name: Build Out of State Data

on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
  push:
    paths:
      - '.github/workflows/build-out-of-state.yml'
      - 'scripts/build-out-of-state.js'

permissions:
  contents: write

concurrency:
  group: out-of-state-data-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build out-of-state JSON
        env:
          SHEET_ID: 1IHr84tlMdZVAazLDh0HV7ZWoxNH4UpjpLt_UTV8KZwo
          OOS_GID: 1550121091
          SIM_FILE: weekly-simulation.json
          LIVE_FILE: out-of-state-live.json
        run: node scripts/build-out-of-state.js
      - name: Commit out-of-state data
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add out-of-state.json out-of-state-live.json
          if git diff --cached --quiet; then
            echo "Out-of-state data current."
          else
            git commit -m "Auto-sync out-of-state data"
            git pull --rebase origin main
            git push
          fi
