name: Add Scoreboard Share Logos

on:
  push:
    paths:
      - .github/workflows/add-scoreboard-share-logos.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add logos to multi-game scoreboard exports
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('scoreboard-share-layout.js')
          s=p.read_text(encoding='utf-8')

          anchor="  const loadCanvas=()=>window.html2canvas?Promise.resolve():new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});"
          helper="""  const normTeam=v=>String(v??'').trim().toUpperCase().replace(/\\s+/g,' ');
  let shareLogosPromise=null;
  const loadShareLogos=()=>shareLogosPromise||(shareLogosPromise=(async()=>{
    const logos=await fetch(`school-logo-cache.json?v=${Date.now()}`,{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({}));
    try{
      const svg=await fetch(`school-logos/rich-user.svg?v=${Date.now()}`,{cache:'no-store'}).then(r=>r.ok?r.text():'');
      const embedded=(svg.match(/href=[\\\"'](data:image\\/(?:png|webp);base64,[^\\\"']+)[\\\"']/i)||[])[1]||'';
      if(embedded)logos.RICH=embedded;
    }catch{}
    return logos;
  })());
  const shareLogoFor=(team,logos)=>logos[normTeam(team)]||window.RUSSchoolAssets?.logoUrl?.(team)||'';"""
          if 'const loadShareLogos=' not in s:
              if anchor not in s:
                  raise SystemExit('loadCanvas anchor not found')
              s=s.replace(anchor,anchor+'\n\n'+helper,1)

          if 'function cloneGame(item,logos)' not in s:
              s=s.replace('  function cloneGame(item){','  function cloneGame(item,logos){',1)
              clone_line="    const clone=item.el.cloneNode(true);clone.classList.add('rus-sb-card');clone.querySelectorAll('.game-details,.deseret-link').forEach(x=>x.remove());"
              if clone_line not in s:
                  raise SystemExit('clone line not found')
              logo_block="""
    const teamRows=[...clone.querySelectorAll('.team-row')];
    [item.away,item.home].forEach((team,i)=>{
      const row=teamRows[i];if(!row)return;
      const main=row.querySelector('.team-main');if(!main)return;
      let img=main.querySelector('.team-logo');
      if(!img){img=document.createElement('img');img.className='team-logo';img.alt=`${team} logo`;main.prepend(img)}
      const src=shareLogoFor(team,logos);
      if(src){img.src=src;img.style.display='block';img.style.objectFit='contain'}
    });"""
              s=s.replace(clone_line,clone_line+logo_block,1)

          dims="    const [w,h]=format==='story'?[1080,1920]:format==='x'?[1600,900]:[1080,1080];"
          if 'const logos=await loadShareLogos();' not in s:
              if dims not in s:
                  raise SystemExit('buildBoard dimensions anchor not found')
              s=s.replace(dims,dims+'\n    const logos=await loadShareLogos();',1)
          s=s.replace('items.forEach(item=>grid.appendChild(cloneGame(item)));','items.forEach(item=>grid.appendChild(cloneGame(item,logos)));')
          p.write_text(s,encoding='utf-8')

          h=Path('scoreboard.html')
          text=h.read_text(encoding='utf-8')
          text=re.sub(r'scoreboard-share-layout\\.js\\?v=[^\"<]+','scoreboard-share-layout.js?v=20260816-v3',text)
          h.write_text(text,encoding='utf-8')
          PY
      - name: Commit scoreboard share logo support
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scoreboard-share-layout.js scoreboard.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Show school logos in multi-game scoreboard shares'
          git pull --rebase origin main
          git push
