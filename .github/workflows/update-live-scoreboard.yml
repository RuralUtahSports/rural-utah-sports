name: Update Final Scoreboard

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-live-scoreboard.yml'

permissions:
  contents: write

concurrency:
  group: live-scoreboard
  cancel-in-progress: true

jobs:
  refresh-final-derived-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preserve verified schedule changes
        run: node scripts/apply-scoreboard-schedule-overrides.mjs

      - name: Refresh 2026 standings
        env:
          SHEET_ID: 1IHr84tlMdZVAazLDh0HV7ZWoxNH4UpjpLt_UTV8KZwo
          WEEKLY_GID: 1211467999
        run: node scripts/build_standings_2026.mjs

      - name: Refresh all-time team records
        env:
          SHEET_ID: 1IHr84tlMdZVAazLDh0HV7ZWoxNH4UpjpLt_UTV8KZwo
          CLEAN_GAMES_GID: 627882418
        run: node scripts/update-alltime-team-records.mjs

      - name: Sync final games into team pages
        run: node scripts/sync_current_finals_to_team_pages.mjs

      - name: Audit 2026 team records
        continue-on-error: true
        run: node scripts/audit_standings_records_2026.mjs

      - name: Publish final-derived data
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add weekly-simulation.json standings-2026.json teams-data.json team-schedules.json team-page-data
          if git diff --cached --quiet; then
            echo "Final-derived data is already current."
            exit 0
          fi
          git commit -m "Refresh data from verified finals"
          ok=0
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push; then
              ok=1
              break
            fi
            git rebase --abort || true
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi
