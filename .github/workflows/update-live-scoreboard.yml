name: Update Live Scoreboard

on:
  workflow_dispatch:
  schedule:
    # Thursday/Friday/Saturday late afternoons in Utah.
    - cron: '*/5 22-23 * 8-11 4-6'
    # Thursday/Friday/Saturday evenings in Utah (next UTC day).
    - cron: '*/5 0-6 * 8-11 5,6,0'
    # Saturday daytime games in Utah.
    - cron: '*/5 16-21 * 8-11 6'
  push:
    paths:
      - 'scripts/enrich-deseret-game-details.mjs'
      - 'scripts/reconcile-deseret-day-status.mjs'
      - 'scripts/build_player_game_stats.mjs'
      - '.github/workflows/update-live-scoreboard.yml'

permissions:
  contents: write

concurrency:
  group: weekly-deseret-links
  cancel-in-progress: false

jobs:
  refresh-live-details:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh live box scores, game clock, scoring plays and stats
        run: node scripts/enrich-deseret-game-details.mjs

      - name: Reconcile Final/Live status from Deseret daily scoreboard
        run: node scripts/reconcile-deseret-day-status.mjs

      - name: Connect updated game stats to roster players
        run: |
          if [ -f deseret-rosters-stats-2026.json ]; then
            node scripts/build_player_game_stats.mjs
          else
            echo "Roster data not built yet; skipping player-game join."
          fi

      - name: Commit live scoreboard data
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add deseret-game-details.json
          if [ -f player-game-stats-2026.json ]; then git add player-game-stats-2026.json; fi
          if git diff --cached --quiet; then
            echo "Live scoreboard data is already current."
            exit 0
          fi
          git commit -m "Auto-refresh live scoreboard"
          ok=0
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi
