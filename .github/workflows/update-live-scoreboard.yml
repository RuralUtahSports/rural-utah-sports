name: Update Live Scoreboard

on:
  workflow_dispatch:
  schedule:
    # Utah football live-score windows. GitHub cron uses UTC.
    # Use simple */5 syntax; GitHub was not creating fresh runs reliably
    # from the previous range/step expressions.
    - cron: '*/5 22-23 * 8-11 4-6'
    - cron: '*/5 0-6 * 8-11 5,6,0'
    - cron: '*/5 16-21 * 8-11 6'
  # Backup trigger: the standings scheduler is demonstrably firing every
  # 15 minutes, so a successful standings run will also kick the live feed.
  workflow_run:
    workflows: ["Build 2026 Standings"]
    types: [completed]
  push:
    paths:
      - 'scoreboard-refresh.js'
      - 'scripts/enrich-deseret-game-details.mjs'
      - 'scripts/apply_manual_stat_corrections.mjs'
      - 'manual-stat-corrections-2026.json'
      - 'scripts/reconcile-deseret-day-status.mjs'
      - 'scripts/repair-live-status-anomalies.mjs'
      - 'scripts/apply-kickoff-live-fallback.mjs'
      - 'scripts/build_standings_2026.mjs'
      - '.github/workflows/update-live-scoreboard.yml'

permissions:
  contents: write

concurrency:
  group: live-scoreboard
  cancel-in-progress: true

jobs:
  refresh-live-details:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh live box scores, game clock, scoring plays and stats
        run: node scripts/enrich-deseret-game-details.mjs

      - name: Reconcile Final/Live status from Deseret daily scoreboard
        run: node scripts/reconcile-deseret-day-status.mjs

      - name: Repair suspicious same-day statuses
        run: node scripts/repair-live-status-anomalies.mjs

      - name: Mark overdue scheduled games live after kickoff grace period
        run: node scripts/apply-kickoff-live-fallback.mjs

      - name: Refresh 2026 team records for rankings and standings
        env:
          SHEET_ID: 1IHr84tlMdZVAazLDh0HV7ZWoxNH4UpjpLt_UTV8KZwo
          WEEKLY_GID: 1211467999
        run: node scripts/build_standings_2026.mjs

      - name: Commit live scoreboard and team records
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"
          git add deseret-game-details.json standings-2026.json
          if git diff --cached --quiet; then
            echo "Live scoreboard and records are already current."
            exit 0
          fi
          git commit -m "Auto-refresh live scoreboard and records"
          ok=0
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi
