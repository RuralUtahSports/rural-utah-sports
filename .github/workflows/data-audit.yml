name: RUS Data Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * *'
  push:
    branches: [main]
    paths:
      - 'teams-data.json'
      - 'weekly-simulation.json'
      - 'standings-2026.json'
      - 'rankings-current-2026.json'
      - 'elo-summary.json'
      - 'deseret-rosters-stats-2026.json'
      - 'team-page-data/**'
      - 'scripts/audit-football-data.mjs'
      - '.github/workflows/data-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check audit script syntax
        run: node --check scripts/audit-football-data.mjs
      - name: Audit football data
        id: audit
        continue-on-error: true
        run: node scripts/audit-football-data.mjs
      - name: Publish readable audit summary
        if: always()
        run: |
          if [ -f data-audit-report.md ]; then cat data-audit-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rus-data-audit
          path: |
            data-audit-report.json
            data-audit-report.md
          if-no-files-found: warn
      - name: Save latest audit in repository
        if: always()
        run: |
          if [ ! -f data-audit-report.json ] || [ ! -f data-audit-report.md ]; then exit 0; fi
          cp data-audit-report.json data-audit-latest.json
          cp data-audit-report.md data-audit-latest.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-audit-latest.json data-audit-latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh latest data audit report'
          git pull --rebase origin main
          git push
      - name: Fail on critical data errors
        if: steps.audit.outcome == 'failure'
        run: exit 1
