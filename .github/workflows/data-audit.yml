name: RUS Data Audit

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Build Simulator Data"
      - "Enrich Weekly Deseret Links"
      - "Build 2026 Standings"
      - "Update Live Scoreboard"
      - "Build Clean Live ELO"
      - "Build MaxPreps Stats Fallback"
    types: [completed]
  schedule:
    - cron: '23 12 * * *'
  push:
    branches: [main]
    paths:
      - 'teams-data.json'
      - 'weekly-simulation.json'
      - 'standings-2026.json'
      - 'rankings-current-2026.json'
      - 'elo-summary.json'
      - 'deseret-rosters-stats-2026.json'
      - 'maxpreps-stats-fallback-2026.json'
      - 'maxpreps-player-game-stats-2026.json'
      - 'player-game-stats-2026.json'
      - 'team-page-data/**'
      - 'scripts/audit-football-data.mjs'
      - 'scripts/audit-all-player-stats-2026.mjs'
      - 'deseret-stat-metrics-2026.json'
      - 'scripts/normalize-weekly-team-names.mjs'
      - '.github/workflows/data-audit.yml'

permissions:
  contents: write

concurrency:
  group: rus-data-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture source snapshot for publication
        run: echo "STAT_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check audit script syntax
        run: node --check scripts/audit-football-data.mjs
      - name: Audit football data
        id: audit
        continue-on-error: true
        run: node scripts/audit-football-data.mjs
      - name: Audit all 2026 player statistics
        id: players
        continue-on-error: true
        run: |
          node --check scripts/audit-all-player-stats-2026.mjs
          node scripts/audit-all-player-stats-2026.mjs
      - name: Publish readable audit summary
        if: always()
        run: |
          if [ -f data-audit-report.md ]; then cat data-audit-report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f audits/2026-player-stats-audit.md ]; then cat audits/2026-player-stats-audit.md | head -n 100 >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rus-data-audit
          path: |
            data-audit-report.json
            data-audit-report.md
            audits/2026-player-stats-audit.json
            audits/2026-player-stats-audit.md
          if-no-files-found: warn
      - name: Save latest audit in repository
        if: github.ref == 'refs/heads/main' && (always())
        run: |
          if [ ! -f data-audit-report.json ] || [ ! -f data-audit-report.md ]; then exit 0; fi
          cp data-audit-report.json data-audit-latest.json
          cp data-audit-report.md data-audit-latest.md
          git fetch origin main
          node scripts/check_stat_publish_2026.mjs --snapshot-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-audit-latest.json data-audit-latest.md audits/2026-player-stats-audit.json audits/2026-player-stats-audit.md
          if git diff --cached --quiet; then echo "Derived data already current."; exit 0; fi
          git commit -m "Refresh derived data from current source snapshot"
          git push origin HEAD:main
      - name: Fail on critical data errors
        if: steps.audit.outcome == 'failure' || steps.players.outcome == 'failure'
        run: exit 1
