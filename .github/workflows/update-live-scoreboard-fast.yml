name: Final Scoreboard Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 22-23 * 8-11 4-6'
    - cron: '*/10 0-6 * 8-11 5,6,0'
    - cron: '*/10 16-21 * 8-11 6'
  push:
    paths:
      - 'weekly-simulation.json'
      - 'deseret-game-links.json'
      - 'scripts/enrich-deseret-game-details.mjs'
      - 'scripts/build_live_scoreboard_details.mjs'
      - 'scripts/reconcile-deseret-day-status.mjs'
      - 'scripts/reconcile-deseret-browser-live.mjs'
      - 'scripts/reconcile-deseret-unlinked-games.mjs'
      - 'scripts/apply-manual-scoreboard-corrections.mjs'
      - 'manual-scoreboard-corrections-2026.json'
      - 'scripts/apply-scoreboard-schedule-overrides.mjs'
      - 'scoreboard-schedule-overrides-2026.json'
      - '.github/workflows/update-live-scoreboard-fast.yml'
permissions:
  contents: write
  actions: write

concurrency:
  # Keep fast ticks from canceling the sustained game-night watcher.
  group: live-scoreboard-fast
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check for newly completed games
        run: |
          node scripts/apply-scoreboard-schedule-overrides.mjs
          node scripts/enrich-deseret-game-details.mjs
          node scripts/reconcile-deseret-day-status.mjs
          node scripts/reconcile-deseret-unlinked-games.mjs --self-test
          node scripts/reconcile-deseret-unlinked-games.mjs
          node scripts/reconcile-deseret-browser-live.mjs
          DESERET_BROWSER_ONLY=1 node scripts/enrich-deseret-game-details.mjs
          node scripts/apply-manual-scoreboard-corrections.mjs
          node scripts/apply-scoreboard-schedule-overrides.mjs
          node scripts/build_live_scoreboard_details.mjs

      - name: Publish final-score changes
        id: publish
        run: |
          git config user.name "RuralUtahSports"
          git config user.email "60403147+RuralUtahSports@users.noreply.github.com"

          # Live/partial detail scraping is only used to detect a trustworthy
          # Final. Do not publish those intermediate states.
          git restore deseret-game-details.json deseret-game-links.json 2>/dev/null || true
          git add deseret-live-details-2026.json weekly-simulation.json

          if git diff --cached --quiet; then
            echo "No new final scores."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Refresh verified final scores"
          ok=0
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push; then
              ok=1
              break
            fi
            git rebase --abort || true
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Commits made with a workflow's GITHUB_TOKEN do not reliably trigger
      # another workflow from a push event. Dispatch the existing final-score
      # sync explicitly so weekly-simulation.json and Scorigami stay current.
      - name: Sync new finals into weekly feed
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-live-finals-to-weekly.yml --ref main
