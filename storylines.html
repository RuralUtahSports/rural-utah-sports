*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff}header{background:#000;border-bottom:4px solid #F14D07;padding:15px 25px}.header-content{max-width:1400px;margin:auto;display:flex;align-items:center;gap:20px}.logo{width:80px;height:80px;object-fit:contain}.site-title h1{font-size:30px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.site-title p{color:#F14D07;font-weight:bold;margin-top:5px}nav{background:#000;border-bottom:1px solid #333}.nav-content{max-width:1400px;margin:auto;display:flex;flex-wrap:wrap}.container{max-width:1400px;margin:auto;padding:35px 20px 60px}.page-title{border-left:6px solid #F14D07;padding-left:15px;font-size:34px;text-transform:uppercase;margin-bottom:10px}.subtitle{color:#aaa;line-height:1.55;max-width:1000px;margin-bottom:22px}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.summary{background:#000;border:1px solid #333;border-top:4px solid #F14D07;border-radius:8px;padding:17px}.summary-value{font-size:28px;font-weight:900;color:#F14D07}.summary-label{font-size:10px;color:#888;text-transform:uppercase;font-weight:900;margin-top:5px}.story-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.story{background:#000;border:1px solid #333;border-radius:9px;overflow:hidden}.story-head{padding:15px 17px;background:#171717;border-bottom:3px solid #F14D07}.story-head h2{font-size:21px;text-transform:uppercase}.story-head p{color:#888;font-size:11px;margin-top:5px;line-height:1.4}.story-list{list-style:none}.story-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #282828}.story-row:last-child{border-bottom:0}.story-logo{width:42px;height:42px;object-fit:contain;flex:0 0 42px}.story-team{display:inline-block;font-weight:900;text-decoration:none;color:var(--team-fg,#fff);background:var(--team-bg,transparent);border-radius:5px;padding:4px 7px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}.story-team:hover{filter:brightness(1.12)}.story-meta{color:#888;font-size:11px;margin-top:5px}.story-value{margin-left:auto;text-align:right;font-weight:900;color:#F14D07;white-space:nowrap}.game-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:13px 14px;border-bottom:1px solid #282828}.game-row:last-child{border-bottom:0}.game-team{display:flex;align-items:center;gap:8px;min-width:0}.game-team.right{justify-content:flex-end;text-align:right}.game-team img{width:34px;height:34px;object-fit:contain}.game-score{text-align:center;color:#F14D07;font-weight:900}.game-date{text-align:center;color:#777;font-size:9px;margin-top:3px}.game-label{text-align:center;color:#aaa;font-size:9px;font-weight:900;text-transform:uppercase;margin-bottom:2px}.empty{padding:30px 16px;text-align:center;color:#777}.section-wide{grid-column:1/-1}.prediction-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.prediction-grid .game-row:nth-child(odd){border-right:1px solid #282828}.region-grid{display:grid;grid-template-columns:repeat(3,1fr)}.region-box{padding:13px 15px;border-right:1px solid #282828;border-bottom:1px solid #282828}.region-box h3{font-size:13px;color:#F14D07;text-transform:uppercase;margin-bottom:7px}.region-box div{font-size:12px;line-height:1.7}.preseason-note{padding:18px;color:#aaa;line-height:1.55}.preseason-note strong{color:#F14D07}.note{margin-top:22px;color:#777;font-size:11px;line-height:1.5;background:#000;border:1px solid #333;border-left:5px solid #F14D07;border-radius:7px;padding:14px 16px}.loading{text-align:center;padding:60px;color:#888}@media(max-width:900px){.story-grid{grid-template-columns:1fr}.section-wide{grid-column:auto}.region-grid{grid-template-columns:repeat(2,1fr)}.prediction-grid{grid-template-columns:1fr}.prediction-grid .game-row:nth-child(odd){border-right:0}}@media(max-width:700px){.header-content{flex-direction:column;text-align:center}.site-title h1{font-size:24px}.container{padding:25px 12px 45px}.page-title{font-size:28px}.summary-grid{grid-template-columns:repeat(2,1fr)}.region-grid{grid-template-columns:1fr}.game-row{grid-template-columns:1fr auto 1fr;gap:6px}.game-team img{display:none}.story-team{padding:3px 5px}}

<body>
<header><div class="header-content"><img src="RUSlogoNew.png" alt="Rural Utah Sports" class="logo"><div class="site-title"><h1>Rural Utah Sports</h1><p>Utah High School Sports History &amp; Data</p></div></div></header>
<nav><div class="nav-content"></div></nav>
<main class="container"><h2 class="page-title" id="title">Football Storylines</h2><p class="subtitle" id="subtitle">Loading the biggest trends, streaks, region races and games around Utah high school football.</p><div id="content" class="loading">Loading storylines...</div></main>
<footer><p><strong>RURAL UTAH SPORTS</strong></p><p>Utah High School Sports History &amp; Data</p></footer>
<script>
const YEAR=new Date().getFullYear(),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'),norm=v=>String(v??'').trim().toUpperCase(),key=v=>norm(v).replace(/[^A-Z0-9]/g,'');
const aliases={'MONUMENT VAL':'MONUMENT VALLEY','GUNNISON':'GUNNISON VALLEY','CEDAR':'CEDAR CITY','GRAND COUNTY':'GRAND','UTAH MILITARY ACADEMY - CAMP WILLIAMS':'UMA-LEHI','UTAH MILITARY ACADEMY - HILL FIELD':'UMA-HILLFIELD'};
const canon=v=>aliases[norm(v)]||norm(v),yearOf=d=>{const m=String(d||'').match(/(18\d{2}|19\d{2}|20\d{2})/);return m?+m[1]:null},dateVal=d=>{const t=Date.parse(d);return Number.isFinite(t)?t:0},safeHex=(v,f)=>/^#[0-9A-F]{3}(?:[0-9A-F]{3})?$/i.test(String(v||'').trim())?String(v).trim():f;
function flatten(data){const out=[],seen=new Set();for(const entry of data.scores||[])for(const g of entry.games||[]){let a,b,sa,sb,tie=!!g.tie;if(tie){a=canon(g.team1);b=canon(g.team2);sa=+g.score1;sb=+g.score2}else{a=canon(g.winner);b=canon(g.loser);sa=+g.winnerScore;sb=+g.loserScore}const pair=[[key(a),sa],[key(b),sb]].sort((x,y)=>x[0].localeCompare(y[0])),sig=`${g.date}|${pair[0][0]}:${pair[0][1]}|${pair[1][0]}:${pair[1][1]}`;if(seen.has(sig))continue;seen.add(sig);out.push({date:g.date||'',a,b,sa,sb,tie,year:yearOf(g.date),total:sa+sb,margin:Math.abs(sa-sb)})}return out}
function activeStreak(games,team,target){const rows=games.filter(g=>g.a===team||g.b===team).sort((a,b)=>dateVal(a.date)-dateVal(b.date));let n=0;for(let i=rows.length-1;i>=0;i--){const g=rows[i],result=g.tie?'T':g.a===team?'W':'L';if(result!==target)break;n++}return n}
function logo(team,cls='story-logo'){return `<img class="${cls}" src="${esc(RUSSchoolAssets.logoUrl(team))}" alt="${esc(team)} logo" onerror="this.style.display='none'">`}
function colorFor(team,teamInfo){const x=teamInfo.get(canon(team))||teamInfo.get(norm(team));return{bg:safeHex(x?.backgroundColor,'#222222'),fg:safeHex(x?.textColor,'#FFFFFF')}}
function teamLink(team,teamInfo){const c=colorFor(team,teamInfo);return `<a class="story-team" style="--team-bg:${c.bg};--team-fg:${c.fg}" href="team.html?team=${encodeURIComponent(team)}">${esc(team)}</a>`}
function teamRow(team,meta,value,teamInfo){return `<li class="story-row">${logo(team)}<div>${teamLink(team,teamInfo)}<div class="story-meta">${esc(meta||'')}</div></div><div class="story-value">${esc(value)}</div></li>`}
function gameRow(g,teamInfo,label=''){return `<div class="game-row"><div class="game-team">${logo(g.awayTeam,'')}${teamLink(g.awayTeam,teamInfo)}</div><div>${label?`<div class="game-label">${esc(label)}</div>`:''}<div class="game-score">${g.awayScore}–${g.homeScore}</div><div class="game-date">${esc(g.date)}</div></div><div class="game-team right">${teamLink(g.homeTeam,teamInfo)}${logo(g.homeTeam,'')}</div></div>`}
function resultRow(g,label,teamInfo){return `<div class="game-row"><div class="game-team">${logo(g.a,'')}${teamLink(g.a,teamInfo)}</div><div><div class="game-label">${esc(label)}</div><div class="game-score">${g.sa}–${g.sb}</div><div class="game-date">${esc(g.date)}</div></div><div class="game-team right">${teamLink(g.b,teamInfo)}${logo(g.b,'')}</div></div>`}
(async()=>{try{
  const stamp=Date.now(),[sr,wr,tr,ar]=await Promise.all([
    fetch('scorigami.json?v='+stamp),fetch('weekly-simulation.json?v='+stamp),fetch('teams-data.json?v='+stamp),fetch('full-season-alignment-2025.json?v='+stamp)
  ]);
  if(!sr.ok||!wr.ok||!tr.ok||!ar.ok)throw new Error('Storyline source unavailable');
  const sc=await sr.json(),weekly=(await wr.json()).games||[],teams=await tr.json(),align=await ar.json();
  const varsity=teams.filter(t=>/^(6A|5A|4A|3A|2A|1A|8P|8-PLAYER)$/i.test(String(t.classification||''))&&!['ESCALANTE','USDB'].includes(norm(t.team)));
  const currentTeams=new Set(varsity.map(t=>canon(t.team))),teamInfo=new Map();
  for(const t of varsity){teamInfo.set(canon(t.team),t);teamInfo.set(norm(t.team),t)}
  const games=flatten(sc),season=games.filter(g=>g.year===YEAR&&(currentTeams.has(g.a)||currentTeams.has(g.b))),records=new Map([...currentTeams].map(t=>[t,{w:0,l:0,t:0}]));
  for(const g of season){if(g.tie){if(records.has(g.a))records.get(g.a).t++;if(records.has(g.b))records.get(g.b).t++}else{if(records.has(g.a))records.get(g.a).w++;if(records.has(g.b))records.get(g.b).l++}}
  const undefeated=[...records].filter(([,r])=>r.l===0).sort((a,b)=>b[1].w-a[1].w||b[1].t-a[1].t||a[0].localeCompare(b[0]));
  const wins=[...currentTeams].map(t=>[t,activeStreak(games,t,'W')]).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,10);
  const losses=[...currentTeams].map(t=>[t,activeStreak(games,t,'L')]).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,10);
  const upcoming=weekly.filter(g=>yearOf(g.date)===YEAR&&g.actualAway==null&&g.actualHome==null&&Number.isFinite(Number(g.awayScore))&&Number.isFinite(Number(g.homeScore))).sort((a,b)=>Math.abs(Number(a.awayScore)-Number(a.homeScore))-Math.abs(Number(b.awayScore)-Number(b.homeScore))||dateVal(a.date)-dateVal(b.date));
  const meta=t=>{const x=teamInfo.get(canon(t));return x?`${x.classification||''}${x.region?' • '+x.region:''}`:''};
  const regionByTeam=new Map();for(const r of align.regions||[])for(const t of r.teams||[])regionByTeam.set(canon(t),r);
  const rr=new Map();for(const g of season){const ra=regionByTeam.get(g.a),rb=regionByTeam.get(g.b);if(!ra||!rb||ra.classification!==rb.classification||String(ra.region)!==String(rb.region))continue;const group=`${ra.classification} ${ra.region}`;if(!rr.has(group))rr.set(group,new Map());const m=rr.get(group);for(const t of[g.a,g.b])if(!m.has(t))m.set(t,{w:0,l:0,t:0});if(g.tie){m.get(g.a).t++;m.get(g.b).t++}else{m.get(g.a).w++;m.get(g.b).l++}}
  const regionHTML=[...rr].sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true})).map(([name,m])=>{const rows=[...m].sort((a,b)=>(b[1].w/(b[1].w+b[1].l+b[1].t||1))-(a[1].w/(a[1].w+a[1].l+a[1].t||1))||b[1].w-a[1].w).slice(0,3);return `<div class="region-box"><h3>${esc(name)}</h3>${rows.map(([t,r])=>`<div>${teamLink(t,teamInfo)} ${r.w}-${r.l}${r.t?'-'+r.t:''}</div>`).join('')}</div>`}).join('');
  const highest=[...season].sort((a,b)=>b.total-a.total)[0],closest=[...season].filter(g=>!g.tie).sort((a,b)=>a.margin-b.margin||b.total-a.total)[0],biggest=[...season].filter(g=>!g.tie).sort((a,b)=>b.margin-a.margin)[0],seasonStarted=season.length>0;
  $('title').textContent=`${YEAR} Football Storylines`;
  $('subtitle').textContent=seasonStarted?`Live season trends from ${season.length} recorded ${YEAR} games, plus live RUS streaks, region races and this week's RUS projections.`:`Opening-week and preseason storylines for ${YEAR}. All current varsity programs begin undefeated, and weekly projections update from the RUS simulation sheet.`;
  $('content').className='';
  $('content').innerHTML=`
    <div class="summary-grid">
      <div class="summary"><div class="summary-value">${seasonStarted?season.length:'Pre'}</div><div class="summary-label">${seasonStarted?'Games Recorded':'Season Status'}</div></div>
      <div class="summary"><div class="summary-value">${undefeated.length}</div><div class="summary-label">Undefeated Teams</div></div>
      <div class="summary"><div class="summary-value">${upcoming.length}</div><div class="summary-label">Weekly Predictions</div></div>
      <div class="summary"><div class="summary-value">${wins[0]?.[1]||0}</div><div class="summary-label">Longest Active Win Streak</div></div>
    </div>
    <div class="story-grid">
      <section class="story">
        <div class="story-head"><h2>Undefeated Teams</h2><p>${seasonStarted?'Every current varsity program that has not lost a game this season — including teams still waiting to play.':'Every current varsity football program is 0-0 and therefore undefeated entering the season.'}</p></div>
        ${seasonStarted?`<ul class="story-list">${undefeated.slice(0,16).map(([t,r])=>teamRow(t,meta(t),`${r.w}-${r.l}${r.t?'-'+r.t:''}`,teamInfo)).join('')||'<li class="empty">No undefeated teams.</li>'}</ul>`:`<div class="preseason-note"><strong>${undefeated.length} teams are undefeated.</strong><br>Every current Utah varsity football program begins ${YEAR} without a loss. This count will decrease automatically as results are added.</div>`}
      </section>
      <section class="story">
        <div class="story-head"><h2>Active Winning Streaks</h2><p>Calculated directly from the latest completed games already in the RUS game database.</p></div>
        <ul class="story-list">${wins.map(([t,n])=>teamRow(t,meta(t),`${n} W`,teamInfo)).join('')||'<li class="empty">No active winning streaks.</li>'}</ul>
      </section>
      <section class="story">
        <div class="story-head"><h2>Active Losing Streaks</h2><p>Calculated directly from the latest completed games already in the RUS game database.</p></div>
        <ul class="story-list">${losses.map(([t,n])=>teamRow(t,meta(t),`${n} L`,teamInfo)).join('')||'<li class="empty">No active losing streaks.</li>'}</ul>
      </section>
      <section class="story">
        <div class="story-head"><h2>${seasonStarted?'Games of the Season':'Opening Week Snapshot'}</h2><p>${seasonStarted?'Highest scoring, closest and biggest-margin results so far.':'The closest projected opening-week games appear in the weekly section below.'}</p></div>
        ${seasonStarted?`${highest?resultRow(highest,'Highest Scoring',teamInfo):''}${closest?resultRow(closest,'Closest',teamInfo):''}${biggest?resultRow(biggest,'Biggest Margin',teamInfo):''}`:`${upcoming.slice(0,3).map((g,i)=>gameRow(g,teamInfo,i===0?'Closest Projection':'Projected')).join('')||'<div class="empty">Opening-week projections will appear when weekly data is available.</div>'}`}
      </section>
      <section class="story section-wide">
        <div class="story-head"><h2>Weekly Predictions / Games to Watch</h2><p>These come directly from the RUS Weekly Simulation sheet and stay visible throughout the season. Closest projected games are listed first.</p></div>
        <div class="prediction-grid">${upcoming.slice(0,12).map((g,i)=>gameRow(g,teamInfo,i<5?'Featured Projection':'Prediction')).join('')||'<div class="empty">No upcoming weekly predictions are available.</div>'}</div>
      </section>
      <section class="story section-wide">
        <div class="story-head"><h2>Region Races</h2><p>${regionHTML?'Current region records based on recorded results.':'Region races will populate automatically when region games begin.'}</p></div>
        <div class="region-grid">${regionHTML||'<div class="empty">No region games have been recorded yet.</div>'}</div>
      </section>
    </div>
    <div class="note">Storylines update from the current RUS game database, current alignment and Weekly Simulation file. Active winning and losing streaks are calculated from completed games already on the site, so they no longer depend on a separate streak file.</div>`;
}catch(e){console.error(e);$('content').innerHTML='<div class="loading">Storyline data could not be loaded.</div>'}})();
</script><script src="back-to-top.js" defer></script>
