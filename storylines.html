<header><div class="header-content"><img src="RUSlogoNew.png" alt="Rural Utah Sports" class="logo"><div class="site-title"><h1>Rural Utah Sports</h1><p>Utah High School Sports History &amp; Data</p></div></div></header>

<main class="container"><h2 class="page-title" id="title">Football Storylines</h2><p class="subtitle" id="subtitle">Loading the biggest trends, streaks, region races and games around Utah high school football.</p><div id="content" class="loading">Loading storylines...</div></main>

<script>
const YEAR=new Date().getFullYear(),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'),norm=v=>String(v??'').trim().toUpperCase(),key=v=>norm(v).replace(/[^A-Z0-9]/g,'');
const aliases={'MONUMENT VAL':'MONUMENT VALLEY','GUNNISON':'GUNNISON VALLEY','CEDAR':'CEDAR CITY','GRAND COUNTY':'GRAND','UTAH MILITARY ACADEMY - CAMP WILLIAMS':'UMA-LEHI','UTAH MILITARY ACADEMY - HILL FIELD':'UMA-HILLFIELD'};
const canon=v=>aliases[norm(v)]||norm(v),yearOf=d=>{const m=String(d||'').match(/(18\d{2}|19\d{2}|20\d{2})/);return m?+m[1]:null},dateVal=d=>{const t=Date.parse(d);return Number.isFinite(t)?t:0};
function flatten(data){const out=[],seen=new Set();for(const entry of data.scores||[])for(const g of entry.games||[]){let a,b,sa,sb,tie=!!g.tie;if(tie){a=canon(g.team1);b=canon(g.team2);sa=+g.score1;sb=+g.score2}else{a=canon(g.winner);b=canon(g.loser);sa=+g.winnerScore;sb=+g.loserScore}const pair=[[key(a),sa],[key(b),sb]].sort((x,y)=>x[0].localeCompare(y[0])),sig=`${g.date}|${pair[0][0]}:${pair[0][1]}|${pair[1][0]}:${pair[1][1]}`;if(seen.has(sig))continue;seen.add(sig);out.push({date:g.date||'',a,b,sa,sb,tie,year:yearOf(g.date),total:sa+sb,margin:Math.abs(sa-sb)})}return out}
function logo(team,cls='story-logo'){return `<img class="${cls}" src="${esc(RUSSchoolAssets.logoUrl(team))}" alt="${esc(team)} logo" onerror="this.style.display='none'">`}
function teamRow(team,meta,value){return `<li class="story-row">${logo(team)}<div><a class="story-team" href="team.html?team=${encodeURIComponent(team)}">${esc(team)}</a><div class="story-meta">${esc(meta||'')}</div></div><div class="story-value">${esc(value)}</div></li>`}
function gameRow(g,label=''){return `<div class="game-row"><div class="game-team">${logo(g.awayTeam,'')}<a href="team.html?team=${encodeURIComponent(g.awayTeam)}">${esc(g.awayTeam)}</a></div><div>${label?`<div class="game-label">${esc(label)}</div>`:''}<div class="game-score">${g.awayScore}–${g.homeScore}</div><div class="game-date">${esc(g.date)}</div></div><div class="game-team right"><a href="team.html?team=${encodeURIComponent(g.homeTeam)}">${esc(g.homeTeam)}</a>${logo(g.homeTeam,'')}</div></div>`}
function resultRow(g,label){return `<div class="game-row"><div class="game-team">${logo(g.a,'')}<a href="team.html?team=${encodeURIComponent(g.a)}">${esc(g.a)}</a></div><div><div class="game-label">${esc(label)}</div><div class="game-score">${g.sa}–${g.sb}</div><div class="game-date">${esc(g.date)}</div></div><div class="game-team right"><a href="team.html?team=${encodeURIComponent(g.b)}">${esc(g.b)}</a>${logo(g.b,'')}</div></div>`}
function currentStreaks(games,current){const s=new Map([...current].map(t=>[t,0]));for(const g of [...games].sort((a,b)=>dateVal(a.date)-dateVal(b.date))){if(g.tie){if(s.has(g.a))s.set(g.a,0);if(s.has(g.b))s.set(g.b,0);continue}if(s.has(g.a))s.set(g.a,(s.get(g.a)>0?s.get(g.a):0)+1);if(s.has(g.b))s.set(g.b,(s.get(g.b)<0?s.get(g.b):0)-1)}return s}
(async()=>{try{const stamp=Date.now(),[sr,wr,tr,ar]=await Promise.all([fetch('scorigami.json?v='+stamp),fetch('weekly-simulation.json?v='+stamp),fetch('teams-data.json?v='+stamp),fetch('full-season-alignment-2025.json?v='+stamp)]);const sc=await sr.json(),weekly=(await wr.json()).games||[],teams=await tr.json(),align=await ar.json();const currentTeams=new Set(teams.filter(t=>/^(6A|5A|4A|3A|2A|1A|8P|8-PLAYER)$/i.test(String(t.classification||''))&&!['ESCALANTE','USDB'].includes(norm(t.team))).map(t=>norm(t.team))),teamInfo=new Map(teams.map(t=>[norm(t.team),t])),games=flatten(sc),season=games.filter(g=>g.year===YEAR&&(currentTeams.has(g.a)||currentTeams.has(g.b))),records=new Map([...currentTeams].map(t=>[t,{w:0,l:0,t:0}]));for(const g of season){if(g.tie){if(records.has(g.a))records.get(g.a).t++;if(records.has(g.b))records.get(g.b).t++}else{if(records.has(g.a))records.get(g.a).w++;if(records.has(g.b))records.get(g.b).l++}}const undefeated=[...records].filter(([,r])=>r.w>0&&r.l===0).sort((a,b)=>b[1].w-a[1].w||a[0].localeCompare(b[0])),streaks=currentStreaks(games,currentTeams),wins=[...streaks].filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]).slice(0,10),losses=[...streaks].filter(([,n])=>n<0).sort((a,b)=>a[1]-b[1]).slice(0,10),upcoming=weekly.filter(g=>yearOf(g.date)===YEAR&&g.actualAway==null&&g.actualHome==null).sort((a,b)=>Math.abs(a.awayScore-a.homeScore)-Math.abs(b.awayScore-b.homeScore)||dateVal(a.date)-dateVal(b.date)).slice(0,10);const meta=t=>{const x=teamInfo.get(t);return x?`${x.classification||''}${x.region?' • '+x.region:''}`:''};const regionByTeam=new Map();for(const r of align.regions||[])for(const t of r.teams||[])regionByTeam.set(norm(t),r);const rr=new Map();for(const g of season){const ra=regionByTeam.get(g.a),rb=regionByTeam.get(g.b);if(!ra||!rb||ra.classification!==rb.classification||String(ra.region)!==String(rb.region))continue;const group=`${ra.classification} ${ra.region}`;if(!rr.has(group))rr.set(group,new Map());const m=rr.get(group);for(const t of[g.a,g.b])if(!m.has(t))m.set(t,{w:0,l:0,t:0});if(g.tie){m.get(g.a).t++;m.get(g.b).t++}else{m.get(g.a).w++;m.get(g.b).l++}}const regionHTML=[...rr].sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true})).map(([name,m])=>{const rows=[...m].sort((a,b)=>(b[1].w/(b[1].w+b[1].l+b[1].t||1))-(a[1].w/(a[1].w+a[1].l+a[1].t||1))||b[1].w-a[1].w).slice(0,3);return `<div class="region-box"><h3>${esc(name)}</h3>${rows.map(([t,r])=>`<div><a class="story-team" href="team.html?team=${encodeURIComponent(t)}">${esc(t)}</a> ${r.w}-${r.l}${r.t?'-'+r.t:''}</div>`).join('')}</div>`}).join('');const highest=[...season].sort((a,b)=>b.total-a.total)[0],closest=[...season].filter(g=>!g.tie).sort((a,b)=>a.margin-b.margin)[0],biggest=[...season].filter(g=>!g.tie).sort((a,b)=>b.margin-a.margin)[0];$('title').textContent=`${YEAR} Football Storylines`;$('subtitle').textContent=season.length?`Live season trends from ${season.length} recorded ${YEAR} games, plus current streaks, region races and upcoming simulations.`:`Opening-week and preseason storylines for ${YEAR}. This page will automatically switch to live results as scores enter the RUS database.`;$('content').className='';$('content').innerHTML=`<div class="summary-grid"><div class="summary"><div class="summary-value">${season.length||'Pre'}</div><div class="summary-label">${season.length?'Games Recorded':'Season Status'}</div></div><div class="summary"><div class="summary-value">${undefeated.length}</div><div class="summary-label">Undefeated Teams</div></div><div class="summary"><div class="summary-value">${upcoming.length}</div><div class="summary-label">Close Games to Watch</div></div><div class="summary"><div class="summary-value">${wins[0]?.[1]||0}</div><div class="summary-label">Longest Active Win Streak</div></div></div><div class="story-grid"><section class="story"><div class="story-head"><h2>${season.length?'Undefeated Teams':'Opening Week: Closest Projections'}</h2><p>${season.length?'Teams still without a loss this season.':'Games with the smallest projected scoring margins from the weekly simulator.'}</p></div>${season.length?`<ul class="story-list">${undefeated.slice(0,12).map(([t,r])=>teamRow(t,meta(t),`${r.w}-${r.l}${r.t?'-'+r.t:''}`)).join('')||'<li class="empty">No undefeated teams.</li>'}</ul>`:`${upcoming.slice(0,8).map(g=>gameRow(g)).join('')||'<div class="empty">No upcoming projections found.</div>'}`}</section><section class="story"><div class="story-head"><h2>Active Winning Streaks</h2><p>Longest current winning streaks across the historical game database.</p></div><ul class="story-list">${wins.map(([t,n])=>teamRow(t,meta(t),`${n} W`)).join('')||'<li class="empty">No active streak data.</li>'}</ul></section><section class="story"><div class="story-head"><h2>Active Losing Streaks</h2><p>Current losing streaks among active Utah football programs.</p></div><ul class="story-list">${losses.map(([t,n])=>teamRow(t,meta(t),`${Math.abs(n)} L`)).join('')||'<li class="empty">No active losing streaks.</li>'}</ul></section><section class="story"><div class="story-head"><h2>${season.length?'Games of the Season':'More Games to Watch'}</h2><p>${season.length?'Highest scoring, closest and biggest-margin results so far.':'Additional opening-week matchups projected to be competitive.'}</p></div>${season.length?`${highest?resultRow(highest,'Highest Scoring'):''}${closest?resultRow(closest,'Closest'):''}${biggest?resultRow(biggest,'Biggest Margin'):''}`:upcoming.slice(8).map(g=>gameRow(g)).join('')||'<div class="empty">More games will appear as the schedule updates.</div>'}</section><section class="story section-wide"><div class="story-head"><h2>Region Races</h2><p>${regionHTML?'Current region records based on recorded results.':'Region races will populate automatically when region games begin.'}</p></div><div class="region-grid">${regionHTML||'<div class="empty">No region games have been recorded yet.</div>'}</div></section></div><div class="note">Storylines are generated from the same RUS game database, current alignment and weekly simulation files used elsewhere on the site. They update as those data files update.</div>`}catch(e){console.error(e);$('content').innerHTML='<div class="loading">Storyline data could not be loaded.</div>'}})();
</script>
