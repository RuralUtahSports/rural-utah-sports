<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team | Rural Utah Sports</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff}
header{background:#000;border-bottom:4px solid #F14D07;padding:15px 25px}
.header-content{max-width:1400px;margin:auto;display:flex;align-items:center;gap:20px}
.logo{width:80px;height:80px;object-fit:contain}
.site-title h1{font-size:30px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
.site-title p{color:#F14D07;font-weight:bold;margin-top:5px}
nav{background:#000;border-bottom:1px solid #333}
.nav-content{max-width:1400px;margin:auto;display:flex;flex-wrap:wrap}
nav a{color:#fff;text-decoration:none;padding:15px 18px;font-size:14px;font-weight:bold;text-transform:uppercase}
nav a:hover{background:#F14D07;color:#000}
.container{max-width:1400px;margin:auto;padding:35px 20px 60px}
.back{display:inline-block;background:#F14D07;color:#000;text-decoration:none;padding:10px 16px;border-radius:4px;font-weight:900;text-transform:uppercase;margin-bottom:20px}
.hero{background:#000;border:1px solid #333;border-radius:8px;overflow:hidden;margin-bottom:28px}
.color-bar{height:14px}
.hero-content{padding:30px}
.team-title{font-size:46px;font-weight:900;text-transform:uppercase;margin-bottom:8px}
.team-subtitle{font-size:18px;color:#aaa}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:28px}
.stat{background:#1c1c1c;border:1px solid #333;border-radius:6px;padding:18px;text-align:center}
.stat-number{font-size:25px;font-weight:900}
.stat-label{font-size:11px;color:#999;text-transform:uppercase;margin-top:5px}
.achievement-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.achievement{background:#1c1c1c;border:1px solid #333;border-radius:6px;padding:22px;text-align:center}
.achievement-number{font-size:30px;font-weight:900;color:#F14D07}
.achievement-label{font-size:11px;color:#999;text-transform:uppercase;margin-top:6px}
.section-title{border-left:6px solid #F14D07;padding-left:14px;margin:35px 0 15px;font-size:27px;text-transform:uppercase}
.info-box{background:#000;border:1px solid #333;border-radius:7px;padding:20px}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.info-item{background:#1c1c1c;border-radius:4px;padding:14px}
.info-label{color:#888;font-size:10px;text-transform:uppercase;margin-bottom:5px}
.info-value{font-size:16px;font-weight:bold}
.table-wrap{overflow-x:auto;background:#000;border:1px solid #333;border-radius:7px}
table{width:100%;border-collapse:collapse;min-width:750px}
th{background:#F14D07;color:#000;padding:12px 10px;text-transform:uppercase;font-size:11px;white-space:nowrap}
td{padding:11px 10px;text-align:center;border-bottom:1px solid #333;white-space:nowrap}
tbody tr:hover{background:#191919}
.rating{color:#F14D07;font-weight:900}
.history-controls{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.control-group{display:flex;flex-direction:column;gap:6px}
.history-controls label{font-size:11px;font-weight:900;text-transform:uppercase;color:#aaa}
.history-controls select{background:#1c1c1c;color:#fff;border:1px solid #444;border-radius:5px;padding:10px 38px 10px 12px;font-weight:700;cursor:pointer;min-width:165px}
.history-controls select:focus{outline:2px solid #F14D07;outline-offset:1px}
.history-count{color:#888;font-size:12px;padding-bottom:11px}
.history-wrap{max-height:68vh;overflow:auto;background:#000;border:1px solid #333;border-radius:7px}
.history-wrap thead th{position:sticky;top:0;z-index:5;box-shadow:0 1px 0 #333}
.record-grid{display:grid;grid-template-columns:minmax(320px,.8fr) minmax(420px,1.2fr);gap:20px;align-items:start}
.record-panel{min-width:0}
.record-panel h3{font-size:16px;text-transform:uppercase;margin:0 0 10px;color:#aaa}
.record-wrap{max-height:60vh;overflow:auto;background:#000;border:1px solid #333;border-radius:7px}
.record-wrap table{min-width:500px}
.record-wrap thead th{position:sticky;top:0;z-index:4;box-shadow:0 1px 0 #333}
.opponent-name{text-align:left;font-weight:800}
.data-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:0 0 12px}
.summary-card{background:#1c1c1c;border:1px solid #333;border-radius:6px;padding:14px;text-align:center}
.summary-number{font-size:21px;font-weight:900;color:#F14D07}
.summary-label{font-size:10px;color:#888;text-transform:uppercase;margin-top:4px}
.result-w{color:#5ee28a;font-weight:900}
.result-l{color:#ff7777;font-weight:900}
.result-t{color:#ddd;font-weight:900}
.playoff-row{background:rgba(241,77,7,.09)}
.playoff-row:hover{background:rgba(241,77,7,.16)}
.playoff-badge{display:inline-block;background:#F14D07;color:#000;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:900;letter-spacing:.5px;text-transform:uppercase}
.regular-badge{color:#666;font-size:12px}
.game-note{text-align:left;color:#bbb;white-space:normal;min-width:190px}
.elo-chart-box{background:#000;border:1px solid #333;border-radius:7px;padding:12px;margin-bottom:12px;overflow:hidden}
.elo-chart-box svg{display:block;width:100%;height:auto;min-height:230px}
.elo-grid{stroke:#333;stroke-width:1}
.elo-axis-text{fill:#888;font-size:12px}
.elo-line{fill:none;stroke:#F14D07;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.elo-baseline{stroke:#666;stroke-width:1;stroke-dasharray:7 6}
.elo-empty{padding:50px 15px;text-align:center;color:#999}
.note{color:#888;font-size:13px;margin-top:10px}
.loading,.error{text-align:center;padding:60px;color:#999}
footer{background:#000;border-top:4px solid #F14D07;text-align:center;padding:30px 20px;color:#888}
footer strong{color:#F14D07}
@media(max-width:1000px){.record-grid{grid-template-columns:1fr}.data-summary{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.achievement-grid{grid-template-columns:repeat(2,1fr)}.info-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.header-content{flex-direction:column;text-align:center}.site-title h1{font-size:24px}nav a{flex:1 1 50%;text-align:center;padding:13px 8px}.container{padding:25px 12px 45px}.team-title{font-size:32px}.stats{grid-template-columns:repeat(2,1fr)}.achievement-grid{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}.history-controls{align-items:stretch;flex-direction:column}.history-controls select{width:100%}.history-count{padding:0}.history-wrap{max-height:72vh}.record-wrap{max-height:65vh}.data-summary{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="header-content"><img src="RUSlogoNew.png" alt="Rural Utah Sports" class="logo"><div class="site-title"><h1>Rural Utah Sports</h1><p>Utah High School Sports History &amp; Data</p></div></div></header>
<nav><div class="nav-content"><a href="index.html">Home</a><a href="teams.html">Teams</a><a href="greatest-seasons.html">Greatest Seasons</a><a href="#">Games</a><a href="#">Rankings</a><a href="#">Simulators</a></div></nav>
<main class="container"><div id="page"><div class="loading">Loading team...</div></div></main>
<footer><p><strong>RURAL UTAH SPORTS</strong></p><p>Utah High School Sports History &amp; Data</p></footer>
<script>
function clean(v){return String(v??'').trim()}
function escapeHTML(v){return clean(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function color(v,f){return /^#[0-9A-F]{6}$/i.test(clean(v))?clean(v):f}
function record(w,l,t){return `${Number(w||0)}-${Number(l||0)}-${Number(t||0)}`}
function pct(v){const n=Number(v);return Number.isFinite(n)?(n*100).toFixed(1)+'%':'—'}
function recordPct(r){const g=Number(r?.games||0);return g?((Number(r?.wins||0)+(Number(r?.ties||0)*.5))/g):null}
function num(v,d=2){const n=Number(v);return Number.isFinite(n)?n.toFixed(d):'—'}
function integer(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString():'—'}
function signed(v){const n=Number(v);return Number.isFinite(n)?`${n>0?'+':''}${n.toFixed(0)}`:'—'}
function paramsTeam(){return new URLSearchParams(location.search).get('team')||''}
function normalize(v){return clean(v).toUpperCase().replace(/[^A-Z0-9]/g,'')}
function teamSlug(v){return clean(v).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function resultClass(v){return v==='W'?'result-w':v==='L'?'result-l':'result-t'}
function dateKey(v){const m=clean(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?(Number(m[3])*10000+Number(m[1])*100+Number(m[2])):0}
let currentHistory=[];
let currentSchedules={};
let currentElo=[];

async function load(){
try{
const stamp=Date.now();
const [teamResponse,recordResponse]=await Promise.all([
fetch('teams-data.json?v='+stamp,{cache:'no-store'}),
fetch('team-records.json?v='+stamp,{cache:'no-store'})
]);
if(!teamResponse.ok)throw new Error('Unable to load team data');
if(!recordResponse.ok)throw new Error('Unable to load record book data');
const teams=await teamResponse.json();
const records=await recordResponse.json();
const wanted=normalize(paramsTeam());
const team=teams.find(t=>normalize(t.team)===wanted);
if(!team)throw new Error('Team not found');
const pageDataResponse=await fetch(`team-page-data/${teamSlug(team.team)}.json?v=${stamp}`,{cache:'no-store'});
if(!pageDataResponse.ok)throw new Error('Unable to load team history data');
const pageData=await pageDataResponse.json();
const aliases={"GUNNISON VALLEY":"GUNNISON","MAPLE MOUNTAIN":"MAPLE MTN","MONUMENT VALLEY":"MONUMENT VAL"};
const recordKey=team.team in records?team.team:(aliases[team.team]||team.team);
render(team,records[recordKey]||null,pageData);
}catch(e){console.error(e);document.getElementById('page').innerHTML='<div class="error">Team information could not be loaded.<br><br><a class="back" href="teams.html">← Back to Teams</a></div>'}
}

function sortHistoryList(list,mode){
const rows=[...list];
const n=(obj,key)=>{const value=Number(obj?.[key]);return Number.isFinite(value)?value:-Infinity};
const sorts={
'year-desc':(a,b)=>n(b,'year')-n(a,'year'),
'year-asc':(a,b)=>n(a,'year')-n(b,'year'),
'wins-desc':(a,b)=>n(b,'wins')-n(a,'wins')||n(b,'rating')-n(a,'rating'),
'wins-asc':(a,b)=>n(a,'wins')-n(b,'wins')||n(a,'rating')-n(b,'rating'),
'winpct-desc':(a,b)=>n(b,'winPct')-n(a,'winPct')||n(b,'wins')-n(a,'wins'),
'pf-desc':(a,b)=>n(b,'pointsFor')-n(a,'pointsFor'),
'ppg-desc':(a,b)=>n(b,'ppg')-n(a,'ppg'),
'margin-desc':(a,b)=>n(b,'avgMargin')-n(a,'avgMargin'),
'sos-desc':(a,b)=>n(b,'sos')-n(a,'sos'),
'rating-desc':(a,b)=>n(b,'rating')-n(a,'rating'),
'rating-asc':(a,b)=>n(a,'rating')-n(b,'rating')};
return rows.sort(sorts[mode]||sorts['year-desc'])
}

function historyRow(s){return `<tr><td>${escapeHTML(s.year)}</td><td>${record(s.wins,s.losses,s.ties)}</td><td>${pct(s.winPct)}</td><td>${integer(s.pointsFor)}</td><td>${integer(s.pointsAgainst)}</td><td>${num(s.ppg,1)}</td><td>${num(s.papg,1)}</td><td>${num(s.avgMargin,1)}</td><td>${num(s.sos,2)}</td><td class="rating">${num(s.rating,2)}</td></tr>`}
function updateHistoryTable(){
const year=document.getElementById('historyYearFilter')?.value||'';
const mode=document.getElementById('historySort')?.value||'year-desc';
const body=document.getElementById('historyBody');
if(!body)return;
let rows=currentHistory.filter(s=>!year||String(s.year)===year);
rows=sortHistoryList(rows,mode);
body.innerHTML=rows.map(historyRow).join('')||'<tr><td colspan="10">No season history available.</td></tr>';
const count=document.getElementById('historyCount');if(count)count.textContent=year?`${rows.length} season shown`:`${rows.length} seasons shown`;
}

function scheduleSummary(games){
let wins=0,losses=0,ties=0,pf=0,pa=0,playoffs=0;
for(const g of games){if(g.result==='W')wins++;else if(g.result==='L')losses++;else ties++;pf+=Number(g.teamScore||0);pa+=Number(g.opponentScore||0);if(g.playoff)playoffs++}
return{wins,losses,ties,games:games.length,pf,pa,playoffs}
}
function updateSchedule(){
const select=document.getElementById('scheduleYear');const body=document.getElementById('scheduleBody');const summary=document.getElementById('scheduleSummary');
if(!select||!body||!summary)return;
const games=[...(currentSchedules[select.value]||[])].sort((a,b)=>dateKey(a.date)-dateKey(b.date));const s=scheduleSummary(games);
summary.innerHTML=`<div class="summary-card"><div class="summary-number">${record(s.wins,s.losses,s.ties)}</div><div class="summary-label">Season Record</div></div><div class="summary-card"><div class="summary-number">${integer(s.games)}</div><div class="summary-label">Games</div></div><div class="summary-card"><div class="summary-number">${integer(s.playoffs)}</div><div class="summary-label">Playoff Games</div></div><div class="summary-card"><div class="summary-number">${integer(s.pf)}</div><div class="summary-label">Points For</div></div><div class="summary-card"><div class="summary-number">${integer(s.pa)}</div><div class="summary-label">Points Against</div></div>`;
body.innerHTML=games.map(g=>`<tr class="${g.playoff?'playoff-row':''}"><td>${escapeHTML(g.date)}</td><td class="opponent-name">${escapeHTML(g.opponent)}</td><td class="${resultClass(g.result)}">${escapeHTML(g.result)}</td><td>${integer(g.teamScore)}-${integer(g.opponentScore)}</td><td>${g.playoff?'<span class="playoff-badge">Playoff</span>':'<span class="regular-badge">—</span>'}</td><td class="game-note">${escapeHTML(g.notes||'')}</td></tr>`).join('')||'<tr><td colspan="6">No schedule data available for that season.</td></tr>';
}

function renderEloChart(rows){
const holder=document.getElementById('eloChart');if(!holder)return;
if(!rows.length){holder.innerHTML='<div class="elo-empty">No ELO history available.</div>';return}
const ordered=[...rows].sort((a,b)=>dateKey(a.date)-dateKey(b.date));const values=ordered.map(r=>Number(r.eloAfter)).filter(Number.isFinite);
if(!values.length){holder.innerHTML='<div class="elo-empty">No ELO history available.</div>';return}
const width=1100,height=300,padL=58,padR=24,padT=22,padB=38;let min=Math.floor((Math.min(...values)-30)/50)*50;let max=Math.ceil((Math.max(...values)+30)/50)*50;if(min===max){min-=50;max+=50}
const x=i=>padL+(ordered.length===1?0:(i/(ordered.length-1))*(width-padL-padR));const y=v=>padT+((max-v)/(max-min))*(height-padT-padB);
const path=ordered.map((r,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(Number(r.eloAfter)).toFixed(1)}`).join(' ');let grid='';for(let i=0;i<=4;i++){const val=max-((max-min)*i/4);const yy=y(val);grid+=`<line class="elo-grid" x1="${padL}" y1="${yy}" x2="${width-padR}" y2="${yy}"></line><text class="elo-axis-text" x="5" y="${yy+4}">${Math.round(val)}</text>`}
let baseline='';if(1500>=min&&1500<=max){const yy=y(1500);baseline=`<line class="elo-baseline" x1="${padL}" y1="${yy}" x2="${width-padR}" y2="${yy}"></line>`}
const first=ordered[0]?.date||'',last=ordered[ordered.length-1]?.date||'';holder.innerHTML=`<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="ELO history chart">${grid}${baseline}<path class="elo-line" d="${path}"></path><text class="elo-axis-text" x="${padL}" y="${height-10}">${escapeHTML(first)}</text><text class="elo-axis-text" x="${width-padR}" y="${height-10}" text-anchor="end">${escapeHTML(last)}</text></svg>`;
}
function updateElo(){
const select=document.getElementById('eloSeason');const body=document.getElementById('eloBody');const summary=document.getElementById('eloSummary');if(!select||!body||!summary)return;
const season=select.value;let rows=currentElo.filter(r=>!season||String(r.season)===season).sort((a,b)=>dateKey(a.date)-dateKey(b.date));const vals=rows.map(r=>Number(r.eloAfter)).filter(Number.isFinite);const ending=vals.length?vals[vals.length-1]:null;const peak=vals.length?Math.max(...vals):null;const low=vals.length?Math.min(...vals):null;
summary.innerHTML=`<div class="summary-card"><div class="summary-number">${ending===null?'—':Math.round(ending)}</div><div class="summary-label">Ending ELO</div></div><div class="summary-card"><div class="summary-number">${peak===null?'—':Math.round(peak)}</div><div class="summary-label">Peak ELO</div></div><div class="summary-card"><div class="summary-number">${low===null?'—':Math.round(low)}</div><div class="summary-label">Low ELO</div></div><div class="summary-card"><div class="summary-number">${integer(rows.length)}</div><div class="summary-label">Rated Games</div></div>`;
renderEloChart(rows);body.innerHTML=[...rows].reverse().map(r=>`<tr><td>${escapeHTML(r.date)}</td><td class="opponent-name">${escapeHTML(r.opponent)}</td><td class="${resultClass(r.result)}">${escapeHTML(r.result)}</td><td>${integer(r.eloBefore)}</td><td class="${Number(r.change)>0?'result-w':Number(r.change)<0?'result-l':''}">${signed(r.change)}</td><td class="rating">${integer(r.eloAfter)}</td></tr>`).join('')||'<tr><td colspan="6">No ELO history available.</td></tr>';
}

function render(team,achievement,pageData){
const bg=color(team.backgroundColor,'#222');let text=color(team.textColor,'#fff');if(text.toUpperCase()==='#000000')text='#fff';
const classification=clean(team.classification)||'—',region=clean(team.region)||'—',mascot=clean(team.mascot)||'—';const greatest=Array.isArray(team.bestSeasons)?team.bestSeasons:[];
const historyList=Array.isArray(pageData?.seasonHistory)?pageData.seasonHistory:[];const breakdown=pageData?.breakdown||{decades:{},opponents:{}};currentHistory=historyList;currentSchedules=pageData?.schedules||{};currentElo=Array.isArray(pageData?.eloHistory)?pageData.eloHistory:[];
const greatestRows=greatest.map(s=>`<tr><td>${escapeHTML(s.year)}</td><td>${record(s.wins,s.losses,s.ties)}</td><td>${pct(s.winPct)}</td><td>${num(s.ppg,1)}</td><td>${num(s.papg,1)}</td><td>${num(s.avgMargin,1)}</td><td>${num(s.sos,2)}</td><td class="rating">${num(s.rating,2)}</td></tr>`).join('');
const initialHistoryRows=sortHistoryList(historyList,'year-desc').map(historyRow).join('');const yearOptions=historyList.map(s=>Number(s.year)).filter(Number.isFinite).sort((a,b)=>b-a).map(y=>`<option value="${y}">${y}</option>`).join('');
const scheduleYears=Object.keys(currentSchedules).map(Number).filter(Number.isFinite).sort((a,b)=>b-a);const scheduleOptions=scheduleYears.map(y=>`<option value="${y}">${y}</option>`).join('');const eloYears=[...new Set(currentElo.map(r=>Number(r.season)).filter(Number.isFinite))].sort((a,b)=>b-a);const eloOptions=eloYears.map(y=>`<option value="${y}">${y}</option>`).join('');
const decades=Object.entries(breakdown.decades||{}).sort((a,b)=>Number(a[0])-Number(b[0]));const decadeRows=decades.map(([decade,r])=>`<tr><td>${escapeHTML(decade)}s</td><td>${record(r.wins,r.losses,r.ties)}</td><td>${integer(r.games)}</td><td>${pct(recordPct(r))}</td></tr>`).join('');
const opponents=Object.entries(breakdown.opponents||{}).sort((a,b)=>a[0].localeCompare(b[0],undefined,{sensitivity:'base'}));const opponentRows=opponents.map(([opponent,r])=>`<tr><td class="opponent-name">${escapeHTML(opponent)}</td><td>${record(r.wins,r.losses,r.ties)}</td><td>${integer(r.games)}</td><td>${pct(recordPct(r))}</td></tr>`).join('');
const regionTitles=achievement?.regionTitles??0,playoffWins=achievement?.playoffWins??0,championships=achievement?.stateChampionships??0,championshipGames=achievement?.championshipGames??0;
document.title=`${team.team} | Rural Utah Sports`;
document.getElementById('page').innerHTML=`
<a class="back" href="teams.html">← All Teams</a>
<section class="hero"><div class="color-bar" style="background:${bg}"></div><div class="hero-content"><h2 class="team-title" style="color:${text}">${escapeHTML(team.team)}</h2><div class="team-subtitle">${escapeHTML(classification)} • ${escapeHTML(region)} • ${escapeHTML(mascot)}</div><div class="stats"><div class="stat"><div class="stat-number">${record(team.wins,team.losses,team.ties)}</div><div class="stat-label">All-Time Record</div></div><div class="stat"><div class="stat-number">${pct(team.winPct)}</div><div class="stat-label">Win Percentage</div></div><div class="stat"><div class="stat-number">${Number(team.games||0).toLocaleString()}</div><div class="stat-label">Games</div></div><div class="stat"><div class="stat-number">${Number(team.seasons||0).toLocaleString()}</div><div class="stat-label">Seasons</div></div><div class="stat"><div class="stat-number">${num(team.avgMargin,1)}</div><div class="stat-label">Avg. Margin</div></div></div></div></section>
<h2 class="section-title">Achievements</h2><div class="achievement-grid"><div class="achievement"><div class="achievement-number">${Number(regionTitles).toLocaleString()}</div><div class="achievement-label">Region Titles</div></div><div class="achievement"><div class="achievement-number">${Number(playoffWins).toLocaleString()}</div><div class="achievement-label">Playoff Wins</div></div><div class="achievement"><div class="achievement-number">${Number(championshipGames).toLocaleString()}</div><div class="achievement-label">Championship Game Appearances</div></div><div class="achievement"><div class="achievement-number">${Number(championships).toLocaleString()}</div><div class="achievement-label">State Championships</div></div></div>
<h2 class="section-title">Team Information</h2><div class="info-box"><div class="info-grid"><div class="info-item"><div class="info-label">Classification</div><div class="info-value">${escapeHTML(classification)}</div></div><div class="info-item"><div class="info-label">Region</div><div class="info-value">${escapeHTML(region)}</div></div><div class="info-item"><div class="info-label">Mascot</div><div class="info-value">${escapeHTML(mascot)}</div></div></div></div>
<h2 class="section-title">Greatest Seasons</h2><div class="table-wrap"><table><thead><tr><th>Year</th><th>Record</th><th>Win %</th><th>PPG</th><th>PAPG</th><th>Margin</th><th>SOS</th><th>Rating</th></tr></thead><tbody>${greatestRows||'<tr><td colspan="8">No season data available.</td></tr>'}</tbody></table></div>
<h2 class="section-title">Season-by-Season History</h2><div class="history-controls"><div class="control-group"><label for="historyYearFilter">Filter by season</label><select id="historyYearFilter" onchange="updateHistoryTable()"><option value="">All Seasons</option>${yearOptions}</select></div><div class="control-group"><label for="historySort">Sort by</label><select id="historySort" onchange="updateHistoryTable()"><option value="year-desc">Newest Season</option><option value="year-asc">Oldest Season</option><option value="wins-desc">Most Wins</option><option value="wins-asc">Fewest Wins</option><option value="winpct-desc">Best Win %</option><option value="rating-desc">Highest Rating</option><option value="rating-asc">Lowest Rating</option><option value="pf-desc">Most Points For</option><option value="ppg-desc">Highest PPG</option><option value="margin-desc">Best Avg Margin</option><option value="sos-desc">Highest SOS</option></select></div><span class="history-count" id="historyCount">${historyList.length} seasons shown</span></div><div class="history-wrap"><table><thead><tr><th>Year</th><th>Record</th><th>Win %</th><th>PF</th><th>PA</th><th>PPG</th><th>PAPG</th><th>Margin</th><th>SOS</th><th>Rating</th></tr></thead><tbody id="historyBody">${initialHistoryRows||'<tr><td colspan="10">No season history available.</td></tr>'}</tbody></table></div>
<h2 class="section-title">Schedule by Year</h2><div class="history-controls"><div class="control-group"><label for="scheduleYear">Season</label><select id="scheduleYear" onchange="updateSchedule()">${scheduleOptions||'<option value="">No seasons</option>'}</select></div></div><div class="data-summary" id="scheduleSummary"></div><div class="history-wrap"><table><thead><tr><th>Date</th><th>Opponent</th><th>Result</th><th>Score</th><th>Playoff</th><th>Notes</th></tr></thead><tbody id="scheduleBody"></tbody></table></div><p class="note">Playoff status and notes are synced from the Other/Notes column on each team tab in the Rural Utah Sports master spreadsheet.</p>
<h2 class="section-title">ELO History</h2><div class="history-controls"><div class="control-group"><label for="eloSeason">View</label><select id="eloSeason" onchange="updateElo()"><option value="">All-Time ELO</option>${eloOptions}</select></div></div><div class="data-summary" id="eloSummary"></div><div class="elo-chart-box" id="eloChart"></div><div class="history-wrap"><table><thead><tr><th>Date</th><th>Opponent</th><th>Result</th><th>ELO Before</th><th>Change</th><th>ELO After</th></tr></thead><tbody id="eloBody"></tbody></table></div><p class="note">ELO history is synced from the ELO History tab in the Rural Utah Sports master spreadsheet.</p>
<h2 class="section-title">Historical Records</h2><div class="record-grid"><div class="record-panel"><h3>Record by Decade</h3><div class="record-wrap"><table><thead><tr><th>Decade</th><th>Record</th><th>Games</th><th>Win %</th></tr></thead><tbody>${decadeRows||'<tr><td colspan="4">No decade data available.</td></tr>'}</tbody></table></div></div><div class="record-panel"><h3>Record vs. Every Opponent</h3><div class="record-wrap"><table><thead><tr><th>Opponent</th><th>Record</th><th>Games</th><th>Win %</th></tr></thead><tbody>${opponentRows||'<tr><td colspan="4">No opponent data available.</td></tr>'}</tbody></table></div></div></div><p class="note">Historical records are calculated from the master game database.</p>`;
if(scheduleYears.length){document.getElementById('scheduleYear').value=String(scheduleYears[0]);updateSchedule()}updateElo();
}
load();
</script>
</body>
</html>
