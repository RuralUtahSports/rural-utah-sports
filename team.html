<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team | Rural Utah Sports</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff}
header{background:#000;border-bottom:4px solid #F14D07;padding:15px 25px}
.header-content{max-width:1400px;margin:auto;display:flex;align-items:center;gap:20px}
.logo{width:80px;height:80px;object-fit:contain}
.site-title h1{font-size:30px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
.site-title p{color:#F14D07;font-weight:bold;margin-top:5px}
nav{background:#000;border-bottom:1px solid #333}
.nav-content{max-width:1400px;margin:auto;display:flex;flex-wrap:wrap}
nav a{color:#fff;text-decoration:none;padding:15px 18px;font-size:14px;font-weight:bold;text-transform:uppercase}
nav a:hover{background:#F14D07;color:#000}
.container{max-width:1400px;margin:auto;padding:35px 20px 60px}
.back{display:inline-block;background:#F14D07;color:#000;text-decoration:none;padding:10px 16px;border-radius:4px;font-weight:900;text-transform:uppercase;margin-bottom:20px}
.hero{background:#000;border:1px solid #333;border-radius:8px;overflow:hidden;margin-bottom:28px}
.color-bar{height:14px}
.hero-content{padding:30px}
.team-title{font-size:46px;font-weight:900;text-transform:uppercase;margin-bottom:8px}
.team-subtitle{font-size:18px;color:#aaa}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:28px}
.stat{background:#1c1c1c;border:1px solid #333;border-radius:6px;padding:18px;text-align:center}
.stat-number{font-size:25px;font-weight:900}
.stat-label{font-size:11px;color:#999;text-transform:uppercase;margin-top:5px}
.achievement-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.achievement{background:#1c1c1c;border:1px solid #333;border-radius:6px;padding:22px;text-align:center}
.achievement-number{font-size:30px;font-weight:900;color:#F14D07}
.achievement-label{font-size:11px;color:#999;text-transform:uppercase;margin-top:6px}
.section-title{border-left:6px solid #F14D07;padding-left:14px;margin:35px 0 15px;font-size:27px;text-transform:uppercase}
.info-box{background:#000;border:1px solid #333;border-radius:7px;padding:20px}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.info-item{background:#1c1c1c;border-radius:4px;padding:14px}
.info-label{color:#888;font-size:10px;text-transform:uppercase;margin-bottom:5px}
.info-value{font-size:16px;font-weight:bold}
.table-wrap{overflow-x:auto;background:#000;border:1px solid #333;border-radius:7px}
table{width:100%;border-collapse:collapse;min-width:750px}
th{background:#F14D07;color:#000;padding:12px 10px;text-transform:uppercase;font-size:11px;white-space:nowrap}
td{padding:11px 10px;text-align:center;border-bottom:1px solid #333;white-space:nowrap}
tbody tr:hover{background:#191919}
.rating{color:#F14D07;font-weight:900}
.history-controls{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.control-group{display:flex;flex-direction:column;gap:6px}
.history-controls label{font-size:11px;font-weight:900;text-transform:uppercase;color:#aaa}
.history-controls select{background:#1c1c1c;color:#fff;border:1px solid #444;border-radius:5px;padding:10px 38px 10px 12px;font-weight:700;cursor:pointer;min-width:165px}
.history-controls select:focus{outline:2px solid #F14D07;outline-offset:1px}
.history-count{color:#888;font-size:12px;padding-bottom:11px}
.history-wrap{max-height:68vh;overflow:auto;background:#000;border:1px solid #333;border-radius:7px}
.history-wrap thead th{position:sticky;top:0;z-index:5;box-shadow:0 1px 0 #333}
.history-empty{display:none;padding:24px;text-align:center;color:#999;background:#000;border:1px solid #333;border-top:0}
.note{color:#888;font-size:13px;margin-top:10px}
.loading,.error{text-align:center;padding:60px;color:#999}
footer{background:#000;border-top:4px solid #F14D07;text-align:center;padding:30px 20px;color:#888}
footer strong{color:#F14D07}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.info-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.header-content{flex-direction:column;text-align:center}.site-title h1{font-size:24px}nav a{flex:1 1 50%;text-align:center;padding:13px 8px}.container{padding:25px 12px 45px}.team-title{font-size:32px}.stats{grid-template-columns:repeat(2,1fr)}.achievement-grid{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}.history-controls{align-items:stretch;flex-direction:column}.history-controls select{width:100%}.history-count{padding:0}.history-wrap{max-height:72vh}}
</style>
</head>
<body>
<header>
<div class="header-content">
<img src="RUSlogoNew.png" alt="Rural Utah Sports" class="logo">
<div class="site-title"><h1>Rural Utah Sports</h1><p>Utah High School Sports History &amp; Data</p></div>
</div>
</header>
<nav><div class="nav-content">
<a href="index.html">Home</a>
<a href="teams.html">Teams</a>
<a href="greatest-seasons.html">Greatest Seasons</a>
<a href="#">Games</a>
<a href="#">Rankings</a>
<a href="#">Simulators</a>
</div></nav>
<main class="container">
<div id="page"><div class="loading">Loading team...</div></div>
</main>
<footer><p><strong>RURAL UTAH SPORTS</strong></p><p>Utah High School Sports History &amp; Data</p></footer>
<script>
function clean(v){return String(v ?? '').trim()}
function escapeHTML(v){return clean(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function color(v,f){return /^#[0-9A-F]{6}$/i.test(clean(v))?clean(v):f}
function record(w,l,t){return `${Number(w||0)}-${Number(l||0)}-${Number(t||0)}`}
function pct(v){const n=Number(v);return Number.isFinite(n)?(n*100).toFixed(1)+'%':'—'}
function num(v,d=2){const n=Number(v);return Number.isFinite(n)?n.toFixed(d):'—'}
function integer(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString():'—'}
function paramsTeam(){return new URLSearchParams(location.search).get('team')||''}
function normalize(v){return clean(v).toUpperCase().replace(/[^A-Z0-9]/g,'')}
let currentHistory=[];

async function load(){
try{
const stamp=Date.now();
const [teamResponse,recordResponse,historyResponse]=await Promise.all([
fetch('teams-data.json?v='+stamp,{cache:'no-store'}),
fetch('team-records.json?v='+stamp,{cache:'no-store'}),
fetch('season-history.json?v='+stamp,{cache:'no-store'})
]);
if(!teamResponse.ok)throw new Error('Unable to load team data');
if(!recordResponse.ok)throw new Error('Unable to load record book data');
if(!historyResponse.ok)throw new Error('Unable to load season history data');
const teams=await teamResponse.json();
const records=await recordResponse.json();
const histories=await historyResponse.json();
const wanted=normalize(paramsTeam());
const team=teams.find(t=>normalize(t.team)===wanted);
if(!team)throw new Error('Team not found');
const aliases={"GUNNISON VALLEY":"GUNNISON","MAPLE MOUNTAIN":"MAPLE MTN","MONUMENT VALLEY":"MONUMENT VAL"};
const recordKey=team.team in records?team.team:(aliases[team.team]||team.team);
const historyKey=team.team in histories?team.team:(aliases[team.team]||team.team);
render(team,records[recordKey]||null,histories[historyKey]||[]);
}catch(e){
console.error(e);
document.getElementById('page').innerHTML='<div class="error">Team information could not be loaded.<br><br><a class="back" href="teams.html">← Back to Teams</a></div>'
}
}

function sortHistoryList(list,mode){
const rows=[...list];
const n=(obj,key)=>{const value=Number(obj?.[key]);return Number.isFinite(value)?value:-Infinity};
const sorts={
'year-desc':(a,b)=>n(b,'year')-n(a,'year'),
'year-asc':(a,b)=>n(a,'year')-n(b,'year'),
'wins-desc':(a,b)=>n(b,'wins')-n(a,'wins')||n(b,'rating')-n(a,'rating'),
'wins-asc':(a,b)=>n(a,'wins')-n(b,'wins')||n(a,'rating')-n(b,'rating'),
'winpct-desc':(a,b)=>n(b,'winPct')-n(a,'winPct')||n(b,'wins')-n(a,'wins'),
'pf-desc':(a,b)=>n(b,'pointsFor')-n(a,'pointsFor'),
'ppg-desc':(a,b)=>n(b,'ppg')-n(a,'ppg'),
'margin-desc':(a,b)=>n(b,'avgMargin')-n(a,'avgMargin'),
'sos-desc':(a,b)=>n(b,'sos')-n(a,'sos'),
'rating-desc':(a,b)=>n(b,'rating')-n(a,'rating'),
'rating-asc':(a,b)=>n(a,'rating')-n(b,'rating')
};
return rows.sort(sorts[mode]||sorts['year-desc']);
}

function updateHistoryTable(){
const yearSelect=document.getElementById('historyYearFilter');
const sortSelect=document.getElementById('historySort');
const body=document.getElementById('historyBody');
if(!yearSelect||!sortSelect||!body)return;
const year=yearSelect.value;
let rows=currentHistory.filter(s=>!year||String(s.year)===year);
rows=sortHistoryList(rows,sortSelect.value);
body.innerHTML=rows.map(s=>`<tr data-year="${escapeHTML(s.year)}"><td>${escapeHTML(s.year)}</td><td>${record(s.wins,s.losses,s.ties)}</td><td>${pct(s.winPct)}</td><td>${integer(s.pointsFor)}</td><td>${integer(s.pointsAgainst)}</td><td>${num(s.ppg,1)}</td><td>${num(s.papg,1)}</td><td>${num(s.avgMargin,1)}</td><td>${num(s.sos,2)}</td><td class="rating">${num(s.rating,2)}</td></tr>`).join('')||'<tr><td colspan="10">No season history available.</td></tr>';
const count=document.getElementById('historyCount');
if(count)count.textContent=year?`${rows.length} season shown`:`${rows.length} seasons shown`;
const empty=document.getElementById('historyEmpty');
if(empty)empty.style.display=rows.length?'none':'block';
}

function render(team,achievement,history){
const bg=color(team.backgroundColor,'#222');
let text=color(team.textColor,'#fff');
if(text.toUpperCase()==='#000000')text='#fff';
const classification=clean(team.classification)||'—';
const region=clean(team.region)||'—';
const mascot=clean(team.mascot)||'—';
const greatest=Array.isArray(team.bestSeasons)?team.bestSeasons:[];
const historyList=Array.isArray(history)?history:[];
currentHistory=historyList;

const greatestRows=greatest.map(s=>`<tr><td>${escapeHTML(s.year)}</td><td>${record(s.wins,s.losses,s.ties)}</td><td>${pct(s.winPct)}</td><td>${num(s.ppg,1)}</td><td>${num(s.papg,1)}</td><td>${num(s.avgMargin,1)}</td><td>${num(s.sos,2)}</td><td class="rating">${num(s.rating,2)}</td></tr>`).join('');
const initialHistoryRows=sortHistoryList(historyList,'year-desc').map(s=>`<tr data-year="${escapeHTML(s.year)}"><td>${escapeHTML(s.year)}</td><td>${record(s.wins,s.losses,s.ties)}</td><td>${pct(s.winPct)}</td><td>${integer(s.pointsFor)}</td><td>${integer(s.pointsAgainst)}</td><td>${num(s.ppg,1)}</td><td>${num(s.papg,1)}</td><td>${num(s.avgMargin,1)}</td><td>${num(s.sos,2)}</td><td class="rating">${num(s.rating,2)}</td></tr>`).join('');
const yearOptions=historyList.map(s=>Number(s.year)).filter(Number.isFinite).sort((a,b)=>b-a).map(y=>`<option value="${y}">${y}</option>`).join('');

const regionTitles=achievement?.regionTitles??0;
const playoffWins=achievement?.playoffWins??0;
const championships=achievement?.stateChampionships??0;

document.title=`${team.team} | Rural Utah Sports`;
document.getElementById('page').innerHTML=`
<a class="back" href="teams.html">← All Teams</a>
<section class="hero">
<div class="color-bar" style="background:${bg}"></div>
<div class="hero-content">
<h2 class="team-title" style="color:${text}">${escapeHTML(team.team)}</h2>
<div class="team-subtitle">${escapeHTML(classification)} • ${escapeHTML(region)} • ${escapeHTML(mascot)}</div>
<div class="stats">
<div class="stat"><div class="stat-number">${record(team.wins,team.losses,team.ties)}</div><div class="stat-label">All-Time Record</div></div>
<div class="stat"><div class="stat-number">${pct(team.winPct)}</div><div class="stat-label">Win Percentage</div></div>
<div class="stat"><div class="stat-number">${Number(team.games||0).toLocaleString()}</div><div class="stat-label">Games</div></div>
<div class="stat"><div class="stat-number">${Number(team.seasons||0).toLocaleString()}</div><div class="stat-label">Seasons</div></div>
<div class="stat"><div class="stat-number">${num(team.avgMargin,1)}</div><div class="stat-label">Avg. Margin</div></div>
</div>
</div>
</section>

<h2 class="section-title">Achievements</h2>
<div class="achievement-grid">
<div class="achievement"><div class="achievement-number">${Number(regionTitles).toLocaleString()}</div><div class="achievement-label">Region Titles</div></div>
<div class="achievement"><div class="achievement-number">${Number(playoffWins).toLocaleString()}</div><div class="achievement-label">Playoff Wins</div></div>
<div class="achievement"><div class="achievement-number">${Number(championships).toLocaleString()}</div><div class="achievement-label">State Championships</div></div>
</div>

<h2 class="section-title">Team Information</h2>
<div class="info-box"><div class="info-grid">
<div class="info-item"><div class="info-label">Classification</div><div class="info-value">${escapeHTML(classification)}</div></div>
<div class="info-item"><div class="info-label">Region</div><div class="info-value">${escapeHTML(region)}</div></div>
<div class="info-item"><div class="info-label">Mascot</div><div class="info-value">${escapeHTML(mascot)}</div></div>
</div></div>

<h2 class="section-title">Greatest Seasons</h2>
<div class="table-wrap"><table><thead><tr><th>Year</th><th>Record</th><th>Win %</th><th>PPG</th><th>PAPG</th><th>Margin</th><th>SOS</th><th>Rating</th></tr></thead><tbody>${greatestRows||'<tr><td colspan="8">No season data available.</td></tr>'}</tbody></table></div>

<h2 class="section-title">Season-by-Season History</h2>
<div class="history-controls">
<div class="control-group">
<label for="historyYearFilter">Filter by season</label>
<select id="historyYearFilter" onchange="updateHistoryTable()"><option value="">All Seasons</option>${yearOptions}</select>
</div>
<div class="control-group">
<label for="historySort">Sort by</label>
<select id="historySort" onchange="updateHistoryTable()">
<option value="year-desc">Newest Season</option>
<option value="year-asc">Oldest Season</option>
<option value="wins-desc">Most Wins</option>
<option value="wins-asc">Fewest Wins</option>
<option value="winpct-desc">Best Win %</option>
<option value="rating-desc">Highest Rating</option>
<option value="rating-asc">Lowest Rating</option>
<option value="pf-desc">Most Points For</option>
<option value="ppg-desc">Highest PPG</option>
<option value="margin-desc">Best Avg Margin</option>
<option value="sos-desc">Highest SOS</option>
</select>
</div>
<span class="history-count" id="historyCount">${historyList.length} seasons shown</span>
</div>
<div class="history-wrap"><table><thead><tr><th>Year</th><th>Record</th><th>Win %</th><th>PF</th><th>PA</th><th>PPG</th><th>PAPG</th><th>Margin</th><th>SOS</th><th>Rating</th></tr></thead><tbody id="historyBody">${initialHistoryRows||'<tr><td colspan="10">No season history available.</td></tr>'}</tbody></table></div>
<div class="history-empty" id="historyEmpty">No seasons match that filter.</div>
<p class="note">Season history is synced from the Greatest Seasons tab in the Rural Utah Sports master spreadsheet.</p>
`;
}
load();
</script>
</body>
</html>
