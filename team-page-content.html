<script>
function clean(v){return String(v??'').trim()}
function escapeHTML(v){return clean(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function color(v,f){return /^#[0-9A-F]{6}$/i.test(clean(v))?clean(v):f}
function record(w,l,t){return `${Number(w||0)}-${Number(l||0)}-${Number(t||0)}`}
function pct(v){const n=Number(v);return Number.isFinite(n)?(n*100).toFixed(1)+'%':'—'}
function recordPct(r){const g=Number(r?.games||0);return g?((Number(r?.wins||0)+(Number(r?.ties||0)*.5))/g):null}
function num(v,d=2){const n=Number(v);return Number.isFinite(n)?n.toFixed(d):'—'}
function integer(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString():'—'}
function signed(v){const n=Number(v);return Number.isFinite(n)?`${n>0?'+':''}${n.toFixed(0)}`:'—'}
function paramsTeam(){return new URLSearchParams(location.search).get('team')||''}
function normalize(v){return clean(v).toUpperCase().replace(/[^A-Z0-9]/g,'')}
function teamSlug(v){return clean(v).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function resultClass(v){return v==='W'?'result-w':v==='L'?'result-l':'result-t'}
function dateKey(v){const m=clean(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?(Number(m[3])*10000+Number(m[1])*100+Number(m[2])):0}
function playoffRecordSummary(schedules){let wins=0,losses=0,ties=0;for(const games of Object.values(schedules||{})){for(const g of Array.isArray(games)?games:[]){if(!g.playoff)continue;if(g.result==='W')wins++;else if(g.result==='L')losses++;else if(g.result==='T')ties++;}}return{wins,losses,ties}}
function teamURL(name){return `team.html?team=${encodeURIComponent(name)}`}
let currentHistory=[];let currentSchedules={};let currentElo=[];const singleGamePageSize=50;let singleGameVisible=singleGamePageSize;

async function load(){try{const stamp=Date.now();const [teamResponse,recordResponse]=await Promise.all([fetch('teams-data.json?v='+stamp),fetch('team-records.json?v='+stamp)]);if(!teamResponse.ok)throw new Error('Unable to load team data');if(!recordResponse.ok)throw new Error('Unable to load record book data');const teams=await teamResponse.json(),records=await recordResponse.json(),wanted=normalize(paramsTeam()),team=teams.find(t=>normalize(t.team)===wanted);if(!team)throw new Error('Team not found');const pageDataResponse=await fetch(`team-page-data/${teamSlug(team.team)}.json?v=${stamp}`);if(!pageDataResponse.ok)throw new Error('Unable to load team history data');const pageData=await pageDataResponse.json();const aliases={"GUNNISON VALLEY":"GUNNISON","MAPLE MOUNTAIN":"MAPLE MTN","MONUMENT VALLEY":"MONUMENT VAL"};const recordKey=team.team in records?team.team:(aliases[team.team]||team.team);render(team,records[recordKey]||null,pageData)}catch(e){console.error(e);document.getElementById('page').innerHTML='<div class="error">Team information could not be loaded.<br><br><a class="back" href="teams.html">← Back to Teams</a></div>'}}

function sortHistoryList(list,mode){const rows=[...list],n=(obj,key)=>{const value=Number(obj?.[key]);return Number.isFinite(value)?value:-Infinity};const sorts={'year-desc':(a,b)=>n(b,'year')-n(a,'year'),'year-asc':(a,b)=>n(a,'year')-n(b,'year'),'wins-desc':(a,b)=>n(b,'wins')-n(a,'wins')||n(b,'rating')-n(a,'rating'),'wins-asc':(a,b)=>n(a,'wins')-n(b,'wins')||n(a,'rating')-n(b,'rating'),'winpct-desc':(a,b)=>n(b,'winPct')-n(a,'winPct')||n(b,'wins')-n(a,'wins'),'pf-desc':(a,b)=>n(b,'pointsFor')-n(a,'pointsFor'),'ppg-desc':(a,b)=>n(b,'ppg')-n(a,'ppg'),'margin-desc':(a,b)=>n(b,'avgMargin')-n(a,'avgMargin'),'sos-desc':(a,b)=>n(b,'sos')-n(a,'sos'),'rating-desc':(a,b)=>n(b,'rating')-n(a,'rating'),'rating-asc':(a,b)=>n(a,'rating')-n(b,'rating')};return rows.sort(sorts[mode]||sorts['year-desc'])}
function historyRow(s){return `<tr><td>${escapeHTML(s.year)}</td><td>${record(s.wins,s.losses,s.ties)}</td><td>${pct(s.winPct)}</td><td>${integer(s.pointsFor)}</td><td>${integer(s.pointsAgainst)}</td><td>${num(s.ppg,1)}</td><td>${num(s.papg,1)}</td><td>${num(s.avgMargin,1)}</td><td>${num(s.sos,2)}</td><td class="rating">${num(s.rating,2)}</td></tr>`}
function updateHistoryTable(){const year=document.getElementById('historyYearFilter')?.value||'',mode=document.getElementById('historySort')?.value||'year-desc',body=document.getElementById('historyBody');if(!body)return;let rows=currentHistory.filter(s=>!year||String(s.year)===year);rows=sortHistoryList(rows,mode);body.innerHTML=rows.map(historyRow).join('')||'<tr><td colspan="10">No season history available.</td></tr>';const count=document.getElementById('historyCount');if(count)count.textContent=year?`${rows.length} season shown`:`${rows.length} seasons shown`}
function scheduleSummary(games){let wins=0,losses=0,ties=0,pf=0,pa=0,playoffs=0;for(const g of games){if(g.result==='W')wins++;else if(g.result==='L')losses++;else ties++;pf+=Number(g.teamScore||0);pa+=Number(g.opponentScore||0);if(g.playoff)playoffs++}return{wins,losses,ties,games:games.length,pf,pa,playoffs}}
function updateSchedule(){const select=document.getElementById('scheduleYear'),body=document.getElementById('scheduleBody'),summary=document.getElementById('scheduleSummary');if(!select||!body||!summary)return;const games=[...(currentSchedules[select.value]||[])].sort((a,b)=>dateKey(a.date)-dateKey(b.date)),s=scheduleSummary(games);summary.innerHTML=`<div class="summary-card"><div class="summary-number">${record(s.wins,s.losses,s.ties)}</div><div class="summary-label">Season Record</div></div><div class="summary-card"><div class="summary-number">${integer(s.games)}</div><div class="summary-label">Games</div></div><div class="summary-card"><div class="summary-number">${integer(s.playoffs)}</div><div class="summary-label">Playoff Games</div></div><div class="summary-card"><div class="summary-number">${integer(s.pf)}</div><div class="summary-label">Points For</div></div><div class="summary-card"><div class="summary-number">${integer(s.pa)}</div><div class="summary-label">Points Against</div></div>`;body.innerHTML=games.map(g=>`<tr class="${g.playoff?'playoff-row':''}"><td>${escapeHTML(g.date)}</td><td class="opponent-name">${escapeHTML(g.opponent)}</td><td class="${resultClass(g.result)}">${escapeHTML(g.result)}</td><td>${integer(g.teamScore)}-${integer(g.opponentScore)}</td><td>${g.playoff?'<span class="playoff-badge">Playoff</span>':'<span class="regular-badge">—</span>'}</td><td class="game-note">${escapeHTML(g.notes||'')}</td></tr>`).join('')||'<tr><td colspan="6">No schedule data available for that season.</td></tr>'}
function allTeamGames(){const rows=[],now=new Date(),todayKey=(now.getFullYear()*10000)+((now.getMonth()+1)*100)+now.getDate();for(const [season,games] of Object.entries(currentSchedules||{})){for(const game of Array.isArray(games)?games:[]){const scored=Number(game.teamScore),allowed=Number(game.opponentScore),gameDate=dateKey(game.date);if(!Number.isFinite(scored)||!Number.isFinite(allowed)||gameDate>todayKey||(scored===0&&allowed===0&&gameDate>=todayKey))continue;rows.push({...game,season:String(season),teamScore:scored,opponentScore:allowed,margin:scored-allowed})}}return rows}
function singleGameRecordCard(label,game,value){if(!game)return `<div class="single-game-record"><div class="single-game-record-label">${escapeHTML(label)}</div><div class="single-game-record-number">—</div><div class="single-game-record-detail">No completed games available.</div></div>`;return `<div class="single-game-record"><div class="single-game-record-label">${escapeHTML(label)}</div><div class="single-game-record-number">${integer(value)}</div><div class="single-game-record-detail">vs. ${escapeHTML(game.opponent)} • ${integer(game.teamScore)}-${integer(game.opponentScore)} • ${escapeHTML(game.date)}</div></div>`}
function sortSingleGames(rows,mode){const sorted=[...rows],newest=(a,b)=>dateKey(b.date)-dateKey(a.date)||Number(b.season)-Number(a.season),sorts={'scored-desc':(a,b)=>b.teamScore-a.teamScore||b.opponentScore-a.opponentScore||newest(a,b),'allowed-desc':(a,b)=>b.opponentScore-a.opponentScore||b.teamScore-a.teamScore||newest(a,b),'newest':newest,'oldest':(a,b)=>dateKey(a.date)-dateKey(b.date)||Number(a.season)-Number(b.season),'margin-desc':(a,b)=>b.margin-a.margin||b.teamScore-a.teamScore||newest(a,b),'closest':(a,b)=>Math.abs(a.margin)-Math.abs(b.margin)||newest(a,b),'opponent-asc':(a,b)=>clean(a.opponent).localeCompare(clean(b.opponent),undefined,{sensitivity:'base'})||newest(a,b)};return sorted.sort(sorts[mode]||sorts['scored-desc'])}
